<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>CosPlan · Cosplay 计划器 v1.0</title>
<style>
/* ============ 基础与主题 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;
}
:root{
  --bg:#f4f5fa; --card:#ffffff; --fg:#20222c; --sub:#6b7183; --line:#e6e8f0;
  --accent:#7c5cff; --accent-soft:#efeaff; --accent2:#ff7aa2; --accent2-soft:#ffeef4;
  --ok:#1fa971; --ok-soft:#e3f7ee; --warn:#d98216; --warn-soft:#fdf1de;
  --danger:#e04357; --danger-soft:#ffe9ec; --info:#2f7de1; --info-soft:#e6f0fd;
  --gray-soft:#eef0f5; --radius:14px; --shadow:0 2px 10px rgba(30,32,60,.06);
  --nav-h:58px;
}
.hidden{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
a{color:var(--info);text-decoration:none;word-break:break-all}
/* ============ 布局骨架 ============ */
#app{max-width:860px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(244,245,250,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;min-height:52px;
}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:12px;color:var(--sub);font-weight:400;display:block;margin-top:1px}
main{padding:12px 14px 20px}
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;background:none;border:0;padding:8px 2px 6px;color:var(--sub);font-size:11px;line-height:1.3;cursor:pointer;
}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar button .ic{display:block;font-size:18px;line-height:1.1}
/* ============ 卡片/列表 ============ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.card h3 .cnt{font-size:12px;color:var(--sub);font-weight:400}
.card h3 .act{margin-left:auto;font-size:12px;color:var(--accent);background:none;border:0;cursor:pointer;font-weight:600}
.sect-title{font-size:13px;color:var(--sub);font-weight:700;margin:16px 2px 8px;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.empty{padding:18px 10px;text-align:center;color:var(--sub);font-size:13px;background:var(--gray-soft);border-radius:10px}
.kv{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{width:74px;color:var(--sub);flex:none}
.kv .v{flex:1;min-width:0;word-break:break-word;overflow-wrap:anywhere}
.kv .v a{overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:400px){.grid3{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .n{font-size:19px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:11px;color:var(--sub);margin-top:2px}
/* ============ 标签/徽章 ============ */
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--gray-soft);color:var(--sub);white-space:nowrap}
.badge.b-ok{background:var(--ok-soft);color:var(--ok)}
.badge.b-warn{background:var(--warn-soft);color:var(--warn)}
.badge.b-danger{background:var(--danger-soft);color:var(--danger)}
.badge.b-info{background:var(--info-soft);color:var(--info)}
.badge.b-accent{background:var(--accent-soft);color:var(--accent)}
.badge.b-pink{background:var(--accent2-soft);color:var(--accent2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--gray-soft);color:var(--sub);border:0;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;font-weight:600}
.pill-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.pill-row::-webkit-scrollbar{display:none}
/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  background:var(--accent);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-weight:600;cursor:pointer;
}
.btn:active{opacity:.75}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.btn.gray{background:var(--gray-soft);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:0}
.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);z-index:35;
  width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:26px;line-height:1;
  box-shadow:0 6px 16px rgba(124,92,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
/* ============ 表单 ============ */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal.mask-center{align-items:center}
.modal-mask{position:absolute;inset:0;background:rgba(20,20,35,.45)}
.modal-body{
  position:relative;background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
}
.modal.mask-center .modal-body{border-radius:18px;max-width:480px;padding-bottom:16px}
@media(min-width:641px){.modal{align-items:center}.modal-body{border-radius:18px;max-height:88vh}}
.modal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg);padding:6px 0 8px;z-index:2}
.modal-head h2{font-size:16px;margin:0;flex:1}
.modal-head .x{background:var(--gray-soft);border:0;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--sub)}
.f{margin-bottom:12px}
.f>label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.f>label .req{color:var(--danger)}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=datetime-local],.f input[type=url],.f input[type=tel],.f select,.f textarea{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;
}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f .hint{font-size:11px;color:var(--sub);margin-top:3px}
.f.err input,.f.err select,.f.err textarea{border-color:var(--danger)}
.f-row{display:flex;gap:8px}.f-row .f{flex:1;min-width:0}
.sub-list{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.sub-item{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sub-item:last-child{border-bottom:0}
.sub-item input{flex:1;min-width:0;border:0;background:none;padding:4px 2px}
.sub-item .del{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer;padding:0 4px}
.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.check-row:last-child{border-bottom:0}
.check-row input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.check-row .txt{flex:1;min-width:0}
.check-row.done .txt{color:var(--sub);text-decoration:line-through}
/* ============ 进度/其他 ============ */
.bar{height:6px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--danger)}
.warn-box{background:var(--warn-soft);color:#8a5406;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.danger-box{background:var(--danger-soft);color:#9c1f30;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.info-box{background:var(--info-soft);color:#1b4d8f;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.row-sec{background:var(--danger-soft)!important}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 40px);transform:translateX(-50%) translateY(20px);
  background:rgba(32,34,44,.94);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:90;
  opacity:0;pointer-events:none;transition:all .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--sub);font-size:12px}
.tiny{font-size:11px}
.mono{font-variant-numeric:tabular-nums}
.right{text-align:right}
.nowrap{white-space:nowrap}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
.tabs{display:flex;gap:4px;background:var(--gray-soft);padding:3px;border-radius:11px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;background:none;border:0;padding:7px 6px;border-radius:8px;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stage-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stage-head h2{font-size:18px;margin:0;flex:1;min-width:120px}
.prog-list{display:flex;flex-direction:column;gap:8px}
details.dd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
details.dd summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:600;list-style:none}
details.dd summary::-webkit-details-marker{display:none}
details.dd[open] summary{margin-bottom:6px;color:var(--fg)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<script>
"use strict";
/* =========================================================
   CosPlan · Cosplay 计划器 v1.0
   单文件本地应用：数据存 localStorage，不上传、不联网。
   需求依据：同目录《开发交付文档.md》v0.2
   ========================================================= */
var APP = { name:'CosPlan', ver:'1.0', schema:1, storeKey:'cosplan.data.v1' };

/* ---------------- 枚举（全中文口径，见文档 §3/§8） ---------------- */
var STAGES = ['计划中','拍摄中','已出片'];                 // FR-1.4 三类，手动切换可回退
var OCCASIONS = ['漫展','外景','棚拍','场照','正片','日常自娱','其他'];
var RESTORE_TARGETS = ['高','中','低'];
var WORK_TYPES = ['游戏','番剧','漫画','小说','VTB','原创','其他'];

var ASSET_KINDS = ['服装','道具','假发','美瞳','鞋','饰品','消耗品'];
var ASSET_CATS = {
  '服装':['上装','下装','外套','连衣裙','内衣打底','披风/外褂','其他'],
  '道具':['手持','背饰','翅膀','头饰','家具','载具','其他'],
  '假发':['整顶假发','发片','头饰毛件','其他'],
  '美瞳':['美瞳','眼镜','其他'],
  '鞋':['靴','鞋','拖鞋','其他'],
  '饰品':['颈饰','手饰','耳饰','腰饰','指环','其他'],
  '消耗品':['甲片','假睫毛','双面胶','护理液','其他']
};
var ASSET_SOURCES = ['购买','自制','租赁','二手购入','借用','代工'];
var MAKE_STAGES = ['设计','打版','下料','组装','打磨','上色','完成'];

/* 状态全集 + 合法推进（文档 §8.1）。额外提供"强制跳转"避免死路 */
var ITEM_STATUS = ['愿望单','计划中','已下单','在途','已到手','制作中','需修改','试装通过','已完成','可用','外借中','已售出','已报废','已归还'];
var STATUS_NEXT = {
  '愿望单':['已下单','计划中'],
  '计划中':['制作中','已下单','已到手'],
  '已下单':['在途','已到手','愿望单'],
  '在途':['已到手','已下单'],
  '已到手':['试装通过','需修改'],
  '制作中':['已完成','已下单','已到手'],
  '需修改':['试装通过','已到手'],
  '试装通过':['可用','需修改','已售出','已报废','已归还','外借中'],
  '已完成':['试装通过','可用'],
  '可用':['外借中','已售出','已报废','已归还','需修改'],
  '外借中':['可用'],
  '已售出':[], '已报废':[], '已归还':[]
};
var TERMINAL_STATUS = ['已售出','已报废','已归还'];   // 不再参与"可用资产"
var DISPOSAL_TYPES = ['已售出','已报废','已归还'];     // 需要记录去向/原因
var STATUS_STYLE = {
  '愿望单':'b-info','计划中':'b-info','已下单':'b-warn','在途':'b-warn','制作中':'b-warn','已到手':'b-accent',
  '需修改':'b-danger','试装通过':'b-ok','已完成':'b-ok','可用':'b-ok','外借中':'b-pink',
  '已售出':'b-gray','已报废':'b-gray','已归还':'b-gray'
};

var ROLES = ['摄影师','妆娘','毛娘','修图师','场地主','道友','其他'];
var PLATFORMS = ['微博','小红书','QQ','微信','闲鱼','B站','LOFTER','抖音','其他'];
var LOCATION_TYPES = ['外景','棚拍','漫展','居家','咖啡厅/店','其他'];
var SHOOT_METHODS = ['约拍','互免(TFP)','朋友帮拍','自拍/三脚架','棚拍','漫展场照','其他'];
var SESSION_STATUS = ['计划中','已确认','已完成','已改期','已取消'];
var APPT_TYPES = ['妆娘','毛娘','修图师','场地预定','其他'];
var APPT_STATUS = ['待确认','已定档','已付定金','已完成','已结清','已取消','爽约'];
var DELIV_TYPES = ['原片','选片','精修','成片包','其他'];
var DELIV_STATUS = ['未交付','已交付','已选片','修图中','已返图'];
var PUB_PLATFORMS = PLATFORMS;
var EXPENSE_CATS = ['服装','道具','假发','美瞳','鞋','饰品','妆造','摄影','场地','交通','后期修图','其他'];
/* 出装日应急包默认项（FR-7.2） */
var EMERGENCY_KIT = ['别针/安全扣','双面胶/透明胶','针线包','充电宝+数据线','湿巾/纸巾','隐形眼镜盒+护理液','卸妆用品','换衣罩衫','暖宝宝/小风扇','平底鞋(换脚)','吸管杯','身份证与零钱'];

/* ---------------- 工具函数 ---------------- */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(p){ return (p||'x')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }            // 防 Infinity/NaN
function numOrNull(v){ if(v===''||v===null||v===undefined) return null; var n=parseFloat(v); return isFinite(n)?n:null; }
function money(n){ n=num(n); return (Math.round(n*100)/100).toString(); }
function todayISO(){ var d=new Date(); return isoOf(d); }
function isoOf(d){
  var m=('0'+(d.getMonth()+1)).slice(-2), dd=('0'+d.getDate()).slice(-2);
  return d.getFullYear()+'-'+m+'-'+dd;
}
function nowStamp(){ var d=new Date(); return isoOf(d)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function dayDiff(iso){                       // iso 距今天数：过去为负
  if(!iso) return null;
  var a=new Date(String(iso).slice(0,10)+'T00:00:00'), b=new Date(todayISO()+'T00:00:00');
  if(isNaN(a.getTime())) return null;
  return Math.round((a-b)/86400000);
}
function dueText(iso){
  var d=dayDiff(iso); if(d===null||d===undefined) return '';
  if(d<0) return '逾期'+(-d)+'天';
  if(d===0) return '今天';
  if(d===1) return '明天';
  if(d<=30) return d+'天后';
  return iso;
}
function isPast(iso){ var d=dayDiff(iso); return d!==null && d<0; }
function arr(v){ return Array.isArray(v)?v:[]; }
function byId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function sortDesc(list,key){ return list.slice().sort(function(a,b){ return String(b[key]||'').localeCompare(String(a[key]||'')); }); }
function sortAsc(list,key){ return list.slice().sort(function(a,b){ return String(a[key]||'~').localeCompare(String(b[key]||'~')); }); }
function sum(list,key){ var t=0; for(var i=0;i<list.length;i++) t+=num(list[i][key]); return t; }
function uniq(list){ var s={},o=[]; for(var i=0;i<list.length;i++){ if(!s[list[i]]){s[list[i]]=1;o.push(list[i]);} } return o; }

/* ---------------- 存储层（M13） ---------------- */
function emptyData(){
  return {
    v:APP.schema, works:[], characters:[], projects:[], items:[], contacts:[], locations:[],
    sessions:[], appointments:[], deliverables:[], publications:[], expenses:[], todos:[],
    meta:{ created_at:nowStamp(), updated_at:nowStamp() }
  };
}
var DB = emptyData();

function migrate(raw){
  /* 读档缺字段一律补默认值（历史 Bug #10 教训） */
  var d = emptyData();
  if(!raw || typeof raw !== 'object') return d;
  for(var k in d){
    if(k==='meta'||k==='v') continue;
    if(Array.isArray(raw[k])) d[k]=raw[k];
  }
  d.meta = (raw.meta&&typeof raw.meta==='object')?raw.meta:d.meta;
  d.v = APP.schema;
  /* 逐条补默认，防止旧备份缺字段（只补会用到的，不造无意义字段） */
  var need = {
    works:{name:'',type:'',note:''},
    characters:{workId:'',name:'',note:''},
    projects:{name:'',characterId:'',skin:'',stage:'计划中',occasion:'',deadline:'',restore:'',budget:null,archived_at:'',refLinks:[],note:''},
    items:{name:'',kind:'服装',category:'',status:'愿望单',source:'购买',characterId:'',projectIds:[],shop:'',link:'',price:null,
      size:'',orderDate:'',arrivedDate:'',storage:'',makeStage:'',makeProgress:null,fragile:'',qty:null,lowQty:null,
      wigColor:'',wigLen:'',wigStyle:'',wigBy:'',clBrand:'',clDia:'',powerL:'',powerR:'',throwType:'',openedAt:'',expiresAt:'',
      dispType:'',dispDate:'',dispPrice:null,dispTo:'',dispReason:'',fittings:[],refLinks:[],note:''},
    contacts:{cn:'',roles:[],platforms:[],phone:'',portfolio:'',priceNote:'',rating:'',warning:false,warnReason:'',note:''},
    locations:{name:'',type:'',address:'',gather:'',fee:null,traffic:'',facilities:'',bestHours:'',risk:'',refLinks:[],note:''},
    sessions:{projectId:'',date:'',time:'',method:'',contactId:'',photographerText:'',locationId:'',locationText:'',

function idxOf(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return i; return -1; }

function openModal(o){

function closeModal(){ var m=document.getElementById('modal'); m.className='modal hidden'; m.innerHTML=''; }

function optsOf(o){
  var list = (typeof o==='function')?o():o;
  return (list||[]).map(function(x){ return (x&&typeof x==='object')?x:{v:x,l:x}; });
}
function fieldInput(f,V){
  var v = V[f.k];
  var reqMark = f.req?'<span class="req"> *</span>':'';
  var lab = `<label>${esc(f.l)}${reqMark}</label>`;
  var hint = f.hint?`<div class="hint">${esc(f.hint)}</div>`:'';
  var id='fld_'+f.k;
  switch(f.t){
    case 'area':
      return `<div class="f" data-fw="${f.k}">${lab}<textarea id="${id}" placeholder="${esc(f.ph||'')}" rows="${f.rows||3}">${esc(v==null?'':v)}</textarea>${hint}</div>`;
    case 'select': {
      var os=optsOf(typeof f.opts==='function'?f.opts(V):f.opts);
      if(!f.req && os.length && os[0].v!=='') os=[{v:'',l:f.ph||'未选择'}].concat(os);
      var hasGroup=os.some(function(o){return o.g;});
      var html='';
      if(hasGroup){
        var groups=[];
        os.forEach(function(o){
          var gname=o.g||'';
          var g=groups.filter(function(x){return x.name===gname;})[0];
          if(!g){ g={name:gname,items:[]}; groups.push(g); }
          g.items.push(o);
        });
        html=groups.map(function(g){
          var inner=g.items.map(function(o){
            return `<option value="${esc(o.v)}" ${String(v==null?'':v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`;}).join('');
          return g.name?`<optgroup label="${esc(g.name)}">${inner}</optgroup>`:inner;
        }).join('');
      }else{
        html=os.map(function(o){
          return `<option value="${esc(o.v)}" ${String(v==null?'':v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`;}).join('');
      }
      return `<div class="f" data-fw="${f.k}">${lab}<select id="${id}">${html}</select>${hint}</div>`;
    }
    case 'chips': {
      var sel=arr(v); var av=optsOf(typeof f.opts==='function'?f.opts(V):f.opts);
      return `<div class="f" data-fw="${f.k}">${lab}<div class="chips" id="${id}">${av.map(function(o){
        return `<button type="button" class="chip ${sel.indexOf(o.v)>=0?'on':''}" data-val="${esc(o.v)}">${esc(o.l)}</button>`;}).join('')}</div>${hint}</div>`;
    }
    case 'check':
      return `<div class="f" data-fw="${f.k}" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="${id}" ${v?'checked':''} style="width:20px;height:20px;accent-color:var(--accent)">
        <label for="${id}" style="margin:0;font-size:14px;color:var(--fg)">${esc(f.l)}</label>${f.hint?`<span class="hint" style="margin:0">${esc(f.hint)}</span>`:''}</div>`;
    case 'links': /* [{label,url,note}] */
      return subList(f,V,'links');
    case 'pairs': /* [{a,b}] */
      return subList(f,V,'pairs');
    case 'list': /* ['文本'] */
      return subList(f,V,'list');
    case 'row':
      return `<div class="f-row">${f.cols.map(function(c){ return fieldInput(c,V); }).join('')}</div>`;
    default: {
      var type = f.t==='money'?'number':(f.t||'text');
      var extra = '';
      if(f.t==='number'||f.t==='money') extra=' inputmode="decimal" step="any" min="0"';
      if(f.t==='money'){
        return `<div class="f" data-fw="${f.k}" style="position:relative">${lab}
          <input id="${id}" type="number" inputmode="decimal" step="any" min="0" value="${esc(v==null?'':v)}" placeholder="${esc(f.ph||'0')}">
          <span class="muted" style="position:absolute;right:11px;top:26px">元</span>${hint}</div>`;
      }
      return `<div class="f" data-fw="${f.k}">${lab}<input id="${id}" type="${type}"${extra} value="${esc(v==null?'':v)}" placeholder="${esc(f.ph||'')}">${hint}</div>`;
    }
  }
}
function subList(f,V,kind){
  var rows=arr(V[f.k]);
  var lab=`<label>${esc(f.l)}${f.req?'<span class="req"> *</span>':''}</label>`;
  var inner='';
  if(kind==='list'){
    inner=rows.map(function(r,i){
      return `<div class="sub-item"><input data-sub="${f.k}:${i}" value="${esc(r)}" placeholder="${esc(f.ph||'')}"><button type="button" class="del" data-subdel="${f.k}:${i}">×</button></div>`;
    }).join('');
  }else{
    var c1=f.c1||'名称', c2=f.c2||'链接';
    inner=rows.map(function(r,i){
      if(kind==='links'){
        return `<div class="sub-item"><input data-sub="${f.k}:${i}:a" value="${esc(r.label||r.a||'')}" placeholder="${esc(c1)}">
          <input data-sub="${f.k}:${i}:b" value="${esc(r.url||r.b||'')}" placeholder="${esc(c2)}">
          <input data-sub="${f.k}:${i}:c" value="${esc(r.note||'')}" placeholder="备注">
          <button type="button" class="del" data-subdel="${f.k}:${i}">×</button></div>`;
      }
      return `<div class="sub-item"><input data-sub="${f.k}:${i}:a" value="${esc(r.a||r.label||'')}" placeholder="${esc(c1)}">
        <input data-sub="${f.k}:${i}:b" value="${esc(r.b||r.url||'')}" placeholder="${esc(c2)}">
        <button type="button" class="del" data-subdel="${f.k}:${i}">×</button></div>`;
    }).join('');
  }
  return `<div class="f" data-fw="${f.k}">${lab}<div class="sub-list">${inner||'<div class="tiny muted" style="padding:4px">暂无</div>'}
    <button type="button" class="btn sm gray" data-subadd="${f.k}" style="margin:6px 0 2px">＋ 添加</button></div>
    ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}
/**
 * openForm({ title, fields, values, onSave })
 * fields: [{k,l,t,req,opts,ph,hint,show,t:'row',cols:[...] }]
 */
function openForm(cfg){
  var V={};
  (cfg.fields||[]).forEach(function(f){ collectDefaults(f); });
  function collectDefaults(f){
    if(f.t==='row'){ (f.cols||[]).forEach(collectDefaults); return; }
    var base = cfg.values?cfg.values[f.k]:undefined;
    if(f.t==='chips') V[f.k]=arr(base).slice();
    else if(f.t==='links'||f.t==='pairs'||f.t==='list') V[f.k]=arr(base).map(function(x){ return Object.assign({},x); });
    else if(f.t==='check') V[f.k]=!!base;
    else V[f.k]= (base===undefined||base===null)?(f.def!==undefined?f.def:''):base;
  }
  function visible(f){ return f.show? !!f.show(V) : true; }
  function syncSelectDefaults(){
    /* 必填 select 不渲染空选项：DOM 显示第一项而模型为空会卡死保存，渲染前先对齐 */
    var walk=function(f){
      if(f.t==='row'){ (f.cols||[]).forEach(walk); return; }
      if(f.t!=='select'||!f.req) return;
      if(V[f.k]!==''&&V[f.k]!==null&&V[f.k]!==undefined) return;
      if(!visible(f)) return;
      var os=optsOf(typeof f.opts==='function'?f.opts(V):f.opts);
      if(os.length) V[f.k]=os[0].v;
    };
    (cfg.fields||[]).forEach(walk);
  }
  function body(){
    syncSelectDefaults();
    return (cfg.fields||[]).filter(function(f){ return f.t==='row' ? (f.cols||[]).some(visible) : visible(f); })
      .map(function(f){
        if(f.t==='row'){
          var cols=(f.cols||[]).filter(visible);
          if(!cols.length) return '';
          return `<div class="f-row">${cols.map(function(c){return fieldInput(c,V);}).join('')}</div>`;
        }
        return fieldInput(f,V);
      }).join('')
      + `<div class="btn-row" style="margin-top:16px">
          <button class="btn gray" id="fCancel">取消</button>
          <button class="btn" id="fSave">${esc(cfg.saveLabel||'保存')}</button></div>
          ${cfg.foot||''}`;
  }
  function bind(m){
    m.querySelector('#fCancel').onclick=function(){ closeModal(); };
    m.querySelectorAll('[id^=fld_]').forEach(function(el){
      var k=el.id.slice(4), f=findField(k);
      if(!f) return;
      if(f.t==='chips'){
        el.querySelectorAll('.chip').forEach(function(b){
          b.onclick=function(){
            var val=b.getAttribute('data-val'), sel=arr(V[k]);
            var i=sel.indexOf(val); if(i>=0) sel.splice(i,1); else sel.push(val);
            V[k]=sel; b.classList.toggle('on');
          };
        });
      }else if(f.t==='check'){
        el.onchange=function(){ V[k]=el.checked; if(f.live) rerender(); };
      }else{
        el.onchange=function(){ V[k]=el.value; if(f.live) rerender(); };
        el.oninput=function(){ V[k]=el.value; };
      }
    });
    m.querySelectorAll('[data-subadd]').forEach(function(b){
      b.onclick=function(){
        var k=b.getAttribute('data-subadd'), f=findField(k);
        var list=arr(V[k]).slice();
        list.push(f.t==='list'?'':{label:'',url:'',note:''});
        if(f.t==='pairs') list[list.length-1]={a:'',b:''};
        V[k]=list; rerender();
      };
    });
    m.querySelectorAll('[data-sub]').forEach(function(inp){
      inp.onchange=function(){
        var p=inp.getAttribute('data-sub').split(':');
        if(p.length===2){ V[p[0]][p[1]]=inp.value; return; }
        var f=findField(p[0]), o=V[p[0]][p[1]], part=p[2];
        if(!o) return;
        if(f&&f.t==='pairs'){ if(part==='a') o.a=inp.value; else if(part==='b') o.b=inp.value; }
        else { if(part==='a') o.label=inp.value; else if(part==='b') o.url=inp.value; else o.note=inp.value; }
      };
    });
    m.querySelectorAll('[data-subdel]').forEach(function(b){
      b.onclick=function(){ var p=b.getAttribute('data-subdel').split(':'); V[p[0]].splice(num(p[1]),1); rerender(); };
    });
    var sv=m.querySelector('#fSave');
    if(sv) sv.onclick=function(){
      var missing=null;
      m.querySelectorAll('[data-fw]').forEach(function(d){ d.classList.remove('err'); });
      for(var i=0;i<cfg.fields.length;i++){
        var f=cfg.fields[i]; if(f.t==='row'){ for(var j=0;j<f.cols.length;j++){ if(checkReq(f.cols[j])) return; } continue; }
        if(checkReq(f)) return;
      }
      function checkReq(f){
        var reqd = (typeof f.req==='function')? !!f.req(V) : !!f.req;
        if(!reqd || !visible(f)) return false;
        var v=V[f.k];
        if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length)){
          var node=m.querySelector('[data-fw="'+f.k+'"]'); if(node){ node.classList.add('err'); node.scrollIntoView({block:'center'}); }
          toast('请填写：'+f.l); missing=f.k; return true;
        }
        return false;
      }
      if(missing) return;
      closeModal();
      cfg.onSave(V);
    };
  }
  function rerender(){
    var m=document.getElementById('modal');
    m.querySelector('#mContent').innerHTML=body();
    bind(m);
  }
  function findField(k){
    for(var i=0;i<cfg.fields.length;i++){
      var f=cfg.fields[i]; if(f.k===k) return f;
      if(f.t==='row'){ for(var j=0;j<f.cols.length;j++) if(f.cols[j].k===k) return f.cols[j]; }
    }
    return null;
  }
  openModal({ title:cfg.title, body:body(), onMount:function(m){ bind(m); if(cfg.onMount) cfg.onMount(m); }, center:cfg.center });
}

/* ---- 自动费用：以 autoKey 幂等，改一处不重复记账 ---- */
function aKey(t,id,slot){ return t+':'+id+':'+slot; }
function upsertAuto(key,data){
  var idx=-1;
  for(var j=0;j<DB.expenses.length;j++) if(DB.expenses[j].autoKey===key){ idx=j; break; }
  if(!data || num(data.amount)<=0){ if(idx>=0) DB.expenses.splice(idx,1); return; }
  if(idx>=0){
    var old=DB.expenses[idx];
    DB.expenses[idx]=Object.assign(old,data,{autoKey:key,source:'自动'});
  }else{
    DB.expenses.push(Object.assign({id:uid('e'),autoKey:key,source:'自动'},data));
  }
}
function dropAutoPrefix(prefix){
  DB.expenses = DB.expenses.filter(function(e){ return String(e.autoKey||'').indexOf(prefix)!==0; });
}
function expCatOfItem(it){
  var k=it.kind||'服装';
  return EXPENSE_CATS.indexOf(k)>=0?k:'其他';
}
function syncItemExpense(it){
  var key=aKey('item',it.id,'buy');
  var charged = num(it.price)>0 && ['愿望单','计划中'].indexOf(it.status)<0;
  if(!charged){ upsertAuto(key,null); return; }
  upsertAuto(key,{
    projectId:arr(it.projectIds)[0]||null,
    date: it.orderDate||it.arrivedDate||todayISO(),
    category: expCatOfItem(it), amount: num(it.price),
    note:'资产·'+(it.name||''), refType:'item', refId:it.id
  });
}
function syncApptExpense(a){
  var paid = ['已付定金','已完成','已结清'].indexOf(a.status)>=0;
  var done = ['已完成','已结清'].indexOf(a.status)>=0;
  var cat = a.type==='修图师'?'后期修图':(a.type==='场地预定'?'场地':'妆造');
  var pid=a.projectId||null, base={projectId:pid, category:cat, refType:'appointment', refId:a.id};
  var dep=num(a.deposit), fee=num(a.fee), bal=fee-dep;
  if(a.status==='已结清'){
    /* 结清：定金按已付入账，尾款补差，总额=fee */
    upsertAuto(aKey('appt',a.id,'deposit'), Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金·'+cnOf(a)}));
    upsertAuto(aKey('appt',a.id,'balance'), bal>0?Object.assign({},base,{amount:bal,date:todayISO(),note:'尾款·'+cnOf(a)}):null);
  }else if(a.status==='已完成'){
    upsertAuto(aKey('appt',a.id,'deposit'), Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金·'+cnOf(a)}));
    upsertAuto(aKey('appt',a.id,'balance'), null);   /* 尾款未结，不计 */
  }else if(paid){
    upsertAuto(aKey('appt',a.id,'deposit'), Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金·'+cnOf(a)}));
    upsertAuto(aKey('appt',a.id,'balance'), null);
  }else{
    upsertAuto(aKey('appt',a.id,'deposit'), null);
    upsertAuto(aKey('appt',a.id,'balance'), null);
  }
  if(['已取消','爽约'].indexOf(a.status)>=0){
    upsertAuto(aKey('appt',a.id,'balance'), null);
    /* 取消/爽约：定金通常不退，保留定金流水由用户手删 */
  }
}
function cnOf(a){ var c=contactLabel(a.contactId); return (a.type||'')+(c?('·'+c):''); }
function syncSessionExpense(s){
  var base={projectId:s.projectId||null, category:'摄影', refType:'session', refId:s.id};
  var dep=num(s.deposit), fee=num(s.fee), bal=fee-dep;
  var d=(s.date||'')||todayISO();
  if(['已确认','已完成'].indexOf(s.status)>=0){
    upsertAuto(aKey('sess',s.id,'deposit'), Object.assign({},base,{amount:dep,date:d,note:'摄影定金'}));
  }else upsertAuto(aKey('sess',s.id,'deposit'), null);
  if(s.status==='已完成'){
    upsertAuto(aKey('sess',s.id,'fee'), bal>0?Object.assign({},base,{amount:bal,date:d,note:'摄影尾款'}):null);
  }else upsertAuto(aKey('sess',s.id,'fee'), null);
}
function syncAllAutoExpenses(){
  DB.items.forEach(syncItemExpense);
  DB.appointments.forEach(syncApptExpense);
  DB.sessions.forEach(syncSessionExpense);
  save();
}

/* ---- 级联删除 ---- */
function deleteProject(p){
  var pids=sessionsOf(p.id).map(function(s){return s.id;});
  DB.deliverables=DB.deliverables.filter(function(d){ return pids.indexOf(d.sessionId)<0; });
  DB.sessions=DB.sessions.filter(function(s){ return s.projectId!==p.id; });
  DB.appointments=DB.appointments.filter(function(a){ return a.projectId!==p.id; });
  DB.publications=DB.publications.filter(function(x){ return x.projectId!==p.id; });
  DB.todos=DB.todos.filter(function(t){ return t.projectId!==p.id; });
  DB.expenses=DB.expenses.filter(function(e){ return e.projectId!==p.id; });
  DB.items.forEach(function(i){ i.projectIds=arr(i.projectIds).filter(function(x){return x!==p.id;}); });
  del('projects',p.id);
  /* 资产仍在，重新生成其自动流水，避免流水凭空消失 */
  DB.items.forEach(syncItemExpense);
  save();
}
function deleteSession(s){
  DB.deliverables=DB.deliverables.filter(function(d){ return d.sessionId!==s.id; });
  dropAutoPrefix('sess:'+s.id+':');
  del('sessions',s.id);
}
function deleteAppt(a){ dropAutoPrefix('appt:'+a.id+':'); del('appointments',a.id); }
function deleteItem(i){
  i.projectIds=[];
  dropAutoPrefix('item:'+i.id+':');
  DB.sessions.forEach(function(s){ s.checklist=arr(s.checklist).filter(function(c){ return c.itemId!==i.id; }); });

function badge(t,cls){ return `<span class="badge ${cls||''}">${esc(t)}</span>`; }
function statusBadge(st){ return badge(st,STATUS_STYLE[st]||''); }
function card(title,body,act){
  return `<div class="card"><h3>${esc(title)}${act?`<span class="act" onclick="${act.fn}" style="cursor:pointer">${esc(act.label)}</span>`:''}</h3>${body}</div>`;
}
function listRow(o){
  return `<div class="row ${o.cls||''}" ${o.onclick?`onclick="${o.onclick}"`:''}>
    <div class="main"><div class="t">${o.t}</div>${o.d?`<div class="d">${o.d}</div>`:''}</div>
    ${o.r?`<div class="r">${o.r}</div>`:''}${o.badge?`<div>${o.badge}</div>`:''}</div>`;
}
function emptyBox(text,btn){
  return `<div class="empty">${esc(text)}${btn?`<div style="margin-top:8px"><button class="btn sm" onclick="${btn.fn}">${esc(btn.label)}</button></div>`:''}</div>`;
}
function kv(k,v){ return `<div class="kv"><div class="k">${esc(k)}</div><div class="v">${v===null||v===undefined||v===''?'<span class="muted">—</span>':v}</div></div>`; }
function linkOrText(u,label){
  if(!u) return '';
  return /^https?:\/\//i.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(label||u)}</a>`:esc(label||u);
}

function render(){
  var t=document.getElementById('topbar'), m=document.getElementById('main');
  var af=document.activeElement, aid=af&&af.id, apos=null, aval=null;
  try{ if(af&&af.setSelectionRange){ apos=af.selectionStart; aval=af.value; } }catch(e){}
  var html='';
  switch(S.view){
    case 'home': html=vHome(); break;
    case 'projects': html=vProjects(); break;
    case 'project': html=vProject(); break;
    case 'assets': html=vAssets(); break;
    case 'asset': html=vAsset(); break;
    case 'team': html=vTeam(); break;
    case 'contact': html=vContact(); break;
    case 'location': html=vLocation(); break;
    case 'session': html=vSession(); break;
    case 'mine': html=vMine(); break;
    default: html=vHome();
  }
  m.innerHTML=html;
  t.innerHTML=vTopbar();
  renderTabbar();
  if(aid){
    var el=document.getElementById(aid);
    if(el){ try{ el.focus(); if(aval!=null&&el.value!==aval) el.value=aval; if(apos!=null) el.setSelectionRange(apos,apos); }catch(e){} }
  }

/* =========================================================
   首页：提醒 + 概览（M12 时间线聚合）
   ========================================================= */
function upcomingEvents(days){
  var out=[];
  DB.sessions.forEach(function(s){
    var d=dayDiff(s.date);
    if(d!==null && d>=0 && d<=days) out.push({due:s.date+(s.time?' '+s.time:''),kind:'拍摄',title:(s.method||'拍摄')+' · '+projLabel(s.projectId)+(s.locationId?' @'+locationLabel(s.locationId):(s.locationText?' @'+s.locationText:'')),to:'session',id:s.id});
  });
  DB.appointments.forEach(function(a){
    var d=dayDiff((a.datetime||'').slice(0,10));
    if(a.datetime && d!==null && d>=0 && d<=days && ['已完成','已结清','已取消','爽约'].indexOf(a.status)<0)
      out.push({due:a.datetime,kind:'妆造',title:a.type+' · '+(contactLabel(a.contactId)||a.contactText||'待定')+'（'+a.status+'）',to:'project',id:a.projectId});
  });
  DB.projects.forEach(function(p){
    if(p.stage==='已出片') return;
    var d=dayDiff(p.deadline);
    if(d!==null && d<=days) out.push({due:p.deadline,kind:'deadline',title:p.name+' 计划完成日（'+p.stage+'）',to:'project',id:p.id});
  });
  DB.todos.forEach(function(t){
    if(t.done) return;
    var d=dayDiff(t.due);
    if(d!==null && d<=days) out.push({due:t.due,kind:'待办',title:t.title+(t.projectId?' · '+projLabel(t.projectId):''),to:'project',id:t.projectId||S.projectId});
  });
  DB.items.forEach(function(i){
    if(i.kind==='美瞳'&&i.expiresAt){ var d=dayDiff(i.expiresAt); if(d!==null&&d<=days&&d>=-365) out.push({due:i.expiresAt,kind:'美瞳到期',title:i.name+' 到期（'+(i.status||'')+'）',to:'asset',id:i.id}); }
    if(i.kind==='消耗品'&&num(i.qty)>0&&num(i.lowQty)>0&&num(i.qty)<=num(i.lowQty)) out.push({due:'',kind:'低库存',title:i.name+' 仅剩 '+i.qty+'，低于阈值 '+i.lowQty,to:'asset',id:i.id});
  });
  return sortAsc(out.map(function(x){x._k=x.due||'9999';return x;}),'_k');
}
function gotoTarget(to,id){
  if(to==='session') go('session',{sessionId:id,tab:'projects'});
  else if(to==='asset') go('asset',{itemId:id,tab:'assets'});
  else if(to==='project') go('project',{projectId:id,tab:'projects'});
}
function vHome(){
  var od=overdueDelivs();
  var openTodos=DB.todos.filter(function(t){return !t.done;});
  var ev=upcomingEvents(14);
  var monthKey=todayISO().slice(0,7);
  var monthCost=sum(DB.expenses.filter(function(e){return String(e.date||'').slice(0,7)===monthKey;}),'amount');
  var allCost=sum(DB.expenses,'amount');
  var back=sum(DB.items.filter(function(i){return i.status==='已售出';}),'dispPrice');
  var active=DB.projects.filter(function(p){return p.stage!=='已出片';});
  var html='';

  if(!DB.projects.length && !DB.items.length && !DB.contacts.length){
    html+=`<div class="info-box">还没有数据。可以点下面的按钮载入示例项目熟悉流程（之后可在「我的」里一键清空），或直接开始新建。</div>
    <div class="btn-row" style="margin-bottom:14px">
      <button class="btn" onclick="formProject()">＋ 新建出装项目</button>
      <button class="btn gray" onclick="loadSample()">载入示例</button>
    </div>`;
  }

  /* 逾期项 */
  var danger=[];
  od.forEach(function(d){ danger.push({t:badge('逾期','b-danger'),t2:'',label:(d.type||'交付物')+'逾期',
    title:projLabel((get('sessions',d.sessionId)||{}).projectId)+' · '+d.type+'（约定 '+(d.agreedDate||'')+'，' + dueText(d.agreedDate) + '）',
    to:'session',id:d.sessionId}); });
  DB.sessions.forEach(function(s){
    if(['计划中','已确认'].indexOf(s.status)>=0 && s.date && isPast(s.date))
      danger.push({label:'拍摄日已过',title:s.date+' '+projLabel(s.projectId)+'（'+s.status+'）',to:'session',id:s.id});
  });
  openTodos.forEach(function(t){ if(t.due&&isPast(t.due)) danger.push({label:'待办逾期',title:t.title,to:'project',id:t.projectId}); });
  if(danger.length){
    html+=`<div class="card"><h3>需要处理<span class="cnt">${danger.length} 项</span></h3>`+
      danger.map(function(x){
        return listRow({cls:'row-sec',t:`${badge(x.label,'b-danger')} ${esc(x.title)}`,onclick:`gotoTarget('${x.to}','${x.id||''}')`});
      }).join('')+`</div>`;
  }

  /* 时间线 */
  html+=`<div class="card"><h3>接下来 14 天<span class="cnt">${ev.length} 项</span><span class="act" onclick="go('projects',{tab:'projects'})">全部项目 ›</span></h3>`;
  html+= ev.length? ev.slice(0,12).map(function(x){
    return listRow({t:`${badge(x.kind, x.kind==='deadline'?'b-warn':(x.kind==='拍摄'?'b-accent':'b-info'))} ${esc(x.title)}`,
      d:x.due||'',onclick:`gotoTarget('${x.to}','${x.id||''}')`});
  }).join('') : '<div class="muted tiny">暂无安排。拍摄单、预约单、项目 deadline、待办都会汇总到这里。</div>';
  html+='</div>';

  /* 数字概览 */
  html+=`<div class="grid2" style="margin-bottom:12px">
    <div class="stat"><div class="n">${money(allCost)}<span class="tiny muted"> 元</span></div><div class="l">累计支出（本月 ${money(monthCost)}）</div></div>
    <div class="stat"><div class="n">${money(back)}<span class="tiny muted"> 元</span></div><div class="l">出物回血合计</div></div>
    <div class="stat"><div class="n">${usableItems().length}</div><div class="l">手头可用资产 / 共 ${DB.items.length} 条</div></div>
    <div class="stat"><div class="n">${active.length}</div><div class="l">进行中项目 / 共 ${DB.projects.length} 个</div></div>
  </div>`;

  /* 进行中项目 */
  html+=`<div class="card"><h3>进行中的出装<span class="act" onclick="go('projects',{tab:'projects'})">管理 ›</span></h3>`;
  html+= active.length? sortAsc(active,'deadline').map(function(p){
    var its=itemsOfProject(p.id), ready=its.filter(function(i){return ['可用','试装通过'].indexOf(i.status)>=0;}).length;
    var pct=its.length?Math.round(ready/its.length*100):0;
    var spent=sum(expsOf(p.id),'amount');
    return listRow({
      t:`${esc(p.name)} ${p.deadline?badge(dueText(p.deadline), isPast(p.deadline)?'b-danger':'b-warn'):''}`,
      d:`${badge(p.stage,'b-accent')} 备装 ${ready}/${its.length} · 花费 ${money(spent)}${p.budget?' / 预算 '+money(p.budget):''}元`,
      r:'›',onclick:`go('project',{projectId:'${p.id}',tab:'projects'})`
    });
  }).join('') : emptyBox('还没有进行中的项目', {label:'＋ 新建项目',fn:'formProject()'});
  html+='</div>';

  /* 处置提醒 */
  var borrow=DB.items.filter(function(i){return i.status==='外借中';});
  if(borrow.length){
    html+=`<div class="card"><h3>外借中的物件<span class="cnt">${borrow.length}</span></h3>`+borrow.map(function(i){
      return listRow({t:esc(i.name),d:`去向 ${esc(i.dispTo||'未记录 CN')} ${(i.dispDate||'')?'· 借出 '+i.dispDate:''}`,r:'›',onclick:`go('asset',{itemId:'${i.id}',tab:'assets'})`});
    }).join('')+`</div>`;
  }
  html+=`<div class="btn-row" style="margin:14px 0 4px">
    <button class="btn" onclick="formProject()">＋ 立项</button>
    <button class="btn ghost" onclick="formItem()">＋ 资产</button>
    <button class="btn gray" onclick="formContact()">＋ 联系人</button>
    <button class="btn gray" onclick="formExpense()">＋ 记一笔</button>
  </div>`;
  return html;
}

function projectStats(p){
  var its=itemsOfProject(p.id);
  var spent=sum(expsOf(p.id),'amount');
  var back=sum(its.filter(function(i){return i.status==='已售出';}),'dispPrice');
  var ready=its.filter(function(i){return ['可用','试装通过'].indexOf(i.status)>=0;}).length;

var PROJ_TABS=[['base','概览'],['gear','置装'],['team','人员'],['shoot','拍摄'],['film','后期'],['cost','费用']];
function projectGaps(p){
  var st=projectStats(p), g=[], its=st.its;
  if(!its.length) g.push('还没有登记任何服装/道具/配件');
  if(!its.filter(function(i){return i.kind==='服装'||i.kind==='鞋'||i.kind==='饰品';}).length) g.push('缺服装类条目');
  if(!its.filter(function(i){return i.kind==='假发';}).length) g.push('缺假发（自剪还是约毛娘？）');
  var appts=DB.appointments.filter(function(a){return a.projectId===p.id;});
  if(!appts.filter(function(a){return a.type==='妆娘';}).length) g.push('未约妆娘');
  if(!appts.filter(function(a){return a.type==='毛娘';}).length && !its.filter(function(i){return i.kind==='假发'&&i.wigStyle==='已造型';}).length) g.push('未约毛娘 / 假发未造型');
  if(!st.ss.length) g.push('还没有拍摄单');
  if(p.stage==='拍摄中'&&!st.ss.filter(function(s){return s.status==='已确认';}).length) g.push('拍摄单未确认（时间/场地/摄影师）');
  if(st.ss.filter(function(s){return s.status==='已完成';}).length && !DB.deliverables.some(function(d){return st.ss.some(function(s){return s.id===d.sessionId;});})) g.push('已拍但没登记原片/精修交付');
  var pend=appts.filter(function(a){return ['待确认','已定档'].indexOf(a.status)>=0 && num(a.fee)>num(a.deposit);});
  if(pend.length) g.push('有预约单未付定金：'+pend.map(function(a){return a.type;}).join('、'));
  if(!st.spent) g.push('还没有费用流水（可能漏记）');
  if(p.budget && st.spent>p.budget) g.push('⚠ 已超出预算 '+money(st.spent-p.budget)+' 元');
  return g;
}

function assetExpiryWarn(i){
  if(i.kind==='美瞳'&&i.expiresAt&&isPast(i.expiresAt)) return '美瞳已过期 '+(i.openedAt?('（开封 '+i.openedAt+'）'):'');
  if(i.kind==='美瞳'&&i.expiresAt&&dayDiff(i.expiresAt)<=30) return '美瞳将于 '+dueText(i.expiresAt)+' 到期';
  if(i.kind==='消耗品'&&num(i.lowQty)>0&&num(i.qty)<=num(i.lowQty)) return '库存偏低：'+(i.qty||0)+' ≤ '+(i.lowQty||0);

function syncChecklist(sid){
  var s=get('sessions',sid); if(!s) return;
  var old={};
  arr(s.checklist).forEach(function(c){ if(c&&c.text) old[c.text]=c; });
  var desired=[];
  itemsOfProject(s.projectId).filter(function(i){ return TERMINAL_STATUS.indexOf(i.status)<0; })
    .sort(function(a,b){ return String(a.kind).localeCompare(String(b.kind),'zh'); })
    .forEach(function(i){ desired.push({text:i.name+'（'+(i.kind||'')+(i.storage?' · '+i.storage:'')+'）',itemId:i.id}); });
  EMERGENCY_KIT.forEach(function(k){ desired.push({text:'应急包·'+k,kit:true}); });
  var out=desired.map(function(d){
    var o=old[d.text];
    if(o){ delete old[d.text]; return Object.assign(o,{text:d.text,itemId:d.itemId||null,kit:!!d.kit}); }
    return {id:uid('c'),text:d.text,itemId:d.itemId||null,kit:!!d.kit,checked:false};
  });
  /* 用户手动加的项目保留；已脱离本项目的资产行自动消失 */
  Object.keys(old).forEach(function(t){
    var c=old[t];
    if(!c.itemId) out.push(c);
  });
  s.checklist=out; s.updated_at=nowStamp(); put('sessions',s);
}

function buildExport(){
  return { meta:{app:'CosPlan',ver:APP.ver,schema:APP.schema,exported_at:nowStamp(),device:navigator.userAgent.slice(0,80)}, data:DB };
}
function exportJSON(){
  var blob=new Blob([JSON.stringify(buildExport(),null,1)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cosplan-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },600);
  toast('已导出备份文件');
}
function copyJSON(){
  var txt=JSON.stringify(buildExport());
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制 '+Math.round(txt.length/1024)+' KB'); },function(){ toast('浏览器不允许复制，请改用导出文件'); });
  }else toast('当前环境不支持剪贴板，请改用导出文件');
}
function pickImport(merge){ S.mergeMode=!!merge; document.getElementById('importFile').click(); }
function readImport(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    inp.value='';
    var obj;
    try{ obj=JSON.parse(r.result); }catch(e){ toast('文件不是合法 JSON'); return; }
    var data=obj&&obj.data?obj.data:obj;
    if(!data||typeof data!=='object'||!data.projects){ toast('文件结构不对：缺少 projects 字段'); return; }
    var cnt=['projects','items','contacts','sessions','appointments','deliverables','expenses'].map(function(k){ return k+' '+(arr(data[k]).length); }).join('，');
    confirmBox(S.mergeMode?'合并导入':'覆盖导入',
      (S.mergeMode?'同 id 的以文件为准，其余追加：':'将完全替换本机数据（导出的这份含：')+cnt+(S.mergeMode?')':''),
      function(){ doImport(data,S.mergeMode); },'继续');
  };
  r.readAsText(f);
}
function doImport(data,merge){
  if(!merge){ DB=migrate(data); save(); go('home',{tab:'home'}); toast('导入完成'); return; }
  var fresh=migrate(data);
  ['works','characters','projects','items','contacts','locations','sessions','appointments','deliverables','publications','expenses','todos'].forEach(function(k){
    var map={};
    DB[k].forEach(function(x){ map[x.id]=x; });
    fresh[k].forEach(function(x){ map[x.id]=x; });
    DB[k]=Object.keys(map).map(function(id){ return map[id]; });
  });
  save(); go('home',{tab:'home'}); toast('合并导入完成');
}

    DB.todos.push({id:uid('t'),projectId:p.id,title:'假发给毛娘补造型',due:isoOf(new Date(Date.now()+6*86400000)),done:false,note:'问小满能不能顺便修刘海'});
    DB.expenses.push({id:uid('e'),projectId:p.id,date:todayISO(),category:'交通',amount:60,note:'勘景打车',source:'手动'});
    save(); render(); toast('示例数据已载入');
  },'载入');
}

  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(String(t||'')).then(function(){ toast('已复制：'+t); },function(){ toast('复制失败：'+t); });
