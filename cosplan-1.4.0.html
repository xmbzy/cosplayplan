<title>CosPlan · Cosplay 计划器 v1.4.0</title>
<style>
/* ============ 基础与主题 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;
}
:root{
  --bg:#f4f5fa; --card:#ffffff; --fg:#20222c; --sub:#6b7183; --line:#e6e8f0;
  --accent:#7c5cff; --accent-soft:#efeaff; --accent2:#ff7aa2; --accent2-soft:#ffeef4;
  --ok:#1fa971; --ok-soft:#e3f7ee; --warn:#d98216; --warn-soft:#fdf1de;
  --danger:#e04357; --danger-soft:#ffe9ec; --info:#2f7de1; --info-soft:#e6f0fd;
  --gray-soft:#eef0f5; --radius:14px; --shadow:0 2px 10px rgba(30,32,60,.06);
  --nav-h:58px;
  /* ===== v1.3.2：立体按键（3D 长方形）=====
     目标是「低对比度下仍看得清按钮大小」，所以边界不靠填充色差，靠三样东西：
       ① --key-edge 描边：始终比面色深，是唯一与配色无关的边界
       ② --key-ledge 底座：底部 2px 实心台阶 —— 就算面与背景同色，也能看出"这是一块凸起"
       ③ 落影：把控件从背景上抬起来
     换主题只要改这四个值，不用动任何控件规则。 */
  --key-radius:7px;              /* 长方形的圆角：小到看得出是矩形，又不扎手 */
  --key-bg:#fbfcfe;              /* 按键面（上） */
  --key-bg2:#eceff7;             /* 按键面（下）—— 极轻的纵向渐变，给一点曲率感 */
  --key-edge:#7e88a6;            /* 外描边：对页面底 #f4f5fa 实测 3.24:1 —— 达到 WCAG 1.4.11
                                    对"非文字控件边界"要求的 3:1，弱屏/强光下边界不会糊掉 */
  --key-ledge:#6b7490;           /* 底座台阶：对底色 4.26:1，底部 2px 实心，靠它认出"这是一块凸起" */
  --key-hi:rgba(255,255,255,.95); /* 顶部内高光 */
  --key-drop:0 3px 5px rgba(30,32,60,.13);
  --key-accent:#6d4bf0;          /* 选中态：面色 */
  --key-accent2:#5033c9;         /* 选中态：底座 */
  --key-accent-edge:#4a2fb8;     /* 选中态：描边 */
  --key-danger-edge:#c8324a;    /* 1.3.3：危险键的描边/底座改用 token（对底色 4.81 / 6.38:1，且跟随「提高对比度」）*/
  --key-danger-ledge:#a8273c;
  --bar-h:66px;               /* 顶栏实测高 65.5px：分页签 sticky 与顶部通知都按它让位，不再各写一个数 */
}
/* 系统开了「提高对比度」时，把边界再压深一档 */
@media(prefers-contrast:more){
  :root{--key-edge:#4d566e;--key-ledge:#333a4d;--line:#a8b0c4;--key-danger-edge:#a8273c;--key-danger-ledge:#8e1f31}
}
/* ===== v1.3.2：立体按键的共同外观（按下 = 真的按下去） ===== */
.chip,.btn,.f-sel,.fab,.modal-head .x,.tabs,.os-box,.toast .u{
  border-radius:var(--key-radius);
  border:1px solid var(--key-edge);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge),var(--key-drop);
}
.chip:active,.btn:active,.fab:active,.modal-head .x:active,.toast .u:active{
  transform:translateY(2px);
  box-shadow:inset 0 1px 0 var(--key-hi),0 0 0 var(--key-ledge);
}
.hidden{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
a{color:var(--info);text-decoration:none;word-break:break-all}
/* ============ 布局骨架 ============ */
#app{max-width:860px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
/* v1.2：滑动时行会横向位移，裁掉横向溢出，避免窄屏出现左右滑动条 */
#main{overflow-x:clip;padding:12px 14px 20px}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(244,245,250,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;min-height:52px;
}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:12px;color:var(--sub);font-weight:400;display:block;margin-top:1px}
main{padding:12px 14px 20px}
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;background:none;border:0;padding:8px 2px 6px;color:var(--sub);font-size:11px;line-height:1.3;cursor:pointer;
}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar button .ic{display:block;font-size:18px;line-height:1.1}
/* ============ 卡片/列表 ============ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:12px;overflow:hidden}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.card h3 .cnt{font-size:12px;color:var(--sub);font-weight:400}
.card h3 .act{margin-left:auto;font-size:12px;color:var(--accent);background:none;border:0;cursor:pointer;font-weight:600}
.sect-title{font-size:13px;color:var(--sub);font-weight:700;margin:16px 2px 8px;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:50px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .d{font-size:12px;color:var(--sub);margin-top:2px}
.row .r{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.empty{padding:18px 10px;text-align:center;color:var(--sub);font-size:13px;background:var(--gray-soft);border-radius:10px}
.kv{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{width:74px;color:var(--sub);flex:none}
.kv .v{flex:1;min-width:0;word-break:break-word;overflow-wrap:anywhere}
.kv .v a{overflow-wrap:anywhere}
/* 1.1.2：长英文串 / URL / 无空格路径在窄屏会撑破卡片（实测 375px 下溢出可达 3753px），统一断行。中文天然可换行，不受影响 */
.card,.card *,.empty,.stage-head h2,.danger-box,.warn-box{overflow-wrap:anywhere;word-break:break-word}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:400px){.grid3{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .n{font-size:19px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:11px;color:var(--sub);margin-top:2px}
/* ============ 标签/徽章 ============ */
/* v1.3.2：徽章是行内标签、不是"选框"，所以不做立体台阶；但加一圈内描边，
   保证在低对比度/强光下「这块标签有多大」仍然看得出来。 */
.badge{
  display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;
  background:var(--gray-soft);color:var(--sub);white-space:nowrap;
  box-shadow:inset 0 0 0 1px var(--key-edge),0 1px 0 rgba(32,34,44,.06);   /* 1.3.3：原来 10% 黑实测只有 1.38:1，"轮廓看得见"没兑现 */
}
.badge.b-ok{background:var(--ok-soft);color:var(--ok)}
.badge.b-warn{background:var(--warn-soft);color:var(--warn)}
.badge.b-danger{background:var(--danger-soft);color:var(--danger)}
.badge.b-info{background:var(--info-soft);color:var(--info)}
.badge.b-accent{background:var(--accent-soft);color:var(--accent)}
.badge.b-pink{background:var(--accent2-soft);color:var(--accent2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:12.5px;padding:8px 13px;min-height:36px;cursor:pointer;
  border-radius:var(--key-radius);border:1px solid var(--key-edge);
  background:linear-gradient(180deg,var(--key-bg) 0%,var(--key-bg2) 100%);
  color:var(--fg);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge),var(--key-drop);
  transition:transform .06s ease,box-shadow .06s ease;
}
.chip.on{
  background:linear-gradient(180deg,#8a6cff 0%,var(--key-accent) 100%);color:#fff;font-weight:600;
  border-color:var(--key-accent-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 var(--key-accent2),0 3px 6px rgba(93,63,224,.3);
}
/* v1.2：状态回退用虚线框，跟「往前推」的实心 chip 一眼能分开 */
.chip.back{
  background:linear-gradient(180deg,#ffffff 0%,#f6f7fb 100%);color:var(--sub);
  border:1px dashed var(--key-edge);
  box-shadow:inset 0 1px 0 var(--key-hi),0 1px 0 rgba(138,147,174,.5);
}
/* v1.2.2 滑动槽：筛选条横向滚，不折行 —— 之前窄屏下 chip 被压成一字一行，整块 UI 看起来是乱的 */
.pill-row{display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill-row>*{flex:0 0 auto}
.pill-row .chip{white-space:nowrap}
.pill-row .f-sel{flex:0 0 auto;max-width:52vw}
.f-sel{
  padding:8px 9px;min-height:36px;color:var(--fg);
  border-radius:var(--key-radius);border:1px solid var(--key-edge);
  background:linear-gradient(180deg,#ffffff 0%,#f4f6fb 100%);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge);
}
/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  color:#fff;padding:10px 14px;font-weight:600;cursor:pointer;
  border-radius:var(--key-radius);border:1px solid var(--key-accent-edge);
  background:linear-gradient(180deg,#8a6cff 0%,var(--key-accent) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 2px 0 var(--key-accent2),0 4px 8px rgba(93,63,224,.22);
  transition:transform .06s ease,box-shadow .06s ease;
}
.btn:active{transform:translateY(2px);opacity:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 0 0 var(--key-accent2)}
.btn.sm{padding:8px 12px;font-size:13.5px;min-height:36px}
.btn.ghost{
  background:linear-gradient(180deg,#ffffff 0%,#f4f6fb 100%);color:var(--accent);
  border-color:var(--accent);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 rgba(124,92,255,.42);
}
.btn.gray{
  background:linear-gradient(180deg,var(--key-bg) 0%,var(--key-bg2) 100%);color:var(--fg);
  border-color:var(--key-edge);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge),var(--key-drop);
}
.btn.danger{
  background:linear-gradient(180deg,#fff3f5 0%,#ffe0e6 100%);color:var(--danger);
  border-color:var(--key-danger-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 0 var(--key-danger-ledge);
}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:0}
/* v1.3.2：原来是正圆，改成长方形立体键（圆角 12px，保留 52px 的拇指友好尺寸） */
.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);z-index:35;
  width:56px;height:52px;font-size:26px;line-height:1;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;border:1px solid var(--key-accent-edge);
  background:linear-gradient(180deg,#8a6cff 0%,var(--key-accent) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.42),0 3px 0 var(--key-accent2),0 8px 18px rgba(93,63,224,.34);
}
/* ============ v1.2 滑动手势 ============ */
.sw{touch-action:pan-y}
.swin{position:relative;flex:1;min-width:0;overflow:hidden}
.swrow{display:flex;align-items:center;gap:10px;width:100%;min-width:0}
/* 面板做成超宽块贴住要揭示的那一侧，未滑动的部分被 .swmain 盖住，看到的就是「露出来的一条」 */
.swpanel{position:absolute;top:0;bottom:0;width:999px;z-index:0;pointer-events:none;display:none;align-items:center}
.swpanel.right{right:0;justify-content:flex-end;padding-right:14px}
.swpanel.left{left:0;padding-left:14px}
.sw.sw-r .swpanel.right{display:flex;background:var(--ok-soft)}
.sw.sw-l .swpanel.left{display:flex;background:var(--gray-soft)}
.swpanel b{position:relative;z-index:1;font-size:12.5px;font-weight:700;white-space:nowrap}
.swpanel.left b{color:var(--sub)}
.swpanel.right b{color:var(--ok)}
.swlab{position:absolute;top:0;bottom:0;left:0;right:0;z-index:0;background:var(--accent);opacity:0}
.swmain{position:relative;z-index:2;background:var(--card)}
/* 卡片级滑动（项目列表）：内边距挪到内容层，面板才能铺满整卡高度 */
.cardsw{padding:0}
.cardsw .swmain{padding:12px}
#swTab{position:fixed;left:50%;bottom:calc(var(--nav-h) + 46px);transform:translateX(-50%);z-index:95;
  background:#20222c;color:#fff;font-size:13px;padding:8px 15px;border-radius:10px;display:none;white-space:nowrap;
  border:1px solid #0c0e15;box-shadow:0 2px 0 #05060a,0 6px 14px rgba(0,0,0,.3)}
/* 行内副文案最多两行，窄屏不至于把行撑得过高 */
.row .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 1.2.2 修复（评审 P0）：.toast 整体 pointer-events:none 会连带吞掉「撤销」的点击，只给按钮放行 */
/* v1.3.2：撤销键做成「深色条上的浅色立体键」—— 低对比度下靠描边与底座认边界 */
.toast .u{
  pointer-events:auto;padding:6px 14px;font-size:13px;font-weight:700;margin-left:10px;cursor:pointer;
  color:#20222c;border-radius:var(--key-radius);border:1px solid #0c0e15;
  background:linear-gradient(180deg,#ffffff 0%,#e8ebf4 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 0 #0c0e15;
}
/* ============ 表单 ============ */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal.mask-center{align-items:center}
.modal-mask{position:absolute;inset:0;background:rgba(20,20,35,.45)}
.modal-body{
  position:relative;background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
}
.modal.mask-center .modal-body{border-radius:18px;max-width:480px;padding-bottom:16px}
@media(min-width:641px){.modal{align-items:center}.modal-body{border-radius:18px;max-height:88vh}}
.modal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg);padding:6px 0 8px;z-index:2}
.modal-head h2{font-size:16px;margin:0;flex:1}
/* v1.3.2：圆形关闭键 → 方形立体键 */
.modal-head .x{
  width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--sub);
  border-radius:var(--key-radius);border:1px solid var(--key-edge);
  background:linear-gradient(180deg,var(--key-bg) 0%,var(--key-bg2) 100%);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge);
}
.f{margin-bottom:12px}
.f>label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.f>label .req{color:var(--danger)}
/* v1.3.2：输入框走「凹槽」而不是「凸键」—— 和按钮形成一套立体语言：
   按钮是抬起来的，输入框是陷下去的。低对比度下靠描边 + 内阴影认范围。 */
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=datetime-local],.f input[type=url],.f input[type=tel],.f select,.f textarea{
  width:100%;background:var(--card);border:1px solid var(--key-edge);border-radius:8px;padding:10px 11px;outline:none;
  box-shadow:inset 0 2px 3px rgba(30,32,60,.08);
}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
/* 窄屏（手机）下 15px 输入框会触发 iOS 自动放大整页，提到 16px 才不会一打字就跳版 */
@media(max-width:640px){
  .f input,.f select,.f textarea,#main input[type=text],#main select{font-size:16px}
  .f input[type=text],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=datetime-local],.f input[type=url],.f input[type=tel],.f select,.f textarea{padding:12px 11px}
}
.f .hint{font-size:11px;color:var(--sub);margin-top:3px}
.f.err input,.f.err select,.f.err textarea{border-color:var(--danger)}
.f-row{display:flex;gap:8px}.f-row .f{flex:1;min-width:0}
.sub-list{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.sub-item{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sub-item:last-child{border-bottom:0}
.sub-item input{flex:1;min-width:0;border:0;background:none;padding:4px 2px}
.sub-item .del{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer;padding:0 4px}
.check-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);min-height:48px}
.check-row:last-child{border-bottom:0}
.check-row input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.check-row .txt{flex:1;min-width:0}
.check-row.done .txt{color:var(--sub);text-decoration:line-through}
/* v1.2：卡片与行只允许竖向 pan，横向手势不会被浏览器抢去当页面平移 */
.card{touch-action:pan-y}
/* v1.2.2.2（P2-8）：滑动槽的 touch-action 会与祖先 .card 的 pan-y 取交集 = 空，
   导致手机上筛选条横滑不动（也不该把整块卡片连竖向一起锁死）。给含滑动槽的卡片单独放开两个方向。
   用 :has() 精准命中，不影响其它卡片的滑动手势；老浏览器不认 :has() 时退化成原样，不会更糟。 */
.card:has(.pill-row){touch-action:pan-x pan-y}
/* ============ 进度/其他 ============ */
.bar{height:6px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--danger)}
.warn-box{background:var(--warn-soft);color:#8a5406;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.danger-box{background:var(--danger-soft);color:#9c1f30;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.info-box{background:var(--info-soft);color:#1b4d8f;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.row-sec{background:var(--danger-soft)!important}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 40px);transform:translateX(-50%) translateY(20px);
  background:#20222c;color:#fff;padding:9px 14px;font-size:13px;z-index:90;
  border-radius:12px;border:1px solid #0c0e15;box-shadow:0 3px 0 #05060a,0 8px 20px rgba(0,0,0,.32);
  opacity:0;pointer-events:none;transition:all .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--sub);font-size:12px}
.tiny{font-size:11px}
.mono{font-variant-numeric:tabular-nums}
.right{text-align:right}
.nowrap{white-space:nowrap}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
/* v1.3.2：分页签也做成"凹槽 + 立体键"——未选中的是平的凹槽底，选中的浮起来 */
.tabs{
  display:flex;gap:5px;padding:4px;margin-bottom:12px;overflow-x:auto;position:sticky;top:var(--bar-h);z-index:25;touch-action:pan-x;
  border-radius:calc(var(--key-radius) + 3px);border:1px solid var(--key-edge);
  background:linear-gradient(180deg,#e6e9f3 0%,#eff1f8 100%);
  box-shadow:inset 0 2px 3px rgba(30,32,60,.13),0 1px 0 var(--key-hi);
}
.tabs button{
  flex:1;background:none;border:0;padding:10px 6px;font-size:13.5px;color:var(--sub);cursor:pointer;white-space:nowrap;
  border-radius:var(--key-radius);
}
.tabs button.on{
  color:var(--accent);font-weight:700;
  border:1px solid var(--key-edge);
  background:linear-gradient(180deg,var(--key-bg) 0%,var(--key-bg2) 100%);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge);
}
.stage-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stage-head h2{font-size:18px;margin:0;flex:1;min-width:120px}
.prog-list{display:flex;flex-direction:column;gap:8px}
details.dd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
details.dd summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:600;list-style:none}
details.dd summary::-webkit-details-marker{display:none}
details.dd[open] summary{margin-bottom:6px;color:var(--fg)}
/* ============ v1.3 滑动槽滑轨（电脑端可拖、可滚、有轨道） ============ */
@media(hover:hover) and (pointer:fine){
  .pill-row{scrollbar-width:thin;scrollbar-color:#cfd3e2 transparent;cursor:grab}
  .pill-row.dragging{cursor:grabbing}
  .pill-row::-webkit-scrollbar{display:block;height:8px}
  .pill-row::-webkit-scrollbar-thumb{background:#cfd3e2;border-radius:99px}
  .pill-row::-webkit-scrollbar-thumb:hover{background:var(--accent)}
  .pill-row::-webkit-scrollbar-track{background:transparent}
}
/* ============ v1.3 长按（删除）反馈 ============ */
[data-lp]{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[data-lp].lp-run::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:5;
  background:var(--danger);transform-origin:left;animation:lpbar var(--lp-ms,1.8s) linear forwards;pointer-events:none}
@keyframes lpbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
[data-lp].lp-hot{animation:lppulse .4s ease}
@keyframes lppulse{0%{background:var(--danger-soft)}100%{background:transparent}}
.lp-count{display:inline-block;min-width:22px;text-align:center;font-weight:800}
/* ============ v1.3 详情页双击快改 ============ */
.qe{cursor:pointer}
.kv.qe{border-radius:8px;padding:5px 6px;margin:0 -6px;position:relative}
.qe:active{background:var(--accent-soft)}
.kv.qe .pen,.stage-head .pen{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--sub);opacity:.55}
.stage-head h2{position:relative;padding-right:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.qe-tip{font-size:11.5px;color:var(--sub);margin:2px 0 8px}
/* ============ v1.3 出装日（现场模式：车上、单手、10 秒、不怕点错） ============ */
.os-hero{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 12px;margin-bottom:12px}
.os-hero .who{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.3px}
.os-hero .when{font-size:15px;margin-top:4px;color:var(--fg)}
.os-hero .where{font-size:13px;color:var(--sub);margin-top:3px}
.os-btns{display:flex;gap:8px;margin-top:12px}
.os-btns .btn{flex:1;min-width:0;min-height:52px;font-size:15px;border-radius:10px;padding:8px 6px;line-height:1.25}
.os-prog{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.os-prog .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.os-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.os-row:last-child{border-bottom:0}
.os-box{
  width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:transparent;
  border-radius:var(--key-radius);border:2px solid var(--key-edge);
  background:linear-gradient(180deg,#ffffff 0%,#f1f3f9 100%);
  box-shadow:inset 0 2px 2px rgba(30,32,60,.10),0 1px 0 var(--key-hi);
}
.os-row.done .os-box{
  background:linear-gradient(180deg,#2fb37e 0%,#1fa971 100%);
  border-color:#0d7350;color:#fff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 #0a5c40;
}
.os-row .nm{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.3}
.os-row.done .nm{color:var(--sub);text-decoration:line-through;font-weight:500}
.os-row .loc{font-size:12.5px;color:var(--sub);margin-top:2px;font-weight:400}
.os-ppl{display:flex;align-items:center;gap:10px;min-height:60px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.os-ppl:last-child{border-bottom:0}
.os-ppl .r{margin-left:auto;font-size:12.5px;color:var(--sub);text-align:right;white-space:nowrap}
.os-ppl .n{font-size:17px;font-weight:700}
.os-ppl .s{font-size:12.5px;color:var(--sub);margin-top:2px}
.os-pick{display:flex;align-items:center;gap:10px;min-height:66px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.os-pick:last-child{border-bottom:0}
.os-pick .t{font-size:18px;font-weight:700}
.os-pick .d{font-size:13px;color:var(--sub);margin-top:2px}
.os-top{position:fixed;right:12px;top:9px;z-index:31}
/* ============ v1.3.4 ①：出装日 = 独立全屏现场模式（藏掉底栏与常规顶栏） ============ */
body.onsite-mode{--nav-h:0px;--bar-h:60px}
body.onsite-mode .topbar,body.onsite-mode #tabbar{display:none!important}
body.onsite-mode #app{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
body.onsite-mode #main{padding:0 14px calc(26px + env(safe-area-inset-bottom))}
.os-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 10px;margin:0 -14px 12px;
  background:rgba(244,245,250,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line)}
.os-bar h1{font-size:16px;margin:0;flex:1;min-width:0;font-weight:700;letter-spacing:-.2px}
.os-bar .sub{display:block;font-size:11.5px;color:var(--sub);font-weight:400;margin-top:2px}
.os-bar .btn{min-height:40px;flex:none}
/* ============ v1.3.4 ②：撤销改成顶部通知（下滑弹出 · 上滑划走） ============ */
.toast{
  top:calc(env(safe-area-inset-top) + var(--bar-h) + 6px);bottom:auto;left:50%;width:max-content;
  transform:translateX(-50%) translateY(-190%);
  display:flex;align-items:center;gap:8px;text-align:left;
  max-width:calc(100vw - 18px);padding:10px 12px 10px 14px;
  transition:transform .26s cubic-bezier(.2,.85,.3,1),opacity .2s;
}
.toast.on{transform:translateX(-50%) translateY(0)}
/* 只有带「撤销」的那条可交互（能上滑划走）；普通提示仍然 pointer-events:none，不挡任何点击 */
.toast.act{pointer-events:auto;touch-action:none}   /* 1.3.4.1：不写 touch-action，浏览器把纵向拖动判成滚页并掐出 pointercancel → 真机上滑划不走 */
.toast .msg{flex:1;min-width:0;line-height:1.4}
.toast .u{min-height:34px;padding:8px 14px;flex:none}
.toast .x{pointer-events:auto;flex:none;width:34px;height:34px;cursor:pointer;
  border-radius:var(--key-radius);border:1px solid #0c0e15;
  background:linear-gradient(180deg,#ffffff 0%,#e8ebf4 100%);color:#20222c;
  font-size:15px;line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 0 #0c0e15}
/* 复制降级框：整段一次长按就能复制走 */
.mcopy{user-select:all;-webkit-user-select:all;border:1px solid var(--key-edge);border-radius:8px;
  padding:11px;background:var(--card);font-size:14px;line-height:1.5;word-break:break-all;
  box-shadow:inset 0 2px 3px rgba(30,32,60,.08);max-height:34vh;overflow:auto}
/* ============ v1.4 ①：装备对比表 ============ */
.cmp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;margin:0 -12px -12px;padding:0 12px 12px}
.card:has(.cmp-wrap){touch-action:pan-x pan-y}   /* 与 1.2.2.2 滑动槽同一坑：.card 的 pan-y 会掐死横向滚动 */
.cmp{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.cmp th:last-child,.cmp td:last-child{border-right:0}
.cmp thead th{position:sticky;top:0;background:var(--card);z-index:2;min-width:118px;max-width:180px}
.cmp td.k,.cmp thead th.k{position:sticky;left:0;background:var(--card);z-index:1;width:80px;min-width:80px;color:var(--sub);font-weight:600}
.cmp thead th.k{z-index:3}
.cmp tr.diff td.k{color:var(--accent)}
.cmp .tiny.muted{font-weight:400}
/* ============ v1.4 ②：上身反馈 / 我的尺寸档案 ============ */
.fitv{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin:0 4px 2px 0;white-space:nowrap}
.fitv.big{background:var(--warn-soft);color:var(--warn)}
.fitv.small{background:var(--info-soft);color:var(--info)}
.fitv.ok{background:var(--ok-soft);color:var(--ok)}
/* ============ v1.3.4 ③：轻量过渡（120~220ms，只在换屏/开弹窗时动一次） ============ */
@keyframes cpnViewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cpnSheet{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes cpnPop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
/* 1.3.4.1：动画挂在子层而不是 #main —— transform 会把 #main 变成 fixed 后代的包含块，
   挂在 #main 上时右下角「＋」会在动画那 ~170ms 里掉到视口外 */
#main.view-in>*{animation:cpnViewIn .17s ease-out}
.modal:not(.hidden) .modal-body{animation:cpnSheet .2s cubic-bezier(.2,.85,.3,1)}
.modal.mask-center:not(.hidden) .modal-body{animation:cpnPop .17s ease-out}
.os-box{transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,color .15s ease}
.os-row .nm{transition:color .15s ease}
@media(prefers-reduced-motion:reduce){
  #main.view-in,.modal:not(.hidden) .modal-body{animation:none!important}
  .toast{transition:opacity .12s linear}
}
</style>

/* ---------------- 工具函数 ---------------- */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(p){ return (p||'x')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }            // 防 Infinity/NaN
function numOrNull(v){ if(v===''||v===null||v===undefined) return null; var n=parseFloat(v); return isFinite(n)?n:null; }
function money(n){ n=num(n); return (Math.round(n*100)/100).toString(); }
function todayISO(){ var d=new Date(); return isoOf(d); }
function isoOf(d){
  var m=('0'+(d.getMonth()+1)).slice(-2), dd=('0'+d.getDate()).slice(-2);
  return d.getFullYear()+'-'+m+'-'+dd;
}
function nowStamp(){ var d=new Date(); return isoOf(d)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function dayDiff(iso){                       // iso 距今天数：过去为负
  if(!iso) return null;
  var a=new Date(String(iso).slice(0,10)+'T00:00:00'), b=new Date(todayISO()+'T00:00:00');
  if(isNaN(a.getTime())) return null;
  return Math.round((a-b)/86400000);
}
function dueText(iso){
  var d=dayDiff(iso); if(d===null||d===undefined) return '';
  if(d<0) return '逾期'+(-d)+'天';
  if(d===0) return '今天';
  if(d===1) return '明天';
  if(d<=30) return d+'天后';
  return iso;
}
function isPast(iso){ var d=dayDiff(iso); return d!==null && d<0; }
function arr(v){ return Array.isArray(v)?v:[]; }
function byId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function sortDesc(list,key){ return list.slice().sort(function(a,b){ return String(b[key]||'').localeCompare(String(a[key]||'')); }); }
function sortAsc(list,key){ return list.slice().sort(function(a,b){ return String(a[key]||'~').localeCompare(String(b[key]||'~')); }); }
function sum(list,key){ var t=0; for(var i=0;i<list.length;i++) t+=num(list[i][key]); return t; }
function uniq(list){ var s={},o=[]; for(var i=0;i<list.length;i++){ if(!s[list[i]]){s[list[i]]=1;o.push(list[i]);} } return o; }

  '愿望单':'愿望单/购物车', '计划中':'愿望单/购物车',

function migrate(raw){
  /* 读档缺字段一律补默认值（历史 Bug #10 教训） */
  var d = emptyData();
  if(!raw || typeof raw !== 'object') return d;
  for(var k in d){
    if(k==='meta'||k==='v') continue;
    if(Array.isArray(raw[k])) d[k]=raw[k];
  }
  d.meta = (raw.meta&&typeof raw.meta==='object')?raw.meta:d.meta;
  d.v = APP.schema;
  /* 1.0 → 1.1 口径迁移：服装→C服、道友→亲友 */
  if(Array.isArray(raw.items)) raw.items.forEach(function(x){ if(x&&x.kind==='服装') x.kind='C服'; });
  if(Array.isArray(raw.expenses)) raw.expenses.forEach(function(x){ if(x&&x.category==='服装') x.category='C服'; });
  if(Array.isArray(raw.contacts)) raw.contacts.forEach(function(x){ if(x&&Array.isArray(x.roles)) x.roles=x.roles.map(function(t){return t==='道友'?'亲友':t;}); });
  /* 1.2 → 1.2.2 装备状态口径迁移：14 个状态并成 9 个，处置三态合并成「报废/已售」+ dispKind 子选项 */
  if(Array.isArray(raw.items)) raw.items.forEach(function(x){
    if(!x||typeof x!=='object') return;
    var old=x.status;
    if(ITEM_STATUS_MIG[old]) x.status=ITEM_STATUS_MIG[old];
    else if(ITEM_STATUS.indexOf(old)<0) x.status='愿望单/购物车';
    if(!x.dispKind) x.dispKind = DISP_KIND_MIG[old] || (DISP_KINDS.indexOf(x.dispType)>=0?x.dispType:'');
    if(x.status==='报废/已售'&&!x.dispKind) x.dispKind='报废';
    if(x.status==='报废/已售') x.dispType=x.dispKind;
    /* v1.2.2.2（P2-1）：外借中 也是 isDisposalStatus，但它不该带着"卖了/售价"——
       否则详情页会显示「回血 150 元」而首页 soldBack 又不算，两处口径打架。 */
    if(x.status==='外借中'){ x.dispType='外借'; x.dispKind=''; x.dispPrice=null; x.dispReason=''; }
    else if(TERMINAL_STATUS.indexOf(x.status)<0){ x.dispType=''; x.dispKind=''; }
  });
  /* 逐条补默认，防止旧备份缺字段（只补会用到的，不造无意义字段） */
  var need = {
    works:{name:'',type:'',note:''},
    characters:{workId:'',name:'',note:''},
    projects:{name:'',characterId:'',skin:'',stage:'计划中',occasion:'',deadline:'',restore:'',budget:null,archived_at:'',refLinks:[],note:''},
    items:{name:'',kind:'C服',category:'',status:'愿望单/购物车',source:'购买',characterId:'',projectIds:[],shop:'',link:'',price:null,
      size:'',orderDate:'',arrivedDate:'',storage:'',makeStage:'',makeProgress:null,fragile:'',qty:null,lowQty:null,
      wigColor:'',wigLen:'',wigStyle:'',wigBy:'',clBrand:'',clDia:'',powerL:'',powerR:'',throwType:'',openedAt:'',expiresAt:'',
      dispType:'',dispKind:'',dispDate:'',dispPrice:null,dispTo:'',dispReason:'',fittings:[],fits:[],imgs:[],refLinks:[],note:'',autoFrom:''},
    contacts:{cn:'',roles:[],platforms:[],phone:'',portfolio:'',priceNote:'',rating:'',warning:false,warnReason:'',note:''},
    locations:{name:'',type:'',address:'',gather:'',fee:null,traffic:'',facilities:'',bestHours:'',risk:'',refLinks:[],note:''},
    sessions:{projectId:'',date:'',time:'',method:'',contactId:'',photographerText:'',locationId:'',locationText:'',
      fee:null,deposit:null,status:'计划中',changeReason:'',timeline:'',backup:'',checklist:[],kitOff:[],note:''},
    appointments:{projectId:'',type:'',contactId:'',contactText:'',datetime:'',place:'',fee:null,deposit:null,
      status:'待确认',paidNote:'',requirement:'',refLinks:[],note:''},
    deliverables:{sessionId:'',type:'原片',agreedCount:null,actualCount:null,agreedDate:'',deliveredDate:'',link:'',retouch:'',status:'未交付',note:''},
    publications:{projectId:'',deliverableId:'',platform:'',url:'',date:'',caption:'',tags:'',stats:'',note:''},
    expenses:{projectId:'',date:'',category:'其他',amount:0,refType:'',refId:'',note:'',source:'手动',paidBy:''},
    todos:{projectId:'',refType:'',refId:'',title:'',due:'',done:false,note:''}
  };
  for(var coll in need){
    d[coll] = arr(d[coll]).map(function(it){
      if(!it||typeof it!=='object') return null;
      var spec=need[coll];
      for(var f in spec) if(it[f]===undefined) it[f]=spec[f];
      if(!it.id) it.id = uid(coll.slice(0,3));
      return it;
    }).filter(Boolean);
  }
  /* 1.1.2：装备台账按 updated_at 倒序，老备份缺这个字段会永远沉底 */
  d.items.forEach(function(it){ if(!it.updated_at) it.updated_at=nowStamp(); });
  return d;
}
function load(){
  try{
    var raw = localStorage.getItem(APP.storeKey);
    DB = migrate(raw?JSON.parse(raw):null);
  }catch(e){
    DB = emptyData();
    setTimeout(function(){ toast('本地数据读取失败，已用空库启动。请检查浏览器是否禁用了存储'); },300);
  }
}
function save(){
  DB.meta = DB.meta||{}; DB.meta.updated_at = nowStamp();
  WRITE_SEQ++;
  try{
    localStorage.setItem(APP.storeKey, JSON.stringify(DB));
    return true;
  }catch(e){
    toast('保存失败：浏览器存储已满或被禁用，请立刻用「我的-导出备份」');
    return false;
  }
}
/* 所有集合统一增删改，自动落盘 */
function put(coll,obj){ var i=idxOf(DB[coll],obj.id); if(i>=0) DB[coll][i]=obj; else DB[coll].push(obj); save(); return obj; }
function idxOf(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return i; return -1; }
function del(coll,id){
  DB[coll] = DB[coll].filter(function(x){return x.id!==id;});
  save();
}
function get(coll,id){ return byId(DB[coll],id); }

/* ---------------- v1.4 图片库（IndexedDB；结构化数据仍在 localStorage） ----------------
   双击 file:// 打开也能用（Chrome/Edge 的 file 源有 IndexedDB）。
   不可用时优雅降级：入口还在，点了提示环境不支持，不影响其他功能。
   图片最长边压到 900px 的 JPEG（原图不落库），缩略 220px；localStorage 不放图片，5MB 配额不受影响。 */
var HAS_IDB=(typeof indexedDB!=='undefined');
var IMG={db:null,ready:false,mem:{}};
function imgOpen(cb){
  if(!HAS_IDB){ toast('当前浏览器环境不支持图片存储（需要 IndexedDB）'); return; }
  if(IMG.ready){ if(cb) cb(); return; }
  var req=indexedDB.open('cosplan.img.v1',1);
  req.onupgradeneeded=function(e){ e.target.result.createObjectStore('imgs',{keyPath:'id'}); };
  req.onsuccess=function(e){ IMG.db=e.target.result; IMG.ready=true; if(cb) cb(); };
  req.onerror=function(){ toast('图片库打开失败，图片功能暂不可用'); };
}
function imgPut(rec,cb){
  imgOpen(function(){
    try{
      var tx=IMG.db.transaction('imgs','readwrite');
      tx.objectStore('imgs').put(rec);
      tx.oncomplete=function(){ if(cb) cb(); };
      tx.onerror=function(){ toast('图片写入失败'); };
    }catch(e){ toast('图片写入失败'); }
  });
}
function imgGet(id,cb){
  if(!IMG.ready){ imgOpen(function(){ imgGet(id,cb); }); return; }
  try{
    var req=IMG.db.transaction('imgs').objectStore('imgs').get(id);
    req.onsuccess=function(){ cb(req.result||null); };
    req.onerror=function(){ cb(null); };
  }catch(e){ cb(null); }
}
function imgDel(id,cb){
  if(!IMG.ready) return;
  try{
    var tx=IMG.db.transaction('imgs','readwrite');
    tx.objectStore('imgs').delete(id);
    tx.oncomplete=function(){ if(cb) cb(); };
  }catch(e){}
}
function imgDelOfItem(itemId){
  if(!IMG.ready) return;
  try{
    var tx=IMG.db.transaction('imgs','readwrite'), st=tx.objectStore('imgs');
    var req=st.openCursor();
    req.onsuccess=function(e){
      var c=e.target.result;
      if(c){ if(c.value&&c.value.itemId===itemId){ delete IMG.mem[c.value.id]; c.delete(); } c.continue(); }
    };
  }catch(e){}
}
/* 压缩：src 可以是 dataURL；cap=最长边，quality=JPEG 质量 */
function compressToDataURL(src,cap,quality,cb){
  var im=new Image();
  im.onload=function(){
    try{
      var r=Math.min(1,cap/Math.max(im.width,im.height));
      var w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',quality),w,h);
    }catch(e){ cb('',0,0); }
  };
  im.onerror=function(){ cb('',0,0); };
  im.src=src;
}
var IMG_TARGET=null;   /* pickImgs 的落点：当前要传图给哪件装备 */
function pickImgs(itemId){
  IMG_TARGET={itemId:itemId};
  var inp=document.getElementById('imgFile');
  if(!inp||!inp.click){ toast('图片入口初始化失败'); return; }
  inp.value=''; inp.click();
}
function readImgs(inp){
  var files=inp.files&&inp.files.length?Array.prototype.slice.call(inp.files):[];
  inp.value='';
  if(!files.length||!IMG_TARGET){ IMG_TARGET=null; return; }
  var itemId=IMG_TARGET.itemId; IMG_TARGET=null;
  var it=get('items',itemId); if(!it){ toast('装备不存在'); return; }
  it.imgs=arr(it.imgs);
  var pend=files.length, added=0, failed=0;
  files.forEach(function(f){
    if(!/^image\//.test(f.type)){ pend--; failed++; if(pend<=0) finish(); return; }
    var r=new FileReader();
    r.onload=function(){
      compressToDataURL(String(r.result),900,0.72,function(dataUrl,w,h){
        if(dataUrl){
          var rec={id:uid('img'),itemId:itemId,name:f.name||'',mime:'image/jpeg',w:w,h:h,created_at:nowStamp(),data:dataUrl,thumb:''};
          imgPut(rec,function(){
            compressToDataURL(dataUrl,220,0.72,function(thumb){
              rec.thumb=thumb||dataUrl;
              imgPut(rec,function(){
                IMG.mem[rec.id]=rec;
                it.imgs.push(rec.id); added++;
                if(--pend<=0) finish();
              });
            });
          });
        }else{ failed++; if(--pend<=0) finish(); }
      });
    };
    r.onerror=function(){ failed++; if(--pend<=0) finish(); };
    r.readAsDataURL(f);
  });
  function finish(){
    put('items',it); render();
    toast(added?('已添加 '+added+' 张图片'+(failed?('，'+failed+' 张失败'):'')):'没有添加任何图片');
  }
}
function delImg(itemId,imgId){
  var it=get('items',itemId); if(!it) return;
  it.imgs=arr(it.imgs).filter(function(x){return x!==imgId;});
  put('items',it); imgDel(imgId); render(); toast('已删除图片');
}
/** 渲染后的异步水合：把 img[data-imgid] 占位符填上缩略图（IndexedDB 是异步的，只能这样） */
function hydrateImgs(scope){
  if(!HAS_IDB) return;
  var list=(scope&&scope.querySelectorAll)?scope.querySelectorAll('img[data-imgid]'):[];
  Array.prototype.forEach.call(list,function(el){
    var id=el.getAttribute('data-imgid');
    if(!id||el.getAttribute('src')) return;
    if(IMG.mem[id]){ el.src=IMG.mem[id].thumb||IMG.mem[id].data; return; }
    if(el._busy) return; el._busy='1';
    imgGet(id,function(rec){
      if(rec){ IMG.mem[id]=rec; el.src=rec.thumb||rec.data; }
      else el.alt='图片已丢失';
    });
  });
}
function zoomImg(id){
  var rec=IMG.mem[id];
  if(!rec){ imgGet(id,function(r){ if(r){ IMG.mem[id]=r; zoomImg(id); } }); return; }
  openModal({center:true,title:rec.name||'装备图片',
    body:'<img src="'+rec.data+'" alt="装备图片" style="width:100%;border-radius:10px;display:block">'+
         '<div class="tiny muted" style="margin-top:6px">'+esc(rec.w||'')+(rec.w?'×'+esc(rec.h||''):'')+' · 已压缩存本机图片库</div>'});
}
function imgCell(it,canEdit){
  var ids=arr(it.imgs);
  var h='<div style="display:flex;flex-wrap:wrap">'+ids.map(function(id){
    return '<div style="position:relative;display:inline-block;margin:0 6px 6px 0">'+
      '<img data-imgid="'+esc(id)+'" alt="装备图片" style="width:92px;height:92px;object-fit:cover;border-radius:9px;background:var(--gray-soft);display:block;cursor:zoom-in">'+
      (canEdit?'<span class="badge" style="position:absolute;top:2px;right:2px;cursor:pointer;background:var(--card)" onclick="event.stopPropagation();delImg(\''+it.id+'\',\''+id+'\')">✕</span>':'')+
      '</div>';
  }).join('')+'</div>';
  if(!ids.length) h+='<div class="tiny muted">还没有图片。点下面按钮从相册/文件选，压缩后只存本机图片库。</div>';
  return h;
}

var S = {
  view:'home', tab:'home', projectId:null, itemId:null, contactId:null, locationId:null,
  assetTab:'全部', assetQ:'', assetStatus:'', assetRole:'', assetAvailable:false,
  projectStage:'', projectQ:'', contactRole:'', contactQ:'', teamTab:'contacts', locationQ:'',
  projTab:'base', sessionTab:{},

  onsiteChar:'', onsitePid:''   /* v1.3 出装日：当前选中的角色 / 1.3.3 当前选中的那一套出装 */
};
function go(view,patch){
  var prevPid=S.projectId;
  S.view=view; if(patch) for(var k in patch) S[k]=patch[k];
  /* 1.1.2 修复：换项目时重置分页（否则看 A 的「费用」页后进 B 会直接落在「费用」页）；
     但同一项目内跳转（如从拍摄单返回）保留当前分页，不打断操作。 */
  if(view==='project'){
    if(S.projectId!==prevPid) S.projTab=(patch&&patch.projTab)||'base';
    else if(patch&&patch.projTab) S.projTab=patch.projTab;
  }
  window.scrollTo(0,0); render();
  navRecord();   /* v1.3：这一屏进返回栈 */
}
function back(){
  if(S.view==='project') go('assets',{tab:'projects'});
  else if(['asset','contact','location','session','appt'].indexOf(S.view)>=0) go('project',{projectId:S.projectId,tab:'projects'});
  else go('home',{tab:'home'});
}

   手机上按返回 = 关掉整个页面，用户经常一按就"丢了"应用。
   做法：boot 时垫一个 history 条目当"守门员"，每屏再各推一个；
   popstate 命中守门员说明已经到最上层了 —— 补回守门员并弹确认框，不让它直接退。 */
var NAV_STACK=[], NAV_FWD=[], NAV_CUR=0, navSeq=0, navHooked=false, navCanPush=true, navAllowExit=false;
var MODAL_OPEN=false;   /* v1.3.1：有弹窗时返回键先关弹窗，不动页面栈 */
function sSnapshot(){ var o={}; for(var k in S) o[k]=S[k]; return o; }
function sRestore(o){ for(var k in S){ if(o&&Object.prototype.hasOwnProperty.call(o,k)) S[k]=o[k]; } }
function navGuard(){
  if(!navCanPush) return;
  navSeq++;
  NAV_FWD.length=0;   /* 1.3.4.1（P3-5）：pushState 语义上就作废前向历史，别留着骗自己 */
  try{ history.pushState({cp:navSeq},''); NAV_CUR=navSeq; }catch(e){ navCanPush=false; }   /* 个别内核 file:// 下不让 push → 自动降级 */
}
function navRecord(){
  if(!navHooked) return;
  var s=sSnapshot();
  if(NAV_STACK.length && JSON.stringify(NAV_STACK[NAV_STACK.length-1])===JSON.stringify(s)) return;  /* 原地刷新不入栈 */
  NAV_STACK.push(s);
  NAV_FWD.length=0;          /* v1.3.1：有新动作就把"前进"那条路作废 */
  navGuard();
}
function initNav(){
  if(navHooked) return;
  navHooked=true; NAV_STACK=[sSnapshot()]; NAV_FWD=[]; NAV_CUR=0; navSeq=0;
  navGuard();
  window.addEventListener('popstate',function(e){
    e = e || {};   /* 防御：某些环境/测试桩调用时可能不带事件对象 */
    if(navAllowExit){ navAllowExit=false; setTimeout(function(){ history.back(); },80); return; }
    /* v1.3.1（P2-1）：按 e.state 的序号判方向。以前不看方向，按「前进键」也会出栈，
       结果"前进"变成又退一层、栈与历史错位。 */
    var st=(e.state&&typeof e.state.cp==='number')?e.state.cp:null;
    var goBack = (st===null) ? true : (st < NAV_CUR);
    if(st!==null) NAV_CUR=st;
    /* v1.3.1（P1-1）：弹窗优先。以前返回键会把底层页面退掉、弹窗却还浮着。 */
    if(MODAL_OPEN){ MODAL_OPEN=false; closeModal(); navGuard(); render(); return; }   /* 1.3.4.1：关完弹窗要重绘，否则页面停在「弹窗盖住前的旧卡片」上（半态） */   /* 1.3.3：这一按只关弹窗，但浏览器已经消费掉一条历史 —— 不补回守门员，走到首页再按返回就会直接退出、不再问一句 */
    if(goBack){
      if(NAV_STACK.length>1){ NAV_FWD.push(NAV_STACK.pop()); sRestore(NAV_STACK[NAV_STACK.length-1]); render(); return; }
    }else{
      /* 1.3.4.1（P3-3）：前进但没有可前进的一屏 → 只是补回守门员，不该问「要退出吗」 */
      if(NAV_FWD.length){ var s=NAV_FWD.pop(); NAV_STACK.push(s); sRestore(s); render(); return; }
      navGuard(); return;
    }
    navGuard(); confirmExit();
  });
}
/** 应用内返回：与手机返回键同一套行为（同一份栈），避免两个入口走两条路 */
function appBack(){
  if(MODAL_OPEN){ closeModal(); return; }   /* v1.3.1（P1-1）：与手机返回键同一口径，先关弹窗 */
  if(NAV_STACK.length>1){
    if(navCanPush){ history.back(); return; }        /* 出栈交给 popstate 做，保证两边同步 */
    NAV_STACK.pop(); sRestore(NAV_STACK[NAV_STACK.length-1]); render(); return;
  }
  navBack();
}
function confirmExit(){
  openModal({ center:true, title:'要退出 CosPlan 吗？',
    body:'<div style="font-size:14px;margin:2px 0 14px">已经存的内容不会丢，数据都在这个浏览器里。<br>只是清缓存、换浏览器会让它消失 —— 隔几天到「我的 → 导出 JSON 备份」存一份最稳。</div>'+
      '<div class="btn-row"><button class="btn" id="exStay">继续编辑</button><button class="btn gray" id="exQuit">退出</button></div>',
    onMount:function(root){
      root.querySelector('#exStay').onclick=closeModal;
      root.querySelector('#exQuit').onclick=function(){ closeModal(); navAllowExit=true; history.back(); };
    }});
}

/* ---------------- 提示与确认 ---------------- */
var toastTimer=null, undoFn=null, undoSeq=-1, toastAct=false;
function showToast(html,ms,act){
  var el=document.getElementById('toast');
  el.style.transform='';
  el.innerHTML='<span class="msg">'+html+'</span>'+
    (act?'<button class="u" onclick="runUndo()">撤销</button><button class="x" onclick="dismissToast()">✕</button>':'');
  toastAct=!!act;
  if(act) el.classList.add('act'); else el.classList.remove('act');
  el.classList.add('on');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('on','act'); toastAct=false; undoFn=null; },ms||2200);
}
/** 顶部通知的"划走"：撤销窗口还没过时，上滑或点 ✕ 就立刻收起来，别挡着看 */
function dismissToast(){
  var el=document.getElementById('toast');
  if(toastTimer){ clearTimeout(toastTimer); toastTimer=null; }
  el.style.transform=''; el.classList.remove('on','act'); toastAct=false; undoFn=null;
}
function toast(msg){
  undoFn=null; showToast(esc(msg));
}
/** 带「撤销」的提示：撤销只在期间没有任何新写入时才生效，避免把后来的改动一起回滚 */
function toastUndo(msg,fn,seq){
  undoFn=fn; undoSeq=seq;
  showToast(esc(msg),4600,true);
}
function runUndo(){
  if(!undoFn){ return; }
  if(WRITE_SEQ!==undoSeq){ undoFn=null; toast('撤销已失效：这之后又有新的改动'); return; }
  var f=undoFn; undoFn=null; dismissToast(); f();
}
/** 撤销通知：从顶上滑下来，跟手上滑超过 24px 就划走 */
function initToast134(){
  var el=document.getElementById('toast'); if(!el||el._t134) return; el._t134=true;
  var down=null;
  el.addEventListener('pointerdown',function(e){
    if(!toastAct) return;
    down={y:e.clientY,id:e.pointerId};
  });
  el.addEventListener('pointermove',function(e){
    if(!down||e.pointerId!==down.id) return;
    var dy=e.clientY-down.y;
    if(dy<-24){ down=null; dismissToast(); return; }
    if(dy<-4) el.style.transform='translateX(-50%) translateY('+dy+'px)';
  });
  var up=function(){ if(!down) return; down=null; el.style.transform=''; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
}

function settings(){
  if(!DB.meta) DB.meta={};

  if(typeof s.hint!=='boolean') s.hint=true;

}

/* =========================================================
   弹窗 + 通用表单引擎（所有实体录入复用）
   ========================================================= */
function openModal(o){
  var m=document.getElementById('modal');
  m.className='modal'+(o.center?' mask-center':'');
  m.innerHTML=`<div class="modal-mask" id="mMask"></div><div class="modal-body">
    <div class="modal-head"><h2>${esc(o.title)}</h2>${o.headRight||''}<button class="x" id="mX">✕</button></div>
    <div id="mContent">${o.body||''}</div></div>`;
  MODAL_OPEN=true;   /* v1.3.1（P1-1）：让返回键知道"现在有弹窗"，先关弹窗而不是退页面。1.3.4.1（P3-7）：必须在 onMount 之前置位，否则 onMount 里就地关掉的弹窗会被重新标成"有弹窗"，白吃一条历史 */
  m.querySelector('#mX').onclick=closeModal;
  m.querySelector('#mMask').onclick=closeModal;
  if(o.onMount) o.onMount(m);
}
function closeModal(){ var m=document.getElementById('modal'); m.className='modal hidden'; m.innerHTML=''; MODAL_OPEN=false; }

function optsOf(o){
  var list = (typeof o==='function')?o():o;
  return (list||[]).map(function(x){ return (x&&typeof x==='object')?x:{v:x,l:x}; });
}
function fieldInput(f,V){
  var v = V[f.k];
  var reqMark = f.req?'<span class="req"> *</span>':'';
  var lab = `<label>${esc(f.l)}${reqMark}</label>`;
  var hint = f.hint?`<div class="hint">${esc(f.hint)}</div>`:'';
  var id='fld_'+f.k;
  switch(f.t){
    case 'area':
      return `<div class="f" data-fw="${f.k}">${lab}<textarea id="${id}" placeholder="${esc(f.ph||'')}" rows="${f.rows||3}">${esc(v==null?'':v)}</textarea>${hint}</div>`;
    case 'select': {
      var os=optsOf(typeof f.opts==='function'?f.opts(V):f.opts);
      if(!f.req && os.length && os[0].v!=='') os=[{v:'',l:f.ph||'未选择'}].concat(os);
      var hasGroup=os.some(function(o){return o.g;});
      var html='';
      if(hasGroup){
        var groups=[];
        os.forEach(function(o){
          var gname=o.g||'';
          var g=groups.filter(function(x){return x.name===gname;})[0];
          if(!g){ g={name:gname,items:[]}; groups.push(g); }
          g.items.push(o);
        });
        html=groups.map(function(g){
          var inner=g.items.map(function(o){
            return `<option value="${esc(o.v)}" ${String(v==null?'':v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`;}).join('');
          return g.name?`<optgroup label="${esc(g.name)}">${inner}</optgroup>`:inner;
        }).join('');
      }else{
        html=os.map(function(o){
          return `<option value="${esc(o.v)}" ${String(v==null?'':v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`;}).join('');
      }
      return `<div class="f" data-fw="${f.k}">${lab}<select id="${id}">${html}</select>${hint}</div>`;
    }
    case 'chips': {
      var sel=arr(v); var av=optsOf(typeof f.opts==='function'?f.opts(V):f.opts);
      return `<div class="f" data-fw="${f.k}">${lab}<div class="chips" id="${id}">${av.map(function(o){
        return `<button type="button" class="chip ${sel.indexOf(o.v)>=0?'on':''}" data-val="${esc(o.v)}">${esc(o.l)}</button>`;}).join('')}</div>${hint}</div>`;
    }
    case 'check':
      return `<div class="f" data-fw="${f.k}" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="${id}" ${v?'checked':''} style="width:20px;height:20px;accent-color:var(--accent)">
        <label for="${id}" style="margin:0;font-size:14px;color:var(--fg)">${esc(f.l)}</label>${f.hint?`<span class="hint" style="margin:0">${esc(f.hint)}</span>`:''}</div>`;
    case 'links': /* [{label,url,note}] */
      return subList(f,V,'links');
    case 'pairs': /* [{a,b}] */
      return subList(f,V,'pairs');
    case 'list': /* ['文本'] */
      return subList(f,V,'list');
    case 'row':
      return `<div class="f-row">${f.cols.map(function(c){ return fieldInput(c,V); }).join('')}</div>`;
    default: {
      var type = f.t==='money'?'number':(f.t||'text');
      var extra = '';
      if(f.t==='number'||f.t==='money') extra=' inputmode="decimal" step="any" min="0"';
      if(f.t==='money'){
        return `<div class="f" data-fw="${f.k}" style="position:relative">${lab}
          <input id="${id}" type="number" inputmode="decimal" step="any" min="0" value="${esc(v==null?'':v)}" placeholder="${esc(f.ph||'0')}">
          <span class="muted" style="position:absolute;right:11px;top:26px">元</span>${hint}</div>`;
      }
      return `<div class="f" data-fw="${f.k}">${lab}<input id="${id}" type="${type}"${extra} value="${esc(v==null?'':v)}" placeholder="${esc(f.ph||'')}">${hint}</div>`;
    }
  }
}
function subList(f,V,kind){
  var rows=arr(V[f.k]);
  var lab=`<label>${esc(f.l)}${f.req?'<span class="req"> *</span>':''}</label>`;
  var inner='';
  if(kind==='list'){
    inner=rows.map(function(r,i){
      return `<div class="sub-item"><input data-sub="${f.k}:${i}" value="${esc(r)}" placeholder="${esc(f.ph||'')}"><button type="button" class="del" data-subdel="${f.k}:${i}">×</button></div>`;
    }).join('');
  }else{
    var c1=f.c1||'名称', c2=f.c2||'链接';
    inner=rows.map(function(r,i){
      if(kind==='links'){
        return `<div class="sub-item"><input data-sub="${f.k}:${i}:a" value="${esc(r.label||r.a||'')}" placeholder="${esc(c1)}">
          <input data-sub="${f.k}:${i}:b" value="${esc(r.url||r.b||'')}" placeholder="${esc(c2)}">
          <input data-sub="${f.k}:${i}:c" value="${esc(r.note||'')}" placeholder="备注">
          <button type="button" class="del" data-subdel="${f.k}:${i}">×</button></div>`;
      }
      if(kind==='fits'){
        return `<div class="sub-item"><input data-sub="${f.k}:${i}:a" value="${esc(r.part||r.a||'')}" placeholder="${esc(c1||'部位，如 胸围 / 衣长')}">
          <input data-sub="${f.k}:${i}:b" value="${esc(r.verdict||r.b||'')}" placeholder="${esc(c2||'偏大 / 合身 / 偏小')}">
          <input data-sub="${f.k}:${i}:c" value="${esc(r.note||'')}" placeholder="${esc(c3||'备注，如 扣子紧')}">
          <button type="button" class="del" data-subdel="${f.k}:${i}">×</button></div>`;
      }
      return `<div class="sub-item"><input data-sub="${f.k}:${i}:a" value="${esc(r.a||r.label||'')}" placeholder="${esc(c1)}">
        <input data-sub="${f.k}:${i}:b" value="${esc(r.b||r.url||'')}" placeholder="${esc(c2)}">
        <button type="button" class="del" data-subdel="${f.k}:${i}">×</button></div>`;
    }).join('');
  }
  return `<div class="f" data-fw="${f.k}">${lab}<div class="sub-list">${inner||'<div class="tiny muted" style="padding:4px">暂无</div>'}
    <button type="button" class="btn sm gray" data-subadd="${f.k}" style="margin:6px 0 2px">＋ 添加</button></div>
    ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}
/**
 * openForm({ title, fields, values, onSave })
 * fields: [{k,l,t,req,opts,ph,hint,show,t:'row',cols:[...] }]
 */
function openForm(cfg){
  var V={};
  (cfg.fields||[]).forEach(function(f){ collectDefaults(f); });
  function collectDefaults(f){
    if(f.t==='row'||f.t==='group'){ (f.cols||[]).forEach(collectDefaults); return; }
    var base = cfg.values?cfg.values[f.k]:undefined;
    if(f.t==='chips') V[f.k]=arr(base).slice();
    /* 1.1.2 修复：t:'list' 的元素是字符串（如试装记录 fittings），
       原先一起走 Object.assign({},x) 会把字符串拆成 {0:'a',1:'b'...}，渲染成 [object Object] 且不可逆 */
    else if(f.t==='list') V[f.k]=arr(base).map(function(x){ return (x&&typeof x==='object')?Object.assign({},x):x; });
    else if(f.t==='links'||f.t==='pairs'||f.t==='fits') V[f.k]=arr(base).map(function(x){ return Object.assign({},x); });
    else if(f.t==='check') V[f.k]=!!base;
    else V[f.k]= (base===undefined||base===null)?(f.def!==undefined?f.def:''):base;
  }
  /* v1.3.1（P1-4）：只读可见性上下文。有些卡片的字段 show() 依赖的键不在本卡片的字段集里
     （「处置」卡的字段靠 status 判断显隐，而 status 不是处置字段），只从字段初始化 V 会让 show() 全判假，
     于是开出一张空卡。这份上下文只喂给 show()，不进 V、不参与落库。 */
  function visOf(){ return cfg.visCtx ? Object.assign({}, cfg.visCtx, V) : V; }
  function visible(f){ return f.show? !!f.show(visOf()) : true; }
  /* 1.3.4.1（P2-5）：行/组「自己该不该出现」以前有三份手写副本，其中 applyDerives 那份传的是裸 V ——
     快改卡的处置行靠 visCtx 才有 status，于是渲染/校验判可见、derive 判不可见（显示 ≠ 落库的配方） */
  function rowShown(f){ return !(f.show && !f.show(visOf())); }
  var openGroups={};                       /* 折叠分组展开状态，重渲染时保留 */
  function rememberGroups(){
    var mm=document.getElementById('modal'); if(!mm) return;
    mm.querySelectorAll('details[data-group]').forEach(function(d){ openGroups[d.getAttribute('data-group')]=d.open; });
  }
  function syncSelectDefaults(){
    /* 必填 select 不渲染空选项：DOM 显示第一项而模型为空会卡死保存，渲染前先对齐 */
    /* v1.2.2.2（P2-4）：进 row/group 先看它自己的 show —— 收起的行/组里的字段渲染时不出现，
       就不该被"兜底"写值（与 walk() 的过滤口径对齐） */
    var walk=function(f){
      if(f.t==='row'||f.t==='group'){
        if(!rowShown(f)) return;
        (f.cols||[]).forEach(walk); return;
      }
      if(f.t!=='select') return;
      if(!visible(f)) return;
      var os=optsOf(typeof f.opts==='function'?f.opts(V):f.opts);
      if(!os.length) return;
      var cur=V[f.k];
      if(cur===''||cur===null||cur===undefined){ if(f.req) V[f.k]=os[0].v; return; }   /* 原逻辑：只对必填兜底 */
      /* 1.1.2 新增：当前值已不在选项里（源实体被删 / 类别切换）时，浏览器会显示第一项但模型还是旧值，
         造成"看到的 ≠ 保存的"。有空选项就置空，否则落到第一项。 */
      var hit=false,hasEmpty=false;
      for(var i=0;i<os.length;i++){ if(String(os[i].v)===String(cur)) hit=true; if(os[i].v==='') hasEmpty=true; }
      if(!hit) V[f.k]=hasEmpty?'':os[0].v;
    };
    (cfg.fields||[]).forEach(walk);
  }
  function renderCols(cols){
    return cols.map(function(f){
      if(f.t==='row'){
        if(!visible(f)) return '';
        var rc=(f.cols||[]).filter(visible);
        if(!rc.length) return '';
        return `<div class="f-row">${rc.map(function(c){return fieldInput(c,V);}).join('')}</div>`;
      }
      if(f.t==='group'){
        if(!visible(f)) return '';
        var gc=(f.cols||[]).filter(visible);
        if(!gc.length) return '';
        return `<details class="dd" data-group="${esc(f.k)}" ${openGroups[f.k]||f.open?'open':''}>
          <summary>${esc(f.l)}<span class="muted tiny">　${gc.length} 项，可跳过</span></summary>
          ${gc.map(function(c){ return c.t==='row'? renderCols([c]) : fieldInput(c,V); }).join('')}</details>`;
      }
      return fieldInput(f,V);
    }).join('');
  }
  function applyDerives(){
    /* v1.2.2：字段可以声明 derive(V) 在每次渲染前自动补另一格（只在联动源变化后跑，不覆盖用户已填的值）
       v1.2.2.2（P2-4）：整行/整组被 show 收起时，里面的 derive 一律不跑 ——
       否则「约人」表单里藏起来的 V.date 会被约定时间偷偷写上日期，跟 walk() 的口径也对不上 */
    var walk=function(f){
      if(f.t==='row'||f.t==='group'){
        if(!rowShown(f)) return;
        (f.cols||[]).forEach(walk); return;
      }
      if(f.derive && visible(f)) f.derive(V);
    };
    (cfg.fields||[]).forEach(walk);
  }
  function body(){
    applyDerives();
    syncSelectDefaults();
    return renderCols((cfg.fields||[]).filter(function(f){
      return (f.t==='row'||f.t==='group') ? visible(f) && (f.cols||[]).some(visible) : visible(f);
    }))
      + `<div class="btn-row" style="margin-top:16px">
          <button class="btn gray" id="fCancel">取消</button>
          <button class="btn" id="fSave">${esc(cfg.saveLabel||'保存')}</button></div>
          ${cfg.foot||''}`;
  }
  function bind(m){
    m.querySelector('#fCancel').onclick=function(){ closeModal(); };
    m.querySelectorAll('[id^=fld_]').forEach(function(el){
      var k=el.id.slice(4), f=findField(k);
      if(!f) return;
      /* v1.2.2.2（P1 追加）：字段可声明 onTouch(V)，在用户**手动编辑**该字段时回调
         （程序化写值 / derive 写入都不会触发）。用来区分"用户真改过"和"值和默认恰好一样"，
         避免用数值相等去推断意图。 */
      var touch=function(){ if(f.onTouch) f.onTouch(V); };
      if(f.t==='chips'){
        el.querySelectorAll('.chip').forEach(function(b){
          b.onclick=function(){
            var val=b.getAttribute('data-val'), sel=arr(V[k]);
            var i=sel.indexOf(val); if(i>=0) sel.splice(i,1); else sel.push(val);
            V[k]=sel; b.classList.toggle('on'); touch();
          };
        });
      }else if(f.t==='check'){
        el.onchange=function(){ V[k]=el.checked; touch(); if(f.live) rerender(); };
      }else{
        el.onchange=function(){ V[k]=el.value; touch(); if(f.live) rerender(); };
        el.oninput=function(){ V[k]=el.value; touch(); };
      }
    });
    m.querySelectorAll('[data-subadd]').forEach(function(b){
      b.onclick=function(){
        var k=b.getAttribute('data-subadd'), f=findField(k);
        var list=arr(V[k]).slice();
        list.push(f.t==='list'?'':{label:'',url:'',note:''});
        if(f.t==='pairs') list[list.length-1]={a:'',b:''};
        if(f.t==='fits') list[list.length-1]={part:'',verdict:'',note:''};
        V[k]=list; rerender();
      };
    });
    m.querySelectorAll('[data-sub]').forEach(function(inp){
      /* 1.1.2 修复：子项原来只绑 onchange，打字后直接点「＋ 添加」会 rerender 重建 DOM，
         onchange 尚未触发导致刚输入的内容丢失 —— 同时绑 oninput */
      function onSub(){
        var p=inp.getAttribute('data-sub').split(':');
        if(p.length===2){ V[p[0]][p[1]]=inp.value; return; }
        var f=findField(p[0]), o=V[p[0]][p[1]], part=p[2];
        if(!o) return;
        if(f&&f.t==='pairs'){ if(part==='a') o.a=inp.value; else if(part==='b') o.b=inp.value; }
        else if(f&&f.t==='fits'){ if(part==='a') o.part=inp.value; else if(part==='b') o.verdict=inp.value; else o.note=inp.value; }
        else { if(part==='a') o.label=inp.value; else if(part==='b') o.url=inp.value; else o.note=inp.value; }
      }
      inp.onchange=onSub; inp.oninput=onSub;
    });
    m.querySelectorAll('[data-subdel]').forEach(function(b){
      b.onclick=function(){ var p=b.getAttribute('data-subdel').split(':'); V[p[0]].splice(num(p[1]),1); rerender(); };
    });
    var sv=m.querySelector('#fSave');
    if(sv) sv.onclick=function(){
      var missing=null;
      m.querySelectorAll('[data-fw]').forEach(function(d){ d.classList.remove('err'); });
      function checkReq(f){
        var reqd = (typeof f.req==='function')? !!f.req(V) : !!f.req;
        if(!reqd || !visible(f)) return false;
        var v=V[f.k];
        if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length)){
          var node=m.querySelector('[data-fw="'+f.k+'"]');
          if(node){
            var grp=node.closest('details[data-group]');      /* 折叠区里的必填项要自己弹出来 */
            if(grp) grp.open=true;
            node.classList.add('err'); node.scrollIntoView({block:'center'});
          }
          toast('请填写：'+f.l); missing=f.k; return true;
        }
        return false;
      }
      function walk(f){
        /* 1.2.2：整行/整组被 show 掉时，里面的必填不再拦保存（渲染时本来也不出现，之前会卡死保存） */
        if(f.t==='row'||f.t==='group'){
          if(!rowShown(f)) return false;
          for(var j=0;j<(f.cols||[]).length;j++) if(walk(f.cols[j])) return true;
          return false;
        }
        return checkReq(f);
      }
      for(var i=0;i<cfg.fields.length;i++){ if(walk(cfg.fields[i])) return; }
      if(missing) return;
      /* 布局合成字段（row/group）不属于数据，统一剔除 */
      (function strip(list){ (list||[]).forEach(function(f){ if(f.t==='row'||f.t==='group'){ delete V[f.k]; strip(f.cols); } }); })(cfg.fields);
      closeModal();
      cfg.onSave(V);
    };
  }
  function rerender(){
    rememberGroups();
    var m=document.getElementById('modal');
    m.querySelector('#mContent').innerHTML=body();
    bind(m);
  }
  function findField(k){
    for(var i=0;i<cfg.fields.length;i++){
      var f=cfg.fields[i]; if(f.k===k) return f;
      if(f.t==='row'||f.t==='group'){ for(var j=0;j<f.cols.length;j++){ var c=findIn(f.cols[j]); if(c) return c; } }
    }
    function findIn(x){
      if(x.k===k) return x;
      if(x.t==='row'||x.t==='group'){ for(var q=0;q<(x.cols||[]).length;q++){ var r=findIn(x.cols[q]); if(r) return r; } }
      return null;
    }
    return null;
  }
  openModal({ title:cfg.title, body:body(), onMount:function(m){ bind(m); if(cfg.onMount) cfg.onMount(m); }, center:cfg.center });
}

/* =========================================================
   领域层：查询助手 / 自动费用 / 级联删除
   ========================================================= */
/* =========================================================
   口径区（1.3.4.2 落地）：同一件事全站只许有一种算法。
   下面这组函数是「挂价归属 / 在手件数 / 下一场拍摄 / 低库存 / 角色显示」的唯一来源，
   视图层只许调用、不许再手写第二份过滤或统计表达式；
   qa/z1342_audit.js 有源码扫描守卫，谁把口径拆成两处，测试直接红。
   ========================================================= */
/** 角色还活着吗（悬空 id = 作品被删时连带删了角色，装备的 characterId 成了孤儿） */
function charAlive(id){ return !!get('characters',id); }
/** 角色显示的唯一口径：空 = 通用；悬空 = （角色已删）—— 让"归属丢了"看得见，而不是伪装成通用件 */
function charLabel(id){
  if(!id) return '通用';
  var c=get('characters',id); if(!c) return '（角色已删）';
  var w=get('works',c.workId);
  return (w?w.name+' · ':'')+c.name;
}
/** 装备页角色筛选的唯一算法：''=全部，'__none'=通用（真·不挂角色），'__gone'=归属已丢，其余=按角色 id */
function matchAssetRole(i,role){
  if(role==='__none') return !i.characterId;
  if(role==='__gone') return !!i.characterId && !charAlive(i.characterId);
  if(role) return i.characterId===role;
  return true;
}
/** 台账里"归属已丢"的件数（决定角色筛选下拉里要不要给「（角色已删）」选项） */
function orphanRoleCount(){ return DB.items.filter(function(i){ return i.characterId && !charAlive(i.characterId); }).length; }
/** 低库存的唯一口径：数量与阈值都记了、且真的还剩（qty>0）——"没记数量"不等于"只剩 0" */
function lowStockOf(i){ return i.kind==='消耗品' && num(i.qty)>0 && num(i.lowQty)>0 && num(i.qty)<=num(i.lowQty); }
/** 「下一场拍摄」的唯一口径：排除已取消与已完成（拍完的不算"下一场"），按日期升序取最近 */
function nextSessionOf(pid){
  var today=todayISO();
  return sessionsOf(pid).filter(function(s){ return s.status!=='已取消'&&s.status!=='已完成'&&s.date&&s.date>=today; })
    .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); })[0]||null;
}
function projLabel(id){ var p=get('projects',id); return p?p.name:'未关联项目'; }
function contactLabel(id){ var c=get('contacts',id); return c?(c.cn||'未命名'):''; }
function locationLabel(id){ var l=get('locations',id); return l?l.name:''; }
function sessionLabel(id){ var s=get('sessions',id); if(!s) return ''; return (s.date||'未定')+' '+(s.method||''); }
function itemsOfProject(pid){ return DB.items.filter(function(i){ return arr(i.projectIds).indexOf(pid)>=0; }); }
function projectsOfChar(cid){ return DB.projects.filter(function(p){ return p.characterId===cid; }); }
function charName(cid){ var c=get('characters',cid); return c?(c.name||''):(cid?'':''); }
function liveItems(){ return DB.items.filter(isLiveItem); }
/* 1.3.4.2（复核 P3-2）：第 4 套口径 usableItems()（试穿通过/已到货/外借中）删除 ——
   它把借出去的算成"在手"、把修改中的漏掉，与装备页「只看在手」的 live 口径打架。
   首页统计现在直接用 liveItems()，与装备页同一个来源。 */
function isReadyItem(i){ return i.status==='试穿通过'; }
/** 出物回血：合并态「报废/已售」只有子选项是"卖了"才算回血 */
function soldBack(i){ return (i.status==='报废/已售'&&i.dispKind==='卖了')?num(i.dispPrice):0; }
function sessionsOf(pid){ return sortDesc(DB.sessions.filter(function(s){return s.projectId===pid;}),'date'); }
function apptsOf(pid){ return sortDesc(DB.appointments.filter(function(a){return a.projectId===pid;}),'datetime'); }
function expsOf(pid){ return sortDesc(DB.expenses.filter(function(e){return e.projectId===pid;}),'date'); }
function todosOf(pid){ return DB.todos.filter(function(t){return !pid||t.projectId===pid;}); }
function delivsOf(sid){ return DB.deliverables.filter(function(d){return d.sessionId===sid;}); }
function pubsOf(pid){ return sortDesc(DB.publications.filter(function(p){return p.projectId===pid;}),'date'); }
function overdueDelivs(){
  return DB.deliverables.filter(function(d){
    var ses=get('sessions',d.sessionId);
    if(ses && ses.status==='已取消') return false;   /* 拍摄已取消，不该再催片 */
    return d.agreedDate && isPast(d.agreedDate) && d.status!=='已返图';
  });
}
/** 1.3.4.1（P2-4）：「这笔钱算不算已记账」的唯一判据。
    以前 syncItemExpense 里写一遍、itemCostInProject 完全不判 → 同一页两个数差一只愿望单。 */
function isCharged(i){ return num(i.price)>0 && i.status!=='愿望单/购物车'; }
/** 一件装备自动生成的那条买入流水（refType==='item' 只会是自动买入行；手动流水不带 refType） */
function itemBuyExpense(iid){ return DB.expenses.filter(function(e){ return e.refType==='item'&&e.refId===iid; })[0]||null; }
/** 1.3.4.2（复核 P2-1）：「装备的钱算在哪个项目头上」唯一来源 = 流水。
    挂在项目上（projectIds）≠ 记在项目头上（1.3.1 起非空即锁定，两者允许不一致）——
    所以这里只数「记在本项目头上」的已记账装备流水，与「已记账支出」真正同源；
    挂在本项目但记在别处的，由 itemCostElsewhereInProject 单独一行交代，差值自己解释自己。 */
function itemCostInProject(pid){ return DB.expenses.filter(function(e){ return e.projectId===pid&&e.refType==='item'; }).reduce(function(t,e){ return t+num(e.amount); },0); }
/** 口径区（同上）：挂在本项目、但这笔钱记在别的项目头上的装备挂价合计 */
function itemCostElsewhereInProject(pid){
  return itemsOfProject(pid).filter(isCharged).filter(function(i){
    var e=itemBuyExpense(i.id); return e && e.projectId && e.projectId!==pid;
  }).reduce(function(t,i){ return t+num(i.price); },0);
}
/** 还没下单（愿望单/购物车）与零价的挂价，单列一行，让差值自己解释自己 */
function itemWishCostInProject(pid){ return itemsOfProject(pid).filter(function(i){ return !isCharged(i); }).reduce(function(t,i){ return t+num(i.price); },0); }
/** 1.3.4.1（P2-6）：一个项目的"有几件装备"只有一份口径。
    all=台账挂着的全部；live=在手（排除留作纪念/报废已售）；ready=其中试穿通过的。
    进度类显示一律用 live 当分母 —— 已处置的件永远不可能变「试穿通过」，用 all 会把进度条判死刑。 */
function isLiveItem(i){ return TERMINAL_STATUS.indexOf(i.status)<0; }
function projItemCounts(pid){
  var all=itemsOfProject(pid), live=all.filter(isLiveItem);
  return {all:all.length, live:live.length, ready:live.filter(isReadyItem).length, gone:all.length-live.length};
}
/** 1.3.4.1（顺带 7）：逾期交付的判断只有 overdueDelivs() 一份，项目页要数个数就从它身上筛 */
function overdueDelivsIn(sessionIds){
  return overdueDelivs().filter(function(d){ return sessionIds.indexOf(d.sessionId)>=0; });
}
function refLinks(list){ /* 渲染参考链接（本期不传图，只存链接） */
  var a=arr(list).filter(function(x){ return x && (x.url||x.label); });
  if(!a.length) return '<div class="muted tiny">未记录（本期不上传图片，可粘贴网盘/图床/微博链接）</div>';
  return a.map(function(x){
    return `<div class="kv"><div class="k">${esc(x.label||'链接')}</div><div class="v">${
      x.url?(/^https?:\/\//i.test(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a>`:esc(x.url)):'—'
    }${x.note?`<div class="tiny muted">${esc(x.note)}</div>`:''}</div></div>`;
  }).join('');
}

/* ---- 自动费用：以 autoKey 幂等，改一处不重复记账 ---- */
function aKey(t,id,slot){ return t+':'+id+':'+slot; }
function upsertAuto(key,data){
  var idx=-1;
  for(var j=0;j<DB.expenses.length;j++) if(DB.expenses[j].autoKey===key){ idx=j; break; }
  if(!data || num(data.amount)<=0){ if(idx>=0) DB.expenses.splice(idx,1); return; }
  if(idx>=0){
    var old=DB.expenses[idx];
    DB.expenses[idx]=Object.assign(old,data,{autoKey:key,source:'自动'});
  }else{
    DB.expenses.push(Object.assign({id:uid('e'),autoKey:key,source:'自动'},data));
  }
}
function dropAutoPrefix(prefix){
  DB.expenses = DB.expenses.filter(function(e){ return String(e.autoKey||'').indexOf(prefix)!==0; });
}
function expCatOfItem(it){
  var k=it.kind||'C服';
  return EXPENSE_CATS.indexOf(k)>=0?k:'其他';
}
function syncItemExpense(it){
  var key=aKey('item',it.id,'buy');
  var charged = isCharged(it);
  if(!charged){ upsertAuto(key,null); return; }
  /* v1.3.1（P1-2）非空即锁定：流水一旦记在某个项目头上就不再改写，只有 null 才补一次。
     以前裸取 projectIds[0]，改一下「用在哪个出装」就会把历史流水静默搬到另一个项目。
     语义是"非空即锁定"而不是"第一次就锁死" —— 录入时还没关联项目的钱，后来挂上去要能进项目。 */
  var locked = (_autoKeep && _autoKeep[key]) || null;
  if(!locked){
    for(var j=0;j<DB.expenses.length;j++){
      if(DB.expenses[j].autoKey===key && DB.expenses[j].projectId){ locked=DB.expenses[j].projectId; break; }
    }
  }
  upsertAuto(key,{
    projectId: locked || arr(it.projectIds)[0] || null,
    date: it.orderDate||it.arrivedDate||todayISO(),
    category: expCatOfItem(it), amount: num(it.price),
    note:'装备·'+(it.name||''), refType:'item', refId:it.id
  });
}
/** v1.3.1：重建自动流水期间，用它把"已锁定的归属"原样带过去（否则重建会把锁定冲掉） */
var _autoKeep=null;
function syncApptExpense(a){
  var paid = APPT_PAID_STATUS.indexOf(a.status)>=0;
  var done = ['已完成','已结清'].indexOf(a.status)>=0;
  var APPT_CAT={ '妆娘':'妆造','毛娘':'妆造','修图师':'后期修图','场地预定':'场地','摄影师':'摄影' };
  var cat=APPT_CAT[a.type]||'其他';
  var pid=a.projectId||null, base={projectId:pid, category:cat, refType:'appointment', refId:a.id};
  var dep=num(a.deposit), fee=num(a.fee), bal=fee-dep;
  if(a.status==='已结清'){
    /* 结清：定金按已付入账，尾款补差，总额=fee */
    upsertAuto(aKey('appt',a.id,'deposit'), Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金·'+cnOf(a)}));
    upsertAuto(aKey('appt',a.id,'balance'), bal>0?Object.assign({},base,{amount:bal,date:todayISO(),note:'尾款·'+cnOf(a)}):null);
  }else if(a.status==='已完成'){
    upsertAuto(aKey('appt',a.id,'deposit'), Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金·'+cnOf(a)}));
    upsertAuto(aKey('appt',a.id,'balance'), null);   /* 尾款未结，不计 */
  }else if(paid){
    upsertAuto(aKey('appt',a.id,'deposit'), Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金·'+cnOf(a)}));
    upsertAuto(aKey('appt',a.id,'balance'), null);
  }else if(['已取消','爽约'].indexOf(a.status)>=0){
    /* 1.1.2 修复：原先这里会走到下面的 else 把定金流水删掉，与注释矛盾、且定金已付出通常不退 → 少算钱。
       现在改为保留定金入账（备注标明未退，用户可手动删除），尾款不记。 */
    upsertAuto(aKey('appt',a.id,'deposit'),
      dep>0?Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金(未退)·'+cnOf(a)}):null);
    upsertAuto(aKey('appt',a.id,'balance'), null);
  }else{
    upsertAuto(aKey('appt',a.id,'deposit'), null);
    upsertAuto(aKey('appt',a.id,'balance'), null);
  }
}
function cnOf(a){ var c=contactLabel(a.contactId); return (a.type||'')+(c?('·'+c):''); }
/* 联系人身份 → 预约单类型（一定落在 APPT_TYPES 内，避免被下拉兜底成"妆娘"） */
var ROLE_TO_APPT={ '妆娘':'妆娘','毛娘':'毛娘','摄影师':'摄影师','修图师':'修图师','场地主':'场地预定' };
function apptTypeOf(contact){
  var rs=arr(contact&&contact.roles);
  for(var i=0;i<rs.length;i++) if(ROLE_TO_APPT[rs[i]]) return ROLE_TO_APPT[rs[i]];
  return '其他';
}
function newApptFor(cid){
  var c=get('contacts',cid);
  formAppt(null,{contactId:cid, type:c?apptTypeOf(c):'妆娘'});
}
function syncSessionExpense(s){
  var base={projectId:s.projectId||null, category:'摄影', refType:'session', refId:s.id};
  var dep=num(s.deposit), fee=num(s.fee), bal=fee-dep;
  var d=(s.date||'')||todayISO();
  /* 「已付定金」填了即代表钱已出去，不等状态推进。
     1.3.4.2（复核 P3-7）：已取消/已改期的拍摄单与预约单同一口径，备注标明「定金(未退)」。 */
  if(dep>0){
    var depNote=['已取消','已改期'].indexOf(s.status)>=0?'摄影定金(未退)':'摄影定金';
    upsertAuto(aKey('sess',s.id,'deposit'), Object.assign({},base,{amount:dep,date:d,note:depNote}));
  }else upsertAuto(aKey('sess',s.id,'deposit'), null);
  if(s.status==='已完成'){
    upsertAuto(aKey('sess',s.id,'fee'), bal>0?Object.assign({},base,{amount:bal,date:d,note:'摄影尾款'}):null);
  }else upsertAuto(aKey('sess',s.id,'fee'), null);
}
function syncAllAutoExpenses(){
  DB.items.forEach(syncItemExpense);
  DB.appointments.forEach(syncApptExpense);
  DB.sessions.forEach(syncSessionExpense);
  save();
}

/* ---- 级联删除 ---- */
function deleteProject(p){
  var pids=sessionsOf(p.id).map(function(s){return s.id;});
  DB.deliverables=DB.deliverables.filter(function(d){ return pids.indexOf(d.sessionId)<0; });
  DB.sessions=DB.sessions.filter(function(s){ return s.projectId!==p.id; });
  DB.appointments=DB.appointments.filter(function(a){ return a.projectId!==p.id; });
  DB.publications=DB.publications.filter(function(x){ return x.projectId!==p.id; });
  DB.todos=DB.todos.filter(function(t){ return t.projectId!==p.id; });
  DB.expenses=DB.expenses.filter(function(e){ return e.projectId!==p.id; });
  DB.items.forEach(function(i){ i.projectIds=arr(i.projectIds).filter(function(x){return x!==p.id;}); });
  del('projects',p.id);
  /* 装备仍在，重新生成其自动流水，避免流水凭空消失 */
  DB.items.forEach(syncItemExpense);

  ];
}
function itemDisposalRules(V){
  /* v1.2.2.2（P2-1）：外借中 也是 isDisposalStatus，但它不该留着「卖了/售价」——
     否则详情页会显示「回血 150 元」而首页 soldBack 又不算，两处口径打架 */
  if(V.status==='外借中'){ V.dispKind=''; V.dispPrice=null; V.dispReason=''; }
  else if(!isDisposalStatus(V.status)){ V.dispTo=''; V.dispDate=''; V.dispPrice=null; V.dispReason=''; V.dispKind=''; }
  else if(V.dispKind!=='卖了') V.dispPrice=null;
  return V;
}

    v1.2.2.2（P2-6）：重名时自动加序号，否则同角色两件同类装备在列表/清单里长得一模一样、分不清 */

  var who=charName(cid)||'通用';
  var what=V.category||V.kind||'装备';
  var base=who+'·'+what, name=base, n=1;
  while(DB.items.some(function(i){ return i && i.id!==selfId && i.name===name; })){ n++; name=base+' '+n; }
  return name;
}

/* ---------- 妆造/毛娘/修图 预约单 ---------- */
/* ---------- 约人（v1.2.2 统一入口）：预约单 = 一张表单，类型选「摄影师」直接落成拍摄单 ---------- */
/* v1.2.2.2（P0）：预约单状态 → 拍摄单状态。映射方向要让"钱的口径"也对得上，
   所以「已完成」落在 `已确认`（服务做完了、但钱还没结清，不补尾款），
   「已结清」才落到 `已完成`（尾款也记）。详见 APPT_PAID_BEFORE 的注释。 */
var APPT_TO_SESSION={
  '待确认':'计划中','已定档':'已确认','已付定金':'已确认',
  '已完成':'已确认','已结清':'已完成','已取消':'已取消','爽约':'已取消','已改期':'已改期'
};
/* 反向映射：摄影师分支切回妆娘/毛娘时，把拍摄单状态折回预约单状态 */
var SESSION_TO_APPT={ '计划中':'待确认','已确认':'已定档','已完成':'已完成','已改期':'已取消','已取消':'已取消' };
/* 哪些预约单状态代表「定金这笔钱已经出去了」（syncApptExpense 的 paid 口径）：
   待确认/已定档 钱还没动 → 转换时定金一并清掉，否则会凭空多记一笔支出 */
var APPT_PAID_BEFORE=['已付定金','已完成','已结清','已取消','爽约'];
/* 1.3.4.1（顺带 8）：syncApptExpense 的「钱已经出去了」口径单独起名，别和上面那个转换用的集合混用（那个含已取消/爽约） */
var APPT_PAID_STATUS=['已付定金','已完成','已结清'];
/** 这个值是不是"预约单独有的状态"（不是拍摄单的状态名） */
function isApptStatus(st){ return APPT_STATUS.indexOf(st)>=0; }
/** v1.2.2.2（P1 追加）：转换时"状态与定金到底落什么"的唯一判定，表单/确认框/落库共用同一份口径，
    保证"表单显示的 == 最终落库的"。
    状态：以**表单值**为准 —— 表单已经用 APPT_TO_SESSION 把预约单口径显式搬成拍摄单口径（derive），
      所以 o.status 是可信的；只有当它不是合法拍摄单状态时才退回按旧状态映射。
    定金：预约单的「定金」≠拍摄单的「已付定金」（前者可能只是约定、后者 >0 立刻入账）。规则：
      · 旧单已付款（APPT_PAID_BEFORE）→ 定金照记；
      · 用户**手动改过**定金（depTouched）→ 以用户为准（哪怕改成的数刚好等于原约定额）；
      · 其余（未付款、也没碰过）→ 不入账，并把被挡金额记进 gated，用于确认框提示与备注，避免信息无声消失。
    注意：判定"改没改过"用的是显式的 touched 标记，**不是**"值和原值是否相等" —— 用户照约定金额重填同一个数，
    也必须被当成"用户填了"。 */
function convertVerdict(o,cur,depTouched){
  var isConvert=!!(cur&&cur.id);
  var fromStatus=(isConvert&&isApptStatus(cur.status))?cur.status:'';
  var sStatus=(SESSION_STATUS.indexOf(o.status)>=0)?o.status
              :(fromStatus?(APPT_TO_SESSION[fromStatus]||'计划中'):'计划中');
  var paidBefore=!isConvert||APPT_PAID_BEFORE.indexOf(cur.status)>=0;
  var origDep=numOrNull(cur.deposit), depRaw=numOrNull(o.deposit);
  var sDeposit=(paidBefore||depTouched)?depRaw:null;
  var gated=(!paidBefore&&origDep>0&&sDeposit===null)?origDep:0;
  return { sStatus:sStatus, sDeposit:sDeposit, paidBefore:paidBefore, gated:gated, isConvert:isConvert };
}
function isShootAppt(V){ return !!V && V.type==='摄影师'; }
function formAppt(id,preset){
  var cur=id?Object.assign({},get('appointments',id)):Object.assign({status:'待确认',type:'妆娘'},preset||{});
