  var notShoot=function(V){ return !isShootAppt(V); };
  /* v1.2.2.2（P0）：记住"上一次渲染时这一格是预约单口径还是拍摄单口径"。
     之所以要记，是因为「已完成」「已取消」两个词在 APPT_STATUS 和 SESSION_STATUS 里**都存在**，
     光看 V.status 的值分不出该不该搬，只能靠"这次跨了分支"来判断。 */
  var wasShoot=shoot(cur);
  /* v1.2.2.2（P1 追加 · 定金口径）：预约单的「定金」只是"约定金额"，只有状态代表已付款时才真出过钱；
     而拍摄单的「已付定金」>0 会被 syncSessionExpense **立刻**记成一笔支出。所以把"未付款的预约单"转成
     拍摄单时，不能把约定定金当成已付带过去，否则凭空多记一笔。做法：**切入拍摄分支时只清一次**定金输入框
     （表单=真相），切回预约分支再还回去；用户之后填的任何金额都以用户为准（哪怕恰好等于原约定额）。
     depTouched 由字段的 onTouch 在用户手动编辑时置位，用来区分"用户真填了"和"还是默认值"。 */
  var paidBeforeCur=!(cur&&cur.id)||APPT_PAID_BEFORE.indexOf(cur.status)>=0;
  var origDep=numOrNull(cur.deposit);
  var depClearedByUs=false;
  var depTouched=false;
  openForm({
    title: shoot(cur) ? (id?'改成拍摄单（摄影师）':'约摄影师 · 拍摄单') : (id?'编辑预约单':'新建预约单'),
    values:cur,
    fields:[
      {k:'rowA',t:'row',cols:[
        {k:'type',l:'约谁做什么',t:'select',opts:APPT_TYPES,req:1,live:1,hint:'选「摄影师」= 直接开一张拍摄单'},
        /* v1.2.2.2（P0）：两个分支的状态选项集不同，切类型时必须"显式搬"状态，
           不能再让 syncSelectDefaults 把对不上的旧状态静默重置成第一项（那会让钱记错）。
           derive 在每次渲染前跑、早于 syncSelectDefaults，所以这里搬完后者会命中、不会再兜底。
           搬的时机 = 跨分支（wasShoot != nowShoot），否则同分支内不动用户的选择。 */
        {k:'status',l:'状态',t:'select',opts:function(V){return shoot(V)?SESSION_STATUS:APPT_STATUS;},req:1,live:1,
          derive:function(V){
            var now=shoot(V);
            if(now!==wasShoot){
              /* 刚跨过分支：按映射表把状态显式搬过去（已完成 ⇄ 已确认 这种差别的关键就在这一步） */
              V.status=now?(APPT_TO_SESSION[V.status]||'计划中'):(SESSION_TO_APPT[V.status]||'待确认');
            }else if(now){
              if(SESSION_STATUS.indexOf(V.status)<0) V.status=APPT_TO_SESSION[V.status]||'计划中';
            }else{
              if(APPT_STATUS.indexOf(V.status)<0) V.status='待确认';
            }
            wasShoot=now;
          }}
      ]},
      /* v1.2.2.2（P1-2）：没有任何项目时，这个下拉只剩一个空的「未关联」，
         如果还强制必填就会永远存不下去 → 有可选项时才要求必填 */
      {k:'projectId',l:'所属项目',t:'select',opts:function(){ var o=DB.projects.map(function(p){return {v:p.id,l:p.name};}); o.unshift({v:'',l:'未关联'}); return o; },live:1,req:function(V){return shoot(V)&&DB.projects.length>0;}},
      {k:'contactId',l:'手艺人（联系人）',t:'select',opts:function(){ var o=DB.contacts.map(function(c){return {v:c.id,l:c.cn+'（'+arr(c.roles).join('/')+'）'};}); o.unshift({v:'',l:'— 不选，手填 —'}); return o; },live:1},
      {k:'contactText',l:'手艺人（手填）',show:function(V){return !V.contactId;}},
      /* 摄影师分支：拍摄单的字段 */
      {k:'rowS',t:'row',show:shoot,cols:[
        {k:'date',l:'拍摄日期',t:'date',req:1,derive:function(V){
          /* 从预约单切过来时，约定时间里的日期与钟点直接搬到拍摄单上 */
          if(!V.date&&V.datetime){ V.date=String(V.datetime).slice(0,10); if(!V.time) V.time=String(V.datetime).slice(11,16); }
        }},
        {k:'time',l:'集合时间',t:'time'}
      ]},
      {k:'rowM',t:'row',show:shoot,cols:[
        {k:'method',l:'拍摄方式',t:'select',opts:SHOOT_METHODS,def:'约拍',req:function(V){return shoot(V);}},
        {k:'locationId',l:'场地',t:'select',opts:function(){ var o=DB.locations.map(function(l){return {v:l.id,l:l.name};}); o.unshift({v:'',l:'— 手填 —'}); return o; },live:1}
      ]},
      {k:'locationText',l:'场地（手填）',show:function(V){return shoot(V)&&!V.locationId;},
        derive:function(V){ if(shoot(V)&&!V.locationText&&V.place&&!V.locationId) V.locationText=V.place; }},
      /* v1.2.2.2（P2-2）：转换已有预约单（id 存在）时不强制填原因 —— 否则「已取消/爽约」的预约单转摄影师，

      {k:'changeReason',l:'改期/取消原因',show:function(V){return shoot(V)&&['已改期','已取消'].indexOf(V.status)>=0;},req:function(V){return !id&&shoot(V)&&['已改期','已取消'].indexOf(V.status)>=0;}},
      /* 其他分支：预约单的字段 */
      {k:'rowB',t:'row',show:notShoot,cols:[
        {k:'datetime',l:'约定时间',t:'datetime-local'},
        {k:'place',l:'地点',ph:'上门/工作室/漫展现场'}
      ]},
      {k:'rowC',t:'row',cols:[
        {k:'fee',l:'总价',t:'money'},
        {k:'deposit',l:'定金',t:'money',hint:'拍摄单里「已付定金」>0 会立刻记一笔支出；未付款的预约单转过来时不带入',
          onTouch:function(){ depTouched=true; },

                 原金额并进备注，见 saveSessionFromAppt。 */
              if(cur.id&&!paidBeforeCur&&origDep>0&&!depClearedByUs){ V.deposit=''; depClearedByUs=true; }

              V.deposit=(origDep===null?'':origDep); depClearedByUs=false;
            }

      ]},
      {k:'g_detail',t:'group',l:'要求与参考（可跳过）',cols:[
        {k:'paidNote',l:'付款说明',show:notShoot,ph:'如：定金微信已转，尾款现场付'},

/** v1.2.2.2（P1-1）：汇总"拍摄单装不下、要并进备注"的预约单字段，转换确认框与备注共用同一份清单 */
function apptCarriedFields(o){
  var out=[];
  if(o.place&&o.locationId) out.push('原地点：'+o.place);
  if(o.paidNote) out.push('付款：'+o.paidNote);
  var rl=arr(o.refLinks).filter(function(x){return x.url||x.label;});
  if(rl.length) out.push('参考链接：'+rl.map(function(x){return (x.label?x.label+' ':'')+(x.url||'');}).join(' / '));
  return out;
}
/** v1.2.2.2（P0-4 / P2-1）：开一张拍摄单本身就说明"这套已经在拍了"，项目还停在「计划中」就往前推一格。
    v1.2.2.2（P2-1）：约人转拍摄单 与 项目页「＋新建拍摄单」两个入口**共用这一套判断**，避免同一动作两入口副作用不同。
    规则：已取消 / 已改期 不推；只推「计划中→拍摄中」、不回退；没有关联项目时什么都不做。
    刻意不动 autoStage()，免得"把拍摄单滑回计划中"这类回退也误触发。 */
function nudgeStageForShoot(cur){
  if(!cur||['已取消','已改期'].indexOf(cur.status)>=0) return false;
  var p=get('projects',cur.projectId);
  if(!p||p.stage!=='计划中') return false;
  doSetStage(p,'拍摄中');
  return true;
}
/** 摄影师档期 → 拍摄单：约人只留一个入口，钱与定金走同一套自动流水。
    v1.2.2.2（P1 追加）：状态与定金都以**表单为准**（表单已用 derive 把预约单口径显式搬成拍摄单口径，
    并在"未付款"时清空了定金输入框），所以用户在转换时手改的状态/定金不会再被静默丢弃；
    打开那一刻的 cur.status 只在表单值非法时兜底。具体的判定见 convertVerdict()。 */
function saveSessionFromAppt(o,cur,depTouched){
  var dt=String(o.datetime||'');
  var v=convertVerdict(o,cur,depTouched);
  /* v1.2.2.2（P1-1）：拍摄单没有的字段一律并进备注，不许静默丢 */
  var carried=apptCarriedFields(o);
  /* 未付款预约单的"约定定金"没有入账：把原金额补进备注，别让信息无声消失 */
  if(v.gated>0) carried.push('原预约单定金 '+v.gated+'（未付款，未入账）');
  var s={
    id:uid('s'), projectId:o.projectId||'',
    date:o.date||dt.slice(0,10)||'', time:o.time||dt.slice(11,16)||'',
    method:o.method||'约拍', contactId:o.contactId||'',
    photographerText:o.contactId?'':(o.contactText||''),
    locationId:o.locationId||'', locationText:(o.locationId?'':(o.locationText||o.place||'')),
    fee:numOrNull(o.fee), deposit:v.sDeposit,
    status:v.sStatus,
    changeReason:o.changeReason||'', timeline:cur.timeline||'', backup:cur.backup||'',
    checklist:arr(cur.checklist),
    note:[o.note,carried.join('；'),o.requirement?('要求：'+o.requirement):''].filter(Boolean).join(' '),
    created_at:cur.created_at||nowStamp(), updated_at:nowStamp()
  };
  put('sessions',s); syncSessionExpense(s);
  var moved=nudgeStageForShoot(s);
  save(); render();
  toast('已存成拍摄单'+(moved?' · 项目自动转「拍摄中」':''));
  go('session',{sessionId:s.id,projectId:s.projectId,tab:'projects'});
}
/** v1.2.2.2（P2-5）：判断一件装备是不是"约毛娘时自动生成的那顶假发"。
    不能只看 kind==='假发' —— 用户把类别改成别的（或改名）就会判重失效、再建一顶。
    用持久标记 autoFrom + 生成时的备注文案做双保险（改名不影响，备注被改也没事，有标记兜底）。 */
function isAutoWig(i){
  if(!i) return false;
  if(i.autoFrom==='appt') return true;
  return /约毛娘时自动生成/.test(i.note||'');
}
/** v1.2.2 联动：约了毛娘 = 这顶假发已经在做了，台账里顺手挂一件并关联角色与出装 */
function ensureWigFromAppt(a){
  if(!a || a.type!=='毛娘') return null;
  var p=get('projects',a.projectId);
  if(!p || !p.characterId) return null;
  /* 同一角色已有那顶自动假发 → 不重复建；顺手把这次的项目也关联上（原来会漏第二个项目） */
  var exist=DB.items.filter(function(i){ return i.characterId===p.characterId&&isAutoWig(i); })[0];
  if(exist){
    if(arr(exist.projectIds).indexOf(p.id)<0){ exist.projectIds=arr(exist.projectIds).concat([p.id]); put('items',exist); }
    return null;
  }
  var it={id:uid('i'),name:charName(p.characterId)+'·假发',kind:'假发',category:'整顶假发',
    status:'已下单/制作中',source:'代工',characterId:p.characterId,projectIds:[p.id],autoFrom:'appt',
    price:null,size:'',orderDate:String(a.datetime||'').slice(0,10)||todayISO(),arrivedDate:'',storage:'',
    wigColor:'',wigLen:'',wigStyle:'未剪',wigBy:contactLabel(a.contactId)||a.contactText||'',
    dispType:'',dispKind:'',dispDate:'',dispPrice:null,dispTo:'',dispReason:'',
    fittings:[],refLinks:[],note:'约毛娘时自动生成，造型归属与毛色可以进装备里补',
    created_at:nowStamp(),updated_at:nowStamp()};
  put('items',it); syncItemExpense(it);
  return it;
}

function listRow(o){
  var inner=`<div class="main"><div class="t">${o.t}</div>${o.d?`<div class="d">${o.d}</div>`:''}</div>`
    + (o.r?`<div class="r">${o.r}</div>`:'') + (o.badge?`<div>${o.badge}</div>`:'');
  var click=o.onclick?`onclick="${o.onclick}"`:'';
  var lp=o.lp?` data-lp="${o.lp}"`:'';                 /* v1.3：长按 3 秒 = 删除入口 */
  if(!o.sw) return `<div class="row ${o.cls||''}" ${click}${lp}>${inner}</div>`;
  return `<div class="row ${o.cls||''} sw" data-sw="${o.sw}" ${click}${lp}>${swWrap(`<div class="swrow">${inner}</div>`)}</div>`;
}

function render(){
  var t=document.getElementById('topbar'), m=document.getElementById('main');
  var af=document.activeElement, aid=af&&af.id, apos=null, aval=null;
  try{ if(af&&af.setSelectionRange){ apos=af.selectionStart; aval=af.value; } }catch(e){}
  /* 1.2.2：滑动槽里的横向滚动位置在重绘后保持原样（点一个 chip 就弹回最左边很碍事） */
  var scrollKeep={};
  m.querySelectorAll('.pill-row[data-sk]').forEach(function(el){ scrollKeep[el.getAttribute('data-sk')]=el.scrollLeft; });
  var html='';
  switch(S.view){
    case 'home': html=vHome(); break;
    case 'projects': html=vProjects(); break;
    case 'project': html=vProject(); break;
    case 'assets': html=vAssets(); break;
    case 'cmp': html=vCompare(); break;
    case 'asset': html=vAsset(); break;
    case 'team': html=vTeam(); break;
    case 'contact': html=vContact(); break;
    case 'location': html=vLocation(); break;
    case 'session': html=vSession(); break;
    case 'onsite': html=vOnsite(); break;
    case 'mine': html=vMine(); break;
    default: html=vHome();
  }
  m.innerHTML=html;
  m.querySelectorAll('.pill-row[data-sk]').forEach(function(el){
    var k=el.getAttribute('data-sk');
    if(scrollKeep[k]) el.scrollLeft=scrollKeep[k];
  });
  t.innerHTML=vTopbar();
  renderTabbar();
  try{ hydrateImgs(m); }catch(e){}   /* v1.4：把 img[data-imgid] 占位符异步填上 */
  /* 1.3.4：出装日是独立全屏（藏掉底栏与常规顶栏，只留这一套的当天内容）；只有换屏才播一次进场过渡 */
  if(S.view==='onsite') document.body.classList.add('onsite-mode'); else document.body.classList.remove('onsite-mode');
  try{
    m.classList.remove('view-in');                       /* 同屏重绘不留动画类 */
    if(render._lastView!==S.view){ render._lastView=S.view; void m.offsetWidth; m.classList.add('view-in'); }
  }catch(e){}
  if(aid){
    var el=document.getElementById(aid);
    if(el){ try{ el.focus(); if(aval!=null&&el.value!==aval) el.value=aval; if(apos!=null) el.setSelectionRange(apos,apos); }catch(e){} }
  }
}

/* =========================================================
   首页：提醒 + 概览（M12 时间线聚合）
   ========================================================= */
function upcomingEvents(days){
  var out=[];
  DB.sessions.forEach(function(s){
    var d=dayDiff(s.date);
    if(d!==null && d>=0 && d<=days && s.status!=='已取消') out.push({due:s.date+(s.time?' '+s.time:''),kind:'拍摄',title:(s.method||'拍摄')+' · '+projLabel(s.projectId)+(s.locationId?' @'+locationLabel(s.locationId):(s.locationText?' @'+s.locationText:'')),to:'session',id:s.id});
  });
  DB.appointments.forEach(function(a){
    var d=dayDiff((a.datetime||'').slice(0,10));
    if(a.datetime && d!==null && d>=0 && d<=days && ['已完成','已结清','已取消','爽约'].indexOf(a.status)<0)
      out.push({due:a.datetime,kind:'妆造',title:a.type+' · '+(contactLabel(a.contactId)||a.contactText||'待定')+'（'+a.status+'）',to:'project',id:a.projectId});
  });
  DB.projects.forEach(function(p){
    if(p.stage==='已出片') return;
    var d=dayDiff(p.deadline);
    /* 1.3.4.2（复核 P3-3）：「接下来」要有下界 —— 过了期的只留给上面「需要处理」，不在这里重复出现 */
    if(d!==null && d>=0 && d<=days) out.push({due:p.deadline,kind:'deadline',title:p.name+' 计划完成日（'+p.stage+'）',to:'project',id:p.id});
  });
  DB.todos.forEach(function(t){
    if(t.done) return;
    var d=dayDiff(t.due);
    /* 1.3.4.2（复核 P3-3 + P2-3B）：同样只列还没到期的；没关联项目的待办不许借 S.projectId 冒充跳转目标 */
    if(d!==null && d>=0 && d<=days) out.push({due:t.due,kind:'待办',title:t.title+(t.projectId?' · '+projLabel(t.projectId):''),to:'project',id:t.projectId||''});
  });
  DB.items.forEach(function(i){
    if(i.kind==='美瞳'&&i.expiresAt){ var d=dayDiff(i.expiresAt); if(d!==null&&d<=days&&d>=-365) out.push({due:i.expiresAt,kind:'美瞳到期',title:i.name+' 到期（'+(i.status||'')+'）',to:'asset',id:i.id}); }
    if(lowStockOf(i)) out.push({due:'',kind:'低库存',title:i.name+' 仅剩 '+i.qty+'，低于阈值 '+i.lowQty,to:'asset',id:i.id});
  });
  return sortAsc(out.map(function(x){x._k=x.due||'9999';return x;}),'_k');
}
function gotoTarget(to,id){
  /* 1.1.2 修复：从首页点进别的项目下的拍摄单时没带 projectId，返回会跳到上一个看过的项目 */
  if(to==='session'){ var s=get('sessions',id); go('session',{sessionId:id,projectId:s?s.projectId:(S.projectId||''),tab:'projects'}); }
  else if(to==='asset') go('asset',{itemId:id,tab:'assets'});
  else if(to==='project'){
    /* 1.3.4.2（复核 P2-3B）：逾期待办/提醒可能没关联项目（或项目已删）——
       不许落到「项目不存在」死屏，回项目列表并说一声 */
    if(!id || !get('projects',id)){ go('projects',{tab:'projects'}); toast('这条记录没有关联项目（或项目已删除）'); return; }
    go('project',{projectId:id,tab:'projects'});
  }
}
function vHome(){
  var od=overdueDelivs();
  var openTodos=DB.todos.filter(function(t){return !t.done;});
  var ev=upcomingEvents(14);
  var monthKey=todayISO().slice(0,7);
  var monthCost=sum(DB.expenses.filter(function(e){return String(e.date||'').slice(0,7)===monthKey;}),'amount');
  var allCost=sum(DB.expenses,'amount');
  var back=DB.items.reduce(function(t,i){ return t+soldBack(i); },0);
  var active=DB.projects.filter(function(p){return p.stage!=='已出片';});
  var html='';

  if(!DB.projects.length && !DB.items.length && !DB.contacts.length){
    html+=`<div class="info-box">还没有数据。可以点下面的按钮载入示例项目熟悉流程（之后可在「我的」里一键清空），或直接开始新建。</div>
    <div class="btn-row" style="margin-bottom:14px">
      <button class="btn" onclick="formProject()">＋ 新建出装项目</button>
      <button class="btn gray" onclick="loadSample()">载入示例</button>
    </div>`;
  }

  /* 逾期项 */
  var danger=[];
  od.forEach(function(d){ danger.push({label:(d.type||'交付物')+'逾期',
    title:projLabel((get('sessions',d.sessionId)||{}).projectId)+' · '+d.type+'（约定 '+(d.agreedDate||'')+'，' + dueText(d.agreedDate) + '）',
    to:'session',id:d.sessionId,
    r:`<span class="badge b-accent" onclick="event.stopPropagation();todoFromDeliv('${d.id}')" style="cursor:pointer">＋转待办</span>`}); });
  DB.sessions.forEach(function(s){
    if(['计划中','已确认'].indexOf(s.status)>=0 && s.date && isPast(s.date))
      danger.push({label:'拍摄日已过',title:s.date+' '+projLabel(s.projectId)+'（'+s.status+'）',to:'session',id:s.id});
  });
  /* v1.2 联动：过了计划完成日还没出片，以前只在项目页里提示，首页看不到 */
  DB.projects.forEach(function(p){
    if(p.stage!=='已出片' && p.deadline && isPast(p.deadline))
      danger.push({label:'已过计划完成日',title:p.name+'（'+p.stage+' · '+p.deadline+'）',to:'project',id:p.id});
  });
  openTodos.forEach(function(t){ if(t.due&&isPast(t.due)) danger.push({label:'待办逾期',title:t.title,to:'project',id:t.projectId}); });
  if(danger.length){
    html+=`<div class="card"><h3>需要处理<span class="cnt">${danger.length} 项</span></h3>`+
      danger.map(function(x){
        return listRow({cls:'row-sec',t:`${badge(x.label,'b-danger')} ${esc(x.title)}`,r:x.r||'',onclick:`gotoTarget('${x.to}','${x.id||''}')`});
      }).join('')+`</div>`;
  }

  /* 时间线 */
  html+=`<div class="card"><h3>接下来 14 天<span class="cnt">${ev.length} 项</span><span class="act" onclick="go('projects',{tab:'projects'})">全部项目 ›</span></h3>`;
  html+= ev.length? ev.slice(0,12).map(function(x){
    return listRow({t:`${badge(x.kind, x.kind==='deadline'?'b-warn':(x.kind==='拍摄'?'b-accent':'b-info'))} ${esc(x.title)}`,
      d:x.due||'',onclick:`gotoTarget('${x.to}','${x.id||''}')`});
  }).join('') : '<div class="muted tiny">暂无安排。拍摄单、预约单、项目 deadline、待办都会汇总到这里。</div>';
  html+='</div>';

  /* 数字概览：只留两件最要紧的 */
  html+=`<div class="grid2" style="margin-bottom:12px">
    <div class="stat"><div class="n">${liveItems().length}</div><div class="l">在手装备 <span class="tiny">/ 台账共 ${DB.items.length} 件</span></div></div>
    <div class="stat"><div class="n">${money(allCost)}<span class="tiny muted"> 元</span></div><div class="l">花掉了 <span class="tiny">/ 本月 ${money(monthCost)}，出物回血 ${money(back)}</span></div></div>
  </div>`;

  /* 进行中项目 */
  html+=`<div class="card"><h3>进行中的出装<span class="act" onclick="go('projects',{tab:'projects'})">管理 ›</span></h3>`;
  html+= active.length? sortAsc(active,'deadline').map(function(p){
    var cnt=projItemCounts(p.id), ready=cnt.ready;   /* 1.3.4.2（复核 P3-8）：its 未使用，删除 */
    var pct=cnt.live?Math.round(ready/cnt.live*100):0;
    var spent=sum(expsOf(p.id),'amount');
    return listRow({
      t:`${esc(p.name)} ${p.deadline?badge(dueText(p.deadline), isPast(p.deadline)?'b-danger':'b-warn'):''}`,
      d:`${badge(p.stage,'b-accent')} 备装 ${ready}/${cnt.live} · 花费 ${money(spent)}${p.budget?' / 预算 '+money(p.budget):''}元${cnt.gone?' · <span class="tiny muted">另有 '+cnt.gone+' 件已处置</span>':''}`,
      r:'›',onclick:`go('project',{projectId:'${p.id}',tab:'projects'})`
    });
  }).join('') : emptyBox('还没有进行中的项目', {label:'＋ 新出一个角色',fn:'formProject()'});
  html+='</div>';

  /* 处置提醒 */
  var borrow=DB.items.filter(function(i){return i.status==='外借中';});
  if(borrow.length){
    html+=`<div class="card"><h3>借出去的<span class="cnt">${borrow.length}</span></h3>`+borrow.map(function(i){
      return listRow({t:esc(i.name),d:`借给 ${esc(i.dispTo||'未记录 CN')} ${(i.dispDate||'')?'· '+i.dispDate:''}`,r:'›',onclick:`go('asset',{itemId:'${i.id}',tab:'assets'})`,sw:'item:'+i.id,lp:'item:'+i.id});
    }).join('')+`</div>`;
  }
  html+=`<div class="btn-row" style="margin:14px 0 4px">
    <button class="btn" onclick="formItem()">＋ 加一件装备</button>
    <button class="btn ghost" onclick="formProject()">＋ 新出一个角色</button>
    <button class="btn gray" onclick="formExpense()">＋ 记一笔钱</button>
  </div>`;
  return html;
}

function projectStats(p){
  var its=itemsOfProject(p.id);
  var spent=sum(expsOf(p.id),'amount');
  var back=its.reduce(function(t,i){ return t+soldBack(i); },0);
  var cnt=projItemCounts(p.id);
  var ss=sessionsOf(p.id);
  var od=overdueDelivsIn(ss.map(function(s){ return s.id; })).length;
  /* n=台账全部（长按删除那一步要说清会删掉几件）；live/readyLive 才是进度口径（已处置的件永远不可能就绪） */
  return {its:its,spent:spent,back:back,ready:cnt.ready,n:cnt.all,live:cnt.live,readyLive:cnt.ready,gone:cnt.gone,ss:ss,od:od};
}
function vProjects(){
  var list=DB.projects.slice();
  if(S.projectStage) list=list.filter(function(p){return p.stage===S.projectStage;});
  if(S.projectQ){ var q=String(S.projectQ).toLowerCase();
    list=list.filter(function(p){ return (p.name+' '+(p.skin||'')+' '+charLabel(p.characterId)+' '+(p.occasion||'')+' '+(p.note||'')).toLowerCase().indexOf(q)>=0; }); }
  list=sortAsc(list,'deadline');
  var html=`<div class="card flat" style="padding:10px">
    <input type="text" id="qProj" placeholder="搜索项目 / 角色" value="${esc(S.projectQ)}" oninput="S.projectQ=this.value;render()" style="width:100%;border:1px solid var(--key-edge);border-radius:8px;padding:9px 11px;background:var(--card);box-shadow:inset 0 2px 3px rgba(30,32,60,.08)">
    <div class="pill-row" data-sk="pstage" style="margin-top:8px">${['全部'].concat(STAGES).map(function(s){
      var v=s==='全部'?'':s;
      return `<button class="chip ${(S.projectStage||'')===v?'on':''}" onclick="S.projectStage='${v}';render()">${s}${v?' '+DB.projects.filter(function(p){return p.stage===v;}).length:''}</button>`;
    }).join('')}</div></div>`;
  html+= list.length? list.map(function(p){
    var st=projectStats(p);
    var pct=st.live?Math.round(st.readyLive/st.live*100):0;
    return `<div class="card cardsw sw" data-sw="project:${p.id}" data-lp="project:${p.id}" onclick="go('project',{projectId:'${p.id}',tab:'projects'})" style="cursor:pointer">${swWrap(`
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="muted tiny">${esc(charLabel(p.characterId))}${p.skin?' · '+esc(p.skin):''}${p.occasion?' · '+esc(p.occasion):''}</div></div>
        ${badge(p.stage,p.stage==='已出片'?'b-ok':(p.stage==='拍摄中'?'b-pink':'b-accent'))}
      </div>
      <div class="bar" style="margin:8px 0 6px"><i style="width:${pct}%"></i></div>
      <div class="muted tiny" style="display:flex;gap:10px;flex-wrap:wrap">
        <span>备装 ${st.readyLive}/${st.live}</span>${st.gone?`<span class="muted">已处置 ${st.gone}</span>`:''}
        <span>拍摄 ${st.ss.length} 场</span>
        <span>花费 ${money(st.spent)}${p.budget?'/预算 '+money(p.budget):''}</span>
        ${st.back?`<span>回血 ${money(st.back)}</span>`:''}
        ${p.deadline?`<span style="${isPast(p.deadline)&&p.stage!=='已出片'?'color:var(--danger);font-weight:700':''}">D-day ${esc(p.deadline)}（${esc(dueText(p.deadline))}）</span>`:''}
        ${st.od?`<span style="color:var(--danger);font-weight:700">${st.od} 项交付逾期</span>`:''}
      </div>`)}</div>`;
  }).join('') : emptyBox(S.projectStage||S.projectQ?'没有符合条件的项目':'还没有项目：一个项目 = 某角色某套皮肤的出装计划', {label:'＋ 新建出装项目',fn:'formProject()'});
  return html+`<button class="fab" onclick="formProject()">＋</button>`;
}

/* =========================================================
   项目详情看板
   ========================================================= */
/* v1.2：五个分页并成四个（拍摄与人员 + 成片 = 拍摄），窄屏放得下，流程也是顺的 */
var PROJ_TABS=[['base','概览'],['gear','装备'],['shoot','拍摄'],['cost','费用']];
function projectGaps(p){
  var st=projectStats(p), g=[], its=st.its;
  if(!its.length) g.push('还没有登记任何 C服/道具/配件');
  if(!its.filter(function(i){return i.kind==='C服'||i.kind==='鞋'||i.kind==='饰品';}).length) g.push('缺 C服条目');
  if(!its.filter(function(i){return i.kind==='假发';}).length) g.push('缺假发（自剪还是约毛娘？）');
  var appts=DB.appointments.filter(function(a){return a.projectId===p.id;});
  var needMakeup=['日常自娱','场照'].indexOf(p.occasion)<0;
  if(needMakeup&&!appts.filter(function(a){return a.type==='妆娘';}).length) g.push('未约妆娘');
  if(needMakeup&&!appts.filter(function(a){return a.type==='毛娘';}).length && !its.filter(function(i){return i.kind==='假发'&&i.wigStyle==='已造型';}).length) g.push('未约毛娘 / 假发未造型');
  if(!st.ss.length) g.push('还没有拍摄单');
  if(p.stage==='拍摄中'&&!st.ss.filter(function(s){return s.status==='已确认';}).length) g.push('拍摄单未确认（时间/场地/摄影师）');
  if(st.ss.filter(function(s){return s.status==='已完成';}).length && !DB.deliverables.some(function(d){return st.ss.some(function(s){return s.id===d.sessionId;});})) g.push('已拍但没登记原片/精修交付');
  /* v1.2 联动：片子都返了却还没有任何发布记录，多半是忘了记 */
  if(st.ss.some(function(x){return delivsOf(x.id).some(function(d){return d.status==='已返图';});}) && !DB.publications.some(function(b){return b.projectId===p.id;}))
    g.push('已返图但没记发布：发出去这套才算用完');
  var pend=appts.filter(function(a){return ['待确认','已定档'].indexOf(a.status)>=0 && num(a.fee)>num(a.deposit);});
  if(pend.length) g.push('有预约单未付定金：'+pend.map(function(a){return a.type;}).join('、'));
  if(!st.spent) g.push('还没有费用流水（可能漏记）');
  if(p.budget && st.spent>p.budget) g.push('⚠ 已超出预算 '+money(st.spent-p.budget)+' 元');
  return g;
}
function doSetStage(p,st){
  p.stage=st; p.updated_at=nowStamp();
  if(st==='已出片'&&!p.archived_at) p.archived_at=todayISO();
  if(st!=='已出片') p.archived_at='';   /* 1.1.2 修复：退回进行中时要清掉归档日期，否则统计仍把它当已出片 */
  put('projects',p);
}
function setStage(pid,st){
  var p=get('projects',pid); if(!p) return;
  applyAction('「'+p.name+'」阶段 → '+st,function(){ doSetStage(p,st); },{plain:true});
  if(st==='已出片') promptDispose(p);
}
function vProject(){
  var p=get('projects',S.projectId);
  if(!p) return emptyBox('项目不存在或已删除。如果是从首页提醒/待办点进来的，说明那条记录关联的项目已经被删掉',{label:'回到项目列表',fn:"go('projects',{tab:'projects'})"});
  var st=projectStats(p);
  var html=`<div class="card"><div class="stage-head">
      <h2>${esc(p.name)}</h2>
      <span class="act" onclick="delProjectConfirm('${p.id}')" style="color:var(--danger);cursor:pointer;font-size:12px">删除</span>
    </div>
    <div class="pill-row" data-sk="dstage">${STAGES.map(function(s){return `<button class="chip ${p.stage===s?'on':''}" onclick="setStage('${p.id}','${s}')">${s}</button>`;}).join('')}</div>
    <div class="grid2">
      ${kv('角色',esc(charLabel(p.characterId))+(p.skin?' · '+esc(p.skin):''))}
      ${kv('场合',esc(p.occasion||''))}
      ${kv('计划完成日',(p.deadline?esc(p.deadline)+'（'+dueText(p.deadline)+'）':''))}
      ${kv('还原度',esc(p.restore||''))}
      ${kv('预算',(p.budget?money(p.budget)+' 元':''))}
      ${kv('实际花费',`<b class="mono">${money(st.spent)}</b>${st.back?` <span class="muted tiny">回血 ${money(st.back)}</span>`:''}`)}
    </div>
    ${p.note?`<div class="muted tiny" style="margin-top:6px">${esc(p.note)}</div>`:''}
    </div>`;
  var gaps=projectGaps(p);
  if(gaps.length) html+=`<div class="warn-box"><b>还缺这些：</b><br>${gaps.map(function(x){return '· '+esc(x);}).join('<br>')}</div>`;

  html+=swipeHintBox();
  html+=`<div class="tabs">${PROJ_TABS.map(function(t){return `<button class="${S.projTab===t[0]?'on':''}" onclick="S.projTab='${t[0]}';render()">${t[1]}</button>`;}).join('')}</div>`;

  if(S.projTab==='gear') html+=projTabGear(p,st);
  else if(S.projTab==='shoot') html+=projTabShoot(p,st)+projTabTeam(p)+projTabFilm(p,st);
  else if(S.projTab==='cost') html+=projTabCost(p,st);
  else html+=projTabBase(p,st);
  return html+`<button class="fab" onclick="quickAdd()">＋</button>`;
}
function projTabBase(p,st){
  var td=DB.todos.filter(function(t){return t.projectId===p.id;});
  var h='';
  h+=card('参考与情报',refLinks(p.refLinks),null);
  h+=card('待办 / 提醒',
    td.length? sortAsc(td,'due').map(function(t){
      return `<div class="check-row ${t.done?'done':''} sw" data-sw="todo:${t.id}" onclick="toggleTodo('${t.id}')">`+
        swWrap(`<div class="swrow">
        <input type="checkbox" ${t.done?'checked':''}>
        <div class="txt">${esc(t.title)}${t.note?`<div class="tiny muted">${esc(t.note)}</div>`:''}</div>
        <div class="r tiny" ${t.due&&isPast(t.due)&&!t.done?'style="color:var(--danger);font-weight:700"':''}>${t.due?esc(dueText(t.due)):''}</div>
        <span class="badge" onclick="event.stopPropagation();delTodo('${t.id}')" style="cursor:pointer">✕</span></div>`)+`</div>`;
    }).join('') : emptyBox('无待办'),{label:'＋ 加待办',fn:`formTodo(null,{projectId:'${p.id}',due:''})`});
  if(st.live){
    var byKind={};
    st.its.filter(isLiveItem).forEach(function(i){ byKind[i.kind]=byKind[i.kind]||[]; byKind[i.kind].push(i); });
    h+=`<div class="card"><h3>备装进度<span class="cnt">${st.readyLive}/${st.live} 就绪${st.gone?'（另有 '+st.gone+' 件已处置）':''}</span><span class="act" onclick="S.projTab='gear';render()">去装备 ›</span></h3>`+
      Object.keys(byKind).map(function(k){
        var a=byKind[k], r=a.filter(isReadyItem).length;
        return `<div class="row" style="cursor:default"><div class="main"><div class="t">${esc(k)} <span class="muted tiny">${r}/${a.length}</span></div>
          <div class="bar" style="margin-top:4px"><i style="width:${Math.round(r/a.length*100)}%"></i></div></div>
          <div class="r tiny">${a.map(function(i){return esc(i.name)+'·'+esc(i.status);}).join(' ')}</div></div>`;
      }).join('')+`</div>`;
  }
  return h;
}
function projTabGear(p,st){
  var its=st.its;
  var h=`<div class="btn-row" style="margin-bottom:10px">
    <button class="btn sm" onclick="formItem(null,{projectIds:['${p.id}'],characterId:'${p.characterId}',status:'愿望单/购物车'})">＋ 加一件装备</button>
    <button class="btn sm ghost" onclick="linkItemPicker('${p.id}')">关联已有装备</button>
  </div>`;
  if(!its.length) return h+emptyBox('还没有条目：C服、假毛、道具、美瞳、鞋都记在这里');
  var byKind={};
  its.forEach(function(i){ (byKind[i.kind]=byKind[i.kind]||[]).push(i); });
  Object.keys(byKind).forEach(function(k){
    h+=`<div class="card"><h3>${esc(k)}<span class="cnt">${byKind[k].length}</span></h3>`+
      byKind[k].map(function(i){
        return listRow({t:`${esc(i.name)} ${statusBadge(i.status)}`,
          d:[i.size?'码:'+esc(i.size):'',i.price?'¥'+money(i.price):'',i.shop?esc(i.shop):'',i.storage?'放:'+esc(i.storage):''].filter(Boolean).join(' · '),
          r:'›',onclick:`go('asset',{itemId:'${i.id}',tab:'assets'})`,
          sw:itemSwappable(i)?'item:'+i.id:'', lp:'item:'+i.id});
      }).join('')+`</div>`;
  });
  return h;
}
function linkItemPicker(pid){
  var p=get('projects',pid); if(!p) return;
  var cand=DB.items.filter(function(i){ return arr(i.projectIds).indexOf(pid)<0 && (!i.characterId || i.characterId===p.characterId); });
  if(!cand.length){ toast('台账里没有可关联的条目，先去「装备」新增'); return; }
  openModal({
    title:'关联已有装备到「'+p.name+'」',
    body:'<div class="tiny muted" style="margin-bottom:8px">按名称或角色筛选，点一条即关联（只显示通用件与同角色件）</div>'+
      cand.map(function(i){
        return listRow({t:`${esc(i.name)} ${statusBadge(i.status)}`,d:(i.kind||'')+' · '+charLabel(i.characterId),r:'＋',onclick:`linkItemToProject('${i.id}','${pid}')`});
      }).join('')
  });
}
function linkItemToProject(iid,pid){
  var i=get('items',iid); if(!i) return;
  i.projectIds=arr(i.projectIds).concat([pid]); put('items',i); syncItemExpense(i); save();
  closeModal(); render(); toast('已关联：'+i.name);
}
function projTabTeam(p){
  var ap=DB.appointments.filter(function(a){return a.projectId===p.id;});
  var h=card('预约单（妆娘 / 毛娘 / 摄影师 / 修图）',
    ap.length? sortDesc(ap,'datetime').map(function(a){
      return listRow({t:`${esc(a.type||'')}·${esc(contactLabel(a.contactId)||a.contactText||'待定')} ${badge(a.status,a.status==='已结清'?'b-ok':(a.status==='待确认'?'b-warn':'b-info'))}`,
        d:`${esc(a.datetime||'未定时间')} ${a.place?'· '+esc(a.place):''} ${a.fee?'· 总价 '+money(a.fee)+'（定金 '+money(a.deposit)+'）':''}`,
        /* 1.1.2：补删除入口（deleteAppt 原先无调用点） */

function cmpItems(){ return S.cmp.ids.map(function(id){ return get('items',id); }).filter(Boolean); }
function cmpAdd(iid){

  if(S.cmp.ids.length>=4){ toast('一次最多对比 4 件，先移走一件'); return; }

/** 装备状态统一入口。opts.quiet：滑动/撤销路径用，由调用方负责 render 与提示 */
function advanceStatus(iid,st,opts){
  var i=get('items',iid); if(!i) return false;
  opts=opts||{};
  if(isDisposalStatus(st)){ formItem(iid,{status:st}); toast('请补记去向（CN）与日期'); return false; }
  i.status=st; i.updated_at=nowStamp();
  /* v1.2 联动：滑到「已下单/制作中」顺手补今天，自动流水的日期才不会落在无日期的旧数据上 */
  if(st==='已下单/制作中'&&!i.orderDate) i.orderDate=todayISO();
  if(st==='已到货'&&!i.arrivedDate) i.arrivedDate=todayISO();
  if(!isDisposalStatus(st)){ i.dispType=''; i.dispKind=''; i.dispTo=''; i.dispDate=''; i.dispPrice=null; i.dispReason=''; }
  put('items',i); syncItemExpense(i);
  if(!opts.quiet){ save(); render(); toast('「'+i.name+'」已推进到「'+st+'」'); }
  return true;
}

function checklistText(i){ return i.name+'（'+(i.kind||'')+(i.storage?' · '+i.storage:'')+'）'; }
function syncChecklist(sid){
  var s=get('sessions',sid); if(!s) return;
  /* v1.3.1（P1-5）：按"装备 id"认领旧行，而不是按文本。
     以前用 checklistText(i) 当 key，而那段文案里带"放在哪儿"——
     现场页顺手改一下存放位置，重新生成时文本对不上，旧行认不回来，已打的勾就全没了。 */
  var oldById={}, oldByText={};
  arr(s.checklist).forEach(function(c){
    if(!c) return;
    if(c.itemId) oldById[c.itemId]=c;
    else if(c.text) oldByText[c.text]=c;
  });
  var desired=checklistWant(s.id);
  var out=desired.map(function(d){
    var o=null;
    if(d.itemId && oldById[d.itemId]){ o=oldById[d.itemId]; delete oldById[d.itemId]; }
    else if(!d.itemId && oldByText[d.text]){ o=oldByText[d.text]; delete oldByText[d.text]; }
    /* 认回来的行：文案跟着最新走（存放位置改了要刷新），勾选状态原样保留 */
    if(o) return Object.assign(o,{text:d.text,itemId:d.itemId||null,kit:!!d.kit});
    return {id:uid('c'),text:d.text,itemId:d.itemId||null,kit:!!d.kit,checked:false};
  });
  /* 用户手动加的项目保留；已脱离本项目的装备行自动消失 */
  Object.keys(oldByText).forEach(function(t){ out.push(oldByText[t]); });
  s.checklist=out; s.updated_at=nowStamp(); put('sessions',s);
}
/* v1.2 联动：项目装备增减或处置后，清单不再是最新的 —— 数一下差几处，提醒一键同步 */
/** 1.3.4.1（P2-7）：「这一场的清单该有哪些行」的唯一来源。
    syncChecklist 与 checklistStale 以前一个按 itemId、一个按文案 —— 改一次存放位置就虚报双倍。 */
function checklistWant(sid){
  var s=get('sessions',sid); if(!s) return [];
  var out=itemsOfProject(s.projectId).filter(isLiveItem)
    .sort(function(a,b){ return String(a.kind).localeCompare(String(b.kind),'zh'); })
    .map(function(i){ return {key:i.id, text:checklistText(i), itemId:i.id, kit:false}; });
  /* 1.3.4.2（复核 P2-2）：用户删掉的应急项记进 s.kitOff，「该有的行」就真的不含它 ——
     否则删一次就永远挂着「有 N 处变动还没同步」，用户被提示逼着接受不想要的项。
     「重新生成」= 全部恢复（regenChecklist 里清空 kitOff）。 */
  var kitOff=arr(s.kitOff);
  EMERGENCY_KIT.forEach(function(k){ if(kitOff.indexOf(k)>=0) return; out.push({key:'kit·'+k, text:'应急包·'+k, itemId:null, kit:true}); });
  return out;
}
function checklistStale(s){
  var cl=arr(s&&s.checklist); if(!cl.length) return 0;
  var want={},have={};
  checklistWant(s.id).forEach(function(d){ want[d.key]=1; });
  /* 手动加的行不参与比对（它们本来就该一直留着，与 1.3.4 之前的口径一致） */
  cl.forEach(function(c){
    if(!c) return;
    if(c.itemId) have[c.itemId]=1;
    else if(c.kit) have['kit·'+String(c.text||'').replace(/^应急包·/,'')]=1;
  });
  var n=0,k;
  for(k in want) if(!have[k]) n++;
  for(k in have) if(!want[k]) n++;
  return n;
}

function doSetSession(s,st){
  s.status=st; s.updated_at=nowStamp(); put('sessions',s); syncSessionExpense(s);
}
function setSessionStatus(sid,st){
  var s=get('sessions',sid); if(!s) return;

  applyAction('拍摄单 '+(s.date||'')+' → '+st+autoStageText(s,st),function(){ doSetSession(s,st); autoStage(s); },{plain:true});
}
/* v1.2 联动：拍摄定了档、拍完了，项目不该还停在「计划中」 */
function autoStage(s){
  if(['已确认','已完成'].indexOf(s.status)<0) return false;
  var p=get('projects',s.projectId);
  if(!p||p.stage!=='计划中') return false;
  doSetStage(p,'拍摄中');
  return true;
}
function autoStageText(s,st){
  var will=['已确认','已完成'].indexOf(st)>=0;
  var p=get('projects',s.projectId);
  return (will&&p&&p.stage==='计划中')?' · 项目自动转「拍摄中」':'';
}
function toggleCheck(sid,cid){
  var s=get('sessions',sid); if(!s) return;
  arr(s.checklist).forEach(function(c){ if(c.id===cid) c.checked=!c.checked; });
  put('sessions',s); render();
}
function delCheck(sid,cid){
  var s=get('sessions',sid); if(!s) return;
  var row=arr(s.checklist).filter(function(c){return c.id===cid;})[0];
  s.checklist=arr(s.checklist).filter(function(c){return c.id!==cid;});
  /* 1.3.4.2（复核 P2-2）：删掉的是应急包行 → 记进 kitOff，重新生成之前不再自动回来、也不再虚报未同步 */
  if(row&&row.kit){
    var k=String(row.text||'').replace(/^应急包·/,'');
    if(EMERGENCY_KIT.indexOf(k)>=0){ s.kitOff=arr(s.kitOff); if(s.kitOff.indexOf(k)<0) s.kitOff.push(k); }
  }
  put('sessions',s); render();
}

function pickImport(merge){ S.mergeMode=!!merge; document.getElementById('importFile').click(); }
function readImport(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    inp.value='';
    var obj;
    try{ obj=JSON.parse(r.result); }catch(e){ toast('文件不是合法 JSON'); return; }
    var data=obj&&obj.data?obj.data:obj;
    if(!data||typeof data!=='object'||!data.projects){ toast('文件结构不对：缺少 projects 字段'); return; }
    var cnt=['projects','items','contacts','sessions','appointments','deliverables','expenses'].map(function(k){ return k+' '+(arr(data[k]).length); }).join('，');
    confirmBox(S.mergeMode?'合并导入':'覆盖导入',
      /* 1.1.2 修复：合并模式末尾多一个无配对的右括号；覆盖模式则少了右括号 */
      (S.mergeMode?'同 id 的以文件为准，其余追加（':'将完全替换本机数据（导出的这份含：')+cnt+'）',
      function(){ doImport(data,S.mergeMode); },'继续');
  };
  r.readAsText(f);
}
function doImport(data,merge){
  if(!merge){ DB=migrate(data); save(); go('home',{tab:'home'}); toast('导入完成'); return; }
  var fresh=migrate(data);
  ['works','characters','projects','items','contacts','locations','sessions','appointments','deliverables','publications','expenses','todos'].forEach(function(k){
    var map={};
    DB[k].forEach(function(x){ map[x.id]=x; });
    fresh[k].forEach(function(x){ map[x.id]=x; });
    DB[k]=Object.keys(map).map(function(id){ return map[id]; });
  });
  save(); go('home',{tab:'home'}); toast('合并导入完成');
}
function rebuildAuto(){
  confirmBox('重建自动流水','按当前装备/预约单/拍摄单重新生成自动费用流水（手动记的不受影响）。',function(){
    /* v1.3.1（P1-2 配套）：重建是"删光自动流水再重算"，会把"非空即锁定"的归属一起冲掉。
       先把归属按 autoKey 记下来，重算时原样带回去。 */
    var keep={};
    DB.expenses.forEach(function(e){ if(e.source==='自动'&&e.autoKey&&e.projectId) keep[e.autoKey]=e.projectId; });
    DB.expenses=DB.expenses.filter(function(e){return e.source!=='自动';});
    _autoKeep=keep;
    try{ syncAllAutoExpenses(); }finally{ _autoKeep=null; }
    render(); toast('已重建');

}

/* =========================================================
   v1.2：滑动手势引擎 + 跨模块联动
   ========================================================= */
/** 一次「可撤销的改动」：先快照整库，改完落盘重绘。
    撤销走整库回滚，所以顺手生成的自动流水、自动转阶段、自动补日期会一起回到原样。 */
function applyAction(msg,mut,opt){
  opt=opt||{};
  var snap=JSON.stringify(DB);
  mut();
  save(); render();
  var seq=WRITE_SEQ;
  if(opt.plain){ toast(msg); return; }
  toastUndo(msg,function(){ DB=JSON.parse(snap); save(); render(); toast('已撤销'); },seq);
}

function itemSwappable(i){ return !!(i&&(ITEM_SWIPE_NEXT[i.status]||ITEM_SWIPE_PREV[i.status])); }
/** 线性流程里前后一格；不在流程内的（已取消 / 爽约 / 已改期 需要填原因）返回 null，也就滑不动 */
function flowStep(list,st,dir){
  var i=list.indexOf(st); if(i<0) return null;
  var j=i+dir; return (j<0||j>=list.length)?null:list[j];
}
function swipeTitle(list,from,to){ return list.indexOf(to)>list.indexOf(from)?('推到 '+to+' ›'):('‹ 退到 '+to); }

var SWIPE_DEFS={
  item:{ steps:function(id){
      var i=get('items',id); if(!i) return null;
      var nx=ITEM_SWIPE_NEXT[i.status], pv=ITEM_SWIPE_PREV[i.status];
      function act(st){ return { t:(st===nx?('推到 '+st+' ›'):('‹ 退到 '+st)), msg:'「'+i.name+'」→ '+st,
        run:function(){ advanceStatus(i.id,st,{quiet:true}); } }; }
      return { l:pv?act(pv):null, r:nx?act(nx):null };
  }},
  session:{ steps:function(id){
      var s=get('sessions',id); if(!s) return null;
      var nx=flowStep(SESSION_FLOW,s.status,1), pv=flowStep(SESSION_FLOW,s.status,-1);
      function act(st){ return { t:swipeTitle(SESSION_FLOW,s.status,st),
        msg:'拍摄单 '+(s.date||'')+' → '+st+autoStageText(s,st),
        run:function(){ var c=get('sessions',s.id); if(!c) return; doSetSession(c,st); autoStage(c); } }; }
      return { l:pv?act(pv):null, r:nx?act(nx):null };
  }},
  appt:{ steps:function(id){
      var a=get('appointments',id); if(!a) return null;
      var nx=flowStep(APPT_FLOW,a.status,1), pv=flowStep(APPT_FLOW,a.status,-1);
      function act(st){ return { t:swipeTitle(APPT_FLOW,a.status,st),
        msg:(a.type||'预约')+' · '+(contactLabel(a.contactId)||a.contactText||'待定')+' → '+st,
        run:function(){ setApptStatus(a.id,st); } }; }
      return { l:pv?act(pv):null, r:nx?act(nx):null };
  }},
  deliv:{ steps:function(id){
      var d=get('deliverables',id); if(!d) return null;
      var nx=flowStep(DELIV_FLOW,d.status,1), pv=flowStep(DELIV_FLOW,d.status,-1);
      function act(st){ return { t:swipeTitle(DELIV_FLOW,d.status,st),
        msg:(d.type||'交付')+' → '+st+((st!=='未交付'&&!d.agreedDate)?' · 记得补约定日期':''),
        run:function(){ setDelivStatus(d.id,st); } }; }
      return { l:pv?act(pv):null, r:nx?act(nx):null };
  }},
  todo:{ steps:function(id){
      var t=get('todos',id); if(!t) return null;
      function act(done){ return { t:done?('完成 ›'):('‹ 重新打开'), msg:(done?'已完成：':'待办重新打开：')+t.title,
        run:function(){ var c=get('todos',t.id); if(c){ c.done=done; put('todos',c); } } }; }
      return { l:t.done?act(false):null, r:t.done?null:act(true) };
  }},
  project:{ steps:function(id){
      var p=get('projects',id); if(!p) return null;
      if(STAGES.indexOf(p.stage)<0) return null;
      var nx=flowStep(STAGES,p.stage,1), pv=flowStep(STAGES,p.stage,-1);
      function act(st){ return { t:swipeTitle(STAGES,p.stage,st), msg:'「'+p.name+'」阶段 → '+st,
        run:function(){ var c=get('projects',p.id); if(c) doSetStage(c,st); },
        done:st==='已出片'?function(){ var c=get('projects',p.id); if(c) promptDispose(c); }:null }; }
      return { l:pv?act(pv):null, r:nx?act(nx):null };
  }}
};
function swStepsFor(kind,id){
  var d=SWIPE_DEFS[kind]; if(!d) return null;
  var s=d.steps(id);
  return (!s||(!s.l&&!s.r))?null:s;
}

/* ---------- 状态写入：滑动与点击共用 ---------- */
function setApptStatus(aid,st){
  var a=get('appointments',aid); if(!a) return;
  a.status=st; a.updated_at=nowStamp(); put('appointments',a); syncApptExpense(a);
}
/** 一离开「未交付」就补实际交付日，退回则清掉，逾期红字才不会一直挂着 */
function setDelivStatus(did,st){
  var d=get('deliverables',did); if(!d) return;
  d.status=st; d.updated_at=nowStamp();
  if(st==='未交付') d.deliveredDate='';
  else if(!d.deliveredDate) d.deliveredDate=todayISO();
  put('deliverables',d);
}

/* ---------- 指针事件：一次只跟一根手指，不设定时器 ---------- */
var SW_LIMIT=88, SW_MIN=46, SW_TAB_MIN=64;
var swDrag=null, swSwallow=0;
/** 起点落在按钮/链接/输入框上就不算滑动：那些是「点」的领地 */
function swSkip(t,host){
  var x=t&&t.closest&&t.closest('[onclick],input,button,select,textarea,a,label');
  return !!(x&&x!==host);
}
function swClamp(v){ return Math.max(-SW_LIMIT,Math.min(SW_LIMIT,v)); }
function initSwipe(){
  var main=document.getElementById('main');
  if(!main||main._swInit) return;
  main._swInit=true;
  main.addEventListener('pointerdown',swDown);
  main.addEventListener('pointermove',swMove);
  main.addEventListener('pointerup',swUp);
  main.addEventListener('pointercancel',swCancel);
  /* 锁定之后不让页面顺手竖滚（必须 passive:false 才拦得住） */
  main.addEventListener('touchmove',function(e){ if(swDrag&&swDrag.locked&&e.cancelable) e.preventDefault(); },{passive:false});
  /* 滑动提交后浏览器还会补一次 click，短窗口内吞掉，免得顺手点开详情页。
     撤销按钮就在手指底下，必须放行，否则刚滑完立刻点「撤销」会被一起吞掉。
     v1.3：电脑端拖动滑动槽之后补的那一次 click 也要吞掉（否则拖一下就把标签选了）。 */
  document.addEventListener('click',function(e){
    var now=Date.now();
    var hot=(swSwallow&&now-swSwallow<=500)||(lpSwallow&&now-lpSwallow<=320)||(dragSwallow&&now-dragSwallow<=350);
    if(!hot) return;
    if(e.target.closest&&e.target.closest('#toast')) return;
    /* v1.3.1（P2-3）：弹窗里的点击一律放行 —— 长按弹窗刚出来时点「下一步」被这条吞掉过 */
    if(e.target.closest&&e.target.closest('#modal')) return;
    swSwallow=0; lpSwallow=0; dragSwallow=0; e.preventDefault(); e.stopPropagation();
  },true);
}
function swDown(e){
  if(e.pointerType==='mouse'||!settings().swipe) return;
  if(swDrag) swCancel();
  var host=e.target.closest?e.target.closest('[data-sw]'):null;
  if(host){
    if(swSkip(e.target,host)) return;
    var kv=String(host.getAttribute('data-sw')).split(':');
    var steps=swStepsFor(kv[0],kv.slice(1).join(':'));
    if(!steps) return;
    swDrag={mode:'row',host:host,steps:steps,x0:e.clientX,y0:e.clientY,locked:false,action:null,side:null,pid:e.pointerId};
  }else if(S.view==='project'&&PROJ_TABS.length>1){
    if(swSkip(e.target,null)) return;
    swDrag={mode:'tab',x0:e.clientX,y0:e.clientY,locked:false,action:null,side:null,pid:e.pointerId};
  }else return;
  try{ if(e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId); }catch(_){}
}
function swMove(e){
  var d=swDrag; if(!d||e.pointerId!==d.pid) return;
  var dx=e.clientX-d.x0, dy=e.clientY-d.y0;
  if(!d.locked){
    if(Math.abs(dx)<8&&Math.abs(dy)<8) return;
    if(Math.abs(dy)>Math.abs(dx)*1.4){ swCancel(); return; }   /* 更像上下滚动：手势让路 */
    d.side=dx>0?'left':'right';
    d.action=d.mode==='row'?(dx>0?d.steps.l:d.steps.r):tabTarget(dx);
    if(!d.action){ swCancel(); return; }
    d.locked=true;
    if(d.mode==='row'){
      d.host.classList.add(d.side==='left'?'sw-l':'sw-r');
      var p=d.host.querySelector('.swpanel.'+d.side);
      d.txt=p.querySelector('b'); d.lab=p.querySelector('.swlab'); d.main=d.host.querySelector('.swmain');
      d.txt.textContent=d.action.t;
    }else showSwTab(d.action.t);
    return;
  }
  if(d.mode==='tab') return;
  var x=swClamp(dx);
  d.main.style.transform='translateX('+x+'px)';
  d.lab.style.opacity=String(Math.min(.16,Math.abs(x)/SW_LIMIT*.16));
}
function swUp(e){
  var d=swDrag; if(!d||e.pointerId!==d.pid) return;
  swDrag=null;
  var dx=e.clientX-d.x0;
  if(!d.locked||!d.action){ if(d.mode==='row') swReset(d); else hideSwTab(); return; }
  if(d.mode==='row'){
    swReset(d);
    if(Math.abs(dx)<SW_MIN) return;
    vibrate(12); swSwallow=Date.now();
    applyAction(d.action.msg,d.action.run);
    if(d.action.done) d.action.done();
  }else{
    hideSwTab();
    if(Math.abs(dx)<SW_TAB_MIN||(dx>0)!==(d.side==='left')) return;
    swSwallow=Date.now();
    S.projTab=d.action.k; render(); toast('已切到「'+d.action.label+'」');
  }
}
function swCancel(){
  var d=swDrag; if(!d) return;
  swDrag=null;
  if(d.mode==='row') swReset(d); else hideSwTab();
}
function swReset(d){
  if(!d||!d.host) return;
  d.host.classList.remove('sw-l'); d.host.classList.remove('sw-r');
  var m=d.host.querySelector('.swmain'); if(m) m.style.transform='';
  var labs=d.host.querySelectorAll('.swlab');
  for(var i=0;i<labs.length;i++) labs[i].style.opacity='';
}
/** 项目页左右滑翻分页：向右滑看前一个分页，向左滑看后一个 */
function tabTarget(dx){
  var i=-1;
  for(var j=0;j<PROJ_TABS.length;j++) if(PROJ_TABS[j][0]===S.projTab) i=j;
  if(i<0) return null;
  var k=dx>0?i-1:i+1;
  if(k<0||k>=PROJ_TABS.length) return null;
  return { k:PROJ_TABS[k][0], label:PROJ_TABS[k][1], t:dx>0?('‹ '+PROJ_TABS[k][1]):(PROJ_TABS[k][1]+' ›') };
}

/** 逾期交付一键转待办，省得再抄一遍名字 */

  var d={id:uid('d'),sessionId:sid,type:'原片',agreedCount:null,actualCount:null,
    agreedDate:isoOf(new Date(Date.now()+7*86400000)),deliveredDate:'',link:'',retouch:'',status:'未交付',note:'默认按 7 天返片约定，可进表单改'};

/** 按当天预约单 + 开拍时间拼一版时间线草稿，自己再补收尾 */
function suggestTimeline(sid){
  var s=get('sessions',sid); if(!s) return;
  var day=String(s.date||'').slice(0,10);
  var parts=[];
  DB.appointments.forEach(function(a){
    if(a.projectId!==s.projectId||!a.datetime) return;
    if(day&&String(a.datetime).slice(0,10)!==day) return;
    var nm=contactLabel(a.contactId)||a.contactText||'待确认';
    parts.push({t:String(a.datetime).slice(11,16)||'00:00', v:(a.type&&nm.indexOf(a.type)<0)?(a.type+' '+nm):nm});
  });
  if(s.time) parts.push({t:s.time,v:'开拍'});
  parts.sort(function(a,b){ return a.t<b.t?-1:(a.t>b.t?1:0); });
  if(!parts.length){ toast('这天没有预约单，也没填开拍时间'); return; }
  var txt=parts.map(function(x){ return x.t+' '+x.v; }).join(' → ');
  applyAction('已按预约单生成时间线',function(){ s.timeline=txt; s.updated_at=nowStamp(); put('sessions',s); });
}

/** 浮窗卡片改一两项：确认才落库，取消什么都不动；落库走 applyAction，4 秒内还能撤销 */
function quickEditItem(iid,key){
  var i=get('items',iid); if(!i) return;
  var spec=QUICK_FIELDS[key]; if(!spec) return;
  openForm({
    center:true, saveLabel:'确认',
    title:'改一下 · '+spec.l,
    values:Object.assign({},i),
    visCtx:i,                 /* v1.3.1（P1-4）：给 show() 一份只读上下文（如「处置」卡要看 status） */
    fields:spec.f(i),
    onSave:function(V){
      var nm=i.name;
      applyAction('已改「'+(nm||'这件装备')+'」· '+spec.l,function(){
        var it=Object.assign({},get('items',iid),V);
        if(!it) return;
        it.name=String(it.name||'').trim()||autoItemName(it,it.characterId,it.id);
        if((ASSET_CATS[it.kind]||[]).indexOf(it.category)<0) it.category='';
        itemDisposalRules(it);
        it.price=numOrNull(it.price); it.dispPrice=numOrNull(it.dispPrice);
        it.qty=numOrNull(it.qty); it.lowQty=numOrNull(it.lowQty);
        it.makeProgress=(it.makeProgress===''||it.makeProgress==null||it.makeProgress===undefined)?null:Math.max(0,Math.min(100,num(it.makeProgress)));
        it.dispType=it.status==='外借中'?'外借':(isDisposalStatus(it.status)?(it.dispKind||''):'');
        it.fittings=arr(it.fittings).filter(Boolean);
        it.fits=normFits(it.fits);
        it.refLinks=arr(it.refLinks).filter(function(x){return x.url||x.label;});
        it.updated_at=nowStamp();
        put('items',it); syncItemExpense(it);
      });
    }
  });
}

var LP_MS=1800, lpDrag=null, lpSwallow=0;   /* 1.3.4.1：进度条时长改成 var(--lp-ms)，由下面这一句按 LP_MS 现算，改一处就够 */
try{ document.documentElement.style.setProperty('--lp-ms',(LP_MS/1000)+'s'); }catch(e){}   /* 1.3.4：用户要求 3 秒太久；改这个值要同时改 .lp-run::after 的动画时长 */
function lpDown(e){
  if(e.pointerType==='mouse') return;                 /* 电脑端仍用详情页的「删除」按钮 */
  var host=e.target.closest?e.target.closest('[data-lp]'):null;
  if(!host) return;
  if(swSkip(e.target,host)) return;                  /* 落在按钮/角标/链接上的不算长按 */
  lpCancel();
  host.classList.add('lp-run');
  lpDrag={host:host,key:String(host.getAttribute('data-lp')),x:e.clientX,y:e.clientY,pid:e.pointerId,
          timer:setTimeout(lpFire,LP_MS)};
}
function lpMove(e){
  if(!lpDrag||e.pointerId!==lpDrag.pid) return;
  if(Math.abs(e.clientX-lpDrag.x)>12||Math.abs(e.clientY-lpDrag.y)>12) lpCancel();
}
function lpUp(){ lpCancel(); }
function lpCancel(){
  if(!lpDrag) return;
  clearTimeout(lpDrag.timer);
  try{ lpDrag.host.classList.remove('lp-run'); }catch(_){}
  lpDrag=null;
}
function lpFire(){
  var d=lpDrag; lpDrag=null; if(!d) return;
  try{ d.host.classList.remove('lp-run'); d.host.classList.add('lp-hot');
       setTimeout(function(){ try{ d.host.classList.remove('lp-hot'); }catch(_){} },400); }catch(_){}
  /* v1.3.1（P1-3）：长按已经成立，把还挂着的滑动判定废掉 ——
     否则"长按 3 秒后手指继续横拖"会顺手把装备状态推进一格（用户只是想长按删除）。 */
  try{ if(typeof swCancel==='function') swCancel(); }catch(_){}
  /* 只吞浏览器补发的那一次 click（几十毫秒内到），不能顺手把用户点「下一步」也吞了 */
  lpSwallow=Date.now();
  vibrate([18,60,18]);
  var kv=d.key.split(':');
  longPressAction(kv[0],kv.slice(1).join(':'));
}

/** 第 3 步：按钮要等 3 秒才亮，防手滑；删完 4 秒内还能撤销 */
function lpFinal(text,onYes){
  var n=3,timer=null;
  openModal({ center:true, title:'最后确认（第 3 步 / 共 3 步）',
    body:'<div class="danger-box">'+esc(text)+'</div>'+
      '<div class="qe-tip">建议先到「我的 → 导出 JSON 备份」存一份。删完 4 秒内还能点「撤销」。</div>'+
      '<div class="btn-row" style="margin-top:12px"><button class="btn gray" id="lpN">取消</button>'+
      '<button class="btn danger" id="lpY" disabled>确认删除（3）</button></div>',
    onMount:function(root){
      var y=root.querySelector('#lpY'), no=root.querySelector('#lpN');
      timer=setInterval(function(){
        n--; if(n>0){ y.textContent='确认删除（'+n+'）'; }
        else{ clearInterval(timer); y.disabled=false; y.textContent='确认删除'; }
      },1000);
      no.onclick=function(){ clearInterval(timer); closeModal(); };
      y.onclick=function(){ if(y.disabled) return; clearInterval(timer); closeModal(); onYes(); };
    }});
}
function doDeleteItem(iid){
  var i=get('items',iid); if(!i) return;
  applyAction('已删除装备「'+i.name+'」',function(){ deleteItem(i); });
  if(S.view==='asset'&&S.itemId===iid) go('assets',{tab:'assets'}); else render();
}
function doDeleteProject(pid,withItems){
  var p=get('projects',pid); if(!p) return;
  var its=withItems?itemsOfProject(pid).slice():[];
  applyAction('已删除项目「'+p.name+'」'+(its.length?'（连带 '+its.length+' 件装备）':''),function(){
    its.forEach(function(i){ deleteItem(i); });
    deleteProject(p);
  });
  go('projects',{tab:'projects'});
}

/* v1.3.3：一个角色可以有多套出装。排序只决定"默认先看到哪一套"，不再决定"哪一套看得见"。
   1.3.2 及以前：出装日按角色只取一套（已出片的、没填截止时间的被排到最后），
   于是同一角色的第二套出装既进不去、也没有任何入口能选到 —— 就是用户报的"某套出装不显示"。 */
function onsiteNextDate(p){
  /* 1.3.4.2（复核 P3-6）：「下一场」只有 nextSessionOf 一份口径（排除已取消与已完成） */
  var up=nextSessionOf(p.id);
  if(up) return {g:0,d:up.date};                                     /* 有还没到的拍摄 */
  var ss=sessionsOf(p.id).filter(function(s){ return s.status!=='已取消'&&s.date; });
  var past=ss[0];                                                    /* sessionsOf 已按日期倒序：第一条就是最近的一场 */
  if(past) return {g:1,d:past.date};                                 /* 只剩过去的拍摄 */
  if(p.deadline) return {g:1,d:p.deadline};                          /* 只有计划完成日 */
  return {g:2,d:''};                                                 /* 什么都没排：仍然列出来，只是排最后 */
}
function onsiteProjectsOf(cid){
  if(!cid) return [];
  return DB.projects.filter(function(p){ return p.characterId===cid; }).sort(function(a,b){
    var ao=a.stage==='已出片'?1:0, bo=b.stage==='已出片'?1:0;
    if(ao!==bo) return ao-bo;                                        /* 已出片排最后，但不隐藏 */
    var ad=onsiteNextDate(a), bd=onsiteNextDate(b);
    if(ad.g!==bd.g) return ad.g-bd.g;
    if(ad.g!==2&&ad.d!==bd.d) return ad.d<bd.d?-1:1;
    return String(b.updated_at||'').localeCompare(String(a.updated_at||''));  /* 都没排时间 → 最近动过的在前 */
  });
}
function onsiteBestProject(cid){ var ps=onsiteProjectsOf(cid); return ps.length?ps[0]:null; }
/** 现场页真正显示的那一套：优先用户手选的，其次默认最佳（手选的那套被删/被改角色时自动回落） */
function onsiteCurrentProject(){
  var ps=onsiteProjectsOf(S.onsiteChar);
  if(!ps.length) return null;
  for(var j=0;j<ps.length;j++) if(ps[j].id===S.onsitePid) return ps[j];
  return ps[0];
}
function onsiteBestSession(p){
  if(!p) return null;
  /* 1.3.4.2（复核 P3-6）：显示的"这一场"与排序用同一份 nextSessionOf ——
     以前排序排除已完成、显示不排除，今天这场拍完了就会"排序按明天、页面显示今天"。 */
  var up=nextSessionOf(p.id);
  if(up) return up;
  var ss=sessionsOf(p.id).filter(function(s){ return s.status!=='已取消'&&s.date; });
  return ss[0]||null;   /* 只剩过去/已完成的场：显示最近那一场当历史 */
}
function onsiteGear(p){
  if(!p) return [];
  return itemsOfProject(p.id).filter(isLiveItem);
}
function onsitePeople(p,s){
  var out=[];
  if(s){
    if(s.contactId) out.push({role:'摄影师',cid:s.contactId,name:contactLabel(s.contactId)||'待定',when:(s.date||'')+' '+(s.time||'')});
    else if(s.photographerText) out.push({role:'摄影师',name:s.photographerText,when:(s.date||'')+' '+(s.time||'')});
  }
  apptsOf(p.id).forEach(function(a){
    if(a.status==='已取消') return;
    if(s&&a.contactId===s.contactId) return;                       /* 摄影师已经在上面了 */
    out.push({role:a.type||'预约',cid:a.contactId||'',name:contactLabel(a.contactId)||a.contactText||'待定',
      when:String(a.datetime||'').replace('T',' ')});
  });
  return out;
}

        <button class="btn gray" onclick="closeModal()">收起</button>

/* =========================================================
   v1.3 ④：指针交互装配（双击快改 / 长按删除 / 滑动槽滑轨）
   ========================================================= */
var dragSwallow=0;
function initGestures13(){
  var main=document.getElementById('main');
  if(!main||main._g13) return;
  main._g13=true;
  /* 触屏上原生 dblclick 不稳：自己判 420ms 内的第二次连点 */
  var last={k:'',t:0};
  main.addEventListener('pointerup',function(e){
    if(e.pointerType==='mouse') return;
    var row=e.target.closest?e.target.closest('[data-qe]'):null;
    if(!row){ last={k:'',t:0}; return; }
    var k=row.getAttribute('data-qe')+'|'+row.getAttribute('data-qid');
    var now=Date.now();
    if(last.k===k&&now-last.t<420){ last={k:'',t:0}; quickEditItem(row.getAttribute('data-qid'),row.getAttribute('data-qe')); }
    else last={k:k,t:now};
  });
  main.addEventListener('pointerdown',lpDown);
  main.addEventListener('pointermove',lpMove);
  main.addEventListener('pointerup',lpUp);
  main.addEventListener('pointercancel',lpUp);
  /* v1.3.1（P1-3）：长按的宿主上再拦一道系统长按菜单/文本选择，
     否则 iOS/Android 会弹选择气泡并可能发 pointercancel，把 3 秒定时器打断，长按永远走不到头。 */
  main.addEventListener('contextmenu',function(e){
    if(e.target.closest&&e.target.closest('[data-lp]')) e.preventDefault();
  });
  main.addEventListener('pointerdown',slotDown);
  main.addEventListener('wheel',slotWheel,{passive:false});
}
/** 电脑端：按住滑动槽横向拖动（拖过 5px 就不算点击，避免误选标签） */
function slotDown(e){
  if(e.pointerType!=='mouse') return;
  var row=e.target.closest?e.target.closest('.pill-row'):null;
  if(!row||row.scrollWidth<=row.clientWidth+1) return;
  var x0=e.clientX, s0=row.scrollLeft, moved=false;
  row.classList.add('dragging');
  function mv(ev){ var dx=ev.clientX-x0; if(Math.abs(dx)>5) moved=true; if(moved) row.scrollLeft=s0-dx; }
  function up(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
    row.classList.remove('dragging'); if(moved) dragSwallow=Date.now(); }
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
}
/** 电脑端：滚轮在滑动槽上就横向滚；滚到头交还给页面，不抢正常滚动 */
function slotWheel(e){
  var row=e.target.closest?e.target.closest('.pill-row'):null;
  if(!row||row.scrollWidth<=row.clientWidth+1) return;
  var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(!d) return;
  var max=row.scrollWidth-row.clientWidth;
  if((d<0&&row.scrollLeft<=0)||(d>0&&row.scrollLeft>=max-1)) return;
  e.preventDefault();
  row.scrollLeft=Math.max(0,Math.min(max,row.scrollLeft+d));
}

/* 1.1.2 修复：file:// 属于非安全上下文，且窗口失焦时 navigator.clipboard.writeText 会 reject，
   导致点平台 ID 就"复制失败"。改为三层兜底：execCommand 优先 → Clipboard API → 手动复制框。 */
/* 1.3.4 复制：三条策略依次试，而且**先确认选区真的等于要复制的文本**再 execCommand。
   1.3.3 及以前用 Range 选 textarea 的内容、且从不 focus —— 桌面 Chrome 会"返回 true"，
   iOS / 部分安卓上其实什么都没写进剪贴板，却照样提示"已复制"，这就是"一键复制还是没实现"。 */
function copySelMatches(text){
  try{ return String(window.getSelection().toString())===String(text); }catch(e){ return false; }
}
/** 策略 A：contentEditable 代理 + Range（iOS Safari 唯一稳的一条） */
function copyByEditable(text){
  var d=document.createElement('div');
  d.setAttribute('contenteditable','true');
  d.textContent=text;
  d.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;overflow:hidden;white-space:pre';
  document.body.appendChild(d);
  var okc=false;
  try{
    var r=document.createRange(); r.selectNodeContents(d);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    if(copySelMatches(text)) okc=!!document.execCommand('copy');
  }catch(e){ okc=false; }
  try{ window.getSelection().removeAllRanges(); }catch(e){}
  document.body.removeChild(d);
  return okc;
}
/** 策略 B：textarea + focus + setSelectionRange（安卓与桌面） */
function copyByExec(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:-9999px;width:2px;height:2px;opacity:0';
  document.body.appendChild(ta);
  var okc=false;
  try{
    ta.focus(); ta.setSelectionRange(0,String(text).length);
    /* 1.3.4.1（P3-1）：B 也要确认选中了才认成功 —— 1.3.4 修的根因就是「execCommand 返回 true ≠ 真复制了」 */
    if(ta.selectionStart===0 && ta.selectionEnd===String(text).length) okc=!!document.execCommand('copy');
  }catch(e){ okc=false; }
  document.body.removeChild(ta);
  return okc;
}
/** 走一遍三条路，返回成功那条的名字（''=都没成） */
function copyNow(text){
  text=String(text==null?'':text);
  if(!text) return '';
  if(copyByEditable(text)) return 'A';
  if(copyByExec(text)) return 'B';
  if(navigator.clipboard&&navigator.clipboard.writeText) return 'C';   /* 1.3.4.1：前一行是后一行的子集，删掉；能不能用由 writeText 的 reject 说话 */
  return '';
}
function copyManual(text, label){
  openModal({
    title:'浏览器拦住了自动复制 · 长按这里复制', center:true,
    body:'<div class="muted tiny" style="margin-bottom:6px">'+esc(label)+'：下面已经整段选好，长按 → 点「复制」就能粘到微信/导航；也可以点「再试一次」。</div>'+
      '<div id="manualCopy" class="mcopy">'+esc(text)+'</div>'+
      '<div class="btn-row" style="margin-top:10px"><button class="btn gray" id="mcAgain">再试一次</button>'+
      '<button class="btn" id="mcDone">好了</button></div>',
    onMount:function(m){
      var box=m.querySelector('#manualCopy');
      try{
        var r=document.createRange(); r.selectNodeContents(box);
        var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
      }catch(e){}
      m.querySelector('#mcAgain').onclick=function(){
        closeModal();
        var how=copyNow(text);
        if(how==='C'){ navigator.clipboard.writeText(text).then(function(){ toast('已复制：'+(label||text)); },function(){ copyManual(text,label||'内容'); }); }
        else if(how){ toast('已复制：'+(label||text)); }
        else copyManual(text, label||'内容');
      };
      m.querySelector('#mcDone').onclick=closeModal;
    }
  });
}
/** 通用复制：只有真的复制成功才说"已复制"，否则直接给可选长的降级框 */
function copyAny(text, label){
  text=String(text==null?'':text);
  if(!text){ toast('没有可复制的内容'); return; }
  var how=copyNow(text);
  if(how==='A'||how==='B'){ toast('已复制：'+(label||text)); return; }
  if(how==='C'){
    navigator.clipboard.writeText(text).then(
      function(){ toast('已复制：'+(label||text)); },
      function(){ copyManual(text, label||'内容'); });
    return;
  }
  copyManual(text, label||'内容');
}
window.copyText=function(t){ copyAny(t, String(t||'')); };
