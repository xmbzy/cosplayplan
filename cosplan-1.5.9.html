/* =========================================================
   v1.5.9 ②：合作条款（挂在单据上）· 一键留档 · 微合同出图
   ========================================================= */
function refCollOf(refType){ return refType==='session'?'sessions':'appointments'; }
/** 用户在「通讯录 → 条款模板」改过的条目：{ 类型: {条款 key: 文本} }，只存差异。
    内置文案以后升级时，没改过的那几条会跟着升级；改过的仍是用户自己那一份。
    ★ 读的一律不写：这几个 getter 会出现在渲染路径上（vTeamTerms→clauseLib、vSession→termsCtx→myCn），
      顺手往 DB.meta.settings 塞个空对象却不 save()，就是内存与落盘悄悄分叉 —— 与 termsOf/termsRead 同一个坑。
      要改的走 termsEditSet / termsParamSet / setMyCn，由它们负责建对象，调用方负责 save()。 */
function metaSettings(){
  var s=(DB.meta&&DB.meta.settings&&typeof DB.meta.settings==='object')?DB.meta.settings:null;
  return s||null;
}
function termsEditRaw(){
  var s=metaSettings(), e=s?s.termsEdit:null;
  return (e&&typeof e==='object'&&!Array.isArray(e))?e:{};
}
function termsParamRaw(){
  var s=metaSettings();
  return (s&&Array.isArray(s.termsParam))?s.termsParam:[];
}
function myCn(){
  var s=metaSettings();
  return (s&&typeof s.myCn==='string')?s.myCn:'';
}
/** 整份替换某一类的覆盖；传空对象就是丢掉这一类的自定义、回到内置文案 */
function termsEditSet(preset,obj){
  var s=settings();
  var m=(s.termsEdit&&typeof s.termsEdit==='object'&&!Array.isArray(s.termsEdit))?s.termsEdit:{};
  if(!obj||!Object.keys(obj).length) delete m[preset]; else m[preset]=obj;
  s.termsEdit=m;
  return m;
}
function termsParamSet(list){
  settings().termsParam=arr(list).map(function(x){
    return {a:String((x&&x.a)||'').trim().slice(0,40), b:String((x&&x.b)||'').trim().slice(0,120)};
  }).filter(function(x){ return x.a||x.b; });
}
function setMyCn(v){ settings().myCn=String(v||'').trim().slice(0,40); }
/** 某一类单据实际生效的条款表（内置 + 用户覆盖）—— 全站读条款文案只走这一个口子 */
function clauseLib(preset){
  var base=TERMS_CLAUSES[preset]||TERMS_CLAUSES['其他'];
  var ed=termsEditRaw()[preset]||{};
  return base.map(function(c){
    var v=(typeof ed[c.k]==='string'&&ed[c.k]!=='')?ed[c.k]:c.def;
    return { k:c.k, l:c.l, on:!!c.on, def:v };
  });
}
function termsEditedN(preset){
  var ed=termsEditRaw()[preset]||{}, n=0;
  (TERMS_CLAUSES[preset]||[]).forEach(function(c){
    if(typeof ed[c.k]==='string'&&ed[c.k]!==''&&ed[c.k]!==c.def) n++;
  });
  return n;
}
/** 假 preset（外来备份塞的）不认：一律归到「其他」，否则会出现"套着 A 的标题、读着 B 的条款、一条都不显示" */
function termsPreset(p){ return TERMS_CLAUSES[p]?p:'其他'; }
/* ---- 条款存在哪：appointments[x].terms / sessions[x].terms（不新增集合，老备份自动兼容） ---- */
function termsOf(refType,refId){
  var rec=get(refCollOf(refType),refId);
  if(!rec) return null;
  if(!rec.terms||typeof rec.terms!=='object'||Array.isArray(rec.terms)) rec.terms={};
  var t=rec.terms;
  if(t.preset) t.preset=termsPreset(t.preset);
  if(!t.c||typeof t.c!=='object'||Array.isArray(t.c)) t.c={};
  /* 外来的 key 一律不认：取文本是按条款表取的，多出来的键读不到、却会跟着备份一直占空间 */
  var keep={};
  Object.keys(t.c).forEach(function(k){ if(TERMS_ALL_KEYS[k]&&typeof t.c[k]==='string') keep[k]=t.c[k]; });
  t.c=keep;
  return t;
}
/** 只读版：render 路径一律用这个。termsOf 会顺手补 rec.terms={} ——
    在渲染里调用等于每次重绘都往内存写一份却不落盘，内存与 localStorage 悄悄分叉。 */
function termsRead(refType,refId){
  var rec=get(refCollOf(refType),refId);
  return (rec&&rec.terms&&typeof rec.terms==='object'&&!Array.isArray(rec.terms))?rec.terms:null;
}
/** 《民法典》第 586 条第 2 款：定金不得超过主合同标的额的 20%，超出部分不产生定金效力。
    圈内常见 30%~50% —— 以为锁住了档期，其实只有 20% 那部分受定金罚则保护。这里只提示，不拦保存。 */
function depositCap(fee){ return fee>0?Math.round(fee*0.2*100)/100:null; }
function depositVerdict(fee,dep){
  fee=numOrNull(fee); dep=numOrNull(dep);
  if(!(fee>0)||!(dep>0)) return null;
  var cap=depositCap(fee), over=Math.round((dep-cap)*100)/100, ratio=Math.round(dep/fee*1000)/10;
  if(over<=0) return {ok:true,cap:cap,over:0,ratio:ratio,msg:'定金 '+dep+' 元 = 总价的 '+ratio+'%，在 20% 上限（'+cap+' 元）内，全额具备定金效力。'};
  return {ok:false,cap:cap,over:over,ratio:ratio,
    msg:'定金 '+dep+' 元 = 总价的 '+ratio+'%，超出 20% 上限（'+cap+' 元）'+over+' 元。按《民法典》第 586 条，超出部分不产生定金效力，违约时不能按定金罚则主张，通常只算预付款。'+
        '想真正锁住档期，建议拆成「定金 '+cap+' 元 + 预付款 '+over+' 元」分别写明。'};
}
/** 占位符的值全部来自已有字段 —— 同一件事全站一种写法，模板里不允许手填第二份。
    _fee/_dep 是原始数值（给 depositVerdict 用），不能混进正文：条款里的 {fee} 要的是「400 元」这个字面。 */
function termsCtx(refType,refId){
  var isS=refType==='session';
  var rec=get(isS?'sessions':'appointments',refId);
  if(!rec) return null;
  var p=rec.projectId?get('projects',rec.projectId):null;
  var who=isS
    ?(rec.photographerText||(rec.contactId?(contactLabel(rec.contactId)||'（联系人已删）'):''))
    :((rec.contactText&&rec.contactText.trim())||(rec.contactId?(contactLabel(rec.contactId)||'（联系人已删）'):''));
  var place=isS
    ?(rec.locationText||(rec.locationId?(locationLabel(rec.locationId)||'（场地已删）'):''))
    :String(rec.place||'');
  var date='',time='';
  if(isS){ date=String(rec.date||''); time=String(rec.time||''); }
  else if(rec.datetime){ date=String(rec.datetime).slice(0,10); time=String(rec.datetime).slice(11,16); }
  var fee=numOrNull(rec.fee), dep=numOrNull(rec.deposit);
  var rest=(fee!==null&&dep!==null)?Math.round((fee-dep)*100)/100:null;
  var v=depositVerdict(fee,dep);
  var dl=isS?arr(DB.deliverables).filter(function(d){return d.sessionId===refId;}):[];
  var d0=dl[0]||{};
  var md=myData(), wig=(md&&md.wig)||{};
  var cp=p?charParts(p.characterId):{work:'',char:''};
  return {
    /* 没填价在这个应用里是正常状态（互免 TFP 是一等拍摄方式），不该标成"待填"；
       但也不能静默留空 —— 明写"另议"，对方一眼看得出现在还没定价。其余占位符照旧走【待填：…】 */
    fee:fee!==null?(money(fee)+' 元'):'费用另议（未填总价）',
    dep:dep!==null?(money(dep)+' 元'):'无（未填定金）',
    rest:rest!==null?(money(rest)+' 元'):(fee!==null?'扣定金后结清（未填定金）':'费用另议'),
    pct:v?('占总价 '+v.ratio+'%'):'', cap:v?(money(v.cap)+' 元'):'',
    date:date, time:time, place:place, who:who||'', me:myCn()||'',
    role:p?((cp.char||'')+(p.skin?(' · '+p.skin):'')):'', proj:p?(p.name||''):'',
    method:isS?String(rec.method||''):'', backup:isS?String(rec.backup||''):'',
    req:String(rec.requirement||''),
    /* 拍摄单没有"付款说明"这一格，但它的口径是确定的：已付定金 > 0 会被 syncSessionExpense
       立刻记成一笔支出 —— 所以定金是否付过由状态与金额推出来，不该在条款里显示成【待填】。 */
    payNote:isS?(dep>0?'定金已付（已记入本机支出流水）':'未收定金'):String(rec.paidNote||''),
    count:(d0.agreedCount!==null&&d0.agreedCount!==undefined&&d0.agreedCount!=='')?(d0.agreedCount+' 张'):'',
    /* 修图师/场地这类预约单没有"交付"字段：约定时间就是交付时间、要求备注就是修图要求，
       不这么映射的话这两条会永远显示【待填】，而这两件事在单据里明明已经写过了 */
    ddate:String(isS?(d0.agreedDate||''):(date||'')),
    retouch:String(isS?(d0.retouch||''):(rec.requirement||'')),
    head1:wig.head1?(wig.head1+' cm'):'', head2:wig.head2?(wig.head2+' cm'):'',
    faceLen:wig.faceLen?(wig.faceLen+' cm'):'', faceWidth:wig.faceWidth?(wig.faceWidth+' cm'):'',
    _fee:fee, _dep:dep, _v:v
  };
}
/** 单据里没有的占位符（时长、是否含美瞳…）先在「条款模板 → 补充参数」里填一次，全站共用 */
function paramVal(k){
  var list=termsParamRaw(), lab=CTX_LABEL[k]||'';
  for(var i=0;i<list.length;i++){
    var p=list[i]||{}, a=String(p.a||'').trim();
    if(a&&(a===k||(lab&&a===lab))) return String(p.b||'').trim();
  }
  return '';
}
/** 填不出来就明说「【待填：中文名】」—— 宁可显眼，也不许让用户以为已经约定好了 */
function fillCtx(text,ctx){
  return String(text==null?'':text).replace(/\{(\w+)\}/g,function(m,k){
    if(k.charAt(0)==='_') return '【待填：'+k+'】';
    var val=(ctx&&ctx[k]!=null&&ctx[k]!=='')?String(ctx[k]):'';
    if(!val) val=paramVal(k);
    return val?val:('【待填：'+(CTX_LABEL[k]||k)+'】');
  });
}
function defaultClauses(preset,ctx){
  var lib=clauseLib(preset), out={};
  lib.forEach(function(c){ out[c.k]=c.on?fillCtx(c.def,ctx||{}):''; });
  return out;
}
/** 留档状态的唯一口径：none 没铺过 / draft 铺了没留档 / sent 已留档已发出 / ok 对方已确认 */
function termsStateOf(t){
  if(!t||!t.preset) return 'none';
  if(t.confirmed) return 'ok';
  if(t.snap) return 'sent';
  return 'draft';
}
function termsStateText(t){
  var st=termsStateOf(t);
  if(st==='ok') return '已确认'+(t&&t.confirmedAt?('（'+t.confirmedAt+'）'):'');
  if(st==='sent') return '已留档'+(t&&t.sentAt?('· 发出 '+t.sentAt):'');
  if(st==='draft') return '编辑中，还没留档';
  return '还没有条款';
}
function termsBadge(refType,refId){
  var t=termsRead(refType,refId), st=termsStateOf(t);
  if(st==='ok') return badge('条款已确认','b-ok');
  if(st==='sent') return badge('条款已留档','b-info');
  if(st==='draft') return badge('条款编辑中','b-warn');
  return '';
}
/** 文本为空的条款直接不出现：一个字段一个动作，不用先找开关再清空 */
function buildTermsText(t,ctx){
  ctx=ctx||{};
  var lib=clauseLib(t.preset);
  var L=['【'+(TERMS_TITLE[t.preset]||'合作确认')+'】'];
  var head=[];
  if(ctx.who) head.push('对方：'+ctx.who);
  head.push('我方：'+(String(ctx.me||'').trim()||'（未填圈名）'));
  L.push(head.join('　'));
  if(ctx.proj||ctx.role) L.push('项目：'+(ctx.proj||'未关联项目')+(ctx.role?(' · 角色：'+ctx.role):''));
  var base=[];
  if(ctx.date) base.push('时间：'+ctx.date+(ctx.time?(' '+ctx.time):''));
  if(ctx.place) base.push('地点：'+ctx.place);
  if(ctx.method) base.push('方式：'+ctx.method);
  if(ctx._fee!==null&&ctx._fee!==undefined) base.push('总价：'+ctx.fee);
  if(base.length) L.push(base.join('　'));
  L.push('————————————');
  var items=[];
  lib.forEach(function(cl){
    var txt=String((t.c&&t.c[cl.k])||'').trim();
    if(!txt) return;
    /* 条款自带的序号（①②…）只留内容。量词写成单个 \s 而不是星号：构建门禁靠数注释开闭标记来配平，
       正则里凑出"星号紧跟斜杠"会被当成一个注释收尾 —— 代码没错但门禁会红。序号后面恰好只有一个空格。 */
    items.push(String(cl.l).replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s/,'')+'：'+fillCtx(txt,ctx));
  });
  if(items.length){
    L.push('');
    L.push('约定条款');
    items.forEach(function(s,i){ L.push((i+1)+'. '+s); });
  }
  if(String(t.extra||'').trim()){
    L.push('');
    L.push('补充约定');
    String(t.extra).split(/\r?\n/).forEach(function(s){ if(s.trim()) L.push('· '+s.trim()); });
  }
  var v=depositVerdict(ctx._fee,ctx._dep);
  if(v&&!v.ok){
    L.push('');
    L.push('定金说明：本约定定金占总价 '+v.ratio+'%，其中 '+money(v.cap)+' 元为定金、'+money(v.over)+
      ' 元为预付款（《民法典》第 586 条：定金不得超过主合同标的额的 20%，超出部分不产生定金效力）。');
  }
  L.push('');
  L.push('请回复「确认」以锁定档期，回复后即视为双方认可上述约定。');
  if(t.sentAt) L.push('发出日期：'+t.sentAt);
  if(t.confirmedAt) L.push('对方确认：'+t.confirmedAt);
  L.push('—— '+(String(t.signAs||'').trim()||String(ctx.me||'').trim()||'CosPlan')+' · '+todayISO()+' · 本确认文本仅作双方约定备忘，以聊天记录与转账凭证为准');
  return L.join('\n');
}
/** 生成（或读取）这张单据当前的条款文本。init=true 才落库首次铺的默认条款 ——
    渲染路径绝对不许传 true（读一下就把数据改了）。 */
function termsTextFor(refType,refId,init){
  var rec=get(refCollOf(refType),refId);
  if(!rec) return '';
  var ctx=termsCtx(refType,refId);
  var t=termsOf(refType,refId);
  if(!t.preset) t.preset=refType==='session'?'摄影师':(rec.type||'其他');
  if(!Object.keys(t.c).length){
    t.c=defaultClauses(t.preset,ctx);
    if(init){ t.updated_at=nowStamp(); save(); }
  }
  return buildTermsText(t,ctx);
}
/** 留档 = 把此刻生成的文本冻结进单据（t.snap）。
    为什么必须冻结：留档之后如果再改预约单的时间/金额，重新生成的文本会跟着变，
    "当初发给对方那一份"就查无实据了 —— 留档的价值正在于有一份不再动的底。 */
function termsArchiveNow(refType,refId){
  var t=termsOf(refType,refId); if(!t) return false;
  var txt=termsTextFor(refType,refId,true);
  t.snap=txt; t.snapAt=nowStamp();
  if(!t.sentAt) t.sentAt=todayISO();
  t.updated_at=nowStamp();
  save();
  return true;
}
function archiveTerms(refType,refId){
  if(writeLocked()){ saveBlocked(); return; }
  if(!termsArchiveNow(refType,refId)) return;
  render(); termsSheet(refType,refId);
  toast('已留档：这份文本不会再随单据字段变动');
}
function confirmTerms(refType,refId){
  if(writeLocked()){ saveBlocked(); return; }
  var t=termsOf(refType,refId); if(!t) return;
  var made=!t.snap;
  if(made) termsArchiveNow(refType,refId);   /* 没留过档：先补一份，"确认"才有东西可指 */
  t.confirmed=true; t.confirmedAt=todayISO(); t.updated_at=nowStamp();
  save(); render(); termsSheet(refType,refId);
  toast(made?'已留档并记下对方确认':'已记下对方确认（留档文本保持原样）');
}
/** 微合同图片挂给谁：图片库的 owner 口径里没有"拍摄单"，所以拍摄单的图挂到它所属项目上 */
function termsImgOwner(refType,refId){
  if(refType==='session'){
    var s=get('sessions',refId);
    var pid=s?s.projectId:'';
    return (idOk(pid)&&get('projects',pid))?{coll:'projects',kind:'project',id:pid}:null;
  }
  return idOk(refId)?{coll:'appointments',kind:'appointment',id:refId}:null;
}
/** dataURL → Blob → 下载（与装包单 dlTextFile 同一条路，浏览器/WebView 都吃这一套） */
function dlImage(name,dataUrl){
  try{
    var parts=String(dataUrl||'').split(',');
    var bin=atob(parts[1]||''), arrB=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arrB[i]=bin.charCodeAt(i);
    var blob=new Blob([arrB],{type:'image/png'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },600);
    toast('已保存：'+name);
  }catch(e){ toast('这台设备的浏览器不让直接存文件；图已经在本机图片库里，看大图用系统截图或长按保存'); }
}
var TERMS_IMG_W=900, TERMS_IMG_MAXLINE=220;
function termsFont(g,size,weight){
  g.font=(weight?weight+' ':'')+size+'px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
}
/** 中文没有空格可断，逐字量宽；但 ASCII 串（日期、金额、网盘链接）要整段不许切断 ——
    先把文本切成"一个中文字"或"一串 ASCII"这样的单元，再按单元填行。
    不这么做的话 2026-10-20 会被切成 2 / 026-10-20，合同上看着就是错的。 */
function wrapCjk(g,text,maxW){
  var out=[], line='';
  /* 行首不许出现收尾标点（，。、；：？）：宁可让上一行超出几像素，也不把逗号顶到下一行开头 ——
     合同图上「，场地：…」这样起行，读起来像断句断错了。超出量最多一个全角标点，右白边 44px 装得下。 */
  var NO_HEAD=/^[，。、；：？！）】」』,.;:!?)\]]/;
  function unitAt(s,i){
    var c=s.charAt(i), ascii=/[0-9A-Za-z.:\-\/#%+&=_?]/.test(c);
    if(!ascii) return c;
    var j=i; while(j<s.length&&/[0-9A-Za-z.:\-\/#%+&=_?]/.test(s.charAt(j))) j++;
    return s.slice(i,j);
  }
  String(text==null?'':text).split('\n').forEach(function(para){
    line='';
    for(var i=0;i<para.length;){
      var u=unitAt(para,i); i+=u.length;
      /* "整段不许切断"有个例外：一段比行还宽的 ASCII（网盘链接）自己得再切，不然顶出右边界 */
      while(u&&g.measureText(u).width>maxW){
        var cut=u.length; while(cut>1&&g.measureText(u.slice(0,cut)).width>maxW) cut--;
        if(line){ out.push(line); line=''; }
        out.push(u.slice(0,cut)); u=u.slice(cut);
      }
      if(line&&g.measureText(line+u).width>maxW&&!NO_HEAD.test(u)){ out.push(line); line=u; }
      else line+=u;
    }
    out.push(line);
  });
  return out;
}
/** 确认文本 → 一张竖版 PNG（900px 宽、按行数自动加高） */
function termsCanvas(txt,title,sub){
  var cv=document.createElement('canvas');
  var g=cv.getContext&&cv.getContext('2d');
  if(!g){ toast('这个浏览器环境画不出图片'); return null; }
  var W=TERMS_IMG_W,P=44,headH=118,footH=76,lh=30,fs=19;
  /* 图上的条款编号靠正文自己，emoji 装饰先去掉：Canvas 不保证有 emoji 字体，画成豆腐块更难看 */
  var body=String(txt||'').split('\n');
  if(/^【/.test(body[0]||'')) body.shift();
  termsFont(g,fs);
  var lines=wrapCjk(g,body.join('\n'),W-P*2);
  if(lines.length>TERMS_IMG_MAXLINE){ toast('条款太长（'+lines.length+' 行），先用「复制文本」发过去'); return null; }
  cv.width=W; cv.height=headH+lines.length*lh+footH;
  g=cv.getContext('2d');                                 /* 改过尺寸会清掉画笔状态，重新设 */
  g.fillStyle='#ffffff'; g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle='#6340e8'; g.fillRect(0,0,cv.width,headH);  /* --accent-text：白字压它 5.9:1 */
  termsFont(g,27,'700'); g.fillStyle='#ffffff';
  g.fillText(String(title||'合作确认'),P,54);
  termsFont(g,16,'400'); g.fillStyle='rgba(255,255,255,.9)';
  g.fillText(String(sub||''),P,86);
  termsFont(g,fs); g.fillStyle='#20222c';
  for(var i=0;i<lines.length;i++) g.fillText(lines[i],P,headH+lh-8+i*lh);
  var fy=cv.height-footH+22;
  g.strokeStyle='#e6e8f0'; g.lineWidth=1;
  g.beginPath(); g.moveTo(P,fy-16); g.lineTo(cv.width-P,fy-16); g.stroke();
  termsFont(g,15); g.fillStyle='#565c6e';
  g.fillText('由 CosPlan 生成 · '+todayISO()+' · 本图仅作约定备忘，以聊天记录与转账凭证为准',P,fy+6);
  try{ return {url:cv.toDataURL('image/png'),w:cv.width,h:cv.height}; }
  catch(e){ toast('这个浏览器不让把画布导成图片；改用「复制文本」'); return null; }
}
function termsImgSub(refType,refId){
  var ctx=termsCtx(refType,refId)||{};
  var s=[];
  if(ctx.who) s.push('对方 '+(String(ctx.who).slice(0,14)));
  s.push('我方 '+(String(ctx.me||'').trim()||'未填圈名'));
  if(ctx.date) s.push(ctx.date+(ctx.time?(' '+ctx.time):''));
  if(ctx._fee!==null&&ctx._fee!==undefined) s.push(ctx.fee);
  return s.join('　');
}
/** 把这张单据上一次的微合同从图片库与图片位里摘掉：重新出图不该在库里堆份数。
    先用台账认回它挂在谁身上（拍摄单的图是按项目存的），再删库、再从那一家的图片位里剔掉这一格。 */
function termsImgDrop(refType,refId){
  var t=termsRead(refType,refId);
  if(!t||!t.img) return;
  var old=t.img; t.img='';
  if(!HAS_IDB||!imgIdOk(old)) return;
  var hit=imgOwnerOfId(old);
  if(hit){
    var coll=imgCollOf(hit.kind), o=coll?get(coll,hit.id):null;
    if(o){ o.imgs=arr(o.imgs).filter(function(x){ return x!==old; }); put(coll,o); }
  }
  imgDel(old);
}
/** 一键出图：画 PNG → 存本机图片库并把指针记在**这张单据的** terms 上 → 顺带触发一次下载 */
function termsImage(refType,refId){
  if(writeLocked()){ saveBlocked(); return; }
  var t=termsOf(refType,refId); if(!t) return;
  var txt=t.snap||termsTextFor(refType,refId,true);
  var title=TERMS_TITLE[t.preset]||'合作确认';
  var made=termsCanvas(txt,title,termsImgSub(refType,refId));
  if(!made) return;
  var nm='微合同-'+title+'-'+todayISO()+'.png';
  var own=termsImgOwner(refType,refId);
  if(!own){ termsImgDrop(refType,refId); dlImage(nm,made.url); return; }
  termsImgDrop(refType,refId);
  var rec={id:uid('img'),owner:own.kind,ownerId:own.id,name:nm,mime:'image/png',
    w:made.w,h:made.h,created_at:nowStamp(),data:made.url,thumb:''};
  imgPut(rec,function(){
    compressToDataURL(made.url,220,0.8,function(th){
      rec.thumb=th||made.url;
      imgPut(rec,function(okf){
        if(okf===false){ dlImage(nm,made.url); toast('图片库存不进去，改成了直接下载'); return; }
        IMG.mem[rec.id]=rec;
        var o=get(own.coll,own.id);
        if(o){ o.imgs=arr(o.imgs).concat([rec.id]); put(own.coll,o); }

      });
    });

}

/** 这一单的条款编辑：条款类型跟着单据类型走，不给下拉切（免得开出"约妆单配约拍条款"） */
function formTerms(refType,refId){

  var fields=lib.map(function(cl){
    return {k:'c.'+cl.k,l:cl.l,t:'area',rows:3,ph:'留空 = 本条不出现在确认文本里'};

  var tip=ctx._v?ctx._v.msg:'未填总价或定金，暂不做定金 20% 校验。';
  openForm({

      '<div class="btn-row" style="margin-top:6px">'+

        '<button class="btn gray" id="fReset">重铺默认条款</button></div>',
    onSave:function(V){

      lib.forEach(function(cl){ c[cl.k]=String(V['c.'+cl.k]||'').trim(); });
      t.preset=refType==='session'?'摄影师':(rec.type||t.preset);
      t.c=c;
      t.extra=String(V.extra||'').trim();
      t.signAs=String(V.signAs||'').trim();
      t.sentAt=V.sentAt||'';
      t.confirmedAt=V.confirmedAt||'';

/* =========================================================
   v1.5.9 ④：意向池（想出但还没立项的角色）
   ========================================================= */
/** 意向怎么显示：有角色记录就用角色口径，没有（含角色已被删）就用记下来的自由文本 ——
    角色被删时不能显示成"（角色已删）"把仍知道的 charName 吞掉，那一格由行上的徽章单独说。 */
function intentLabel(it){
  if(!it) return '';
  var c=it.characterId?get('characters',it.characterId):null;
  var w=(c&&c.workId)?get('works',c.workId):null;
  var nm=(c?String(c.name||'').trim():'')||String(it.charName||'').trim();
  var wk=(w?String(w.name||'').trim():'')||String(it.workName||'').trim();
  return (wk?wk+' · ':'')+(nm||'未命名意向');
}
/** 与 findOrCreateWork 同一口径：先按（作品 + 名字）认领，认不到才新建 —— 否则同名角色会越建越多。
    note 只在新建时写：认领到的角色可能已经有设定，不能被一条意向的理由覆盖掉。 */
function findOrCreateChar(charName,workId,note){
  charName=String(charName||'').trim(); if(!charName) return null;
  for(var i=0;i<DB.characters.length;i++){
    var c=DB.characters[i];
    if(c&&String(c.name||'').trim()===charName&&(c.workId||'')===(workId||'')) return c;
  }
  var nc={id:uid('c'),workId:workId||'',name:charName,note:String(note||'').slice(0,200),updated_at:nowStamp()};
  DB.characters.push(nc); return nc;
}
/** 池子的唯一排序口径：有日期的按日期，其余按"有多想出"，再按录入先后 */
function intentSort(list){
  var w={'很想要':0,'可出可不出':1,'先收藏':2};
  return arr(list).slice().sort(function(a,b){
    var x=String(a.when||''), y=String(b.when||'');
    if(x&&y&&x!==y) return x<y?-1:1;
    if(!!x!==!!y) return x?-1:1;
    var wa=w[a.want||'很想要'], wb=w[b.want||'很想要'];
    if(wa!==wb) return wa-wb;
    return String(a.created_at||'')<String(b.created_at||'')?-1:1;
  });
}
function intentInPool(){
  return intentSort(arr(DB.intents).filter(function(i){ return (i.status||'在池子里')==='在池子里'; }));
}
function intentRow(i){
  var linked=(i.status==='已进流程'&&i.projectId&&get('projects',i.projectId));
  var gone=(i.status==='已进流程'&&i.projectId&&!get('projects',i.projectId));
  var bits=[];
  /* listRow 的 d 吃 HTML（同 t），而意向的文字全部可能来自导入的备份 —— 必须逐段 esc，
     idSanity 只管 id 形状，不管正文里塞的标签。 */
  if(i.when) bits.push('想出 '+esc(i.when)+(isPast(i.when)?'（已过）':''));
  if(i.budget!==null&&i.budget!==undefined&&i.budget!=='') bits.push('预算 '+money(i.budget)+' 元');
  var why0=String(i.why||'').split('\n')[0].trim();
  if(why0) bits.push(esc(why0.slice(0,26)));
  return listRow({
    t:`${esc(intentLabel(i))} ${badge(i.want||'很想要',i.want==='先收藏'?'':(i.want==='可出可不出'?'b-info':'b-pink'))} ${(i.characterId&&!charAlive(i.characterId))?badge('角色已删','b-warn'):''}`,
    d:bits.join(' · ')||'还没排时间，也没填预算',

/** 进流程 = 建/找角色 → 打开新建项目表单（项目仍走 formProject，重拍序号与装备继承不分叉） */
function intentGo(iid){
  var it=get('intents',iid); if(!it){ toast('这条意向已经删了'); return; }
  if(writeLocked()){ saveBlocked(); return; }
  if(it.characterId&&charAlive(it.characterId)){
    go('projects',{tab:'projects'});
    formProject(null,{characterId:it.characterId,fromIntent:iid});
    return;
  }
  var nm=String(it.charName||'').trim();
  if(!nm){ toast('这条意向还没有角色名'); formIntent(iid); return; }
  confirmBox('进流程','将按（作品 + 角色名）认领角色「'+intentLabel(it)+'」，库里没有同名的就新建一个，然后开一张出装项目。'+
    '项目那一步如果取消，角色仍留在角色库里，下次点「进流程」直接用它。',function(){
    var w=String(it.workName||'').trim()?findOrCreateWork(it.workName,'其他'):null;
    var before=DB.characters.length;
    var c=findOrCreateChar(nm,w?w.id:'',it.why);
    if(!c){ toast('角色名是空的'); return; }
    var fresh=DB.characters.length>before;
    it.characterId=c.id;
    if(w) it.workId=w.id;
    it.updated_at=nowStamp();
    put('intents',it); save();
    go('projects',{tab:'projects'});
    formProject(null,{characterId:c.id,fromIntent:iid});
    toast((fresh?'已新建角色：':'已认领库里已有角色：')+(w?(w.name+' · '):'')+nm);
  },'建角色并开项目');
}
function intentPromote(iid,pid){

/* =========================================================
   v1.5 ④：出装复盘报告（首次归档自动弹 + 项目页常驻入口，实时计算）
   ========================================================= */
function projectReport(p){
  var st=projectStats(p);
  /* 利用率口径（v1.5.0 定，v1.5.5 P3-③ 归置）：清单里被"勾选过"的件才算真的上场——清单本身会自动包含全部在手件，光在清单里不算用上。不要另起第二份算法 */
  var used={};
  st.ss.forEach(function(s){ arr(s.checklist).forEach(function(c){ if(c&&c.itemId&&c.checked) used[c.itemId]=1; }); });
  var live=st.its.filter(isLiveItem);
  var usedLive=live.filter(function(i){ return used[i.id]; });
  var unused=live.filter(function(i){ return !used[i.id]; });
  var dl=[];
  st.ss.forEach(function(s){ delivsOf(s.id).forEach(function(d){ dl.push(d); }); });
  var od=dl.filter(function(d){ return d.agreedDate&&isPast(d.agreedDate)&&d.status!=='已返图'; }).length;
  var notBack=dl.filter(function(d){ return d.status!=='已返图'; }).length;
  var doneN=st.ss.filter(function(s){ return s.status==='已完成'; }).length;
  var mod=live.filter(function(i){ return i.status==='修改中'; }).length;
  var cancel=st.ss.filter(function(s){ return ['已取消','已改期'].indexOf(s.status)>=0; }).length;
  var b=num(p.budget), over=b>0&&st.spent>b?st.spent-b:0;
  var wish=live.filter(function(i){ return i.status==='愿望单/购物车'; }).length;
  var first=st.ss.length?st.ss[st.ss.length-1].date:'', last=st.ss.length?st.ss[0].date:'';
  var L=[];
  L.push('💰 总成本 '+money(st.spent)+' 元'+(b>0?('（预算 '+money(b)+'，'+(over?('超支 '+money(over)+' 元）'):('还剩 '+money(b-st.spent)+' 元）'))):'（未设预算）'));
  if(st.back) L.push('💵 出物回血 '+money(st.back)+' 元，净成本 '+money(st.spent-st.back)+' 元');
  L.push('🎯 装备利用率：上场 '+usedLive.length+'/'+live.length+' 件（'+(live.length?Math.round(usedLive.length/live.length*100):0)+'%）'+(unused.length?('；没上过场：'+unused.map(function(i){return i.name;}).join('、')):''));
  L.push('🎬 拍摄完成 '+doneN+'/'+st.ss.length+' 场'+((first&&last)?('（'+first+' ~ '+last+'）'):''));
  if(dl.length) L.push('📦 交付 '+dl.length+' 条，逾期 '+od+' 条，未返图 '+notBack+' 条');
  var bad=[];
  if(mod) bad.push(mod+' 件装备还停在「修改中」');
  if(cancel) bad.push(cancel+' 场拍摄取消/改期');
  if(over) bad.push('超支 '+money(over)+' 元');
  L.push('⚠ 翻车记录：'+(bad.length?bad.join('；'):'这次没有明显翻车，漂亮！'));
  var tips=[];
  if(unused.length) tips.push(unused.length+' 件装备没上过场：记下原因（用不上/忘了带），下次立项前先翻台账别重复买');
  if(wish) tips.push('愿望单里还挂着 '+wish+' 件没下单：这套收尾了，确定还要不要');
  if(od) tips.push('有 '+od+' 条交付逾期过：下次把约定日期放宽一点，或拍完当天就催');
  if(st.gone) tips.push('这套已处置 '+st.gone+' 件：去向（卖了/送了/报废）都记了吗');
  if(!tips.length) tips.push('全流程顺畅。这次的妆造/摄影联系方式都在联系人页，下次直接约');
  L.push('📝 下次改进：\n· '+tips.join('\n· '));
  return {text:'📒 出装复盘 · '+(p.name||'')+'\n'+L.join('\n')+'\n—— 来自 CosPlan', unused:unused, usedN:usedLive.length, liveN:live.length};
}

/* =========================================================
   v1.5.8 P2：含图片的完整备份 / 恢复
   台账 JSON 只有几十 KB，但对这个软件来说图才是资产：立绘参考、妆面图、实拍效果图。
   换机或清缓存后只回来一本台账、图库全丢，是最伤的一种丢法。
   做法：把本机图片库（IndexedDB）整个打进同一帧 JSON。仍然纯本机——Blob 下载 + FileReader 读入，
   一次网络请求都不发（qa/apply158.js 有一道全文件网络 API 扫描）。
   ========================================================= */
var IMG_MAX_BYTES=6*1024*1024;   /* 单张记录上限：900px JPEG 压完远小于此，超了就是被人造出来的 */
var IMG_MAX_N=4000;              /* 一次导入的张数上限 */
function kbText(kb){ kb=num(kb); if(kb>=1024) return (Math.round(kb/102.4)/10)+' MB'; return Math.round(kb)+' KB'; }
/** 遍历图片库全部记录（备份用；缩略图一起带上，恢复后不用重压一遍） */
function imgWalk(cb){
  if(!HAS_IDB){ cb(null); return; }
  imgOpen(function(okf){
    if(okf===false||!IMG.db){ cb(null); return; }
    try{
      var req=IMG.db.transaction('imgs').objectStore('imgs').getAll();
      req.onsuccess=function(){ cb(req.result||[]); };
      req.onerror=function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
/** v1.5.9：图片 dataURI 的放行口径。
    1.5.8 只认 JPEG，因为那时唯一的 producing 路径是压缩管线；本版「微合同」画的是 PNG（文字图，
    压成 JPEG 边缘会糊），所以白名单加一条 image/png —— 但"只认图片"这条没放宽：
    data:image/svg+xml 与 data:text/html 能直接在本机页面里执行脚本，照旧拒。 */
function imgDataOk(s){
  return typeof s==='string' && (s.indexOf('data:image/jpeg;base64,')===0 || s.indexOf('data:image/png;base64,')===0);
}
/** 外来图片记录逐条体检：id 形状、owner 枚举、只认本机自己存进去的图片 dataURL、限体积。 */
function imgRecOk(r){
  if(!r||typeof r!=='object') return false;
  if(!r.owner&&r.itemId){ r.owner='item'; r.ownerId=r.itemId; }   /* 1.5.4 及之前的老形状 */
  if(!imgIdOk(r.id)) return false;
  if(IMG_OWNERS.indexOf(r.owner)<0) return false;
  if(r.ownerId&&!idOk(String(r.ownerId))) return false;
  /* 体积上限这条必须在：imgDataOk 只管前缀，逐条体检的闸口在这里（1.5.8 原来写在同一行里） */
  if(!imgDataOk(r.data)||r.data.length>IMG_MAX_BYTES) return false;
  if(r.thumb&&typeof r.thumb==='string'&&(!imgDataOk(r.thumb)||r.thumb.length>IMG_MAX_BYTES)) r.thumb='';
  if(typeof r.name==='string'&&r.name.length>200) r.name=r.name.slice(0,200);
  r.w=num(r.w); r.h=num(r.h);
  return true;
}

function exportFull(mode){
  imgWalk(function(recs){
    if(!recs){ toast('图片库读不出来'); return; }
    if(!recs.length){ toast('图片库是空的'); return; }
    closeModal();
    toast('正在打包 '+recs.length+' 张图片…');
    var out=[], i=0, orphan=0;
    function finishFull(){
      var pack={ meta:{app:'CosPlan',ver:APP.ver,schema:APP.schema,exported_at:nowStamp(),
        device:navigator.userAgent.slice(0,80), withImages:true, imgMode:(mode==='slim'?'slim':'keep'), imgCount:out.length},
        data:DB, images:out };
      var txt=JSON.stringify(pack);
      dlTextFile('cosplan-full-backup-'+todayISO()+'.json','application/json',txt);
      toast('已导出完整备份：'+out.length+' 张图 · 约 '+kbText(Math.round(txt.length/1024))+
        (orphan?('（'+orphan+' 张无人认领的孤儿图没打包，可在「本机图片库」清空）'):''));
    }
    /* 一张一张压，压完再走下一张：一次性把几百张丢给 canvas 会把主线程堵死 */
    function step(){
      if(i>=recs.length){ finishFull(); return; }
      var rr=Object.assign({},recs[i++]); delete rr.itemId;   /* owner/ownerId 才是现行口径 */
      if(IMG_OWNERS.indexOf(rr.owner)<0){                     /* 1.5.7 及以前 owner 是空的：按台账认回来 */
        var hit=imgOwnerOfId(rr.id);
        if(hit){ rr.owner=hit.kind; rr.ownerId=hit.id; }
        else{ orphan++; setTimeout(step,0); return; }
      }
      if(mode==='slim'&&rr.data&&rr.data.indexOf('data:image/jpeg;base64,')===0){
        try{
          compressToDataURL(rr.data,640,0.62,function(d2,w2,h2){
            compressToDataURL(d2||rr.data,200,0.7,function(th){
              if(d2){ rr.data=d2; if(w2) rr.w=w2; if(h2) rr.h=h2; }
              rr.thumb=th||''; out.push(rr); setTimeout(step,0);
            });
          });
        }catch(e){ out.push(rr); setTimeout(step,0); }
      }else{ out.push(rr); setTimeout(step,0); }
    }
    step();
  });
}
/** 把备份里的图片写回本机图片库；replace=true 先清库（覆盖导入用）。不合格的一张都不落库 */
function ingestImages(list,replace,done){
  var all=arr(list), imgs=[], bad=0;
  all.forEach(function(r){ if(imgRecOk(r)&&imgs.length<IMG_MAX_N) imgs.push(r); else bad++; });
  function fin(n){ IMG.mem={}; if(done) done({n:n,bad:bad}); }
  if(!HAS_IDB){ toast('这个环境打不开图片库：图片部分跳过了'); fin(0); return; }
  imgOpen(function(okf){
    if(okf===false||!IMG.db){ toast('图片库打开失败：图片部分跳过了'); fin(0); return; }
    function writeAll(){
      try{
        var tx=IMG.db.transaction('imgs','readwrite'), st=tx.objectStore('imgs');
        imgs.forEach(function(r){ try{ st.put(r); }catch(e){} });
        tx.oncomplete=function(){ fin(imgs.length); };
        tx.onerror=function(){ fin(0); };
      }catch(e){ fin(0); }
    }
    if(replace){
      try{
        var t0=IMG.db.transaction('imgs','readwrite');
        t0.objectStore('imgs').clear();
        t0.oncomplete=function(){ writeAll(); };
        t0.onerror=function(){ writeAll(); };
      }catch(e){ writeAll(); }
    }else writeAll();
  });
}

var IMPORT_MAX_MB=160;   /* 护栏：完整备份上百 MB 时先给一句话，而不是让浏览器假死在 readAsText 上 */
function readImport(inp){

                         :('导入前会先清掉本机图片库现在的 '+cur.n+' 张（约 '+kbText(cur.kb)+'）。')))
        : '。注意：这份备份<b>不含图片</b>，图片只在本机图片库里（连图一起备份用「导出完整备份」）';
      confirmBox(S.mergeMode?'合并导入':'覆盖导入',
        /* 1.1.2 修复：合并模式末尾多一个无配对的右括号；覆盖模式则少了右括号 */
        (S.mergeMode?'同 id 的以文件为准，其余追加（':'将完全替换本机数据（导出的这份含：')+cnt+'）'+tail
          +'。导入时所有 id 会按应用生成格式校验，不合规的会自动换号并改写引用',
      function(){ doImport(data,S.mergeMode,imgs); },'继续');
    });

function doImport(data,merge,images){
  var imgs=arr(images);
  function land(base){
    if(SAVE_BAD.at) base+=' · 但本机存储写入失败，见页面顶部红条';
    if(!imgs.length){ go('home',{tab:'home'}); toast(base); return; }
    toast(base+' · 正在写入 '+imgs.length+' 张图片…');
    ingestImages(imgs,!merge,function(r){
      go('home',{tab:'home'});
      toast('图片已恢复 '+((r&&r.n)||0)+' 张'+((r&&r.bad)?('（'+r.bad+' 条不合格，已跳过）'):''));
    });
  }
  if(!merge){
    DB=migrate(data);
    var fx0=Object.assign({},LAST_ID_FIX);
    save();
    land('导入完成'+(fx0.renamed||fx0.cleaned?('（id 校正：换号 '+fx0.renamed+'、断引用清理 '+fx0.cleaned+'）'):''));
    return;
  }
  var fresh=migrate(data);
  var fix=Object.assign({},LAST_ID_FIX);
  ['works','characters','projects','items','contacts','locations','sessions','appointments','deliverables','publications','expenses','todos','intents'].forEach(function(k){
    var map={};
    DB[k].forEach(function(x){ map[x.id]=x; });
    fresh[k].forEach(function(x){ map[x.id]=x; });
    DB[k]=Object.keys(map).map(function(id){ return map[id]; });
  });
  save();
  land('合并导入完成'+(fix.renamed||fix.cleaned?('（id 校正：换号 '+fix.renamed+'、断引用清理 '+fix.cleaned+'）'):''));
}

/* =========================================================
   v1.2：滑动手势引擎 + 跨模块联动
   ========================================================= */
/** 一次「可撤销的改动」：先快照整库，改完落盘重绘。
    撤销走整库回滚，所以顺手生成的自动流水、自动转阶段、自动补日期会一起回到原样。 */
function applyAction(msg,mut,opt){
  opt=opt||{};
  if(writeLocked()){ saveBlocked(); return; }   /* v1.5.8 P2：写盘失败时滑动/推格这类动作先不执行 */
  var snap=JSON.stringify(DB);
  mut();
  save(); render();
  var seq=WRITE_SEQ;
  if(opt.plain){ toast(msg); return; }
  toastUndo(msg,function(){ DB=JSON.parse(snap); save(); render(); toast('已撤销'); },seq);
}

function itemSwappable(i){ return !!(i&&(ITEM_SWIPE_NEXT[i.status]||ITEM_SWIPE_PREV[i.status])); }
/** 线性流程里前后一格；不在流程内的（已取消 / 爽约 / 已改期 需要填原因）返回 null，也就滑不动 */
function flowStep(list,st,dir){
  var i=list.indexOf(st); if(i<0) return null;
  var j=i+dir; return (j<0||j>=list.length)?null:list[j];

/* ---------- 指针事件：一次只跟一根手指，不设定时器 ---------- */
var SW_LIMIT=88, SW_MIN=46, SW_TAB_MIN=64;
var swDrag=null, swSwallow=0;
/** 起点落在按钮/链接/输入框上就不算滑动：那些是「点」的领地 */
function swSkip(t,host){
  var x=t&&t.closest&&t.closest('[onclick],input,button,select,textarea,a,label');
  return !!(x&&x!==host);
}
/** v1.5.5：主导航滑动的轻量豁免——只避开真实控件与横向滑动槽/行滑槽，
    普通卡片与列表行上的滑动也算"空白处"（旧行为几乎吞掉整页滑动） */
function swSkipLite(t){
  /* v1.5.6：[data-sw] 不在这里豁免 —— 滑槽行"这一格到底有没有动作"由 swDown 判，
     没有动作的行（如项目阶段已在头/尾）应该让位给切页，而不是整段手势作废 */
  var x=t&&t.closest?t.closest('input,button,select,textarea,a,label,.pill-row,.cmp-wrap'):null;
  return !!x;
}
function swClamp(v){ return Math.max(-SW_LIMIT,Math.min(SW_LIMIT,v)); }
function initSwipe(){
  /* v1.5.6：挂到 document。1.5.5 挂 #app，但底部标签栏 #tabbar、状态栏占位 .status-fill
     都在 #app 外面 —— 手机上拇指最常起手的地方恰好被漏掉（这就是"滑空白处还是不切页"剩下那半条根因）。
     弹窗、撤销通知、滑动指示条本身一律不接。 */
  if(document._swInit) return;
  document._swInit=true;
  document.addEventListener('pointerdown',swDown);
  document.addEventListener('pointermove',swMove);
  document.addEventListener('pointerup',swUp);
  document.addEventListener('pointercancel',swCancel);
  /* 锁定之后不让页面顺手竖滚（必须 passive:false 才拦得住） */
  document.addEventListener('touchmove',function(e){ if(swDrag&&swDrag.locked&&e.cancelable) e.preventDefault(); },{passive:false});
  /* 滑动提交后浏览器还会补一次 click，短窗口内吞掉，免得顺手点开详情页。
     撤销按钮就在手指底下，必须放行，否则刚滑完立刻点「撤销」会被一起吞掉。
     v1.3：电脑端拖动滑动槽之后补的那一次 click 也要吞掉（否则拖一下就把标签选了）。 */
  document.addEventListener('click',function(e){
    var now=Date.now();
    var hot=(swSwallow&&now-swSwallow<=500)||(lpSwallow&&now-lpSwallow<=320)||(dragSwallow&&now-dragSwallow<=350);
    if(!hot) return;
    if(e.target.closest&&e.target.closest('#toast')) return;
    /* v1.3.1（P2-3）：弹窗里的点击一律放行 —— 长按弹窗刚出来时点「下一步」被这条吞掉过 */
    if(e.target.closest&&e.target.closest('#modal')) return;
    swSwallow=0; lpSwallow=0; dragSwallow=0; e.preventDefault(); e.stopPropagation();
  },true);
}
function swDown(e){
  if(e.pointerType==='mouse'||!settings().swipe) return;
  if(swDrag) swCancel();
  var t=e.target;
  if(t&&t.closest&&(t.closest('#modal')||t.closest('#toast')||t.closest('#swTab'))) return;   /* 撤销通知的上滑划走与弹窗内滑动归它们自己 */
  if(swSkipLite(t)) return;
  var host=t.closest?t.closest('[data-sw]'):null;
  if(host){
    var steps=null;
    if(!swSkip(e.target,host)){
      var kv=String(host.getAttribute('data-sw')).split(':');
      steps=swStepsFor(kv[0],kv.slice(1).join(':'));
    }
    if(steps){
      swDrag={mode:'row',host:host,steps:steps,x0:e.clientX,y0:e.clientY,locked:false,action:null,side:null,pid:e.pointerId};
    }else if(tabTrackFor()){
      /* v1.5.6：这一行没有可滑的动作（或起点是行内可点小元素）→ 让位给切页，别整段作废 */
      swDrag={mode:'tab',x0:e.clientX,y0:e.clientY,locked:false,action:null,side:null,pid:e.pointerId};
    }else return;
  }else if(tabTrackFor()){
    swDrag={mode:'tab',x0:e.clientX,y0:e.clientY,locked:false,action:null,side:null,pid:e.pointerId};
  }else return;
  try{ if(e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId); }catch(_){}
}
function swMove(e){
  var d=swDrag; if(!d||e.pointerId!==d.pid) return;
  var dx=e.clientX-d.x0, dy=e.clientY-d.y0;
  if(!d.locked){
    if(Math.abs(dx)<8&&Math.abs(dy)<8) return;
    if(Math.abs(dy)>Math.abs(dx)*1.4){ swCancel(); return; }   /* 更像上下滚动：手势让路 */
    d.side=dx>0?'left':'right';
    d.action=d.mode==='row'?(dx>0?d.steps.l:d.steps.r):tabTarget(dx);
    if(!d.action){ swCancel(); return; }
    d.locked=true;
    if(d.mode==='row'){
      d.host.classList.add(d.side==='left'?'sw-l':'sw-r');
      var p=d.host.querySelector('.swpanel.'+d.side);
      d.txt=p.querySelector('b'); d.lab=p.querySelector('.swlab'); d.main=d.host.querySelector('.swmain');
      d.txt.textContent=d.action.t;
    }else showSwTab(d.action.t);
    return;
  }
  if(d.mode==='tab') return;
  var x=swClamp(dx);
  d.main.style.transform='translateX('+x+'px)';
  d.lab.style.opacity=String(Math.min(.16,Math.abs(x)/SW_LIMIT*.16));
}
function swUp(e){
  var d=swDrag; if(!d||e.pointerId!==d.pid) return;
  swDrag=null;
  var dx=e.clientX-d.x0;
  if(!d.locked||!d.action){ if(d.mode==='row') swReset(d); else hideSwTab(); return; }
  if(d.mode==='row'){
    swReset(d);
    if(Math.abs(dx)<SW_MIN) return;
    vibrate(12); swSwallow=Date.now();
    applyAction(d.action.msg,d.action.run);
    if(d.action.done) d.action.done();
  }else{
    hideSwTab();
    if(Math.abs(dx)<SW_TAB_MIN||(dx>0)!==(d.side==='left')) return;
    swSwallow=Date.now();
    d.action.apply(d.action.k); render(); toast('已切到「'+d.action.label+'」');
  }
}
function swCancel(){
  var d=swDrag; if(!d) return;
  swDrag=null;
  if(d.mode==='row') swReset(d); else hideSwTab();
}
function swReset(d){
  if(!d||!d.host) return;
  d.host.classList.remove('sw-l'); d.host.classList.remove('sw-r');
  var m=d.host.querySelector('.swmain'); if(m) m.style.transform='';
  var labs=d.host.querySelectorAll('.swlab');
  for(var i=0;i<labs.length;i++) labs[i].style.opacity='';
}
/** 项目页左右滑翻分页：向右滑看前一个分页，向左滑看后一个 */
/** v1.5.4：左右滑切页轨道 —— 项目页=分页签；我的页(设置展开)=设置双面板；五个主页面=主导航 */
function tabTrackFor(){
  if(S.view==='project') return {list:PROJ_TABS,cur:S.projTab,apply:function(k){ S.projTab=k; }};
  if(S.view==='mine'&&S.mineSetOpen) return {list:SET_TABS,cur:S.setTab,apply:function(k){ S.setTab=k; }};
  if(['home','projects','assets','team','mine'].indexOf(S.view)>=0){
    var order=['home','projects','assets','team','mine'];
    var list=order.map(function(k){
      for(var j=0;j<TABS.length;j++) if(TABS[j].k===k) return [k,TABS[j].l];
      return [k,k];
    });
    return {list:list,cur:TAB_OF[S.view]||S.view,apply:function(k){ go(k,{tab:k}); }};
  }
  return null;
}
function tabTarget(dx){
  var track=tabTrackFor(); if(!track) return null;
  var i=-1;
  for(var j=0;j<track.list.length;j++) if(track.list[j][0]===track.cur) i=j;
  if(i<0) return null;
  var k=dx>0?i-1:i+1;
  if(k<0||k>=track.list.length) return null;
  return { k:track.list[k][0], label:track.list[k][1], t:dx>0?('‹ '+track.list[k][1]):(track.list[k][1]+' ›'), apply:track.apply };
}
function showSwTab(txt){ var el=document.getElementById('swTab'); if(!el) return; el.textContent=txt; el.style.display='block'; }
function hideSwTab(){ var el=document.getElementById('swTab'); if(el) el.style.display='none'; }
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(_){} }
function swipeHintBox(){
  var st=settings(); if(!st.swipe||!st.hint) return '';
  if(!DB.items.some(itemSwappable)&&!DB.projects.length) return '';
  return `<div class="info-box" style="margin-bottom:12px">手机上<b>左滑推一格、右滑退一格</b>，松手后 4 秒内还能点「撤销」；<b>空白处左右滑换页面</b>（卡片之间、页面上下边、顶栏与底部标签栏的背景）。
    「报废/已售」这类要给<b>去向 CN</b> 的状态故意不给滑动，得进表单补记。
    <div style="text-align:right;margin-top:4px"><span style="cursor:pointer;text-decoration:underline;padding:6px 8px;margin:-6px -4px;display:inline-block;min-height:24px" onclick="setSetting('hint',false)">知道了</span></div></div>`;
}

/** 按当天预约单 + 开拍时间拼一版时间线草稿，自己再补收尾 */
function suggestTimeline(sid){
  var s=get('sessions',sid); if(!s) return;
  var day=String(s.date||'').slice(0,10);
  var parts=[];
  DB.appointments.forEach(function(a){
    if(a.projectId!==s.projectId||!a.datetime) return;
    if(day&&String(a.datetime).slice(0,10)!==day) return;
    var nm=contactLabel(a.contactId)||a.contactText||'待确认';
    parts.push({t:String(a.datetime).slice(11,16)||'00:00', v:(a.type&&nm.indexOf(a.type)<0)?(a.type+' '+nm):nm});
  });
  if(s.time) parts.push({t:s.time,v:'开拍'});
  parts.sort(function(a,b){ return a.t<b.t?-1:(a.t>b.t?1:0); });
  if(!parts.length){ toast('这天没有预约单，也没填开拍时间'); return; }
  var txt=parts.map(function(x){ return x.t+' '+x.v; }).join(' → ');
  applyAction('已按预约单生成时间线',function(){ s.timeline=txt; s.updated_at=nowStamp(); put('sessions',s); });
}

function quickEditItem(iid,key){
  var i=get('items',iid); if(!i) return;
  var spec=QUICK_FIELDS[key]; if(!spec) return;
  openForm({
    center:true, saveLabel:'确认',
    title:'改一下 · '+spec.l,
    values:Object.assign({},i),
    visCtx:i,                 /* v1.3.1（P1-4）：给 show() 一份只读上下文（如「处置」卡要看 status） */
    fields:spec.f(i),
    onSave:function(V){
      var nm=i.name;
      applyAction('已改「'+(nm||'这件装备')+'」· '+spec.l,function(){
        var it=Object.assign({},get('items',iid),V);
        if(!it) return;
        it.name=String(it.name||'').trim()||autoItemName(it,it.characterId,it.id);
        if((ASSET_CATS[it.kind]||[]).indexOf(it.category)<0) it.category='';
        itemDisposalRules(it);
        it.price=numOrNull(it.price); it.dispPrice=numOrNull(it.dispPrice);
        it.qty=numOrNull(it.qty); it.lowQty=numOrNull(it.lowQty);
        it.makeProgress=(it.makeProgress===''||it.makeProgress==null||it.makeProgress===undefined)?null:Math.max(0,Math.min(100,num(it.makeProgress)));
        it.dispType=it.status==='外借中'?'外借':(isDisposalStatus(it.status)?(it.dispKind||''):'');
        it.fittings=arr(it.fittings).filter(Boolean);
        it.fits=normFits(it.fits);
        it.refLinks=arr(it.refLinks).filter(function(x){return x.url||x.label;});
        it.updated_at=nowStamp();
        put('items',it); syncItemExpense(it);
      });
    }
  });
}

var LP_MS=1800, lpDrag=null, lpSwallow=0;   /* 1.3.4.1：进度条时长改成 var(--lp-ms)，由下面这一句按 LP_MS 现算，改一处就够 */
try{ document.documentElement.style.setProperty('--lp-ms',(LP_MS/1000)+'s'); }catch(e){}   /* 1.3.4：用户要求 3 秒太久；改这个值要同时改 .lp-run::after 的动画时长 */
function lpDown(e){
  if(e.pointerType==='mouse') return;                 /* 电脑端仍用详情页的「删除」按钮 */
  var host=e.target.closest?e.target.closest('[data-lp]'):null;
  if(!host) return;
  if(swSkip(e.target,host)) return;                  /* 落在按钮/角标/链接上的不算长按 */
  lpCancel();
  host.classList.add('lp-run');
  lpDrag={host:host,key:String(host.getAttribute('data-lp')),x:e.clientX,y:e.clientY,pid:e.pointerId,
          timer:setTimeout(lpFire,LP_MS)};
}
function lpMove(e){
  if(!lpDrag||e.pointerId!==lpDrag.pid) return;
  if(Math.abs(e.clientX-lpDrag.x)>12||Math.abs(e.clientY-lpDrag.y)>12) lpCancel();
}
function lpUp(){ lpCancel(); }
function lpCancel(){
  if(!lpDrag) return;
  clearTimeout(lpDrag.timer);
  try{ lpDrag.host.classList.remove('lp-run'); }catch(_){}
  lpDrag=null;
}
function lpFire(){
  var d=lpDrag; lpDrag=null; if(!d) return;
  try{ d.host.classList.remove('lp-run'); d.host.classList.add('lp-hot');
       setTimeout(function(){ try{ d.host.classList.remove('lp-hot'); }catch(_){} },400); }catch(_){}
  /* v1.3.1（P1-3）：长按已经成立，把还挂着的滑动判定废掉 ——
     否则"长按 3 秒后手指继续横拖"会顺手把装备状态推进一格（用户只是想长按删除）。 */
  try{ if(typeof swCancel==='function') swCancel(); }catch(_){}
  /* 只吞浏览器补发的那一次 click（几十毫秒内到），不能顺手把用户点「下一步」也吞了 */
  lpSwallow=Date.now();
  vibrate([18,60,18]);
  var kv=d.key.split(':');
  longPressAction(kv[0],kv.slice(1).join(':'));
}
function longPressAction(kind,id){
  if(kind==='item') return lpItem(id);
  if(kind==='project') return lpProjectMenu(id);   /* v1.5.1：长按项目 = 菜单（归档为已出片 / 删除） */

  else stageBtn='<button class="btn block" onclick="closeModal();setStage(\''+pid+'\',\'已出片\')">归档为已出片（会先问装备处置）</button>';
  openModal({center:true,title:'「'+(p.name||'项目')+'」',

function legacyArchived(){ return DB.projects.filter(function(p){ return p.stage==='已出片'&&p.archived_at; }); }
function archiveLegacy(){
  var ls=legacyArchived(); if(!ls.length){ toast('没有待搬移的旧归档记录'); return; }

    function(){

          var c=get('projects',x.id);
          if(!c) return;

        });

  var h=`<div class="grid2" style="margin-bottom:12px">

  </div>`;
  h+= list.length? '<div class="card"><h3>归档记录<span class="cnt">'+list.length+' 套</span></h3>'+list.map(function(p){

    : emptyBox('还没有归档的出装：项目滑到「已归档」，或在长按菜单里移入已归档');

/* =========================================================
   v1.3 ③：出装日（现场模式：车上、单手、10 秒、不怕点错）
   ========================================================= */
/* v1.3.3：一个角色可以有多套出装。排序只决定"默认先看到哪一套"，不再决定"哪一套看得见"。
   1.3.2 及以前：出装日按角色只取一套（已出片的、没填截止时间的被排到最后），
   于是同一角色的第二套出装既进不去、也没有任何入口能选到 —— 就是用户报的"某套出装不显示"。 */
function onsiteNextDate(p){
  /* 1.3.4.2（复核 P3-6）：「下一场」只有 nextSessionOf 一份口径（排除已取消与已完成） */
  var up=nextSessionOf(p.id);
  if(up) return {g:0,d:up.date};                                     /* 有还没到的拍摄 */
  var ss=sessionsOf(p.id).filter(function(s){ return s.status!=='已取消'&&s.date; });
  var past=ss[0];                                                    /* sessionsOf 已按日期倒序：第一条就是最近的一场 */
  if(past) return {g:1,d:past.date};                                 /* 只剩过去的拍摄 */
  if(p.deadline) return {g:1,d:p.deadline};                          /* 只有计划完成日 */
  return {g:2,d:''};                                                 /* 什么都没排：仍然列出来，只是排最后 */
}
function onsiteProjectsOf(cid){
  if(!cid) return [];
  /* v1.5.6：「已归档」是用户主动收起来的一套，出装日不再把它当候选；
     「已出片」只排到最后但仍然列出——现场可能还得回头看这一套穿过什么。 */
  return DB.projects.filter(function(p){ return p.characterId===cid&&p.stage!=='已归档'; }).sort(function(a,b){
    var ao=isDoneStage(a)?1:0, bo=isDoneStage(b)?1:0;
    if(ao!==bo) return ao-bo;                                        /* 已出片排最后，但不隐藏 */
    var ad=onsiteNextDate(a), bd=onsiteNextDate(b);
    if(ad.g!==bd.g) return ad.g-bd.g;
    if(ad.g!==2&&ad.d!==bd.d) return ad.d<bd.d?-1:1;
    return String(b.updated_at||'').localeCompare(String(a.updated_at||''));  /* 都没排时间 → 最近动过的在前 */
  });
}
function onsiteBestProject(cid){ var ps=onsiteProjectsOf(cid); return ps.length?ps[0]:null; }
/** 现场页真正显示的那一套：优先用户手选的，其次默认最佳（手选的那套被删/被改角色时自动回落） */
function onsiteCurrentProject(){
  var ps=onsiteProjectsOf(S.onsiteChar);
  if(!ps.length) return null;
  for(var j=0;j<ps.length;j++) if(ps[j].id===S.onsitePid) return ps[j];
  return ps[0];
}
function onsiteBestSession(p){
  if(!p) return null;
  /* 1.3.4.2（复核 P3-6）：显示的"这一场"与排序用同一份 nextSessionOf ——
     以前排序排除已完成、显示不排除，今天这场拍完了就会"排序按明天、页面显示今天"。 */
  var up=nextSessionOf(p.id);
  if(up) return up;
  var ss=sessionsOf(p.id).filter(function(s){ return s.status!=='已取消'&&s.date; });
  return ss[0]||null;   /* 只剩过去/已完成的场：显示最近那一场当历史 */
}

/* =========================================================
   v1.3 ④：指针交互装配（双击快改 / 长按删除 / 滑动槽滑轨）
   ========================================================= */
var dragSwallow=0;
function initGestures13(){
  var main=document.getElementById('main');
  if(!main||main._g13) return;
  main._g13=true;
  /* 触屏上原生 dblclick 不稳：自己判连点。v1.5.8 把窗口从 420ms 放宽到 520ms——
     用户报的"很容易点不上"，一部分就是第二下稍微慢一点、整次作废。
     另一半（更主处的原因）是第二下之前页面被轻微滚动 / 双击缩放挪了位：
     那一条靠 .qe 上的 touch-action:manipulation + user-select:none 治，见样式区注释。
     再留一条退路：✎ 单下就开（qePen），不非得赌 timing。 */
  var last={k:'',t:0};
  main.addEventListener('pointerup',function(e){
    if(e.pointerType==='mouse') return;
    var row=e.target.closest?e.target.closest('[data-qe]'):null;
    if(!row){ last={k:'',t:0}; return; }
    /* v1.5.1：data-qent 区分实体——装备走 quickEditItem，项目走 quickEditProject */
    var ent=row.getAttribute('data-qent')||'item';
    var qid=row.getAttribute('data-qid'), qk=row.getAttribute('data-qe');
    var k=ent+'|'+qk+'|'+qid;
    var now=Date.now();
    if(last.k===k&&now-last.t<520){
      last={k:'',t:0};
      qeOpen(ent,qid,qk);
    }
    else last={k:k,t:now};
  });
  main.addEventListener('pointerdown',lpDown);
  main.addEventListener('pointermove',lpMove);
  main.addEventListener('pointerup',lpUp);
  main.addEventListener('pointercancel',lpUp);
  /* v1.3.1（P1-3）：长按的宿主上再拦一道系统长按菜单/文本选择，
     否则 iOS/Android 会弹选择气泡并可能发 pointercancel，把 3 秒定时器打断，长按永远走不到头。 */
  main.addEventListener('contextmenu',function(e){
    if(e.target.closest&&e.target.closest('[data-lp]')) e.preventDefault();
  });
  main.addEventListener('pointerdown',slotDown);
  main.addEventListener('wheel',slotWheel,{passive:false});
}
/** 电脑端：按住滑动槽横向拖动（拖过 5px 就不算点击，避免误选标签） */
function slotDown(e){
  if(e.pointerType!=='mouse') return;
  var row=e.target.closest?e.target.closest('.pill-row'):null;
  if(!row||row.scrollWidth<=row.clientWidth+1) return;
  var x0=e.clientX, s0=row.scrollLeft, moved=false;
  row.classList.add('dragging');
  function mv(ev){ var dx=ev.clientX-x0; if(Math.abs(dx)>5) moved=true; if(moved) row.scrollLeft=s0-dx; }
  function up(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
    row.classList.remove('dragging'); if(moved) dragSwallow=Date.now(); }
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
}
/** 电脑端：滚轮在滑动槽上就横向滚；滚到头交还给页面，不抢正常滚动 */
function slotWheel(e){
  var row=e.target.closest?e.target.closest('.pill-row'):null;
  if(!row||row.scrollWidth<=row.clientWidth+1) return;
  var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(!d) return;
  var max=row.scrollWidth-row.clientWidth;
  if((d<0&&row.scrollLeft<=0)||(d>0&&row.scrollLeft>=max-1)) return;
  e.preventDefault();
  row.scrollLeft=Math.max(0,Math.min(max,row.scrollLeft+d));
}

/* 1.1.2 修复：file:// 属于非安全上下文，且窗口失焦时 navigator.clipboard.writeText 会 reject，
   导致点平台 ID 就"复制失败"。改为三层兜底：execCommand 优先 → Clipboard API → 手动复制框。 */
/* 1.3.4 复制：三条策略依次试，而且**先确认选区真的等于要复制的文本**再 execCommand。
   1.3.3 及以前用 Range 选 textarea 的内容、且从不 focus —— 桌面 Chrome 会"返回 true"，
   iOS / 部分安卓上其实什么都没写进剪贴板，却照样提示"已复制"，这就是"一键复制还是没实现"。 */
function copySelMatches(text){
  try{ return String(window.getSelection().toString())===String(text); }catch(e){ return false; }
}
/** 策略 A：contentEditable 代理 + Range（iOS Safari 唯一稳的一条） */
function copyByEditable(text){
  var d=document.createElement('div');
  d.setAttribute('contenteditable','true');
  d.textContent=text;
  d.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;overflow:hidden;white-space:pre';
  document.body.appendChild(d);
  var okc=false;
  try{
    var r=document.createRange(); r.selectNodeContents(d);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    if(copySelMatches(text)) okc=!!document.execCommand('copy');
  }catch(e){ okc=false; }
  try{ window.getSelection().removeAllRanges(); }catch(e){}
  document.body.removeChild(d);
  return okc;
}
/** 策略 B：textarea + focus + setSelectionRange（安卓与桌面） */
function copyByExec(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:-9999px;width:2px;height:2px;opacity:0';
  document.body.appendChild(ta);
  var okc=false;
  try{
    ta.focus(); ta.setSelectionRange(0,String(text).length);
    /* 1.3.4.1（P3-1）：B 也要确认选中了才认成功 —— 1.3.4 修的根因就是「execCommand 返回 true ≠ 真复制了」 */
    if(ta.selectionStart===0 && ta.selectionEnd===String(text).length) okc=!!document.execCommand('copy');
  }catch(e){ okc=false; }
  document.body.removeChild(ta);
  return okc;
}
/** 走一遍三条路，返回成功那条的名字（''=都没成） */
function copyNow(text){
  text=String(text==null?'':text);
  if(!text) return '';
  if(copyByEditable(text)) return 'A';
  if(copyByExec(text)) return 'B';
  if(navigator.clipboard&&navigator.clipboard.writeText) return 'C';   /* 1.3.4.1：前一行是后一行的子集，删掉；能不能用由 writeText 的 reject 说话 */
  return '';
}
function copyManual(text, label){
  openModal({
    title:'浏览器拦住了自动复制 · 长按这里复制', center:true,
    body:'<div class="muted tiny" style="margin-bottom:6px">'+esc(label)+'：下面已经整段选好，长按 → 点「复制」就能粘到微信/导航；也可以点「再试一次」。</div>'+
      '<div id="manualCopy" class="mcopy">'+esc(text)+'</div>'+
      '<div class="btn-row" style="margin-top:10px"><button class="btn gray" id="mcAgain">再试一次</button>'+
      '<button class="btn" id="mcDone">好了</button></div>',
    onMount:function(m){
      var box=m.querySelector('#manualCopy');
      try{
        var r=document.createRange(); r.selectNodeContents(box);
        var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
      }catch(e){}
      m.querySelector('#mcAgain').onclick=function(){
        closeModal();
        var how=copyNow(text);
        if(how==='C'){ navigator.clipboard.writeText(text).then(function(){ toast('已复制：'+(label||text)); },function(){ copyManual(text,label||'内容'); }); }
        else if(how){ toast('已复制：'+(label||text)); }
        else copyManual(text, label||'内容');
      };
      m.querySelector('#mcDone').onclick=closeModal;
    }
  });
}
/** v1.5.5：预约单参考图弹窗（妆面/造型参考从相册传） */
function apptImgs(aid){
  var a=get('appointments',aid); if(!a) return;
  openModal({center:true,title:'妆面/造型参考 · '+(contactLabel(a.contactId)||a.contactText||'预约'),
    body:imgCell(a,'appointment',a.id,true)+
      '<div class="btn-row" style="margin-top:8px"><button class="btn sm ghost" onclick="pickImgs(\'appointment\',\''+a.id+'\')">＋ 图片</button>'+
      '<button class="btn gray" onclick="closeModal()">关闭</button></div>'});
}
/** 通用复制：只有真的复制成功才说"已复制"，否则直接给可选长的降级框 */
function copyAny(text, label){
  text=String(text==null?'':text);
  if(!text){ toast('没有可复制的内容'); return; }
  var how=copyNow(text);
  if(how==='A'||how==='B'){ toast('已复制：'+(label||text)); return; }
  if(how==='C'){
    navigator.clipboard.writeText(text).then(
      function(){ toast('已复制：'+(label||text)); },
      function(){ copyManual(text, label||'内容'); });
    return;
  }
  copyManual(text, label||'内容');
}
window.copyText=function(t){ copyAny(t, String(t||'')); };

/* v1.5.8.2（评审 P1-2）：让所有 role=button 的行/卡能用键盘操作。
   委托挂在 #main 上（render 只换 innerHTML，监听不会掉）；只在事件源本身就是这一行时触发，
   行内嵌的按钮/徽章按回车不会连带点两下。 */
/* v1.5.8.2（评审 P1-5）：给横向滚动槽打「还能往哪边滑」的标记。
   只在真的有内容溢出、且没滑到头的那一侧加 data-sc，CSS 用 mask 做渐隐。
   滚动监听是 passive 的，不打断手势。 */
function updScrollMark(el){
  var l=el.scrollLeft>1, r=(el.scrollLeft+el.clientWidth)<(el.scrollWidth-1);
  var v=(l?'l':'')+(r?'r':'');
  if(el.getAttribute('data-sc')!==v) el.setAttribute('data-sc', v);
}
function markScrollables(scope){
  var rows=(scope||document).querySelectorAll('.pill-row');
  for(var i=0;i<rows.length;i++){
    var el=rows[i];
    if(!el._scBind){ el._scBind=1; el.addEventListener('scroll',function(){ updScrollMark(this); },{passive:true}); }
    updScrollMark(el);
  }
}
/** v1.5.8.3（复核 P3-2）：行内嵌的小动作（＋转待办 / ✕ / 编辑链接…）只有 onclick，
    键盘完全够不到；而 1.5.8.2 给整行加了 role=button 之后，读屏更容易把这些子节点
    压成"一个按钮的名字"。统一补 role=button + tabindex=0，回车/空格交给 initRowKeys 同一套委托。
    两类不补：✎（与它所在行是同一个动作，别加第二个停靠点）、滑动揭示面板里的按钮（平时是隐藏的）。 */
function markInlineActions(scope){
  var root=scope||document.getElementById('main');
  if(!root||!root.querySelectorAll) return;
  var list=root.querySelectorAll('[onclick]');
  for(var i=0;i<list.length;i++){
    var el=list[i], tg=el.tagName;
    if(tg==='BUTTON'||tg==='A'||tg==='INPUT'||tg==='SELECT'||tg==='LABEL') continue;
    if(el.classList&&el.classList.contains('pen')) continue;
    if(el.closest&&el.closest('.swpanel')) continue;
    if(el.getAttribute('role')) continue;
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
  }
}
function initRowKeys(){
  var m=document.getElementById('main');
  if(!m||m._rowKeys) return; m._rowKeys=1;
  m.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar') return;
    var el=e.target; if(!el||!el.getAttribute) return;
    if(el.getAttribute('role')!=='button') return;
    if(el.tagName==='BUTTON'||el.tagName==='A'||el.tagName==='INPUT'||el.tagName==='SELECT') return;
    e.preventDefault(); el.click();
  });
}
function boot(){
  load();
  if(!DB.meta) DB.meta={};
  settings();            /* v1.2：手势开关先落到对象上，渲染与指针事件都要读 */
  try{ document.documentElement.style.setProperty('--top-inset',(settings().topInset||0)+'px'); }catch(e){}   /* v1.5.3 异形屏避让 */
  DB.meta.opened_at=nowStamp();
  render();
  initSwipe();           /* v1.5.6：监听挂在 document 上（顶栏/底部标签栏也算空白处），render 只换 innerHTML，不会掉 */
  initNav();             /* v1.3：手机返回键先回上一屏 */
  initGestures13();      /* v1.3：双击快改 / 长按删除 / 滑动槽拖拽 */
  initToast134();        /* v1.3.4：顶部撤销通知能上滑划走 */
  initRowKeys();         /* v1.5.8.2：列表行 role=button 的回车/空格 */
  /* v1.5.3：安卓系统返回键（Capacitor App 插件）——弹窗优先关弹窗，其次应用内返回上一级，
     到首页才弹「要退出吗」；不再一按就直接退出应用。桌面/网页环境无此插件，自动跳过。 */
  try{
    var CAP=(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App)||null;
    if(CAP&&CAP.addListener){
      CAP.addListener('backButton',function(){
        if(MODAL_OPEN){ closeModal(); render(); return; }
        if(NAV_STACK.length>1){ appBack(); return; }
        confirmExit();
      });
    }
  }catch(e){}
  /* v1.5.4：通知系统（仅 APK）——启动即请求通知权限，排每晚 20:00 的「明日与到期」 */
  try{ setupNotifications(); }catch(e){}
  /* v1.4：点缩略图放大（事件委托，render 重建 DOM 也不掉）。
     v1.5.8 改挂 document：图片块现在也出现在弹窗里（角色参考图、预约单图片、表单里的图片位），
     只挂 #main 的话那些缩略图点不开。 */
  document.addEventListener('click',function(e){
    var im=e.target&&e.target.closest?e.target.closest('img[data-imgid]'):null;
    if(im) zoomImg(im.getAttribute('data-imgid'));
  });
  /* v1.4.1：打开应用时查一遍档期冲突，有才弹（无冲突不打扰） */
  setTimeout(function(){ try{ if(conflictScan().length) showConflicts(); }catch(e){} },700);
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
if(typeof module==='undefined') boot();
</script>
