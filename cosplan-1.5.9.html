    if(f.t==='chips') V[f.k]=arr(base).slice();
    /* 1.1.2 修复：t:'list' 的元素是字符串（如试装记录 fittings），
       原先一起走 Object.assign({},x) 会把字符串拆成 {0:'a',1:'b'...}，渲染成 [object Object] 且不可逆 */
    else if(f.t==='list') V[f.k]=arr(base).map(function(x){ return (x&&typeof x==='object')?Object.assign({},x):x; });
    else if(f.t==='links'||f.t==='pairs'||f.t==='fits') V[f.k]=arr(base).map(function(x){ return Object.assign({},x); });
    else if(f.t==='check') V[f.k]=!!base;
    else V[f.k]= (base===undefined||base===null)?(f.def!==undefined?f.def:''):base;
  }
  /* v1.3.1（P1-4）：只读可见性上下文。有些卡片的字段 show() 依赖的键不在本卡片的字段集里
     （「处置」卡的字段靠 status 判断显隐，而 status 不是处置字段），只从字段初始化 V 会让 show() 全判假，
     于是开出一张空卡。这份上下文只喂给 show()，不进 V、不参与落库。 */
  function visOf(){ return cfg.visCtx ? Object.assign({}, cfg.visCtx, V) : V; }
  function visible(f){ return f.show? !!f.show(visOf()) : true; }
  /* 1.3.4.1（P2-5）：行/组「自己该不该出现」以前有三份手写副本，其中 applyDerives 那份传的是裸 V ——
     快改卡的处置行靠 visCtx 才有 status，于是渲染/校验判可见、derive 判不可见（显示 ≠ 落库的配方） */
  function rowShown(f){ return !(f.show && !f.show(visOf())); }
  var openGroups={};                       /* 折叠分组展开状态，重渲染时保留 */
  function rememberGroups(){
    var mm=document.getElementById('modal'); if(!mm) return;
    mm.querySelectorAll('details[data-group]').forEach(function(d){ openGroups[d.getAttribute('data-group')]=d.open; });
  }
  function syncSelectDefaults(){
    /* 必填 select 不渲染空选项：DOM 显示第一项而模型为空会卡死保存，渲染前先对齐 */
    /* v1.2.2.2（P2-4）：进 row/group 先看它自己的 show —— 收起的行/组里的字段渲染时不出现，
       就不该被"兜底"写值（与 walk() 的过滤口径对齐） */
    var walk=function(f){
      if(f.t==='row'||f.t==='group'){
        if(!rowShown(f)) return;
        (f.cols||[]).forEach(walk); return;
      }
      if(f.t!=='select') return;
      if(!visible(f)) return;
      var os=optsOf(typeof f.opts==='function'?f.opts(V):f.opts);
      if(!os.length) return;
      var cur=V[f.k];
      if(cur===''||cur===null||cur===undefined){ if(f.req) V[f.k]=os[0].v; return; }   /* 原逻辑：只对必填兜底 */
      /* 1.1.2 新增：当前值已不在选项里（源实体被删 / 类别切换）时，浏览器会显示第一项但模型还是旧值，
         造成"看到的 ≠ 保存的"。有空选项就置空，否则落到第一项。 */
      var hit=false,hasEmpty=false;
      for(var i=0;i<os.length;i++){ if(String(os[i].v)===String(cur)) hit=true; if(os[i].v==='') hasEmpty=true; }
      if(!hit) V[f.k]=hasEmpty?'':os[0].v;
    };
    (cfg.fields||[]).forEach(walk);
  }
  function renderCols(cols){
    return cols.map(function(f){
      if(f.t==='row'){
        if(!visible(f)) return '';
        var rc=(f.cols||[]).filter(visible);
        if(!rc.length) return '';
        return `<div class="f-row">${rc.map(function(c){return fieldInput(c,V);}).join('')}</div>`;
      }
      if(f.t==='group'){
        if(!visible(f)) return '';
        var gc=(f.cols||[]).filter(visible);
        if(!gc.length) return '';
        return `<details class="dd" data-group="${esc(f.k)}" ${openGroups[f.k]||f.open?'open':''}>
          <summary>${esc(f.l)}<span class="muted tiny">　${gc.length} 项，展开查看</span></summary>
          ${gc.map(function(c){ return c.t==='row'? renderCols([c]) : fieldInput(c,V); }).join('')}</details>`;
      }
      return fieldInput(f,V);
    }).join('');
  }
  function applyDerives(){
    /* v1.2.2：字段可以声明 derive(V) 在每次渲染前自动补另一格（只在联动源变化后跑，不覆盖用户已填的值）
       v1.2.2.2（P2-4）：整行/整组被 show 收起时，里面的 derive 一律不跑 ——
       否则「约人」表单里藏起来的 V.date 会被约定时间偷偷写上日期，跟 walk() 的口径也对不上 */
    var walk=function(f){
      if(f.t==='row'||f.t==='group'){
        if(!rowShown(f)) return;
        (f.cols||[]).forEach(walk); return;
      }
      if(f.derive && visible(f)) f.derive(V);
    };
    (cfg.fields||[]).forEach(walk);
  }
  function body(){
    applyDerives();
    syncSelectDefaults();
    return renderCols((cfg.fields||[]).filter(function(f){
      return (f.t==='row'||f.t==='group') ? visible(f) && (f.cols||[]).some(visible) : visible(f);
    }))
      + `<div class="btn-row" style="margin-top:16px">
          <button class="btn gray" id="fCancel">取消</button>
          <button class="btn" id="fSave">${esc(cfg.saveLabel||'保存')}</button></div>
          ${cfg.foot||''}`;
  }
  function bind(m){
    m.querySelector('#fCancel').onclick=function(){ closeModal(); };
    m.querySelectorAll('[id^=fld_]').forEach(function(el){
      var k=el.id.slice(4), f=findField(k);
      if(!f) return;
      /* v1.2.2.2（P1 追加）：字段可声明 onTouch(V)，在用户**手动编辑**该字段时回调
         （程序化写值 / derive 写入都不会触发）。用来区分"用户真改过"和"值和默认恰好一样"，
         避免用数值相等去推断意图。 */
      var touch=function(){ if(f.onTouch) f.onTouch(V); };
      if(f.t==='chips'){
        el.querySelectorAll('.chip').forEach(function(b){
          b.onclick=function(){
            var val=b.getAttribute('data-val'), sel=arr(V[k]);
            var i=sel.indexOf(val); if(i>=0) sel.splice(i,1); else sel.push(val);
            V[k]=sel; b.classList.toggle('on'); touch();
          };
        });
      }else if(f.t==='check'){
        el.onchange=function(){ V[k]=el.checked; touch(); if(f.live) rerender(); };
      }else{
        el.onchange=function(){ V[k]=el.value; touch(); if(f.live) rerender(); };
        el.oninput=function(){ V[k]=el.value; touch(); };
      }
    });
    m.querySelectorAll('[data-subadd]').forEach(function(b){
      b.onclick=function(){
        var k=b.getAttribute('data-subadd'), f=findField(k);
        var list=arr(V[k]).slice();
        list.push(f.t==='list'?'':{label:'',url:'',note:''});
        if(f.t==='pairs') list[list.length-1]={a:'',b:''};
        if(f.t==='fits') list[list.length-1]={part:'',verdict:'',note:''};
        V[k]=list; rerender();
      };
    });
    m.querySelectorAll('[data-sub]').forEach(function(inp){
      /* 1.1.2 修复：子项原来只绑 onchange，打字后直接点「＋ 添加」会 rerender 重建 DOM，
         onchange 尚未触发导致刚输入的内容丢失 —— 同时绑 oninput */
      function onSub(){
        var p=inp.getAttribute('data-sub').split(':');
        if(p.length===2){ V[p[0]][p[1]]=inp.value; return; }
        var f=findField(p[0]), o=V[p[0]][p[1]], part=p[2];
        if(!o) return;
        if(f&&f.t==='pairs'){ if(part==='a') o.a=inp.value; else if(part==='b') o.b=inp.value; }
        else if(f&&f.t==='fits'){ if(part==='a') o.part=inp.value; else if(part==='b') o.verdict=inp.value; else o.note=inp.value; }
        else { if(part==='a') o.label=inp.value; else if(part==='b') o.url=inp.value; else o.note=inp.value; }
      }
      inp.onchange=onSub; inp.oninput=onSub;
    });
    m.querySelectorAll('[data-subdel]').forEach(function(b){
      b.onclick=function(){ var p=b.getAttribute('data-subdel').split(':'); V[p[0]].splice(num(p[1]),1); rerender(); };
    });
    var sv=m.querySelector('#fSave');
    if(sv) sv.onclick=function(){
      if(writeLocked()){ saveBlocked(); return; }   /* v1.5.8 P2：写不进去的时候不再往内存里堆改动 */
      IMG_FORM_CB=null;   /* 保存即收卡，别让旧表单的刷新回调留给下一张弹窗 */
      var missing=null;
      m.querySelectorAll('[data-fw]').forEach(function(d){ d.classList.remove('err'); });
      function checkReq(f){
        var reqd = (typeof f.req==='function')? !!f.req(V) : !!f.req;
        if(!reqd || !visible(f)) return false;
        var v=V[f.k];
        if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length)){
          var node=m.querySelector('[data-fw="'+f.k+'"]');
          if(node){
            var grp=node.closest('details[data-group]');      /* 折叠区里的必填项要自己弹出来 */
            if(grp) grp.open=true;
            node.classList.add('err'); node.scrollIntoView({block:'center'});
          }
          toast('请填写：'+f.l); missing=f.k; return true;
        }
        return false;
      }
      function walk(f){
        /* 1.2.2：整行/整组被 show 掉时，里面的必填不再拦保存（渲染时本来也不出现，之前会卡死保存） */
        if(f.t==='row'||f.t==='group'){
          if(!rowShown(f)) return false;
          for(var j=0;j<(f.cols||[]).length;j++) if(walk(f.cols[j])) return true;
          return false;
        }
        return checkReq(f);
      }
      for(var i=0;i<cfg.fields.length;i++){ if(walk(cfg.fields[i])) return; }
      if(missing) return;
      /* 布局合成字段（row/group）不属于数据，统一剔除 */
      (function strip(list){ (list||[]).forEach(function(f){ if(f.t==='row'||f.t==='group'){ delete V[f.k]; strip(f.cols); } }); })(cfg.fields);
      closeModal();
      cfg.onSave(V);
    };
  }
  function rerender(){
    rememberGroups();
    var m=document.getElementById('modal');
    m.querySelector('#mContent').innerHTML=body();
    bind(m);
    try{ hydrateImgs(m); }catch(e){}   /* v1.5.8：表单里刚传的那张要立刻显出来 */
  }
  function findField(k){
    for(var i=0;i<cfg.fields.length;i++){
      var f=cfg.fields[i]; if(f.k===k) return f;
      if(f.t==='row'||f.t==='group'){ for(var j=0;j<f.cols.length;j++){ var c=findIn(f.cols[j]); if(c) return c; } }
    }
    function findIn(x){
      if(x.k===k) return x;
      if(x.t==='row'||x.t==='group'){ for(var q=0;q<(x.cols||[]).length;q++){ var r=findIn(x.cols[q]); if(r) return r; } }
      return null;
    }
    return null;
  }
  /* v1.5.8：把这张卡自己的重绘函数交出去 —— 表单里的图片位传完图要刷的是这张卡
     （openModal 一进来会把 IMG_FORM_CB 清空，所以这里在 onMount 里赋值正好在它之后） */
  openModal({ title:cfg.title, body:body(), onMount:function(m){ IMG_FORM_CB=rerender; bind(m); if(cfg.onMount) cfg.onMount(m); }, center:cfg.center });
}

/* =========================================================
   领域层：查询助手 / 自动费用 / 级联删除
   ========================================================= */
/* =========================================================
   口径区（1.3.4.2 落地）：同一件事全站只许有一种算法。
   下面这组函数是「挂价归属 / 在手件数 / 下一场拍摄 / 低库存 / 角色显示」的唯一来源，
   视图层只许调用、不许再手写第二份过滤或统计表达式；
   qa/z1342_audit.js 有源码扫描守卫，谁把口径拆成两处，测试直接红。
   ========================================================= */
/** 角色还活着吗（悬空 id = 作品被删时连带删了角色，装备的 characterId 成了孤儿） */
function charAlive(id){ return !!get('characters',id); }
/** 角色显示的唯一口径：空 = 通用；悬空 = （角色已删）—— 让"归属丢了"看得见，而不是伪装成通用件 */
function charLabel(id){
  if(!id) return '通用';
  var c=get('characters',id); if(!c) return '（角色已删）';
  var w=get('works',c.workId);
  return (w?w.name+' · ':'')+c.name;
}
/** v1.5.5：角色显示拆成 作品 / 角色 两段（项目列表与概览要求分行显示） */
function charParts(id){
  var c=get('characters',id);
  if(!c) return {work:'',char:id?'（角色已删）':'通用'};
  var w=get('works',c.workId);
  return {work:w?w.name:'',char:c.name||''};
}
/** 口径：这两个阶段不算"进行中"（首页进行中/提醒/现场排序都跳过） */
function isDoneStage(p){ return STAGES_DONE.indexOf(p&&p.stage)>=0; }
function projDoneById(pid){ var p=pid?get('projects',pid):null; return !!p&&isDoneStage(p); }
/** v1.5.6 唯一算法：同一「角色 + 时装」的第 N 次拍摄按 created_at 定序，缺 created_at 的用录入顺序兜底。
    绝不能用 updated_at —— 它每存一次就跳到末尾，1.5.5 就是这么把两套项目撞成完全同名的（评审 P2-1 复发）。 */
function projRepriseGroup(cid,skin){
  var out=[];
  DB.projects.forEach(function(p,i){
    if(!p||p.characterId!==cid||p.skin!==skin) return;
    out.push({p:p,ord:String(p.created_at||p.updated_at||'')+'#'+('00000'+i).slice(-6)});
  });
  out.sort(function(a,b){ return a.ord<b.ord?-1:(a.ord>b.ord?1:0); });
  return out;
}
function projRepriseNum(cid,skin,selfId){
  var g=projRepriseGroup(cid,skin);
  for(var i=0;i<g.length;i++){ if(g[i].p.id===selfId) return i+1; }
  return g.length+1;   /* 新建：还没有自己，排到最后一次 */
}
/** 「上一套」= 序号上的前一条（继承关联装备的出处），不是"最近被我改动的那条" */
function projPrevReprise(cid,skin,selfId){
  var g=projRepriseGroup(cid,skin);
  for(var i=1;i<g.length;i++){ if(g[i].p.id===selfId) return g[i-1].p; }
  if(!selfId&&g.length) return g[g.length-1].p;
  return null;
}
/** 装备页角色筛选的唯一算法：''=全部，'__none'=通用（真·不挂角色），'__gone'=归属已丢，其余=按角色 id */
function matchAssetRole(i,role){
  if(role==='__none') return !i.characterId;
  if(role==='__gone') return !!i.characterId && !charAlive(i.characterId);
  if(role) return i.characterId===role;
  return true;
}
/** 台账里"归属已丢"的件数（决定角色筛选下拉里要不要给「（角色已删）」选项） */
function orphanRoleCount(){ return DB.items.filter(function(i){ return i.characterId && !charAlive(i.characterId); }).length; }
/** 低库存的唯一口径：数量与阈值都记了、且真的还剩（qty>0）——"没记数量"不等于"只剩 0" */
function lowStockOf(i){ return i.kind==='消耗品' && num(i.qty)>0 && num(i.lowQty)>0 && num(i.qty)<=num(i.lowQty); }
/** 「下一场拍摄」的唯一口径：排除已取消与已完成（拍完的不算"下一场"），按日期升序取最近 */
function nextSessionOf(pid){
  var today=todayISO();
  return sessionsOf(pid).filter(function(s){ return s.status!=='已取消'&&s.status!=='已完成'&&s.date&&s.date>=today; })
    .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); })[0]||null;
}
function projLabel(id){ var p=get('projects',id); return p?p.name:'未关联项目'; }
function contactLabel(id){ var c=get('contacts',id); return c?(c.cn||'未命名'):''; }
function locationLabel(id){ var l=get('locations',id); return l?l.name:''; }
function sessionLabel(id){ var s=get('sessions',id); if(!s) return ''; return (s.date||'未定')+' '+(s.method||''); }
function itemsOfProject(pid){ return DB.items.filter(function(i){ return arr(i.projectIds).indexOf(pid)>=0; }); }
function projectsOfChar(cid){ return DB.projects.filter(function(p){ return p.characterId===cid; }); }
function charName(cid){ var c=get('characters',cid); return c?(c.name||''):(cid?'':''); }
function liveItems(){ return DB.items.filter(isLiveItem); }
/* 1.3.4.2（复核 P3-2）：第 4 套口径 usableItems()（试穿通过/已到货/外借中）删除 ——
   它把借出去的算成"在手"、把修改中的漏掉，与装备页「只看在手」的 live 口径打架。
   首页统计现在直接用 liveItems()，与装备页同一个来源。 */
function isReadyItem(i){ return i.status==='试穿通过'; }
/** 出物回血：合并态「报废/已售」只有子选项是"卖了"才算回血 */
function soldBack(i){ return (i.status==='报废/已售'&&i.dispKind==='卖了')?num(i.dispPrice):0; }
function sessionsOf(pid){ return sortDesc(DB.sessions.filter(function(s){return s.projectId===pid;}),'date'); }
function apptsOf(pid){ return sortDesc(DB.appointments.filter(function(a){return a.projectId===pid;}),'datetime'); }
function expsOf(pid){ return sortDesc(DB.expenses.filter(function(e){return e.projectId===pid;}),'date'); }
function todosOf(pid){ return DB.todos.filter(function(t){return !pid||t.projectId===pid;}); }
function delivsOf(sid){ return DB.deliverables.filter(function(d){return d.sessionId===sid;}); }
function pubsOf(pid){ return sortDesc(DB.publications.filter(function(p){return p.projectId===pid;}),'date'); }
function overdueDelivs(){
  return DB.deliverables.filter(function(d){
    var ses=get('sessions',d.sessionId);
    if(ses && ses.status==='已取消') return false;   /* 拍摄已取消，不该再催片 */
    return d.agreedDate && isPast(d.agreedDate) && d.status!=='已返图';
  });
}
/** 1.3.4.1（P2-4）：「这笔钱算不算已记账」的唯一判据。
    以前 syncItemExpense 里写一遍、itemCostInProject 完全不判 → 同一页两个数差一只愿望单。 */
function isCharged(i){ return num(i.price)>0 && i.status!=='愿望单/购物车'; }
/** 一件装备自动生成的那条买入流水（refType==='item' 只会是自动买入行；手动流水不带 refType） */
function itemBuyExpense(iid){ return DB.expenses.filter(function(e){ return e.refType==='item'&&e.refId===iid; })[0]||null; }
/** 1.3.4.2（复核 P2-1）：「装备的钱算在哪个项目头上」唯一来源 = 流水。
    挂在项目上（projectIds）≠ 记在项目头上（1.3.1 起非空即锁定，两者允许不一致）——
    所以这里只数「记在本项目头上」的已记账装备流水，与「已记账支出」真正同源；
    挂在本项目但记在别处的，由 itemCostElsewhereInProject 单独一行交代，差值自己解释自己。 */
function itemCostInProject(pid){ return DB.expenses.filter(function(e){ return e.projectId===pid&&e.refType==='item'; }).reduce(function(t,e){ return t+num(e.amount); },0); }
/** 口径区（同上）：挂在本项目、但这笔钱记在别的项目头上的装备挂价合计 */
function itemCostElsewhereInProject(pid){
  return itemsOfProject(pid).filter(isCharged).filter(function(i){
    var e=itemBuyExpense(i.id); return e && e.projectId && e.projectId!==pid;
  }).reduce(function(t,i){ return t+num(i.price); },0);
}
/** 还没下单（愿望单/购物车）与零价的挂价，单列一行，让差值自己解释自己 */
function itemWishCostInProject(pid){ return itemsOfProject(pid).filter(function(i){ return !isCharged(i); }).reduce(function(t,i){ return t+num(i.price); },0); }
/** 1.3.4.1（P2-6）：一个项目的"有几件装备"只有一份口径。
    all=台账挂着的全部；live=在手（排除留作纪念/报废已售）；ready=其中试穿通过的。
    进度类显示一律用 live 当分母 —— 已处置的件永远不可能变「试穿通过」，用 all 会把进度条判死刑。 */
function isLiveItem(i){ return TERMINAL_STATUS.indexOf(i.status)<0; }
function projItemCounts(pid){
  var all=itemsOfProject(pid), live=all.filter(isLiveItem);
  return {all:all.length, live:live.length, ready:live.filter(isReadyItem).length, gone:all.length-live.length};
}

/* ---- 自动费用：以 autoKey 幂等，改一处不重复记账 ---- */
function aKey(t,id,slot){ return t+':'+id+':'+slot; }
function upsertAuto(key,data){
  var idx=-1;
  for(var j=0;j<DB.expenses.length;j++) if(DB.expenses[j].autoKey===key){ idx=j; break; }
  if(!data || num(data.amount)<=0){ if(idx>=0) DB.expenses.splice(idx,1); return; }
  if(idx>=0){
    var old=DB.expenses[idx];
    DB.expenses[idx]=Object.assign(old,data,{autoKey:key,source:'自动'});
  }else{
    DB.expenses.push(Object.assign({id:uid('e'),autoKey:key,source:'自动'},data));
  }
}
function dropAutoPrefix(prefix){
  DB.expenses = DB.expenses.filter(function(e){ return String(e.autoKey||'').indexOf(prefix)!==0; });
}
function expCatOfItem(it){
  var k=it.kind||'C服';
  return EXPENSE_CATS.indexOf(k)>=0?k:'其他';
}
function syncItemExpense(it){
  var key=aKey('item',it.id,'buy');
  var charged = isCharged(it);
  if(!charged){ upsertAuto(key,null); return; }
  /* v1.3.1（P1-2）非空即锁定：流水一旦记在某个项目头上就不再改写，只有 null 才补一次。
     以前裸取 projectIds[0]，改一下「用在哪个出装」就会把历史流水静默搬到另一个项目。
     语义是"非空即锁定"而不是"第一次就锁死" —— 录入时还没关联项目的钱，后来挂上去要能进项目。 */
  var locked = (_autoKeep && _autoKeep[key]) || null;
  if(!locked){
    for(var j=0;j<DB.expenses.length;j++){
      if(DB.expenses[j].autoKey===key && DB.expenses[j].projectId){ locked=DB.expenses[j].projectId; break; }
    }
  }
  upsertAuto(key,{
    projectId: locked || arr(it.projectIds)[0] || null,
    date: it.orderDate||it.arrivedDate||todayISO(),
    category: expCatOfItem(it), amount: num(it.price),
    note:'装备·'+(it.name||''), refType:'item', refId:it.id
  });
}
/** v1.3.1：重建自动流水期间，用它把"已锁定的归属"原样带过去（否则重建会把锁定冲掉） */
var _autoKeep=null;
function syncApptExpense(a){
  var paid = APPT_PAID_STATUS.indexOf(a.status)>=0;
  var done = ['已完成','已结清'].indexOf(a.status)>=0;
  var APPT_CAT={ '妆娘':'妆造','毛娘':'妆造','修图师':'后期修图','场地预定':'场地','摄影师':'摄影' };
  var cat=APPT_CAT[a.type]||'其他';
  var pid=a.projectId||null, base={projectId:pid, category:cat, refType:'appointment', refId:a.id};
  var dep=num(a.deposit), fee=num(a.fee), bal=fee-dep;
  if(a.status==='已结清'){
    /* 结清：定金按已付入账，尾款补差，总额=fee */
    upsertAuto(aKey('appt',a.id,'deposit'), Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金·'+cnOf(a)}));
    upsertAuto(aKey('appt',a.id,'balance'), bal>0?Object.assign({},base,{amount:bal,date:todayISO(),note:'尾款·'+cnOf(a)}):null);
  }else if(a.status==='已完成'){
    upsertAuto(aKey('appt',a.id,'deposit'), Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金·'+cnOf(a)}));
    upsertAuto(aKey('appt',a.id,'balance'), null);   /* 尾款未结，不计 */
  }else if(paid){
    upsertAuto(aKey('appt',a.id,'deposit'), Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金·'+cnOf(a)}));
    upsertAuto(aKey('appt',a.id,'balance'), null);
  }else if(['已取消','爽约'].indexOf(a.status)>=0){
    /* 1.1.2 修复：原先这里会走到下面的 else 把定金流水删掉，与注释矛盾、且定金已付出通常不退 → 少算钱。
       现在改为保留定金入账（备注标明未退，用户可手动删除），尾款不记。 */
    upsertAuto(aKey('appt',a.id,'deposit'),
      dep>0?Object.assign({},base,{amount:dep,date:(a.datetime||'').slice(0,10)||todayISO(),note:'定金(未退)·'+cnOf(a)}):null);
    upsertAuto(aKey('appt',a.id,'balance'), null);
  }else{
    upsertAuto(aKey('appt',a.id,'deposit'), null);
    upsertAuto(aKey('appt',a.id,'balance'), null);
  }
}

  var base={projectId:s.projectId||null, category:'摄影', refType:'session', refId:s.id};
  var dep=num(s.deposit), fee=num(s.fee), bal=fee-dep;
  var d=(s.date||'')||todayISO();

     1.3.4.2（复核 P3-7）：已取消/已改期的拍摄单与预约单同一口径，备注标明「定金(未退)」。 */
  if(dep>0){

    upsertAuto(aKey('sess',s.id,'deposit'), Object.assign({},base,{amount:dep,date:d,note:depNote}));

/** v1.5.2：项目重拍序号 → 中文数字（二、三…十一…），过百用阿拉伯数字 */
function cnNum(n){
  var CN=['零','一','二','三','四','五','六','七','八','九'];
  n=Math.round(num(n));
  if(n<0) return String(n);
  if(n<10) return CN[n];
  if(n===10) return '十';
  if(n<20) return '十'+CN[n-10];
  if(n<100){ var t=Math.floor(n/10),o=n%10; return (t>1?CN[t]:'')+'十'+(o?CN[o]:''); }
  return String(n);
}

         做法：找同角色+同时装的全部项目（含自己），按 updated_at 降序排，自己在第几位就写"第几位次拍摄"。 */
      var autoName=charLabel(cid)+(V.skin?'·'+V.skin:'');
      var nm='', prevSame=null;
      if(V.skin){
        prevSame=projPrevReprise(cid,V.skin,id);
        var myNum=projRepriseNum(cid,V.skin,id);
        if(myNum>1) nm=autoName+'（第'+cnNum(myNum)+'次拍摄）';
      }
      if(!nm) nm=autoName;
      var o=Object.assign({},cur,V,{
        characterId:cid,
        name:nm,
        budget:numOrNull(V.budget), refLinks:arr(V.refLinks).filter(function(x){return x.url||x.label;}),
        updated_at:nowStamp()
      });
      ['row1','row2','g_plan','newWork','newChar','fromIntent'].forEach(function(k){ delete o[k]; });
      /* v1.5.6：序号的稳定键。老记录没有 created_at 时先拿它自己已有的时间戳——
         直接写 nowStamp() 会让「编辑一次」把这套瞬移到最新，序号反而跳到第 2 位、与另一套撞名。 */
      if(!o.created_at) o.created_at=cur.updated_at||cur.archived_at||nowStamp();
      o.id=cur.id||uid('p'); put('projects',o);
      if(prevSame){
        itemsOfProject(prevSame.id).forEach(function(it){
          if(arr(it.projectIds).indexOf(o.id)<0){ it.projectIds=arr(it.projectIds).concat([o.id]); put('items',it); syncItemExpense(it); }
        });
      }
      /* v1.5.9：从意向池「进流程」开出来的项目 → 那条意向自动转「已进流程」并记住这张项目。
         为什么走 preset 不走全局变量：弹窗里放一个 S.intentFrom 的话，"取消了这次新建"没人负责清它，
         下一次真新建别的项目会被错绑。走表单自己的 preset，取消即失效。 */
      if(!id&&cur.fromIntent) intentPromote(cur.fromIntent,o.id);
      render();
      toast('项目已保存'+(prevSame?(' · 已继承「'+prevSame.name+'」的关联装备'):''));
      if(!id) go('project',{projectId:o.id,tab:'projects'});
    }
  });
}

function itemDisposalRules(V){
  /* v1.2.2.2（P2-1）：外借中 也是 isDisposalStatus，但它不该留着「卖了/售价」——
     否则详情页会显示「回血 150 元」而首页 soldBack 又不算，两处口径打架 */
  if(V.status==='外借中'){ V.dispKind=''; V.dispPrice=null; V.dispReason=''; }
  else if(!isDisposalStatus(V.status)){ V.dispTo=''; V.dispDate=''; V.dispPrice=null; V.dispReason=''; V.dispKind=''; }
  else if(V.dispKind!=='卖了') V.dispPrice=null;

}
/** v1.2.2：装备名字不重要 —— 留空时按「角色 · 分类（没有分类就用大类）」拼一个，别为了起名卡住录入
    v1.2.2.2（P2-6）：重名时自动加序号，否则同角色两件同类装备在列表/清单里长得一模一样、分不清 */
function autoItemName(V,cid,selfId){
  var who=charName(cid)||'通用';
  var what=V.category||V.kind||'装备';
  var base=who+'·'+what, name=base, n=1;
  while(DB.items.some(function(i){ return i && i.id!==selfId && i.name===name; })){ n++; name=base+' '+n; }
  return name;
}

      {k:'g_detail',t:'group',l:'钱与当天安排（展开）',cols:[

/* ---------- 妆造/毛娘/修图 预约单 ---------- */
/* ---------- 约人（v1.2.2 统一入口）：预约单 = 一张表单，类型选「摄影师」直接落成拍摄单 ---------- */
/* v1.2.2.2（P0）：预约单状态 → 拍摄单状态。映射方向要让"钱的口径"也对得上，
   所以「已完成」落在 `已确认`（服务做完了、但钱还没结清，不补尾款），
   「已结清」才落到 `已完成`（尾款也记）。详见 APPT_PAID_BEFORE 的注释。 */
var APPT_TO_SESSION={
  '待确认':'计划中','已定档':'已确认','已付定金':'已确认',
  '已完成':'已确认','已结清':'已完成','已取消':'已取消','爽约':'已取消','已改期':'已改期'
};
/* 反向映射：摄影师分支切回妆娘/毛娘时，把拍摄单状态折回预约单状态 */
var SESSION_TO_APPT={ '计划中':'待确认','已确认':'已定档','已完成':'已完成','已改期':'已取消','已取消':'已取消' };
/* 哪些预约单状态代表「定金这笔钱已经出去了」（syncApptExpense 的 paid 口径）：
   待确认/已定档 钱还没动 → 转换时定金一并清掉，否则会凭空多记一笔支出 */
var APPT_PAID_BEFORE=['已付定金','已完成','已结清','已取消','爽约'];
/* 1.3.4.1（顺带 8）：syncApptExpense 的「钱已经出去了」口径单独起名，别和上面那个转换用的集合混用（那个含已取消/爽约） */
var APPT_PAID_STATUS=['已付定金','已完成','已结清'];
/** 这个值是不是"预约单独有的状态"（不是拍摄单的状态名） */
function isApptStatus(st){ return APPT_STATUS.indexOf(st)>=0; }
/** v1.2.2.2（P1 追加）：转换时"状态与定金到底落什么"的唯一判定，表单/确认框/落库共用同一份口径，
    保证"表单显示的 == 最终落库的"。
    状态：以**表单值**为准 —— 表单已经用 APPT_TO_SESSION 把预约单口径显式搬成拍摄单口径（derive），
      所以 o.status 是可信的；只有当它不是合法拍摄单状态时才退回按旧状态映射。
    定金：预约单的「定金」≠拍摄单的「已付定金」（前者可能只是约定、后者 >0 立刻入账）。规则：
      · 旧单已付款（APPT_PAID_BEFORE）→ 定金照记；
      · 用户**手动改过**定金（depTouched）→ 以用户为准（哪怕改成的数刚好等于原约定额）；
      · 其余（未付款、也没碰过）→ 不入账，并把被挡金额记进 gated，用于确认框提示与备注，避免信息无声消失。
    注意：判定"改没改过"用的是显式的 touched 标记，**不是**"值和原值是否相等" —— 用户照约定金额重填同一个数，
    也必须被当成"用户填了"。 */
function convertVerdict(o,cur,depTouched){
  var isConvert=!!(cur&&cur.id);
  var fromStatus=(isConvert&&isApptStatus(cur.status))?cur.status:'';
  var sStatus=(SESSION_STATUS.indexOf(o.status)>=0)?o.status
              :(fromStatus?(APPT_TO_SESSION[fromStatus]||'计划中'):'计划中');
  var paidBefore=!isConvert||APPT_PAID_BEFORE.indexOf(cur.status)>=0;
  var origDep=numOrNull(cur.deposit), depRaw=numOrNull(o.deposit);
  var sDeposit=(paidBefore||depTouched)?depRaw:null;
  var gated=(!paidBefore&&origDep>0&&sDeposit===null)?origDep:0;
  return { sStatus:sStatus, sDeposit:sDeposit, paidBefore:paidBefore, gated:gated, isConvert:isConvert };
}
function isShootAppt(V){ return !!V && V.type==='摄影师'; }
function formAppt(id,preset){
  var cur=id?Object.assign({},get('appointments',id)):Object.assign({status:'待确认',type:'妆娘'},preset||{});
  var shoot=function(V){ return isShootAppt(V); };
  var notShoot=function(V){ return !isShootAppt(V); };
  /* v1.2.2.2（P0）：记住"上一次渲染时这一格是预约单口径还是拍摄单口径"。
     之所以要记，是因为「已完成」「已取消」两个词在 APPT_STATUS 和 SESSION_STATUS 里**都存在**，
     光看 V.status 的值分不出该不该搬，只能靠"这次跨了分支"来判断。 */
  var wasShoot=shoot(cur);
  /* v1.2.2.2（P1 追加 · 定金口径）：预约单的「定金」只是"约定金额"，只有状态代表已付款时才真出过钱；
     而拍摄单的「已付定金」>0 会被 syncSessionExpense **立刻**记成一笔支出。所以把"未付款的预约单"转成
     拍摄单时，不能把约定定金当成已付带过去，否则凭空多记一笔。做法：**切入拍摄分支时只清一次**定金输入框
     （表单=真相），切回预约分支再还回去；用户之后填的任何金额都以用户为准（哪怕恰好等于原约定额）。
     depTouched 由字段的 onTouch 在用户手动编辑时置位，用来区分"用户真填了"和"还是默认值"。 */
  var paidBeforeCur=!(cur&&cur.id)||APPT_PAID_BEFORE.indexOf(cur.status)>=0;
  var origDep=numOrNull(cur.deposit);
  var depClearedByUs=false;
  var depTouched=false;
  openForm({
    title: shoot(cur) ? (id?'改成拍摄单（摄影师）':'约摄影师 · 拍摄单') : (id?'编辑预约单':'新建预约单'),
    values:cur,
    fields:[
      {k:'rowA',t:'row',cols:[
        {k:'type',l:'约谁做什么',t:'select',opts:APPT_TYPES,req:1,live:1,hint:'选「摄影师」= 直接开一张拍摄单'},
        /* v1.2.2.2（P0）：两个分支的状态选项集不同，切类型时必须"显式搬"状态，
           不能再让 syncSelectDefaults 把对不上的旧状态静默重置成第一项（那会让钱记错）。
           derive 在每次渲染前跑、早于 syncSelectDefaults，所以这里搬完后者会命中、不会再兜底。
           搬的时机 = 跨分支（wasShoot != nowShoot），否则同分支内不动用户的选择。 */
        {k:'status',l:'状态',t:'select',opts:function(V){return shoot(V)?SESSION_STATUS:APPT_STATUS;},req:1,live:1,
          derive:function(V){
            var now=shoot(V);
            if(now!==wasShoot){
              /* 刚跨过分支：按映射表把状态显式搬过去（已完成 ⇄ 已确认 这种差别的关键就在这一步） */
              V.status=now?(APPT_TO_SESSION[V.status]||'计划中'):(SESSION_TO_APPT[V.status]||'待确认');
            }else if(now){
              if(SESSION_STATUS.indexOf(V.status)<0) V.status=APPT_TO_SESSION[V.status]||'计划中';
            }else{
              if(APPT_STATUS.indexOf(V.status)<0) V.status='待确认';
            }
            wasShoot=now;
          }}
      ]},
      /* v1.2.2.2（P1-2）：没有任何项目时，这个下拉只剩一个空的「未关联」，
         如果还强制必填就会永远存不下去 → 有可选项时才要求必填 */
      {k:'projectId',l:'所属项目',t:'select',opts:function(){ var o=DB.projects.map(function(p){return {v:p.id,l:p.name};}); o.unshift({v:'',l:'未关联'}); return o; },live:1,req:function(V){return shoot(V)&&DB.projects.length>0;}},
      {k:'contactId',l:'手艺人（联系人）',t:'select',opts:function(){ var o=DB.contacts.map(function(c){return {v:c.id,l:c.cn+'（'+arr(c.roles).join('/')+'）'};}); o.unshift({v:'',l:'— 不选，手填 —'}); return o; },live:1},
      {k:'contactText',l:'手艺人（手填）',show:function(V){return !V.contactId;}},
      /* 摄影师分支：拍摄单的字段 */
      {k:'rowS',t:'row',show:shoot,cols:[
        {k:'date',l:'拍摄日期',t:'date',req:1,derive:function(V){
          /* 从预约单切过来时，约定时间里的日期与钟点直接搬到拍摄单上 */
          if(!V.date&&V.datetime){ V.date=String(V.datetime).slice(0,10); if(!V.time) V.time=String(V.datetime).slice(11,16); }
        }},
        {k:'time',l:'集合时间',t:'time'}
      ]},
      {k:'rowM',t:'row',show:shoot,cols:[
        {k:'method',l:'拍摄方式',t:'select',opts:SHOOT_METHODS,def:'约拍',req:function(V){return shoot(V);}},
        {k:'locationId',l:'场地',t:'select',opts:function(){ var o=DB.locations.map(function(l){return {v:l.id,l:l.name};}); o.unshift({v:'',l:'— 手填 —'}); return o; },live:1}
      ]},
      {k:'locationText',l:'场地（手填）',show:function(V){return shoot(V)&&!V.locationId;},
        derive:function(V){ if(shoot(V)&&!V.locationText&&V.place&&!V.locationId) V.locationText=V.place; }},
      /* v1.2.2.2（P2-2）：转换已有预约单（id 存在）时不强制填原因 —— 否则「已取消/爽约」的预约单转摄影师，
         一点保存就先被"请填写：改期/取消原因"挡住、根本看不到转换确认框。
         新建摄影师单（非转换）仍必须填；拍摄单状态 pill（setSessionStatus）那条拦截也不动。 */
      {k:'changeReason',l:'改期/取消原因',show:function(V){return shoot(V)&&['已改期','已取消'].indexOf(V.status)>=0;},req:function(V){return !id&&shoot(V)&&['已改期','已取消'].indexOf(V.status)>=0;}},
      /* 其他分支：预约单的字段 */
      {k:'rowB',t:'row',show:notShoot,cols:[
        {k:'datetime',l:'约定时间',t:'datetime-local'},
        {k:'place',l:'地点',ph:'上门/工作室/漫展现场'}
      ]},
      {k:'rowC',t:'row',cols:[
        {k:'fee',l:'总价',t:'money'},
        {k:'deposit',l:'定金',t:'money',hint:'拍摄单里「已付定金」>0 会立刻记一笔支出；未付款的预约单转过来时不带入',
          onTouch:function(){ depTouched=true; },
          derive:function(V){
            if(shoot(V)){
              /* 未付款的预约单 → 定金不该带进拍摄单：**只在切入拍摄分支时清一次**（用 depClearedByUs 守卫），
                 之后用户在拍摄分支里填的任何金额（哪怕等于原约定额）都不再被清。
                 原金额并进备注，见 saveSessionFromAppt。 */
              if(cur.id&&!paidBeforeCur&&origDep>0&&!depClearedByUs){ V.deposit=''; depClearedByUs=true; }
            }else if(depClearedByUs&&!depTouched&&(V.deposit===''||V.deposit===null||V.deposit===undefined)){
              /* 又切回预约分支：把刚才清掉的约定定金还回去，别把原预约单的定金改没了 */
              V.deposit=(origDep===null?'':origDep); depClearedByUs=false;
            }
          }}
      ]},
      {k:'g_detail',t:'group',l:'要求与参考（展开）',cols:[
        {k:'paidNote',l:'付款说明',show:notShoot,ph:'如：定金微信已转，尾款现场付'},
        {k:'requirement',l:'要求备注',t:'area',rows:3,ph:'妆面风格 / 毛型 / 时长 / 是否含睫毛'},
        {k:'refLinks',l:'妆面/造型参考链接',t:'links',c1:'说明',c2:'链接'},
        {k:'note',l:'备注',t:'area'}
      ]}
    ],
    onSave:function(V){
      var o=Object.assign({},cur,V,{id:cur.id||uid('a'),
        fee:numOrNull(V.fee), deposit:numOrNull(V.deposit),
        refLinks:arr(V.refLinks).filter(function(x){return x.url||x.label;}), updated_at:nowStamp()});
      ['rowA','rowB','rowC','rowS','rowM'].forEach(function(k){delete o[k];});
      if(isShootAppt(V)){
        /* 约定时间与地点由 saveSessionFromAppt 折进拍摄单的日期/场地，不会原样存进 sessions */
        if(id){
          /* v1.2.2.2（P1-1）：这条路径会删掉原预约单、又不走 applyAction 快照（保存即落定），
             所以必须先让用户确认；取消时原预约单原封不动（此刻还什么都没动）。
             注意 confirmBox 内部会对 text 做一次 esc()，这里只传纯文本、不要带标签。 */
          var who=contactLabel(cur.contactId)||cur.contactText||'待定';
          var carried=apptCarriedFields(o);
          var gated=convertVerdict(o,cur,depTouched).gated;
          closeModal();
          confirmBox('转成拍摄单',
            '「'+(cur.type||'预约')+' · '+who+'」这张预约单将被删除，改存成一张拍摄单。'+
            (carried.length?('  拍摄单没有对应字段的内容会并进备注，不会丢：'+carried.join('；')):'')+
            (gated>0?('  原预约单的定金 '+gated+' 还没有付款，不会计入拍摄单流水；若已补付，进拍摄单再填「已付定金」。'):'')+
            '  你在表单里改过的状态与定金，一律以表单为准。',
            function(){ deleteAppt(cur); saveSessionFromAppt(o,cur,depTouched); },'确认转换');
          return;
        }
        saveSessionFromAppt(o,cur,depTouched); return;
      }
      ['date','time','method','locationId','locationText','changeReason'].forEach(function(k){ delete o[k]; });
      put('appointments',o); syncApptExpense(o);
      var wig=ensureWigFromAppt(o);
      save(); render();
      toast('预约单已保存'+(wig?' · 顺手加了一件假发（'+wig.name+'）':''));
    }

/** v1.2.2.2（P1-1）：汇总"拍摄单装不下、要并进备注"的预约单字段，转换确认框与备注共用同一份清单 */
function apptCarriedFields(o){
  var out=[];
  if(o.place&&o.locationId) out.push('原地点：'+o.place);
  if(o.paidNote) out.push('付款：'+o.paidNote);
  var rl=arr(o.refLinks).filter(function(x){return x.url||x.label;});
  if(rl.length) out.push('参考链接：'+rl.map(function(x){return (x.label?x.label+' ':'')+(x.url||'');}).join(' / '));
  return out;
}
/** v1.2.2.2（P0-4 / P2-1）：开一张拍摄单本身就说明"这套已经在拍了"，项目还停在「计划中」就往前推一格。
    v1.2.2.2（P2-1）：约人转拍摄单 与 项目页「＋新建拍摄单」两个入口**共用这一套判断**，避免同一动作两入口副作用不同。
    规则：已取消 / 已改期 不推；只推「计划中→拍摄中」、不回退；没有关联项目时什么都不做。
    刻意不动 autoStage()，免得"把拍摄单滑回计划中"这类回退也误触发。 */
function nudgeStageForShoot(cur){
  if(!cur||['已取消','已改期'].indexOf(cur.status)>=0) return false;
  var p=get('projects',cur.projectId);
  if(!p||p.stage!=='计划中') return false;
  doSetStage(p,'拍摄中');
  return true;
}
/** 摄影师档期 → 拍摄单：约人只留一个入口，钱与定金走同一套自动流水。
    v1.2.2.2（P1 追加）：状态与定金都以**表单为准**（表单已用 derive 把预约单口径显式搬成拍摄单口径，
    并在"未付款"时清空了定金输入框），所以用户在转换时手改的状态/定金不会再被静默丢弃；
    打开那一刻的 cur.status 只在表单值非法时兜底。具体的判定见 convertVerdict()。 */
function saveSessionFromAppt(o,cur,depTouched){
  var dt=String(o.datetime||'');
  var v=convertVerdict(o,cur,depTouched);
  /* v1.2.2.2（P1-1）：拍摄单没有的字段一律并进备注，不许静默丢 */
  var carried=apptCarriedFields(o);
  /* 未付款预约单的"约定定金"没有入账：把原金额补进备注，别让信息无声消失 */
  if(v.gated>0) carried.push('原预约单定金 '+v.gated+'（未付款，未入账）');
  var s={
    id:uid('s'), projectId:o.projectId||'',
    date:o.date||dt.slice(0,10)||'', time:o.time||dt.slice(11,16)||'',
    method:o.method||'约拍', contactId:o.contactId||'',
    photographerText:o.contactId?'':(o.contactText||''),
    locationId:o.locationId||'', locationText:(o.locationId?'':(o.locationText||o.place||'')),
    fee:numOrNull(o.fee), deposit:v.sDeposit,
    status:v.sStatus,
    changeReason:o.changeReason||'', timeline:cur.timeline||'', backup:cur.backup||'',
    checklist:arr(cur.checklist),
    note:[o.note,carried.join('；'),o.requirement?('要求：'+o.requirement):''].filter(Boolean).join(' '),
    created_at:cur.created_at||nowStamp(), updated_at:nowStamp()
  };
  put('sessions',s); syncSessionExpense(s);
  var moved=nudgeStageForShoot(s);
  save(); render();
  toast('已存成拍摄单'+(moved?' · 项目自动转「拍摄中」':''));
  go('session',{sessionId:s.id,projectId:s.projectId,tab:'projects'});
}
/** v1.2.2.2（P2-5）：判断一件装备是不是"约毛娘时自动生成的那顶假发"。
    不能只看 kind==='假发' —— 用户把类别改成别的（或改名）就会判重失效、再建一顶。
    用持久标记 autoFrom + 生成时的备注文案做双保险（改名不影响，备注被改也没事，有标记兜底）。 */
function isAutoWig(i){
  if(!i) return false;
  if(i.autoFrom==='appt') return true;

function listRow(o){
  var inner=`<div class="main"><div class="t">${o.t}</div>${o.d?`<div class="d">${o.d}</div>`:''}</div>`
    + (o.r?`<div class="r">${o.r}</div>`:'') + (o.badge?`<div>${o.badge}</div>`:'');
  var click=o.onclick?`onclick="${o.onclick}"`:'';
  var lp=o.lp?` data-lp="${o.lp}"`:'';                 /* v1.3：长按 3 秒 = 删除入口 */
  /* v1.5.8.2（评审 P1-2）：列表行原来是裸 div[onclick]，键盘与读屏完全用不了
     （实测装备页可聚焦元素只有 12 个，12 件装备一行都聚焦不到）。
     加 role=button + tabindex=0，回车/空格由 #main 上的委托监听触发（initRowKeys）。 */
  var a11y=(o.onclick?' role="button" tabindex="0"':'');
  if(!o.sw) return `<div class="row ${o.cls||''}" ${click}${lp}${a11y}>${inner}</div>`;
  return `<div class="row ${o.cls||''} sw" data-sw="${o.sw}" ${click}${lp}${a11y}>${swWrap(`<div class="swrow">${inner}</div>`)}</div>`;

function render(){
  var t=document.getElementById('topbar'), m=document.getElementById('main');
  var af=document.activeElement, aid=af&&af.id, apos=null, aval=null;
  try{ if(af&&af.setSelectionRange){ apos=af.selectionStart; aval=af.value; } }catch(e){}
  /* 1.2.2：滑动槽里的横向滚动位置在重绘后保持原样（点一个 chip 就弹回最左边很碍事） */
  var scrollKeep={};
  m.querySelectorAll('.pill-row[data-sk]').forEach(function(el){ scrollKeep[el.getAttribute('data-sk')]=el.scrollLeft; });
  var html='';
  switch(S.view){
    case 'home': html=vHome(); break;
    case 'projects': html=vProjects(); break;
    case 'archived': html=vArchived(); break;
    case 'project': html=vProject(); break;
    case 'assets': html=vAssets(); break;
    case 'cmp': html=vCompare(); break;
    case 'asset': html=vAsset(); break;
    case 'team': html=vTeam(); break;
    case 'contact': html=vContact(); break;
    case 'location': html=vLocation(); break;
    case 'session': html=vSession(); break;
    case 'onsite': html=vOnsite(); break;
    case 'mine': html=vMine(); break;
    case 'intents': html=vIntents(); break;   /* v1.5.9 意向池 */
    default: html=vHome();
  }
  /* v1.5.8 P2：写盘失败的红条挂在每一页最上面（出装日现场模式也一样，滑不走它） */
  html = saveBarHtml() + html;
  m.innerHTML=html;
  m.querySelectorAll('.pill-row[data-sk]').forEach(function(el){
    var k=el.getAttribute('data-sk');
    if(scrollKeep[k]) el.scrollLeft=scrollKeep[k];
  });
  try{ markScrollables(m); }catch(e){}   /* v1.5.8.2：横滑槽的「还能往右滑」渐隐标记 */
  try{ markInlineActions(m); }catch(e){}   /* v1.5.8.3：行内小动作补 role/tabindex，键盘够得到 */
  /* v1.5.8.3：:has() 的兜底类（老内核里 CSS 那条不生效，只能由 JS 打标） */
  try{ if(m.querySelector('.fab')) m.classList.add('fab-on'); else m.classList.remove('fab-on'); }catch(e){}
  t.innerHTML=vTopbar();
  renderTabbar();
  try{ hydrateImgs(m); }catch(e){}   /* v1.4：把 img[data-imgid] 占位符异步填上 */
  /* 1.3.4：出装日是独立全屏（藏掉底栏与常规顶栏，只留这一套的当天内容）；只有换屏才播一次进场过渡 */
  /* v1.4.1：对比页同样藏掉底栏（不用 classList.toggle：部分老内核/测试桩没有带 force 的 toggle） */
  if(S.view==='onsite') document.body.classList.add('onsite-mode'); else document.body.classList.remove('onsite-mode');
  if(S.view==='cmp') document.body.classList.add('cmp-mode'); else document.body.classList.remove('cmp-mode');
  try{
    m.classList.remove('view-in');                       /* 同屏重绘不留动画类 */
    if(render._lastView!==S.view){ render._lastView=S.view; void m.offsetWidth; m.classList.add('view-in'); }
  }catch(e){}
  if(aid){
    var el=document.getElementById(aid);
    if(el){ try{ el.focus(); if(aval!=null&&el.value!==aval) el.value=aval; if(apos!=null) el.setSelectionRange(apos,apos); }catch(e){} }
  }
}

   首页：提醒 + 概览（M12 时间线聚合）
   ========================================================= */
function upcomingEvents(days){
  var out=[];
  DB.sessions.forEach(function(s){
    var d=dayDiff(s.date);
    if(d!==null && d>=0 && d<=days && s.status!=='已取消') out.push({due:s.date+(s.time?' '+s.time:''),kind:'拍摄',title:(s.method||'拍摄')+' · '+projLabel(s.projectId)+(s.locationId?' @'+locationLabel(s.locationId):(s.locationText?' @'+s.locationText:'')),to:'session',id:s.id});
  });
  DB.appointments.forEach(function(a){
    var d=dayDiff((a.datetime||'').slice(0,10));
    if(a.datetime && d!==null && d>=0 && d<=days && ['已完成','已结清','已取消','爽约'].indexOf(a.status)<0)
      out.push({due:a.datetime,kind:'妆造',title:a.type+' · '+(contactLabel(a.contactId)||a.contactText||'待定')+'（'+a.status+'）',to:'project',id:a.projectId});
  });
  DB.projects.forEach(function(p){
    if(isDoneStage(p)) return;
    var d=dayDiff(p.deadline);
    /* 1.3.4.2（复核 P3-3）：「接下来」要有下界 —— 过了期的只留给上面「需要处理」，不在这里重复出现 */
    if(d!==null && d>=0 && d<=days) out.push({due:p.deadline,kind:'deadline',title:p.name+' 计划完成日（'+p.stage+'）',to:'project',id:p.id});
  });
  DB.todos.forEach(function(t){
    if(t.done) return;
    var d=dayDiff(t.due);
    /* 1.3.4.2（复核 P3-3 + P2-3B）：同样只列还没到期的；没关联项目的待办不许借 S.projectId 冒充跳转目标 */
    if(d!==null && d>=0 && d<=days) out.push({due:t.due,kind:'待办',title:t.title+(t.projectId?' · '+projLabel(t.projectId):''),to:'project',id:t.projectId||''});
  });
  DB.items.forEach(function(i){
    if(i.kind==='美瞳'&&i.expiresAt){ var d=dayDiff(i.expiresAt); if(d!==null&&d<=days&&d>=-365) out.push({due:i.expiresAt,kind:'美瞳到期',title:i.name+' 到期（'+(i.status||'')+'）',to:'asset',id:i.id}); }
    if(lowStockOf(i)) out.push({due:'',kind:'低库存',title:i.name+' 仅剩 '+i.qty+'，低于阈值 '+i.lowQty,to:'asset',id:i.id});
    if(i.borrowFrom&&i.borrowDue){ var d2=dayDiff(i.borrowDue);   /* v1.5 借入到期：提前 7 天到逾期都提醒 */
      if(d2!==null&&d2<=7&&d2>=-60) out.push({due:i.borrowDue,kind:'借入到期',title:'「'+i.name+'」该还了：借自 '+(i.borrowFrom||'？')+(d2<0?('（已逾期 '+(-d2)+' 天）'):''),to:'asset',id:i.id}); }
    if(i.rentDue&&i.source==='租赁'&&isLiveItem(i)){ var d3=dayDiff(i.rentDue);   /* v1.5.6：只在来源仍是租赁、且这件还没处置时提醒（1.5.5 只看字段非空，改过来源/已报废还在 nag） */
      if(d3!==null&&d3<=3&&d3>=-30) out.push({due:i.rentDue,kind:'租赁到期',title:'「'+i.name+'」租期'+(d3<0?('已逾期 '+(-d3)+' 天，快还'):('还剩 '+d3+' 天'))+'，归还日 '+i.rentDue,to:'asset',id:i.id}); }
  });
  /* v1.5.9：意向池里写了"想出的时间"的，进时间线催一下；已进流程/已拔草的不催 */
  arr(DB.intents).forEach(function(x){
    if((x.status||'在池子里')!=='在池子里'||!x.when) return;
    var d=dayDiff(x.when);
    if(d!==null&&d>=0&&d<=days) out.push({due:x.when,kind:'意向',title:intentLabel(x)+' 想出（意向池）',to:'intent',id:x.id});
  });
  return sortAsc(out.map(function(x){x._k=x.due||'9999';return x;}),'_k');
}
function gotoTarget(to,id){
  /* 1.1.2 修复：从首页点进别的项目下的拍摄单时没带 projectId，返回会跳到上一个看过的项目 */
  if(to==='session'){ var s=get('sessions',id); go('session',{sessionId:id,projectId:s?s.projectId:(S.projectId||''),tab:'projects'}); }
  else if(to==='asset') go('asset',{itemId:id,tab:'assets'});
  else if(to==='project'){
    /* 1.3.4.2（复核 P2-3B）：逾期待办/提醒可能没关联项目（或项目已删）——
       不许落到「项目不存在」死屏，回项目列表并说一声 */
    if(!id || !get('projects',id)){ go('projects',{tab:'projects'}); toast('这条记录没有关联项目（或项目已删除）'); return; }
    go('project',{projectId:id,tab:'projects'});
  }
  /* v1.5.9：首页「需要处理」里的条款提醒跳回这张单据的条款卡；意向直接进池子 */
  else if(to==='appt'){
    var a=get('appointments',id);
    if(!a){ go('projects',{tab:'projects'}); toast('这条预约单已经删了'); return; }
    /* 预约单可以没有所属项目（1.2.2.2 P1-2 就是这个口径），项目也可能被删 ——
       不许落到「项目不存在」那一屏（与上面 project 分支同一条护栏），直接原地开条款卡。 */
    if(a.projectId&&get('projects',a.projectId)) go('project',{projectId:a.projectId,tab:'projects'});
    else { go('team',{tab:'team',teamTab:'contacts'}); toast('这张预约单没有所属项目（或项目已删除）'); }
    termsSheet('appt',id);
  }
  else if(to==='intent') go('intents',{tab:'projects'});
}

function projectStats(p){
  var its=itemsOfProject(p.id);
  var spent=sum(expsOf(p.id),'amount');
  var back=its.reduce(function(t,i){ return t+soldBack(i); },0);
  var cnt=projItemCounts(p.id);
  var ss=sessionsOf(p.id);
  var od=overdueDelivsIn(ss.map(function(s){ return s.id; })).length;
  /* n=台账全部（长按删除那一步要说清会删掉几件）；live/readyLive 才是进度口径（已处置的件永远不可能就绪） */
  return {its:its,spent:spent,back:back,ready:cnt.ready,n:cnt.all,live:cnt.live,readyLive:cnt.ready,gone:cnt.gone,ss:ss,od:od};
}

/* v1.2：五个分页并成四个（拍摄与人员 + 成片 = 拍摄），窄屏放得下，流程也是顺的 */
var PROJ_TABS=[['base','概览'],['gear','装备'],['shoot','拍摄'],['cost','费用']];
function projectGaps(p){
  var st=projectStats(p), g=[], its=st.its;
  if(!its.length) g.push('还没有登记任何 C服/道具/配件');
  if(!its.filter(function(i){return i.kind==='C服'||i.kind==='鞋'||i.kind==='饰品';}).length) g.push('缺 C服条目');
  if(!its.filter(function(i){return i.kind==='假发';}).length) g.push('缺假发（自剪还是约毛娘？）');
  var appts=DB.appointments.filter(function(a){return a.projectId===p.id;});
  var needMakeup=['日常自娱','场照'].indexOf(p.occasion)<0;
  if(needMakeup&&!appts.filter(function(a){return a.type==='妆娘';}).length) g.push('未约妆娘');
  if(needMakeup&&!appts.filter(function(a){return a.type==='毛娘';}).length && !its.filter(function(i){return i.kind==='假发'&&i.wigStyle==='已造型';}).length) g.push('未约毛娘 / 假发未造型');
  if(!st.ss.length) g.push('还没有拍摄单');
  if(p.stage==='拍摄中'&&!st.ss.filter(function(s){return s.status==='已确认';}).length) g.push('拍摄单未确认（时间/场地/摄影师）');
  if(st.ss.filter(function(s){return s.status==='已完成';}).length && !DB.deliverables.some(function(d){return st.ss.some(function(s){return s.id===d.sessionId;});})) g.push('已拍但没登记原片/精修交付');
  /* v1.2 联动：片子都返了却还没有任何发布记录，多半是忘了记 */
  if(st.ss.some(function(x){return delivsOf(x.id).some(function(d){return d.status==='已返图';});}) && !DB.publications.some(function(b){return b.projectId===p.id;}))
    g.push('已返图但没记发布：发出去这套才算用完');
  var pend=appts.filter(function(a){return ['待确认','已定档'].indexOf(a.status)>=0 && num(a.fee)>num(a.deposit);});
  if(pend.length) g.push('有预约单未付定金：'+pend.map(function(a){return a.type;}).join('、'));
  if(!st.spent) g.push('还没有费用流水（可能漏记）');
  if(p.budget && st.spent>p.budget) g.push('⚠ 已超出预算 '+money(st.spent-p.budget)+' 元');
  return g;
}
function doSetStage(p,st){

function assetExpiryWarn(i){

  if(i.kind==='美瞳'&&i.expiresAt&&dayDiff(i.expiresAt)<=30) return '美瞳将于 '+dueText(i.expiresAt)+' 到期';
  if(lowStockOf(i)) return '库存偏低：'+(i.qty||0)+' ≤ '+(i.lowQty||0);
  return '';

/** v1.4 上身反馈清洗：部位 + 判断（偏大/合身/偏小）+ 备注，全空行丢掉 */
function normFits(list){
  return arr(list).map(function(x){
    var part=String(x&&x.part||'').trim(), verdict=String(x&&x.verdict||'').trim(), note=String(x&&x.note||'').trim();
    if(FIT_VERDICTS.indexOf(verdict)<0) verdict='';
    return {part:part,verdict:verdict,note:note};
  }).filter(function(x){ return x.part||x.note; });
}
/** v1.4 一件装备的上身反馈渲染成小标签（对比表与详情页共用） */
function fitsSummary(i){
  var fs=arr(i.fits); if(!fs.length) return '';
  return fs.map(function(f){
    var cls=f.verdict==='偏大'?'big':(f.verdict==='偏小'?'small':'ok');
    return '<span class="fitv '+cls+'">'+esc((f.part||'')+' '+(f.verdict||''))+'</span>'+(f.note?'<div class="tiny muted">'+esc(f.note)+'</div>':'');
  }).join('');
}

   v1.4 ①：装备对比（同类装备摆一起，像手机配置对比页）
   ========================================================= */
/* v1.4.1：行序按重要度排——商家、图片、价格、还原度、尺码、预期发到货、评测、备注；其余排后。
   行结构：[名称, 单元格HTML(i), 可选的"差异判据"(i)→字符串]；不给判据就用单元格 HTML 比对。 */
var CMP_ROWS=[
  ['商家 / 渠道',function(i){return esc([i.source,i.shop].filter(Boolean).join(' · '));}],
  ['图片',function(i){
    var ids=arr(i.imgs);
    return (ids.length?'<img data-imgid="'+esc(ids[0])+'" alt="装备图片" style="width:96px;height:96px;object-fit:cover;border-radius:9px;background:var(--gray-soft);display:block;margin-bottom:4px;cursor:zoom-in">'+(ids.length>1?'<div class="tiny muted">共 '+ids.length+' 张，点进详情看全部</div>':''):'<div class="tiny muted">未上传</div>')+
      '<button class="btn sm gray" style="margin-top:4px" onclick="pickImgs(\'item\',\''+i.id+'\')">＋ 图片</button>';
  },function(i){ return arr(i.imgs).length>0?'有图':'无图'; }],
  ['价格',function(i){return (i.price!=null&&i.price!=='')?money(i.price)+' 元':'';}],
  ['还原度',function(i){return esc(i.restore||'');}],
  ['尺码',function(i){return esc(i.size||'');}],
  ['预期发到货',function(i){return esc([i.etaShip?('预计发货 '+i.etaShip):'',i.trackingNo?('单号 '+i.trackingNo):'',i.etaArrive?('预计到货 '+i.etaArrive):''].filter(Boolean).join(' · '));}],
  ['评测',function(i){return esc(i.review||'');}],
  ['备注',function(i){return esc(i.note||'');}],
  ['状态',function(i){return statusBadge(i.status);}],
  ['分类',function(i){return esc([i.kind,i.category].filter(Boolean).join(' / '));}],
  ['角色',function(i){return esc(charLabel(i.characterId));}],
  ['下单 → 到手',function(i){return esc([i.orderDate,i.arrivedDate].filter(Boolean).join(' → '));}],
  ['放在哪儿',function(i){return esc(i.storage||'');}],
  ['上身反馈',function(i){return fitsSummary(i);}],
  ['去向',function(i){return isDisposalStatus(i.status)?esc([i.dispKind||i.dispType,i.dispTo?('→ '+i.dispTo):''].filter(Boolean).join(' · ')):'';}]
];
var CMP_KIND={
  '道具':[['制作',function(i){return esc([i.makeStage,i.makeProgress!=null?i.makeProgress+'%':''].filter(Boolean).join(' '))+(i.fragile?'<div class="tiny muted">'+esc(i.fragile)+'</div>':'');}]],
  '假发':[['毛色 / 长度',function(i){return esc([i.wigColor,i.wigLen].filter(Boolean).join(' · '));}],
          ['造型',function(i){return esc([i.wigStyle,i.wigBy?('by '+i.wigBy):''].filter(Boolean).join(' · '));}]],
  '美瞳':[['品牌 / 直径',function(i){return esc([i.clBrand,i.clDia?('直径 '+i.clDia):''].filter(Boolean).join(' · '));}],
          ['度数',function(i){return esc('L '+(i.powerL||'0')+' / R '+(i.powerR||'0'));}],
          ['抛型 / 到期',function(i){return esc([i.throwType,i.expiresAt?('到期 '+i.expiresAt):''].filter(Boolean).join(' · '));}]],
  '消耗品':[['库存',function(i){return esc((i.qty!=null?('剩 '+i.qty):'')+(i.lowQty>0?((i.qty!=null?' / 阈值 ':'阈值 ')+i.lowQty):''))+(lowStockOf(i)?' <span class="fitv big">库存偏低</span>':'');}]]
};
function cmpItems(){ return S.cmp.ids.map(function(id){ return get('items',id); }).filter(Boolean); }
function cmpAdd(iid){
  var it=get('items',iid); if(!it) return;
  if(S.cmp.ids.indexOf(iid)>=0) return;
  if(S.cmp.ids.length>=4){ toast('一次最多对比 4 件，先移走一件'); return; }
  if(!S.cmp.kind){ S.cmp.kind=it.kind||''; }
  else if(S.cmp.kind!==it.kind){ toast('同一轮只对比同一类（当前：'+S.cmp.kind+'）'); return; }
  S.cmp.ids.push(iid); render();
}
function cmpRemove(iid){ S.cmp.ids=S.cmp.ids.filter(function(x){return x!==iid;}); if(!S.cmp.ids.length) S.cmp.kind=''; render(); }
function cmpKind(k){ if(S.cmp.kind===k) return; S.cmp.kind=k; S.cmp.ids=S.cmp.ids.filter(function(id){ var it=get('items',id); return it&&it.kind===k; }); render(); }
function cmpToggleDiff(){ S.cmp.onlyDiff=!S.cmp.onlyDiff; render(); }
function cmpClear(){ S.cmp={kind:'',ids:[],onlyDiff:false}; render(); }
function vCompare(){
  var items=cmpItems();
  var kind=S.cmp.kind;
  var cand=DB.items.filter(function(i){ return i.id && S.cmp.ids.indexOf(i.id)<0 && (!kind||i.kind===kind); });
  var h=`<div class="card flat" style="padding:10px">
    <div class="tiny muted" style="margin-bottom:6px">点下面的装备直接加（首件自动锁定类别，最多 4 件）；商家、图片、价格、还原度、尺码、预期发到货、评测并排看差异，每列都能现场补拍图或新建一件。</div>
    <div class="pill-row" data-sk="cmpkind">${ASSET_KINDS.map(function(k){
      return `<button class="chip ${kind===k?'on':''}" onclick="cmpKind('${k}')">${k}${kind===k?' ✓':''}</button>`;
    }).join('')}</div>
    <div class="chips"><button class="chip ${S.cmp.onlyDiff?'on':''}" onclick="cmpToggleDiff()">只看不同</button>
    <button class="chip back" onclick="cmpClear()">清空重来</button></div>
  </div>`;
  if(items.length){
    h+='<div class="card"><h3>在对比的装备<span class="cnt">'+items.length+'/4</span><span class="act" onclick="go(\'assets\',{tab:\'assets\'})">回台账 ›</span></h3>'+
      '<div class="pill-row" data-sk="cmpsel">'+items.map(function(i){
        return `<span class="chip" onclick="go('asset',{itemId:'${i.id}',tab:'assets'})">${esc(i.name)} <b onclick="event.stopPropagation();cmpRemove('${i.id}')" style="color:var(--danger);cursor:pointer;font-weight:400">✕</b></span>`;
      }).join('')+'</div></div>';
    var rows=CMP_ROWS.slice();
    (CMP_KIND[kind]||[]).forEach(function(r){ rows.push(r); });
    h+='<div class="card"><h3>对比</h3><div class="cmp-wrap"><table class="cmp"><thead><tr><th class="k"></th>'+
      items.map(function(i){ return '<th>'+esc(i.name)+'<div class="tiny muted">'+esc(i.kind||'')+'</div></th>'; }).join('')+
      '</tr></thead><tbody>';
    rows.forEach(function(r){
      var diffFn=r[2]||r[1];
      var vals=items.map(function(i){ return diffFn(i); });
      var diff=vals.some(function(v){ return v!==vals[0]; });
      if(S.cmp.onlyDiff&&!diff) return;
      h+='<tr class="'+(diff?'diff':'')+'"><td class="k">'+esc(r[0])+'</td>'+items.map(function(i){ return '<td>'+(r[1](i)||'<span class="muted">—</span>')+'</td>'; }).join('')+'</tr>';
    });
    h+='</tbody></table></div></div>';
  }else{
    h+='<div class="card">'+emptyBox('还没选装备：先在上面点一类，再从下面加进来')+'</div>';
  }
  h+='<div class="card"><h3>加入对比<span class="cnt">'+(kind?esc(kind):'全部类别')+(cand.length?(' · '+cand.length+' 件可选'):'')+'</span><span class="act" onclick="formItem(null,'+(kind?("{kind:'"+kind+"'}"):'{}')+')">＋ 新建一件来对比</span></h3>';
  if(!cand.length) h+=emptyBox(kind?'这一类里没有更多可加的装备了，点右上「＋ 新建一件来对比」':'台账还是空的，先去「装备」页加几件');
  else h+=cand.map(function(i){
    return listRow({t:esc(i.name)+' '+statusBadge(i.status),
      d:(kind?'':esc(i.kind)+' · ')+esc(charLabel(i.characterId))+(i.price?' · ¥'+money(i.price):'')+(i.size?' · '+esc(i.size):''),
      r:'＋ 加入',onclick:`cmpAdd('${i.id}')`});
  }).join('');
  h+='</div>';
  return h;
}
function vAssets(){
  /* 1.3.4.2（复核 P3-1）：筛选里存着已删除角色的幽灵 id 时归零 —— 显示"全部角色"却少几件最骗人 */
  if(S.assetRole && S.assetRole!=='__none' && S.assetRole!=='__gone' && !charAlive(S.assetRole)) S.assetRole='';
  var list=DB.items.slice();
  if(S.assetTab&&S.assetTab!=='全部') list=list.filter(function(i){return i.kind===S.assetTab;});
  if(S.assetAvailable) list=list.filter(isLiveItem);
  if(S.assetStatus) list=list.filter(function(i){return i.status===S.assetStatus;});
  /* 1.3.4.2（复核 P1-1）：角色筛选只有 matchAssetRole 一份算法。
     旧版先按 i.characterId===S.assetRole 精确匹配（'__none' 永远匹配不到 → 列表被清空），
     再在空数组上做"通用"补救 —— 从 1.1.2 起选「通用」永远是空列表。 */
  if(S.assetRole) list=list.filter(function(i){ return matchAssetRole(i,S.assetRole); });
  if(S.assetQ){ var q=String(S.assetQ).toLowerCase();
    list=list.filter(function(i){ return (i.name+' '+(i.kind||'')+' '+(i.category||'')+' '+(i.shop||'')+' '+(i.storage||'')+' '+charLabel(i.characterId)).toLowerCase().indexOf(q)>=0; }); }
  list=sortDesc(list,'updated_at');
  var term=DB.items.length-liveItems().length;
  var h=`<div class="card flat" style="padding:10px">
    <input type="text" id="qAsset" placeholder="搜索装备：名称 / 店铺 / 存放位置 / 角色" value="${esc(S.assetQ)}" oninput="S.assetQ=this.value;render()" style="width:100%;border:1px solid var(--key-edge);border-radius:8px;padding:9px 11px;background:var(--card);box-shadow:inset 0 2px 3px rgba(30,32,60,.08)">
    <div class="pill-row" data-sk="kind" style="margin-top:6px">${['全部'].concat(ASSET_KINDS).map(function(k){
      var n=k==='全部'?DB.items.length:DB.items.filter(function(i){return i.kind===k;}).length;
      return `<button class="chip ${S.assetTab===k?'on':''}" onclick="S.assetTab='${k}';render()">${k} ${n}</button>`;
    }).join('')}</div>
    <div class="pill-row" data-sk="filter">
      <button class="chip ${S.assetAvailable?'on':''}" onclick="S.assetAvailable=!S.assetAvailable;render()" title="隐藏留作纪念与报废/已售">只看在手</button>
      <select class="f-sel" onchange="S.assetStatus=this.value;render()">
        <option value="">全部状态</option>${ITEM_STATUS.map(function(s){return `<option value="${s}" ${S.assetStatus===s?'selected':''}>${s} ${DB.items.filter(function(i){return i.status===s;}).length}</option>`;}).join('')}</select>
      <select class="f-sel" onchange="S.assetRole=this.value;render()">
        <option value="">全部角色</option>${DB.characters.map(function(c){return `<option value="${c.id}" ${S.assetRole===c.id?'selected':''}>${esc(charLabel(c.id))}</option>`;}).join('')}
        <option value="__none" ${S.assetRole==='__none'?'selected':''}>通用 ${DB.items.filter(function(i){return !i.characterId;}).length}</option>
        ${orphanRoleCount()?`<option value="__gone" ${S.assetRole==='__gone'?'selected':''}>（角色已删） ${orphanRoleCount()}</option>`:''}</select>
    </div>
  </div>`;
  h+=swipeHintBox();
  h+= list.length? `<div class="card"><h3>结果<span class="cnt">${list.length} 条 · 挂价 ${money(sum(list,'price'))} 元</span></h3>${list.map(function(i){return assetRow(i,S.assetTab==='全部');}).join('')}</div>`
    : emptyBox('没有符合条件的装备');
  if(term&&!S.assetAvailable) h+=`<div class="muted tiny" style="text-align:center">另有 ${term} 条已处置（留作纪念 / 报废/已售）记录，在上方状态里可以筛出来</div>`;
  return h+`<button class="fab" onclick="formItem()">＋</button>`;
}

  var h=`<div class="card"><div class="stage-head"><h2 data-qe="name" data-qid="${jsid(i.id)}" ondblclick="quickEditItem('${jsid(i.id)}','name')" title="双击改名">${esc(i.name)}<span class="pen" onclick="event.stopPropagation();qePen(this)">✎</span></h2>

    <div class="pill-row" data-sk="advance" style="margin-top:8px">${nxt.map(function(s){var back=ITEM_SWIPE_PREV[i.status]===s;return `<button class="chip${back?' back':''}" onclick="advanceStatus('${i.id}','${s}')">${back?'‹ '+s:s+' ›'}</button>`;}).join('')}</div>

  rows+=qke(i.id,'price','价格',i.price?money(i.price)+' 元':'');
  rows+=qkv(i.id,'buy','渠道 / 链接',[i.shop?esc(i.shop):'',i.link?linkOrText(i.link,i.link):''].filter(Boolean).join(' ')||'<span class="muted">—</span>');
  rows+=qke(i.id,'dates','下单 / 到手',[i.orderDate,i.arrivedDate].filter(Boolean).join(' → '));
  rows+=qke(i.id,'storage','存放位置',i.storage);
  rows+=qke(i.id,'restore','还原度',i.restore);
  if(i.borrowFrom) rows+=qke(i.id,'borrow','借入',[i.borrowFrom,i.borrowDue?('应还 '+i.borrowDue):''].filter(Boolean).join(' · '));
  if(i.etaShip||i.trackingNo||i.etaArrive)
    rows+=qke(i.id,'logi','物流',[i.etaShip?('预计发货 '+i.etaShip):'',i.trackingNo?('单号 '+i.trackingNo):'',i.etaArrive?('预计到货 '+i.etaArrive):''].filter(Boolean).join(' · '));
  if(i.review) rows+=qke(i.id,'review','评测',i.review);
  rows+=qkv(i.id,'fits','上身反馈',(function(){
    var fs=arr(i.fits).filter(function(f){return f.part||f.note;});
    if(!fs.length) return '<span class="muted">—</span>';
    return fs.map(function(f){
      var cls=f.verdict==='偏大'?'big':(f.verdict==='偏小'?'small':'ok');
      return '<div style="margin-bottom:3px"><span class="fitv '+cls+'">'+esc((f.part||'')+' '+(f.verdict||''))+'</span>'+(f.note?'<span class="tiny muted"> '+esc(f.note)+'</span>':'')+'</div>';
    }).join('');
  })());
  if(i.kind==='道具'){
    rows+=qke(i.id,'make','制作进度',[i.makeStage,i.makeProgress!=null?i.makeProgress+'%':''].filter(Boolean).join(' '));
    rows+=qke(i.id,'make','易损/运输',i.fragile);
  }
  if(i.kind==='假发'){
    rows+=qke(i.id,'wig','毛色 / 长度',[i.wigColor,i.wigLen].filter(Boolean).join(' · '));
    rows+=qke(i.id,'wig','造型',[i.wigStyle,i.wigBy?'by '+i.wigBy:''].filter(Boolean).join(' '));
  }
  if(i.kind==='美瞳'){
    rows+=qke(i.id,'cl','品牌/花色',[i.clBrand,i.clDia?'直径 '+i.clDia:''].filter(Boolean).join(' · '));

      + '</div>',

  var es=DB.expenses.filter(function(e){return e.refType==='item'&&e.refId===i.id;});
  if(es.length) h+=card('费用流水',es.map(function(e){return `<div class="kv"><div class="k">${esc(e.date)}</div><div class="v">${badge(e.category,'b-info')} ${money(e.amount)} 元 · ${esc(e.note||'')} ${e.projectId?'· '+esc(projLabel(e.projectId)):''}</div></div>`;}).join(''),null);
  return h;
}
/* 1.1.2：删除 iLink。它两个分支返回同一个值、是空操作，真正的转义在 linkOrText 里完成 */
/** 装备状态统一入口。opts.quiet：滑动/撤销路径用，由调用方负责 render 与提示 */
function advanceStatus(iid,st,opts){
  var i=get('items',iid); if(!i) return false;
  opts=opts||{};
  if(isDisposalStatus(st)){ formItem(iid,{status:st}); toast('请补记去向（CN）与日期'); return false; }
  i.status=st; i.updated_at=nowStamp();
  /* v1.2 联动：滑到「已下单/制作中」顺手补今天，自动流水的日期才不会落在无日期的旧数据上 */
  if(st==='已下单/制作中'&&!i.orderDate) i.orderDate=todayISO();
  if(st==='已到货'&&!i.arrivedDate) i.arrivedDate=todayISO();
  if(!isDisposalStatus(st)){ i.dispType=''; i.dispKind=''; i.dispTo=''; i.dispDate=''; i.dispPrice=null; i.dispReason=''; }
  put('items',i); syncItemExpense(i);
  if(!opts.quiet){ save(); render(); toast('「'+i.name+'」已推进到「'+st+'」'); }
  return true;
}
function delItemConfirm(iid){
  /* v1.3：与长按删除同一套三级确认（原来只有一层 confirm，删错了没法回头） */
  lpItem(iid);
}

function checklistText(i){ return i.name+'（'+(i.kind||'')+(i.storage?' · '+i.storage:'')+'）'; }
function syncChecklist(sid){
  var s=get('sessions',sid); if(!s) return;
  /* v1.3.1（P1-5）：按"装备 id"认领旧行，而不是按文本。
     以前用 checklistText(i) 当 key，而那段文案里带"放在哪儿"——
     现场页顺手改一下存放位置，重新生成时文本对不上，旧行认不回来，已打的勾就全没了。 */
  var oldById={}, oldByText={};
  arr(s.checklist).forEach(function(c){
    if(!c) return;
    if(c.itemId) oldById[c.itemId]=c;
    else if(c.text) oldByText[c.text]=c;
  });
  var desired=checklistWant(s.id);
  var out=desired.map(function(d){
    var o=null;
    if(d.itemId && oldById[d.itemId]){ o=oldById[d.itemId]; delete oldById[d.itemId]; }
    else if(!d.itemId && oldByText[d.text]){ o=oldByText[d.text]; delete oldByText[d.text]; }
    /* 认回来的行：文案跟着最新走（存放位置改了要刷新），勾选状态原样保留 */
    if(o) return Object.assign(o,{text:d.text,itemId:d.itemId||null,kit:!!d.kit});
    return {id:uid('c'),text:d.text,itemId:d.itemId||null,kit:!!d.kit,checked:false};
  });
  /* 用户手动加的项目保留；已脱离本项目的装备行自动消失 */
  Object.keys(oldByText).forEach(function(t){ out.push(oldByText[t]); });
  s.checklist=out; s.updated_at=nowStamp(); put('sessions',s);
}
/* v1.2 联动：项目装备增减或处置后，清单不再是最新的 —— 数一下差几处，提醒一键同步 */
/** 1.3.4.1（P2-7）：「这一场的清单该有哪些行」的唯一来源。
    syncChecklist 与 checklistStale 以前一个按 itemId、一个按文案 —— 改一次存放位置就虚报双倍。 */
function checklistWant(sid){
  var s=get('sessions',sid); if(!s) return [];
  var out=itemsOfProject(s.projectId).filter(isLiveItem)
    .sort(function(a,b){ return String(a.kind).localeCompare(String(b.kind),'zh'); })
    .map(function(i){ return {key:i.id, text:checklistText(i), itemId:i.id, kit:false}; });
  /* 1.3.4.2（复核 P2-2）：用户删掉的应急项记进 s.kitOff，「该有的行」就真的不含它 ——
     否则删一次就永远挂着「有 N 处变动还没同步」，用户被提示逼着接受不想要的项。
     「重新生成」= 全部恢复（regenChecklist 里清空 kitOff）。 */
  var kitOff=arr(s.kitOff);
  EMERGENCY_KIT.forEach(function(k){ if(kitOff.indexOf(k)>=0) return; out.push({key:'kit·'+k, text:'应急包·'+k, itemId:null, kit:true}); });
  return out;
}
function checklistStale(s){
  var cl=arr(s&&s.checklist); if(!cl.length) return 0;
  var want={},have={};
  checklistWant(s.id).forEach(function(d){ want[d.key]=1; });
  /* 手动加的行不参与比对（它们本来就该一直留着，与 1.3.4 之前的口径一致） */
  cl.forEach(function(c){
    if(!c) return;
    if(c.itemId) have[c.itemId]=1;
    else if(c.kit) have['kit·'+String(c.text||'').replace(/^应急包·/,'')]=1;
  });
  var n=0,k;
  for(k in want) if(!have[k]) n++;
  for(k in have) if(!want[k]) n++;
  return n;
}

/* v1.2 联动：拍摄定了档、拍完了，项目不该还停在「计划中」 */

  if(!p||p.stage!=='计划中') return false;
  doSetStage(p,'拍摄中');

}
function autoStageText(s,st){

/* =========================================================
   v1.4.1：档期冲突预警（人员撞档 / 装备赶不上出装日）
   ========================================================= */
var CONFLICT_GAP_MIN=5*60;   /* 同一联系人同日两组安排：开始时间相差 ≥5 小时视为来得及赶场 */
function confMute(){
  if(!DB.meta) DB.meta={};
  if(!DB.meta.confMute) DB.meta.confMute={keys:[],pairs:[]};
  var m=DB.meta.confMute;
  m.keys=arr(m.keys); m.pairs=arr(m.pairs);
  return m;
}
function confPairKey(a,b){ return [a,b].sort().join('+'); }
function confToMin(t){ var m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'')); return m?(+m[1])*60+(+m[2]):null; }
function conflictScan(){
  var out=[], mute=confMute();
  /* ① 人员撞档：同一联系人、同一天、不同项目（时间差 ≥5h 视为赶得及） */
  var byPerson={};
  DB.sessions.forEach(function(s){
    if(!s.contactId||!s.date||s.status==='已取消') return;
    if(projDoneById(s.projectId)) return;   /* v1.5.6：已出片/已归档的项目不再报撞档 */
    (byPerson[s.contactId]=byPerson[s.contactId]||[]).push({pid:s.projectId,date:s.date,time:s.time||'',
      txt:projLabel(s.projectId)+' · 拍摄'+(s.time?' '+s.time:'')});
  });
  DB.appointments.forEach(function(a){
    if(!a.contactId||!a.datetime||['已取消','爽约'].indexOf(a.status)>=0) return;
    if(projDoneById(a.projectId)) return;   /* v1.5.6：同上 */
    var d=String(a.datetime).slice(0,10), t=String(a.datetime).slice(11,16)||'';
    (byPerson[a.contactId]=byPerson[a.contactId]||[]).push({pid:a.projectId,date:d,time:t,
      txt:projLabel(a.projectId)+' · '+(a.type||'预约')+(t?' '+t:'')});
  });
  Object.keys(byPerson).forEach(function(cid){
    var evs=byPerson[cid];
    for(var i=0;i<evs.length;i++) for(var j=i+1;j<evs.length;j++){
      var A=evs[i],B=evs[j];
      if(A.date!==B.date||A.pid===B.pid) continue;
      var ta=confToMin(A.time),tb=confToMin(B.time);
      if(ta!=null&&tb!=null&&Math.abs(ta-tb)>=CONFLICT_GAP_MIN) continue;
      var key='pc:'+cid+':'+A.date+':'+confPairKey(A.pid||'',B.pid||'');
      if(mute.keys.indexOf(key)>=0) continue;
      if(mute.pairs.indexOf(confPairKey(A.pid||'',B.pid||''))>=0) continue;
      out.push({key:key,type:'人员撞档',date:A.date,pids:[A.pid||'',B.pid||''],
        desc:(contactLabel(cid)||'同一位联系人')+' 在 '+A.date+' 被两组安排占用：'+A.txt+' ＆ '+B.txt});
    }
  });
  /* ② 装备赶不上出装日：在途的预计到货 / 已下单的预计发货，晚于该项目下一场拍摄 */
  DB.projects.forEach(function(p){
    var nx=nextSessionOf(p.id); if(!nx) return;
    itemsOfProject(p.id).forEach(function(i){
      if(!isLiveItem(i)) return;
      var eta='',why='';
      if(i.status==='在途'&&i.etaArrive){ eta=i.etaArrive; why='预计到货'; }
      else if(i.status==='已下单/制作中'&&i.etaShip){ eta=i.etaShip; why='预计发货'; }
      if(!eta||eta<=nx.date) return;
      var key='ic:'+i.id+':'+nx.date;
      if(mute.keys.indexOf(key)>=0) return;
      out.push({key:key,type:'装备赶不上',date:nx.date,pids:[p.id],
        desc:'「'+(i.name||'装备')+'」'+why+'是 '+eta+'，晚于「'+(p.name||'项目')+'」在 '+nx.date+' 的拍摄'});
    });
  });
  /* ③ 预算（v1.5）：花费达预算 90% 告急、超过即超支；按里程碑 key 忽略（90% 忽略后超支仍会提醒） */
  DB.projects.forEach(function(p){
    var b=num(p.budget); if(b<=0) return;
    var spent=sum(expsOf(p.id),'amount');
    var key=spent>b?('bc:'+p.id+':over'):(spent>=b*0.9?('bc:'+p.id+':90'):null);
    if(!key||mute.keys.indexOf(key)>=0) return;
    out.push({key:key,type:spent>b?'预算超支':'预算告急',date:'',pids:[p.id],
      desc:spent>b?('「'+(p.name||'项目')+'」已花 '+money(spent)+' 元，超出预算 '+money(b)+' 元中的 '+money(spent-b)+' 元 —— 该收手，或把预算改成现实')
                   :('「'+(p.name||'项目')+'」已花 '+money(spent)+' 元，达到预算 '+money(b)+' 元的 '+Math.round(spent/b*100)+'%（还剩 '+money(b-spent)+' 元）')});
  });
  return out;
}
function showConflicts(){
  var list=conflictScan();
  if(!list.length){ closeModal(); toast('目前没有发现档期冲突'); return; }
  openModal({center:true,title:'⚠ 档期冲突预警（'+list.length+'）',
    body:list.map(function(c){
      var both=c.pids.filter(Boolean);
      return '<div class="danger-box"><b>'+esc(c.type)+(c.date?(' · '+esc(c.date)):'')+'</b>'+
        '<div style="margin:4px 0 8px">'+esc(c.desc)+'</div>'+
        '<div class="btn-row">'+
        (both.length===2?'<button class="btn sm gray" onclick="mutePair(\''+both[0]+'\',\''+both[1]+'\')">这两个项目就是同期拍</button>':'')+
        '<button class="btn sm gray" onclick="muteConflict(\''+c.key+'\')">忽略这条</button></div></div>';
    }).join('')+
    '<div class="btn-row"><button class="btn gray" onclick="closeModal()">先不管（下次打开还会提醒）</button>'+
    '<button class="btn danger" onclick="muteAllConflicts()">全部忽略这批</button></div>'+
    '<div class="tiny muted" style="margin-top:6px">忽略记录与"同期拍"的项目对，都可以在「我的 → 档期冲突预警」里撤销。</div>'
  });
}
function muteConflict(key){
  var m=confMute(); if(m.keys.indexOf(key)<0) m.keys.push(key);
  if(m.keys.length>80) m.keys=m.keys.slice(-80);
  save(); showConflicts();
}
function muteAllConflicts(){
  var m=confMute();
  conflictScan().forEach(function(c){ if(m.keys.indexOf(c.key)<0) m.keys.push(c.key); });
  save(); closeModal(); render(); toast('已忽略本批提醒，可在「我的」里撤销');
}
function mutePair(a,b){
  var m=confMute(), k=confPairKey(a,b);
  if(m.pairs.indexOf(k)<0) m.pairs.push(k);
  save(); showConflicts();
}
function confMuteClear(which){
  var m=confMute();
  if(which==='keys'){ m.keys=[]; toast('已清空忽略记录'); }
  else { m.pairs=[]; toast('已清空同期项目对'); }
  save(); render();
}
function conflictCard(){
  var m=confMute();
  return '<div class="card"><h3>档期冲突预警</h3>'+
    '<div class="tiny muted" style="margin-bottom:6px">打开应用时自动检查：同一联系人同天被两组安排占用、装备预计到货/发货晚于出装日、或项目花费逼近/超过预算，会正中间弹窗提醒。可以逐条忽略（忽略"告急"后真超支还会再提醒一次），也可以把"就是同期拍"的两个项目设为不再提醒（同一联系人同天开始时间差 5 小时以上视为赶得及）。</div>'+
    '<div class="btn-row"><button class="btn sm" onclick="showConflicts()">立即检查</button>'+
    '<button class="btn sm gray" onclick="confMuteClear(\'keys\')">清空忽略记录（'+m.keys.length+'）</button>'+
    '<button class="btn sm gray" onclick="confMuteClear(\'pairs\')">清空同期项目对（'+m.pairs.length+'）</button></div></div>';
}
/* =========================================================
   v1.5.7 装包单导出：拍摄单一键出实体文件（Word / Excel / CSV）
   目的：把这一场要带的东西落到纸上，出发前对着单子把配件找齐。
   三种格式共用 packPlanFor() 一份算法；内容是纯字符串 + a.download，不走网络。
   隐私：打印件会带去现场，所以只出姓名/角色/收纳位，不出联系方式与网盘链接。
   ========================================================= */
/** 一行装备/清单项 → 找齐配件真正用得上的字段（提醒一栏集中说"为什么现在拿不到"） */
function packNote(i,c){
  if(!i) return c&&c.kit?'应急包':'手动加的行';
  var n=[];
  if(i.status==='外借中') n.push('⚠ 已借给 '+(i.dispTo||'未记 CN')+'，出发前要先要回来');
  else if(i.borrowFrom) n.push('⚠ 借自 '+(i.borrowFrom||'？')+(i.borrowDue?('，应还 '+i.borrowDue):'')+'，别弄坏');
  else if(i.status==='报废/已售'||i.status==='留作纪念') n.push('已处置（'+i.status+'）· 拿不到');
  else if(['愿望单/购物车','已下单/制作中','在途','修改中'].indexOf(i.status)>=0){
    n.push('未到手（'+i.status+'）');
    if(i.etaArrive) n.push('预计到货 '+i.etaArrive); else if(i.etaShip) n.push('预计发货 '+i.etaShip);
  }
  if(lowStockOf(i)) n.push('仅剩 '+i.qty+'（阈值 '+i.lowQty+'）');
  else if(i.qty&&Number(i.qty)>1) n.push('数量 '+i.qty);
  if(i.fragile) n.push('易损：'+i.fragile);
  if(!String(i.storage||'').trim()) n.push('未填收纳位');
  return n.join(' · ');
}
/** 装包单的唯一数据源：三种格式都读它，别各算一遍 */
function packPlanFor(sid){
  var s=get('sessions',sid); if(!s) return null;
  var p=get('projects',s.projectId);
  var ph=s.photographerText||(s.contactId?(contactLabel(s.contactId)||'（联系人已删）'):'');
  var lc=s.locationText||(s.locationId?(locationLabel(s.locationId)||'（场地已删）'):'');
  var meta=[
    ['项目',(p?p.name:'（项目已删）')],
    ['角色 · 时装',p?((charLabel(p.characterId)||'')+(p.skin?(' · '+p.skin):'')):''],
    ['拍摄时间',(s.date||'未定')+(s.time?(' '+s.time):'')],
    ['场地',lc],['摄影师',ph],['拍摄单状态',s.status||''],
    ['时间线',s.timeline||''],['雨备',s.backup||''],['备注',s.note||'']
  ].filter(function(x){ return String(x[1]||'').trim(); });
  var buckets={}, order=[];
  arr(s.checklist).forEach(function(c){
    if(!c||!(c.text||c.itemId)) return;
    var i=c.itemId?get('items',c.itemId):null;
    var g=i?(c.kit?'应急包':(i.kind||'其他')):(c.kit?'应急包':'手动加的行');
    if(!buckets[g]){ buckets[g]=[]; order.push(g); }
    buckets[g].push({ chk:(c.checked?'☑':'☐'), name:(i?i.name:(c.text||'')), kind:(i?(i.kind||''):''),
      cat:(i?(i.category||''):''), size:(i?(i.size||''):''), storage:(i?String(i.storage||'').trim():''),
      qty:(i&&i.qty?String(i.qty):''), note:packNote(i,c) });
  });
  var KIND_ORDER=ASSET_KINDS.concat(['应急包','手动加的行']);
  var groups=KIND_ORDER.filter(function(g){ return buckets[g]&&buckets[g].length; })
    .map(function(g){ return {name:g, rows:buckets[g]}; });
  var all=0, got=0, need=0;
  groups.forEach(function(g){ g.rows.forEach(function(r){ all++; if(r.chk==='☑') got++; if(/未到手|已借给|拿不到|未填收纳位/.test(r.note)) need++; }); });
  return {
    title:(s.date||'拍摄')+' 装包单 · '+(p?p.name:''),
    date:s.date||'', meta:meta, groups:groups,
    counts:{ all:all, got:got, need:need },
    foot:'共 '+all+' 件 · 已装包 '+got+' 件 · 出发前还要处理 '+need+' 件（未到手/在别人手上/没填收纳位）· 导出于 '+nowStamp()
  };
}
/** 文件名里 Windows 不能收的字符一律换掉，否则下载会静默失败 */
function packFileName(sid,ext){
  var s=get('sessions',sid); var p=s?get('projects',s.projectId):null;
  var nm='cosplan-装包单-'+String((s&&s.date)||'').replace(/[^\d\-]/g,'')+'-'+((p&&p.name)||'')+'.'+ext;
  return nm.replace(/[\/\\:*?"<>|\s]+/g,'_').slice(0,120);
}
function packCsvCell(v){
  v=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(v)) v="'"+v;        /* 防 CSV 公式注入：以 = + - @ 开头的值会被 Excel 当公式执行 */
  return '"'+v.replace(/"/g,'""')+'"';
}
function packCsvText(pl){
  var L=[['装包单',pl.title].map(packCsvCell)];
  pl.meta.forEach(function(x){ L.push([x[0],x[1]].map(packCsvCell)); });
  L.push([]); L.push(['勾选','名称','大类','分类','尺码','收纳位','数量','提醒'].map(packCsvCell));
  pl.groups.forEach(function(g){
    L.push(['','',g.name+'（'+g.rows.length+' 件）'].map(packCsvCell));
    g.rows.forEach(function(r){ L.push([r.chk,r.name,r.kind,r.cat,r.size,r.storage,r.qty,r.note].map(packCsvCell)); });
  });
  L.push([]); L.push([pl.foot].map(packCsvCell));
  return '﻿'+L.map(function(r){ return r.join(','); }).join('\r\n');   /* BOM：没它 Excel 打开是乱码 */
}
function packDocText(pl){
  var T=function(x){ return '<tr><th>'+esc(x[0])+'</th><td>'+esc(x[1])+'</td></tr>'; };
  var body=pl.groups.map(function(g){

      g.rows.map(function(r){
        return '<tr><td>'+esc(r.chk)+'</td><td>'+esc(r.name)+'</td><td>'+esc([r.kind,r.cat].filter(Boolean).join(' / '))+'</td>'+
          '<td>'+esc(r.size)+'</td><td>'+esc(r.storage||'（没填）')+'</td><td>'+esc(r.qty)+'</td><td>'+esc(r.note)+'</td></tr>';
      }).join('')+'</table>';
  }).join('');
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8"><title>'+esc(pl.title)+'</title><style>'+
    '@page{size:A4 portrait;margin:1.5cm 1.4cm}body{font-family:"Microsoft YaHei",sans-serif;font-size:11pt;color:#222}'+
    'h1{font-size:16pt;margin:0 0 6pt}h2{font-size:12pt;margin:10pt 0 4pt}h3{font-size:11pt;margin:10pt 0 3pt}'+
    'table{border-collapse:collapse;width:100%;margin-bottom:4pt}th,td{border:.6pt solid #999;padding:3pt 5pt;font-size:9.5pt;text-align:left}'+
    'th{background:#eee}td.first{font-weight:bold}</style></head><body>'+
    '<h1>'+esc(pl.title)+'</h1><table>'+pl.meta.map(T).join('')+'</table>'+
    '<h2>要带的东西</h2>'+(body||'<p>这场还没有生成出装清单。回到拍摄单点「重新生成」。</p>')+
    '<p style="margin-top:10pt;font-size:9pt;color:#666">'+esc(pl.foot)+'</p>'+
    '<p style="font-size:9pt;color:#666">本单不含联系方式与网盘链接（打印件会带去现场）。</p>'+
    '</body></html>';
}
function packXlsText(pl){
  var C=function(v,t){ return '<Cell><Data ss:Type="'+(t||'String')+'">'+esc(String(v==null?'':v))+'</Data></Cell>'; };
  var R=function(a){ return '<Row>'+a.map(function(x){ return C(x); }).join('')+'</Row>'; };
  var rows=[R(['装包单',pl.title])].concat(pl.meta.map(function(x){ return R([x[0],x[1]]); }))
    .concat([R([''])]).concat([R(['勾选','名称','大类','分类','尺码','收纳位','数量','提醒'])]);
  pl.groups.forEach(function(g){
    rows.push(R(['','',g.name+'（'+g.rows.length+' 件）']));
    g.rows.forEach(function(r){ rows.push(R([r.chk,r.name,r.kind,r.cat,r.size,r.storage,r.qty,r.note])); });
  });
  rows.push(R([''])); rows.push(R([pl.foot]));
  return '<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>'+
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    '<Worksheet ss:Name="装包单"><Table ss:DefaultColumnWidth="90">'+rows.join('')+
    '</Table></Worksheet></Workbook>';
}
/** 本机落文件的唯一出口（与 JSON 备份同一条路：Blob + a.download，不上传） */
function dlTextFile(name,mime,text){
  try{
    var blob=new Blob([text],{type:mime});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },600);
    toast('已导出：'+name);
  }catch(e){ toast('导出失败：'+(e&&e.message?e.message:'环境不支持下载')); }
}
function packExport(sid,kind){
  var pl=packPlanFor(sid); if(!pl){ toast('拍摄单不存在'); return; }
  if(!pl.groups.length){ toast('这场还没有出装清单，先在拍摄单里「重新生成」'); return; }
  /* 不关弹窗：常常要 Word 打印版 + Excel 各来一份，关一次就得重开一次 */
  /* doc 与 xls 也带 BOM：Word/Excel 在没有 BOM 时可能按本机 ANSI 猜编码，中文标题就成乱码了 */
  if(kind==='doc') dlTextFile(packFileName(sid,'doc'),'application/msword','﻿'+packDocText(pl));
  else if(kind==='xls') dlTextFile(packFileName(sid,'xls'),'application/vnd.ms-excel;charset=utf-8','﻿'+packXlsText(pl));
  else dlTextFile(packFileName(sid,'csv'),'text/csv;charset=utf-8',packCsvText(pl));
}
function packSheet(sid){
  var pl=packPlanFor(sid);
  if(!pl){ toast('拍摄单不存在'); return; }

    body:'<div class="tiny muted" style="margin-bottom:8px">'+esc(pl.title)+'<br>已装包 '+pl.counts.got+'/'+pl.counts.all+
      ' 件'+(pl.counts.need?(' · <b>出发前还要处理 '+pl.counts.need+' 件</b>'):'')+'</div>'+
    '<div class="btn-row" style="margin-bottom:6px">'+
      '<button class="btn" onclick="packExport(\''+jsid(sid)+'\',\'doc\')">Word 打印版</button>'+
      '<button class="btn ghost" onclick="packExport(\''+jsid(sid)+'\',\'xls\')">Excel 表格</button></div>'+
    '<div class="btn-row"><button class="btn gray sm" onclick="packExport(\''+jsid(sid)+'\',\'csv\')">CSV（任何表格软件都能开）</button></div>'+
    '<div class="tiny muted" style="margin-top:8px">带<b>收纳位</b>与"借自谁 / 还没到手 / 易损 / 低库存 / 没填收纳位"，对着找齐配件用。'+
      '文件只在本机生成，<b>不含联系方式与网盘链接</b>。</div>' });

/* =========================================================
   v1.5 ①：分享卡（文本卡；navigator.share 是给 Capacitor 留的缝）
   ========================================================= */
/** 分享唯一入口：有系统分享就走系统分享（Capacitor 迁移时把这行换成 @capacitor/share 即为原生），
    没有就一键复制（带长按降级框）。文本卡直接粘进微信即可用。 */
function shareText(text,title){
  text=String(text==null?'':text);
  if(!text){ toast('没有可分享的内容'); return; }
  if(navigator.share){
    navigator.share({title:title||'CosPlan',text:text}).then(function(){ toast('已打开分享'); },
      function(){ copyAny(text,title||'分享内容'); });
    return;
  }
  copyAny(text,title||'分享内容');
}
