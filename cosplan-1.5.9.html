<title>CosPlan · Cosplay 计划器 v1.5.9</title>
<style>
/* ============ 基础与主题 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-top:var(--top-inset);   /* v1.5.4：整体下移——状态栏区域由 .status-fill 用同色补全，内容不再被顶栏盖住 */
}
:root{
  /* v1.5.8.2：--sub 由 #6b7183 加深到 #565c6e —— 顶栏副标题 4.47→5.9:1，普通 badge 4.11→5.8:1 */
  --bg:#f4f5fa; --card:#ffffff; --fg:#20222c; --sub:#565c6e; --line:#e6e8f0;
  --accent:#7c5cff; --accent-soft:#efeaff; --accent2:#ff7aa2; --accent2-soft:#ffeef4;
  --ok:#1fa971; --ok-soft:#e3f7ee; --warn:#d98216; --warn-soft:#fdf1de;
  --danger:#e04357; --danger-soft:#ffe9ec; --info:#2f7de1; --info-soft:#e6f0fd;
  --gray-soft:#eef0f5; --radius:14px; --shadow:0 2px 10px rgba(30,32,60,.06);
  /* v1.5.8.2：小字专用色 —— 原 --accent #7c5cff 对白底只有 4.35:1，够不到 AA 4.5（11px 不算 large text） */
  --accent-text:#6340e8;  /* 对白底 6.12:1：底栏选中、卡片 act 链接、ghost 按钮文字 */
  --info-text:#185fa5;    /* 对白底 6.53:1：正文链接（原 --info #2f7de1 只有 3.79:1） */
  /* 语义色当"文字"用时也要过 4.5:1 —— 第一轮只测了默认灰 badge，漏了彩色徽章：
     红 3.55 / 橙 2.63 / 绿 2.70 / 粉 2.20 / 紫 3.70 全都不达标（都是 12px 小字）。
     这些 -text 变体只用于文字；色块/进度条/描边仍用原色（图形只要 3:1）。 */
  --ok-text:#0f7a51;      /* 对 --ok-soft 4.79:1 */
  --warn-text:#8a5406;    /* 对 --warn-soft 5.62:1（与 .warn-box 原本用的色一致） */
  --danger-text:#b02332;  /* 对 --danger-soft 5.79:1，对白底 6.71:1 */
  --pink-text:#b8325c;    /* 对 --accent2-soft 5.15:1 */
  --nav-h:58px;
  /* ===== v1.3.2：立体按键（3D 长方形）=====
     目标是「低对比度下仍看得清按钮大小」，所以边界不靠填充色差，靠三样东西：
       ① --key-edge 描边：始终比面色深，是唯一与配色无关的边界
       ② --key-ledge 底座：底部 2px 实心台阶 —— 就算面与背景同色，也能看出"这是一块凸起"
       ③ 落影：把控件从背景上抬起来
     换主题只要改这四个值，不用动任何控件规则。 */
  --key-radius:7px;              /* 长方形的圆角：小到看得出是矩形，又不扎手 */
  --key-bg:#fbfcfe;              /* 按键面（上） */
  --key-bg2:#eceff7;             /* 按键面（下）—— 极轻的纵向渐变，给一点曲率感 */
  --key-edge:#7e88a6;            /* 外描边：对页面底 #f4f5fa 实测 3.24:1 —— 达到 WCAG 1.4.11
                                    对"非文字控件边界"要求的 3:1，弱屏/强光下边界不会糊掉 */
  --key-ledge:#6b7490;           /* 底座台阶：对底色 4.26:1，底部 2px 实心，靠它认出"这是一块凸起" */
  --key-hi:rgba(255,255,255,.95); /* 顶部内高光 */
  --key-drop:0 3px 5px rgba(30,32,60,.13);
  --key-accent:#6d4bf0;          /* 选中态：面色 */
  --key-accent2:#5033c9;         /* 选中态：底座 */
  --key-accent-edge:#4a2fb8;     /* 选中态：描边 */
  --key-danger-edge:#c8324a;    /* 1.3.3：危险键的描边/底座改用 token（对底色 4.81 / 6.38:1，且跟随「提高对比度」）*/
  --key-danger-ledge:#a8273c;
  --bar-h:66px;               /* 顶栏实测高 65.5px：分页签 sticky 与顶部通知都按它让位，不再各写一个数 */
  --top-inset:14px;           /* v1.5.3 异形屏/状态栏避让：顶栏整体下移量，默认 14px，「我的→应用设置」里滑块可调 0-60 */
}
/* 系统开了「提高对比度」时，把边界再压深一档 */
@media(prefers-contrast:more){
  :root{--key-edge:#4d566e;--key-ledge:#333a4d;--line:#a8b0c4;--key-danger-edge:#a8273c;--key-danger-ledge:#8e1f31}
}
/* ===== v1.3.2：立体按键的共同外观（按下 = 真的按下去） ===== */
.chip,.btn,.f-sel,.fab,.modal-head .x,.tabs,.os-box,.toast .u{
  border-radius:var(--key-radius);
  border:1px solid var(--key-edge);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge),var(--key-drop);
}
.chip:active,.btn:active,.fab:active,.modal-head .x:active,.toast .u:active{
  transform:translateY(2px);
  box-shadow:inset 0 1px 0 var(--key-hi),0 0 0 var(--key-ledge);
}
.hidden{display:none!important}
/* v1.5.4：状态栏补色块 —— 盖在滚动内容之上（z45 < 弹窗60/通知90），与顶栏同色 */
.status-fill{position:fixed;top:0;left:0;right:0;height:var(--top-inset);background:#f4f5fa;z-index:45}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
a{color:var(--info-text);text-decoration:none;word-break:break-all}
/* ============ 布局骨架 ============ */
#app{max-width:860px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
/* v1.2：滑动时行会横向位移，裁掉横向溢出，避免窄屏出现左右滑动条 */
#main{overflow-x:clip;padding:12px 14px 20px}
/* v1.5.8.2（评审 P2-4）：实测 FAB 盒 (318,716,56,52) 压住「关联已有装备」按钮与「费用」分页签。
   给「带 FAB 的那一屏」留出底部让位，最后一行总能滚到 FAB 之上。 */
/* v1.5.8.3（复核 P3-4）：:has() 在 Android WebView <105 / iOS Safari <15.4 整条失效，
   那时 FAB 会压回「关联已有装备」与「费用」签。render 里再打一个 fab-on 类，两条选择器并写。 */
#main:has(.fab),#main.fab-on{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.topbar{
  position:sticky;top:var(--top-inset);z-index:30;background:rgba(244,245,250,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;min-height:52px;
}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:12px;color:var(--sub);font-weight:400;display:block;margin-top:1px}
main{padding:12px 14px 20px}
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;background:none;border:0;padding:8px 2px 6px;color:var(--sub);font-size:12px;line-height:1.3;cursor:pointer;
}
.tabbar button.on{color:var(--accent-text);font-weight:700}
/* v1.5.8.2（评审 P1-4）：实测 1280px 视口下内容容器 860px 居中、底栏却横跨 1280px
   （首标签 left=0 / 末标签 right=1280），导航与内容差 420px 完全脱节。
   宽屏改成与内容同宽的居中浮岛；手机端保持贴底通栏。 */
@media(min-width:700px){
  .tabbar{max-width:860px;margin:0 auto;left:0;right:0;bottom:10px;border:1px solid var(--line);
    border-radius:16px;box-shadow:0 6px 18px rgba(30,32,60,.10)}
}
.tabbar button .ic{display:block;font-size:18px;line-height:1.1}
/* v1.5.8.2（评审 P3-1）：底栏原来是 ⌂ ✎ ❐ ☺ ⚙ —— 来自不同符号区，字重/基线/包围盒都不一致
   （❐ 明显比 ☺ 粗且偏移），而且 Android WebView 会用系统字体替换它们，
   APK 用户看到的和电脑上不是同一副样子。换成同一套 24x24 viewBox / 1.75 描边的线性图标，
   跟随 currentColor，在哪端都一致。 */
.tabbar button .ic svg{width:22px;height:22px;display:block;margin:0 auto;
  fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
/* ============ 卡片/列表 ============ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:12px;overflow:hidden}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.card h3 .cnt{font-size:12px;color:var(--sub);font-weight:400}
.card h3 .act,.stage-head .act{margin-left:auto;font-size:12px;color:var(--accent-text);background:none;border:0;cursor:pointer;font-weight:600}
/* v1.5.8.2（评审 P1-1）：「全部项目› / 编辑 / 删除 / 重新生成 / ＋新增」实测只有 18px 高，
   远低于 WCAG 2.5.8 的 24x24（平台惯例 44x44）。负 margin 抵消内边距，文字一个像素都不挪，
   触控靶 18px → 30px。 */
.act{padding:6px 8px;margin:-6px -8px;border-radius:8px;min-height:24px;display:inline-flex;align-items:center}
.act:focus-visible{outline:2px solid var(--accent-text);outline-offset:1px}
/* v1.5.8.3（复核 P3-3）：1.5.8.2 只给 .row 写了焦点环，项目卡是 .card[role=button] → 走 UA 默认；
   行内小动作（本版起可聚焦）也一并给同一个环。 */
.row[role=button]:focus-visible,.card[role=button]:focus-visible,#main [role=button]:focus-visible{
  outline:2px solid var(--accent-text);outline-offset:-2px}
.sect-title{font-size:13px;color:var(--sub);font-weight:700;margin:16px 2px 8px;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:50px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .d{font-size:12.5px;color:var(--sub);margin-top:2px}
.row .r{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.empty{padding:18px 10px;text-align:center;color:var(--sub);font-size:13px;background:var(--gray-soft);border-radius:10px}
.kv{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{width:74px;color:var(--sub);flex:none}
.kv .v{flex:1;min-width:0;word-break:break-word;overflow-wrap:anywhere}
.kv .v a{overflow-wrap:anywhere}
/* 1.1.2：长英文串 / URL / 无空格路径在窄屏会撑破卡片（实测 375px 下溢出可达 3753px），统一断行。中文天然可换行，不受影响 */
.card,.card *,.empty,.stage-head h2,.danger-box,.warn-box{overflow-wrap:anywhere;word-break:break-word}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:400px){.grid3{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .n{font-size:19px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:12px;color:var(--sub);margin-top:2px}
/* ============ 标签/徽章 ============ */
/* v1.3.2：徽章是行内标签、不是"选框"，所以不做立体台阶；但加一圈内描边，
   保证在低对比度/强光下「这块标签有多大」仍然看得出来。 */
.badge{
  display:inline-block;font-size:12px;padding:2px 7px;border-radius:4px;
  background:var(--gray-soft);color:var(--sub);white-space:nowrap;
  box-shadow:inset 0 0 0 1px var(--key-edge);   /* v1.5.8.2：去掉外投影（去键帽化），边界仍由内描边承担 */   /* 1.3.3：原来 10% 黑实测只有 1.38:1，"轮廓看得见"没兑现 */
}
.badge.b-ok{background:var(--ok-soft);color:var(--ok-text)}
.badge.b-warn{background:var(--warn-soft);color:var(--warn-text)}
.badge.b-danger{background:var(--danger-soft);color:var(--danger-text)}
.badge.b-info{background:var(--info-soft);color:var(--info-text)}
.badge.b-accent{background:var(--accent-soft);color:var(--accent-text)}
.badge.b-pink{background:var(--accent2-soft);color:var(--pink-text)}
/* v1.5.9：行内可点的动作徽章（条款 / 🖼 / ✕ / 进流程 / 回池…）—— .badge 本来是"状态标签"，
   padding 2px 7px 实测高 22px，当按钮用比 WCAG 2.5.8 的 24×24 小一圈。这类加 .ra：撑到 24 高。 */
.badge.ra{display:inline-flex;align-items:center;min-height:24px;padding:5px 8px;cursor:pointer;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* v1.5.8.2（评审 P1-3）：装备页一屏 38 个「键帽」（描边 + 2px 底座 + 落影），层级被抹平——
   筛选签看起来和主按钮一样重，下拉框看起来和「删除」一样重。
   现在凸起只留给「点一下立刻执行」的控件（.btn / .fab / .tabs 选中态 / 出装日勾框）。
   筛选签改扁平：边界靠 1px --key-edge（对白底 3.24:1，仍达 WCAG 1.4.11 的 3:1），
   选中态用实色填充而不是「浮起来」。 */
.chip{
  font-size:12.5px;padding:8px 13px;min-height:36px;cursor:pointer;
  border-radius:9px;border:1px solid var(--key-edge);
  background:var(--card);box-shadow:none;color:var(--fg);
  transition:background .12s ease,border-color .12s ease;
}
.chip.on{
  background:var(--accent-text);color:#fff;font-weight:600;
  border-color:var(--accent-text);box-shadow:none;
}
/* v1.2：状态回退用虚线框，跟「往前推」的实心 chip 一眼能分开 */
.chip.back{
  background:var(--card);color:var(--sub);
  border:1px dashed var(--key-edge);box-shadow:none;
}
/* v1.2.2 滑动槽：筛选条横向滚，不折行 —— 之前窄屏下 chip 被压成一字一行，整块 UI 看起来是乱的 */
/* v1.5.3：滑轨在手机上也常驻显示（之前只在桌面端显示，真机上不知道那里能滑） */
.pill-row{display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:#cfd3e2 transparent}
.pill-row::-webkit-scrollbar{display:block;height:8px}
.pill-row::-webkit-scrollbar-thumb{background:#cfd3e2;border-radius:99px}
.pill-row::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.pill-row::-webkit-scrollbar-track{background:transparent}
.pill-row>*{flex:0 0 auto}
/* v1.5.8.2（评审 P1-5）：装备x2 / 项目 / 对比 / 拍摄单 五个页面的筛选条都被硬切在卡片圆角上，
   被切掉的 chip 连 2px 底座都被切平，看着像渲染坏了，不像「还能往右滑」。
   实测：pure-CSS 的 local/scroll 双层背景阴影在这里不成立 —— 覆盖层会把阴影盖掉
   （真 Chromium 实测近边缘像素恒为纯白）。改成给 .pill-row 打 data-sc 标记，
   用 mask 在「还有内容的那一侧」做渐隐：滚到头自动取消，不溢出时完全不生效。
   标记由 markScrollables() 在每次 render 后与滚动时更新。 */
.pill-row[data-sc~="r"]{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
.pill-row[data-sc~="l"]{-webkit-mask-image:linear-gradient(90deg,transparent,#000 26px);mask-image:linear-gradient(90deg,transparent,#000 26px)}
.pill-row[data-sc~="l"][data-sc~="r"]{-webkit-mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 26px),transparent)}
.pill-row{padding-right:10px}
.pill-row .chip{white-space:nowrap}
.pill-row .f-sel{flex:0 0 auto;max-width:52vw}
.f-sel{
  padding:8px 9px;min-height:36px;color:var(--fg);
  border-radius:9px;border:1px solid var(--key-edge);
  background:var(--card);box-shadow:none;
}
/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  color:#fff;padding:10px 14px;font-weight:600;cursor:pointer;
  border-radius:var(--key-radius);border:1px solid var(--key-accent-edge);
  background:linear-gradient(180deg,#8a6cff 0%,var(--key-accent) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 2px 0 var(--key-accent2),0 4px 8px rgba(93,63,224,.22);
  transition:transform .06s ease,box-shadow .06s ease;
}
.btn:active{transform:translateY(2px);opacity:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 0 0 var(--key-accent2)}
.btn.sm{padding:8px 12px;font-size:13.5px;min-height:36px}
.btn.ghost{
  background:linear-gradient(180deg,#ffffff 0%,#f4f6fb 100%);color:var(--accent-text);
  border-color:var(--accent);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 rgba(124,92,255,.42);
}
.btn.gray{
  background:linear-gradient(180deg,var(--key-bg) 0%,var(--key-bg2) 100%);color:var(--fg);
  border-color:var(--key-edge);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge),var(--key-drop);
}
.btn.danger{
  background:linear-gradient(180deg,#fff3f5 0%,#ffe0e6 100%);color:var(--danger-text);
  border-color:var(--key-danger-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 0 var(--key-danger-ledge);
}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:0}
/* v1.3.2：原来是正圆，改成长方形立体键（圆角 12px，保留 52px 的拇指友好尺寸） */
.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);z-index:35;
  width:56px;height:52px;font-size:26px;line-height:1;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;border:1px solid var(--key-accent-edge);
  background:linear-gradient(180deg,#8a6cff 0%,var(--key-accent) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.42),0 3px 0 var(--key-accent2),0 8px 18px rgba(93,63,224,.34);
}
/* ============ v1.2 滑动手势 ============ */
.sw{touch-action:pan-y}
.swin{position:relative;flex:1;min-width:0;overflow:hidden}
.swrow{display:flex;align-items:center;gap:10px;width:100%;min-width:0}
/* 面板做成超宽块贴住要揭示的那一侧，未滑动的部分被 .swmain 盖住，看到的就是「露出来的一条」 */
.swpanel{position:absolute;top:0;bottom:0;width:999px;z-index:0;pointer-events:none;display:none;align-items:center}
.swpanel.right{right:0;justify-content:flex-end;padding-right:14px}
.swpanel.left{left:0;padding-left:14px}
.sw.sw-r .swpanel.right{display:flex;background:var(--ok-soft)}
.sw.sw-l .swpanel.left{display:flex;background:var(--gray-soft)}
.swpanel b{position:relative;z-index:1;font-size:12.5px;font-weight:700;white-space:nowrap}
.swpanel.left b{color:var(--sub)}
.swpanel.right b{color:var(--ok-text)}
.swlab{position:absolute;top:0;bottom:0;left:0;right:0;z-index:0;background:var(--accent);opacity:0}
.swmain{position:relative;z-index:2;background:var(--card)}
/* 卡片级滑动（项目列表）：内边距挪到内容层，面板才能铺满整卡高度 */
.cardsw{padding:0}
.cardsw .swmain{padding:12px}
#swTab{position:fixed;left:50%;bottom:calc(var(--nav-h) + 46px);transform:translateX(-50%);z-index:95;
  background:#20222c;color:#fff;font-size:13px;padding:8px 15px;border-radius:10px;display:none;white-space:nowrap;
  border:1px solid #0c0e15;box-shadow:0 2px 0 #05060a,0 6px 14px rgba(0,0,0,.3)}
/* 行内副文案最多两行，窄屏不至于把行撑得过高 */
.row .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 1.2.2 修复（评审 P0）：.toast 整体 pointer-events:none 会连带吞掉「撤销」的点击，只给按钮放行 */
/* v1.3.2：撤销键做成「深色条上的浅色立体键」—— 低对比度下靠描边与底座认边界 */
.toast .u{
  pointer-events:auto;padding:6px 14px;font-size:13px;font-weight:700;margin-left:10px;cursor:pointer;
  color:#20222c;border-radius:var(--key-radius);border:1px solid #0c0e15;
  background:linear-gradient(180deg,#ffffff 0%,#e8ebf4 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 0 #0c0e15;
}
/* ============ 表单 ============ */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal.mask-center{align-items:center}
.modal-mask{position:absolute;inset:0;background:rgba(20,20,35,.45)}
.modal-body{
  position:relative;background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
}
.modal.mask-center .modal-body{border-radius:18px;max-width:480px;padding-bottom:16px}
@media(min-width:641px){.modal{align-items:center}.modal-body{border-radius:18px;max-height:88vh}}
.modal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg);padding:6px 0 8px;z-index:2}
.modal-head h2{font-size:16px;margin:0;flex:1}
/* v1.3.2：圆形关闭键 → 方形立体键 */
.modal-head .x{
  width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--sub);
  border-radius:var(--key-radius);border:1px solid var(--key-edge);
  background:linear-gradient(180deg,var(--key-bg) 0%,var(--key-bg2) 100%);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge);
}
.f{margin-bottom:12px}
.f>label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px;font-weight:600}
.f>label .req{color:var(--danger-text)}
/* v1.3.2：输入框走「凹槽」而不是「凸键」—— 和按钮形成一套立体语言：
   按钮是抬起来的，输入框是陷下去的。低对比度下靠描边 + 内阴影认范围。 */
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=datetime-local],.f input[type=url],.f input[type=tel],.f select,.f textarea{
  width:100%;background:var(--card);border:1px solid var(--key-edge);border-radius:8px;padding:10px 11px;outline:none;
  box-shadow:inset 0 2px 3px rgba(30,32,60,.08);
}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
/* 窄屏（手机）下 15px 输入框会触发 iOS 自动放大整页，提到 16px 才不会一打字就跳版 */
@media(max-width:640px){
  .f input,.f select,.f textarea,#main input[type=text],#main select{font-size:16px}
  .f input[type=text],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=datetime-local],.f input[type=url],.f input[type=tel],.f select,.f textarea{padding:12px 11px}
}
.f .hint{font-size:12px;color:var(--sub);margin-top:3px}
.f.err input,.f.err select,.f.err textarea{border-color:var(--danger)}
.f-row{display:flex;gap:8px}.f-row .f{flex:1;min-width:0}
.sub-list{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.sub-item{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sub-item:last-child{border-bottom:0}
.sub-item input{flex:1;min-width:0;border:0;background:none;padding:4px 2px}
.sub-item .del{background:none;border:0;color:var(--danger-text);font-size:18px;cursor:pointer;padding:0 4px}
.check-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);min-height:48px}
.check-row:last-child{border-bottom:0}
.check-row input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.check-row .txt{flex:1;min-width:0}
.check-row.done .txt{color:var(--sub);text-decoration:line-through}
/* v1.2：卡片与行只允许竖向 pan，横向手势不会被浏览器抢去当页面平移 */
.card{touch-action:pan-y}
/* v1.2.2.2（P2-8）：滑动槽的 touch-action 会与祖先 .card 的 pan-y 取交集 = 空，
   导致手机上筛选条横滑不动（也不该把整块卡片连竖向一起锁死）。给含滑动槽的卡片单独放开两个方向。
   用 :has() 精准命中，不影响其它卡片的滑动手势；老浏览器不认 :has() 时退化成原样，不会更糟。 */
.card:has(.pill-row){touch-action:pan-x pan-y}
/* ============ 进度/其他 ============ */
.bar{height:6px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--danger)}
.warn-box{background:var(--warn-soft);color:#8a5406;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.danger-box{background:var(--danger-soft);color:#9c1f30;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.info-box{background:var(--info-soft);color:#1b4d8f;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
/* v1.5.8.2（评审 P2-3）：原来四条告警全是同一块实心粉底，看不出轻重（一屏四行 = 一面红墙）。
   按严重度分三档，用左侧 3px 色条 + 极淡底色代替整行染粉。 */
.row-sec{background:rgba(224,67,87,.055)!important;box-shadow:inset 3px 0 0 var(--danger);
  border-radius:8px;padding-left:10px!important;padding-right:8px!important}
/* v1.5.8.3（复核 P2-2）：色条是"中/低"两档唯一的区分件，所以它自己得过 3:1。
   实测 --warn #d98216 对本行淡底只有 2.73:1 → 换 --warn-text（5.84:1）。 */
.row-sec-m{background:rgba(217,130,22,.07)!important;box-shadow:inset 3px 0 0 var(--warn-text);
  border-radius:8px;padding-left:10px!important;padding-right:8px!important}
.row-sec-l{background:rgba(86,92,110,.06)!important;box-shadow:inset 3px 0 0 var(--sub);
  border-radius:8px;padding-left:10px!important;padding-right:8px!important}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 40px);transform:translateX(-50%) translateY(20px);
  background:#20222c;color:#fff;padding:9px 14px;font-size:13px;z-index:90;
  border-radius:12px;border:1px solid #0c0e15;box-shadow:0 3px 0 #05060a,0 8px 20px rgba(0,0,0,.32);
  opacity:0;pointer-events:none;transition:all .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--sub);font-size:12.5px}
.tiny{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.right{text-align:right}
.nowrap{white-space:nowrap}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
/* v1.3.2：分页签也做成"凹槽 + 立体键"——未选中的是平的凹槽底，选中的浮起来 */
.tabs{
  display:flex;gap:5px;padding:4px;margin-bottom:12px;overflow-x:auto;position:sticky;top:calc(var(--top-inset) + var(--bar-h));z-index:25;touch-action:pan-x;
  border-radius:calc(var(--key-radius) + 3px);border:1px solid var(--key-edge);
  background:linear-gradient(180deg,#e6e9f3 0%,#eff1f8 100%);
  box-shadow:inset 0 2px 3px rgba(30,32,60,.13),0 1px 0 var(--key-hi);
}
.tabs button{
  flex:1;background:none;border:0;padding:10px 6px;font-size:13.5px;color:var(--sub);cursor:pointer;white-space:nowrap;
  border-radius:var(--key-radius);
}
.tabs button.on{
  color:var(--accent-text);font-weight:700;
  border:1px solid var(--key-edge);
  background:linear-gradient(180deg,var(--key-bg) 0%,var(--key-bg2) 100%);
  box-shadow:inset 0 1px 0 var(--key-hi),0 2px 0 var(--key-ledge);
}
.stage-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stage-head h2{font-size:18px;margin:0;flex:1;min-width:120px}
.prog-list{display:flex;flex-direction:column;gap:8px}
details.dd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
details.dd summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:600;list-style:none}
details.dd summary::-webkit-details-marker{display:none}
details.dd[open] summary{margin-bottom:6px;color:var(--fg)}
/* ============ v1.3 滑动槽滑轨（电脑端可拖；滑轨本身 v1.5.3 起全端常驻） ============ */
@media(hover:hover) and (pointer:fine){
  .pill-row{cursor:grab}
  .pill-row.dragging{cursor:grabbing}
}
/* ============ v1.3 长按（删除）反馈 ============ */
[data-lp]{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[data-lp].lp-run::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:5;
  background:var(--danger);transform-origin:left;animation:lpbar var(--lp-ms,1.8s) linear forwards;pointer-events:none}
@keyframes lpbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
[data-lp].lp-hot{animation:lppulse .4s ease}
@keyframes lppulse{0%{background:var(--danger-soft)}100%{background:transparent}}
.lp-count{display:inline-block;min-width:22px;text-align:center;font-weight:800}
/* ============ v1.3 详情页双击快改 ============ */
/* v1.5.8（手感）：双击快改"点不上"的三处来源，逐个消掉
   ① 双击缩放 / 取词抢事件：viewport 没锁 user-scalable，.qe 又能选字 → 第二下常被浏览器当成
      双击缩放或划词，页面一跳就是用户说的"位置移动"。touch-action 关掉这一片的双击缩放，
      user-select / touch-callout 关掉取词与长按气泡。
   ② 热区太薄：上下 padding 5px→10px（负 margin 抵消，文字一个像素都不挪），一行好点中。
   ③ 双击没成没有退路：✎ 现在是单下就开的按钮（见 qePen），不非得赌那 520ms。 */
.qe{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* v1.5.8.3（复核 P3-2 附带）：原来 ✎ 的盒比行还宽 6px（right:2px 与 margin-right:-8px 叠加），
   既被卡片 overflow:hidden 裁掉 2px，字形又压在值文本上 17px。右侧内边距 8→16px 给笔留一条自己的道。 */
.kv.qe{border-radius:8px;padding:10px 16px 10px 8px;margin:0 -8px;position:relative}
.qe:active{background:var(--accent-soft)}
.kv.qe .pen,.stage-head .pen{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--sub);opacity:.55}   /* 复核 P3-1：11→12px */
.pen{padding:9px 4px 9px 10px;margin:-9px -2px}   /* 笔自己就是个够大的点击靶；v1.5.8.3：盒不超行盒、字形不盖文本 */
.stage-head h2{position:relative;padding-right:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.qe-tip{font-size:12px;color:var(--sub);margin:2px 0 8px}
/* ============ v1.3 出装日（现场模式：车上、单手、10 秒、不怕点错） ============ */
.os-hero{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 12px;margin-bottom:12px}
.os-hero .who{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.3px}
.os-hero .when{font-size:15px;margin-top:4px;color:var(--fg)}
.os-hero .where{font-size:13px;color:var(--sub);margin-top:3px}
.os-btns{display:flex;gap:8px;margin-top:12px}
.os-btns .btn{flex:1;min-width:0;min-height:52px;font-size:15px;border-radius:10px;padding:8px 6px;line-height:1.25}
.os-prog{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.os-prog .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.os-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.os-row:last-child{border-bottom:0}
.os-box{
  width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:transparent;
  border-radius:var(--key-radius);border:2px solid var(--key-edge);
  background:linear-gradient(180deg,#ffffff 0%,#f1f3f9 100%);
  box-shadow:inset 0 2px 2px rgba(30,32,60,.10),0 1px 0 var(--key-hi);
}
.os-row.done .os-box{
  background:linear-gradient(180deg,#2fb37e 0%,#1fa971 100%);
  border-color:#0d7350;color:#fff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 #0a5c40;
}
.os-row .nm{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.3}
.os-row.done .nm{color:var(--sub);text-decoration:line-through;font-weight:500}
.os-row .loc{font-size:12.5px;color:var(--sub);margin-top:2px;font-weight:400}
.os-ppl{display:flex;align-items:center;gap:10px;min-height:60px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.os-ppl:last-child{border-bottom:0}
.os-ppl .r{margin-left:auto;font-size:12.5px;color:var(--sub);text-align:right;white-space:nowrap}
.os-ppl .n{font-size:17px;font-weight:700}
.os-ppl .s{font-size:12.5px;color:var(--sub);margin-top:2px}
.os-pick{display:flex;align-items:center;gap:10px;min-height:66px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.os-pick:last-child{border-bottom:0}
.os-pick .t{font-size:18px;font-weight:700}
.os-pick .d{font-size:13px;color:var(--sub);margin-top:2px}
.os-top{position:fixed;right:12px;top:9px;z-index:31}
/* ============ v1.3.4 ①：出装日 = 独立全屏现场模式（藏掉底栏与常规顶栏） ============ */
body.onsite-mode{--nav-h:0px;--bar-h:60px}
body.onsite-mode .topbar,body.onsite-mode #tabbar{display:none!important}
body.onsite-mode #app{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
body.onsite-mode #main{padding:0 14px calc(26px + env(safe-area-inset-bottom))}
.os-bar{position:sticky;top:var(--top-inset);z-index:40;display:flex;align-items:center;gap:8px;
  padding:8px 14px 10px;margin:0 -14px 12px;
  background:rgba(244,245,250,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line)}
.os-bar h1{font-size:16px;margin:0;flex:1;min-width:0;font-weight:700;letter-spacing:-.2px}
.os-bar .sub{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:2px}   /* v1.5.8.3 复核 P3-1 */
.os-bar .btn{min-height:40px;flex:none}
/* ============ v1.3.4 ②：撤销改成顶部通知（下滑弹出 · 上滑划走） ============ */
.toast{
  top:calc(env(safe-area-inset-top) + var(--top-inset) + var(--bar-h) + 6px);bottom:auto;left:50%;width:max-content;
  transform:translateX(-50%) translateY(-190%);
  display:flex;align-items:center;gap:8px;text-align:left;
  max-width:calc(100vw - 18px);padding:10px 12px 10px 14px;
  transition:transform .26s cubic-bezier(.2,.85,.3,1),opacity .2s;
}
.toast.on{transform:translateX(-50%) translateY(0)}
/* 只有带「撤销」的那条可交互（能上滑划走）；普通提示仍然 pointer-events:none，不挡任何点击 */
.toast.act{pointer-events:auto;touch-action:none}   /* 1.3.4.1：不写 touch-action，浏览器把纵向拖动判成滚页并掐出 pointercancel → 真机上滑划不走 */
.toast .msg{flex:1;min-width:0;line-height:1.4}
.toast .u{min-height:34px;padding:8px 14px;flex:none}
.toast .x{pointer-events:auto;flex:none;width:34px;height:34px;cursor:pointer;
  border-radius:var(--key-radius);border:1px solid #0c0e15;
  background:linear-gradient(180deg,#ffffff 0%,#e8ebf4 100%);color:#20222c;
  font-size:15px;line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 0 #0c0e15}
/* 复制降级框：整段一次长按就能复制走 */
.mcopy{user-select:all;-webkit-user-select:all;border:1px solid var(--key-edge);border-radius:8px;
  padding:11px;background:var(--card);font-size:14px;line-height:1.5;word-break:break-all;
  box-shadow:inset 0 2px 3px rgba(30,32,60,.08);max-height:34vh;overflow:auto}
/* ============ v1.4.1：对比页也全屏（藏底栏省空间，与出装日同一思路） ============ */
body.cmp-mode #tabbar{display:none!important}
body.cmp-mode #app{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
body.cmp-mode #main{padding:0 14px calc(26px + env(safe-area-inset-bottom))}
/* ============ v1.4 ①：装备对比表 ============ */
.cmp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;margin:0 -12px -12px;padding:0 12px 12px}
.card:has(.cmp-wrap){touch-action:pan-x pan-y}   /* 与 1.2.2.2 滑动槽同一坑：.card 的 pan-y 会掐死横向滚动 */
.cmp{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.cmp th:last-child,.cmp td:last-child{border-right:0}
.cmp thead th{position:sticky;top:0;background:var(--card);z-index:2;min-width:118px;max-width:180px}
.cmp td.k,.cmp thead th.k{position:sticky;left:0;background:var(--card);z-index:1;width:80px;min-width:80px;color:var(--sub);font-weight:600}
.cmp thead th.k{z-index:3}
.cmp tr.diff td.k{color:var(--accent-text)}
.cmp .tiny.muted{font-weight:400}
/* ============ v1.4 ②：上身反馈 / 我的尺寸档案 ============ */
.fitv{display:inline-block;font-size:12px;padding:1px 6px;border-radius:4px;margin:0 4px 2px 0;white-space:nowrap}   /* v1.5.8.3 复核 P3-1：这是正文（偏大/合身），地板 12px */
.fitv.big{background:var(--warn-soft);color:var(--warn-text)}
.fitv.small{background:var(--info-soft);color:var(--info-text)}

/* ============ v1.3.4 ③：轻量过渡（120~220ms，只在换屏/开弹窗时动一次） ============ */
@keyframes cpnViewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cpnSheet{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes cpnPop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
/* 1.3.4.1：动画挂在子层而不是 #main —— transform 会把 #main 变成 fixed 后代的包含块，
   挂在 #main 上时右下角「＋」会在动画那 ~170ms 里掉到视口外 */
#main.view-in>*{animation:cpnViewIn .17s ease-out}
.modal:not(.hidden) .modal-body{animation:cpnSheet .2s cubic-bezier(.2,.85,.3,1)}
.modal.mask-center:not(.hidden) .modal-body{animation:cpnPop .17s ease-out}
.os-box{transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,color .15s ease}
.os-row .nm{transition:color .15s ease}
@media(prefers-reduced-motion:reduce){
  #main.view-in,.modal:not(.hidden) .modal-body{animation:none!important}
  .toast{transition:opacity .12s linear}
}
</style>

<script>

/* =========================================================

   单文件本地应用：数据存 localStorage，不上传、不联网。
   需求依据：同目录《开发交付文档.md》

   1.3.4 一键复制改三条策略并先验选区；长按 3 秒→1.8 秒；出装日独立全屏；撤销改成顶部通知（上滑划走）；加轻量过渡

   1.4.1 按用户反馈修订 + 新增档期冲突预警：

   1.5.2 小缺陷修复与清单手势：

                 ③ 出装日选套：标题只显示时装名，方便快速选
                 ④ 清单滑动手势（现场页 + 拍摄单通用）：右滑勾上 / 再右滑取消，左滑移除

   1.5.3 APK 化第一批改进（用户真机反馈）：

                    到首页才问「要退出吗」，确认后 exitApp——不再直接退出应用
   1.5.4 APK 真机反馈第二批 + 评审报告接受项：

                    （.status-fill），滚动内容不再从顶栏底下钻出来，分页签不再被盖
                 ② 图标修复：@capacitor/assets 未真正覆写自适应图标（APK 内仍是默认矢量前景），

                 ③ 通知系统落地：@capacitor/local-notifications，启动即请求通知权限；每晚 20:00
                    提醒「明日安排 + 即将到期/到货」（提前排 7 天，每次打开刷新），可在设置关
                 ④ 左右滑动：五个主页面（首页/项目/装备/通讯录/我的）左右滑切换；
                    「应用设置」拆成双面板（避让与手势 ⇄ 预警与备份），打开后左右滑切换
                 ⑤ 评审接受项：P2-1 时装名"原皮"清空（编辑老项目不再被必填拦下）、滑动归档守卫、
                    预算文案口径、打包脚本自动拷最新 html、versionCode/Name 跟版本、
                    删除根目录遗留 index.html、补回真 Chromium 测试套件
   1.5.5（仅网页版，APK 暂不更新）：
                 ① 主导航左右滑修复：滑轨豁免从"避开所有可点元素"放宽为"只避开真实控件与滑动槽"，

1.5.7（本版只做一件事 + 首个 release APK）：
  ① 拍摄单「导出装包单」：一键把这一场要带的东西出成<b>实体文件</b>——Word（.doc，打印友好，带☐方框）

1.5.8（本版只做 HTML，APK 仍停在 1.5.7）：
  ① P1 导入备份的存储型 XSS 收口：外来数据只有两个入口（读档 / 导入），两者都过 migrate()，

     渲染侧新增 jsid()（形状不对给空串，宁可少一个按钮），构建时再卡一道门禁：
     内联事件属性的 JS 字符串上下文里只许出现 id 形态或代码常量，冒出别的表达式就构建失败。

  ④ 导出装包单进「出装日」：顶上那排按钮多一颗「导出装包单」，与拍摄单共用同一份 packPlanFor()。
  ⑤ 双击快改手感：关掉 .qe 上的双击缩放与取词、热区加厚（文字不挪位）、✎ 改成单下即开、双击窗口 420→520ms。

/* ---------------- 工具函数 ---------------- */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(p){ return (p||'x')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }            // 防 Infinity/NaN
function numOrNull(v){ if(v===''||v===null||v===undefined) return null; var n=parseFloat(v); return isFinite(n)?n:null; }
function money(n){ n=num(n); return (Math.round(n*100)/100).toString(); }
function todayISO(){ var d=new Date(); return isoOf(d); }
function isoOf(d){
  var m=('0'+(d.getMonth()+1)).slice(-2), dd=('0'+d.getDate()).slice(-2);
  return d.getFullYear()+'-'+m+'-'+dd;
}
function nowStamp(){ var d=new Date(); return isoOf(d)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function dayDiff(iso){                       // iso 距今天数：过去为负
  if(!iso) return null;
  var a=new Date(String(iso).slice(0,10)+'T00:00:00'), b=new Date(todayISO()+'T00:00:00');
  if(isNaN(a.getTime())) return null;
  return Math.round((a-b)/86400000);
}
function dueText(iso){
  var d=dayDiff(iso); if(d===null||d===undefined) return '';
  if(d<0) return '逾期'+(-d)+'天';
  if(d===0) return '今天';
  if(d===1) return '明天';
  if(d<=30) return d+'天后';
  return iso;
}
function isPast(iso){ var d=dayDiff(iso); return d!==null && d<0; }
function arr(v){ return Array.isArray(v)?v:[]; }
function byId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function sortDesc(list,key){ return list.slice().sort(function(a,b){ return String(b[key]||'').localeCompare(String(a[key]||'')); }); }
function sortAsc(list,key){ return list.slice().sort(function(a,b){ return String(a[key]||'~').localeCompare(String(b[key]||'~')); }); }
function sum(list,key){ var t=0; for(var i=0;i<list.length;i++) t+=num(list[i][key]); return t; }
function uniq(list){ var s={},o=[]; for(var i=0;i<list.length;i++){ if(!s[list[i]]){s[list[i]]=1;o.push(list[i]);} } return o; }

   （qa/apply158.js 用 qa/audit158.js 的口径扫内联事件，出现非 id 表达式就不出盘）。 */
var ID_RE = /^[A-Za-z][A-Za-z0-9_-]{0,39}$/;
var IMG_ID_RE = /^[A-Za-z][A-Za-z0-9_-]{0,47}$/;
var CONF_KEY_RE = /^[A-Za-z0-9_:.\-+]{1,160}$/;   /* 冲突忽略键是 type:id:日期:id+id 的形状，含数字与点，只要求"没有引号与尖括号" */
function idOk(v){ return typeof v==='string' && v.length<=40 && ID_RE.test(v); }
function imgIdOk(v){ return typeof v==='string' && v.length<=48 && IMG_ID_RE.test(v); }
/** 渲染侧兜底：不是应用形状的 id 一律当没有。宁可少一个按钮，也不给外来 JSON 拆字符串的机会 */
function jsid(v){ return idOk(v)?v:''; }
/* 各集合里"指向别的记录"的 id 字段：换号时要跟着改 */
var ID_REF_ONE = {
  characters:['workId'],
  projects:['characterId'],
  items:['characterId'],
  sessions:['projectId','contactId','locationId'],
  appointments:['projectId','contactId'],
  deliverables:['sessionId'],
  publications:['projectId','deliverableId'],
  expenses:['projectId','refId'],
  todos:['projectId','refId'],
  intents:['workId','characterId','projectId']   /* v1.5.9 意向池：外来 id 一样要过白名单 */
};
var ID_REF_ARR = { items:['projectIds'] };
var ID_REF_SUB = { sessions:[['checklist','itemId']] };
/* 子对象里"自己的 id"：会被拼进 onclick（清单行 toggleCheck('${s.id}','${c.id}')），不合规就换号 */
var ID_OWN_SUB = { sessions:[['checklist','id']] };
var IMG_OWNERS = ['item','project','location','appointment','character'];
var LAST_ID_FIX = {renamed:0,cleaned:0};

function idSanity(d){
  var map={}, taken={}, renamed=0, cleaned=0;
  var colls=Object.keys(d).filter(function(k){ return Array.isArray(d[k]); });
  function freshId(coll){ var n; do{ n=uid(String(coll).slice(0,3)); }while(taken[n]||map[n]); taken[n]=1; return n; }
  colls.forEach(function(coll){ d[coll].forEach(function(it){ if(it&&idOk(it.id)) taken[it.id]=1; }); });
  colls.forEach(function(coll){
    var one=ID_REF_ONE[coll]||[], aq=ID_REF_ARR[coll]||[], sub=ID_REF_SUB[coll]||[], own=ID_OWN_SUB[coll]||[];
    function ref(x){                       /* 指向别处的 id：能映射就映射，形状不对就当没有 */
      if(!x||typeof x!=='string') return x===''?'':null;
      if(map[x]!==undefined) return map[x];
      return idOk(x)?x:null;
    }
    d[coll].forEach(function(it){
      if(!it||typeof it!=='object') return;
      if(!idOk(it.id)){
        var old=(typeof it.id==='string')?it.id:String(it.id==null?'':it.id);
        it.id=freshId(coll); renamed++;
        if(old&&map[old]===undefined) map[old]=it.id;   /* 同一批里重复的坏号并到同一个新号，引用才不会散 */
      }
      one.forEach(function(f){
        if(!it[f]) return;
        var r=ref(String(it[f]));
        if(r===null){ cleaned++; it[f]=''; } else it[f]=r;
      });
      aq.forEach(function(f){
        if(!Array.isArray(it[f])) return;
        var out=[];
        it[f].forEach(function(x){ var r=ref(String(x)); if(r&&out.indexOf(r)<0) out.push(r); else cleaned++; });
        it[f]=out;
      });
      sub.forEach(function(pair){
        var list=it[pair[0]]; if(!Array.isArray(list)) return;
        list.forEach(function(row){
          if(!row||typeof row!=='object'||!row[pair[1]]) return;
          var r=ref(String(row[pair[1]]));
          if(r===null){ cleaned++; row[pair[1]]=''; } else row[pair[1]]=r;
        });
      });
      own.forEach(function(pair2){
        var list=it[pair2[0]]; if(!Array.isArray(list)) return;
        list.forEach(function(row){
          if(!row||typeof row!=='object') return;
          if(row[pair2[1]]===undefined) return;
          if(!idOk(row[pair2[1]])){ row[pair2[1]]=freshId('k'); renamed++; }
        });
      });
      /* imgs 里每一项都是图片 id：形状不对直接摘掉（库里也是按这个 id 存的，留着只会渲染成"已丢失"） */
      if(Array.isArray(it.imgs)){
        var keep=[];
        it.imgs.forEach(function(x){ if(imgIdOk(x)) keep.push(x); else cleaned++; });
        it.imgs=keep;
      }
      /* refLinks / fits / fittings / text 只落进 HTML 文本位（一律过 esc），这里不碰内容 */
    });
  });
  /* meta 里两处会把字符串拼进 onclick：冲突忽略键与「就是同期拍」的项目对 */
  var mt=d.meta;
  if(mt&&typeof mt==='object'){
    var cm=mt.confMute||mt.conflictMute;
    if(cm&&typeof cm==='object'){
      ['keys','pairs'].forEach(function(f){
        if(!Array.isArray(cm[f])) return;
        var before=cm[f].length;
        cm[f]=cm[f].filter(function(x){ return typeof x==='string' && CONF_KEY_RE.test(x); });
        cleaned+=before-cm[f].length;
      });
    }
    if(mt.settings&&typeof mt.settings==='object'&&('topInset' in mt.settings)){
      mt.settings.topInset=Math.max(0,Math.min(60,num(mt.settings.topInset)||0));
    }
  }
  /* v1.5.9：单据上的条款卡（appointments/sessions 的 terms）同样是外来数据，在同一个入口收干净。
     不在这里收的话：假 preset 会套错模板、c 里的怪 key 白占空间、假 img 会让「下载图片 / 看大图」
     指向一张不存在的图（点下去只有一句看不懂的 toast）。文本内容本身不消毒 —— 存档要能看清当初写了什么，
     渲染侧一律走 esc()，画进图里是 fillText，两条路都不会执行它。 */
  ['appointments','sessions'].forEach(function(coll){
    arr(d[coll]).forEach(function(it){
      if(!it||typeof it!=='object') return;
      var t=it.terms;
      if(t===undefined||t===null) return;
      if(typeof t!=='object'||Array.isArray(t)){ delete it.terms; cleaned++; return; }
      if(t.preset&&!TERMS_CLAUSES[t.preset]){ cleaned++; delete t.preset; }
      /* 预约单的条款类型必须跟着单据类型走：对不上就当没铺过（下次打开按 type 重铺），
         否则会出现"约妆单套着约拍条款、还带一堆填不出来的交付占位符" */
      else if(coll==='appointments'&&t.preset&&it.type&&t.preset!==it.type){ cleaned++; delete t.preset; }
      var keep={};
      if(t.c!==undefined){
        if(!t.c||typeof t.c!=='object'||Array.isArray(t.c)){ t.c={}; cleaned++; }
        else Object.keys(t.c).forEach(function(k){
          if(TERMS_ALL_KEYS[k]&&typeof t.c[k]==='string') keep[k]=t.c[k].slice(0,4000); else cleaned++;
        });
        t.c=keep;
      }
      if(t.img!==undefined){ if(imgIdOk(t.img)) { /* 形状对就留着 */ } else { cleaned++; delete t.img; } }
      ['extra','signAs','snap','snapAt','updated_at'].forEach(function(f){
        if(t[f]===undefined) return;
        if(typeof t[f]!=='string'){ t[f]=String(t[f]===null||t[f]===undefined?'':t[f]).slice(0,4000); cleaned++; }
        else if(t[f].length>40000){ t[f]=t[f].slice(0,40000); cleaned++; }
      });
      /* 日期格子只留 YYYY-MM-DD：过长的一律截，反正它只进文本与图片，不参与比较 */
      ['sentAt','confirmedAt'].forEach(function(f){
        if(t[f]===undefined) return;
        if(typeof t[f]!=='string'){ t[f]=String(t[f]===null||t[f]===undefined?'':t[f]); cleaned++; }
        if(t[f].length>10){ t[f]=t[f].slice(0,10); cleaned++; }
      });
      if(t.confirmed!==undefined) t.confirmed=!!t.confirmed;
    });
  });
  /* settings 里的模板覆盖与补充参数：只认六类名、只留字符串，键名不对的整条丢 */
  if(d.meta&&typeof d.meta==='object'&&d.meta.settings&&typeof d.meta.settings==='object'){
    var stg=d.meta.settings;
    if(typeof stg.myCn==='string'&&stg.myCn.length>40) stg.myCn=stg.myCn.slice(0,40);
    if(stg.termsEdit&&typeof stg.termsEdit==='object'&&!Array.isArray(stg.termsEdit)){
      var te={};
      Object.keys(stg.termsEdit).forEach(function(preset){
        var one0=stg.termsEdit[preset];
        if(!TERMS_CLAUSES[preset]||!one0||typeof one0!=='object'){ cleaned++; return; }
        var one={};
        Object.keys(one0).forEach(function(k){
          if(TERMS_ALL_KEYS[k]&&typeof one0[k]==='string') one[k]=one0[k].slice(0,4000); else cleaned++;
        });
        if(Object.keys(one).length) te[preset]=one;
      });
      stg.termsEdit=te;
    } else if(stg.termsEdit!==undefined) delete stg.termsEdit;
    if(stg.termsParam!==undefined){
      if(!Array.isArray(stg.termsParam)){ delete stg.termsParam; cleaned++; }
      else stg.termsParam=stg.termsParam.filter(function(x){
        var good=!!x&&typeof x==='object'&&typeof x.a==='string'&&typeof x.b==='string';
        if(good){ x.a=x.a.slice(0,40); x.b=x.b.slice(0,120); } else cleaned++;
        return good;
      });
    }
  }
  LAST_ID_FIX={renamed:renamed,cleaned:cleaned};
  return d;
}

function migrate(raw){
  /* 读档缺字段一律补默认值（历史 Bug #10 教训） */
  var d = emptyData();
  if(!raw || typeof raw !== 'object') return d;
  for(var k in d){
    if(k==='meta'||k==='v') continue;
    if(Array.isArray(raw[k])) d[k]=raw[k];
  }
  d.meta = (raw.meta&&typeof raw.meta==='object')?raw.meta:d.meta;
  d.v = APP.schema;
  /* 1.0 → 1.1 口径迁移：服装→C服、道友→亲友 */
  if(Array.isArray(raw.items)) raw.items.forEach(function(x){ if(x&&x.kind==='服装') x.kind='C服'; });
  if(Array.isArray(raw.expenses)) raw.expenses.forEach(function(x){ if(x&&x.category==='服装') x.category='C服'; });
  if(Array.isArray(raw.contacts)) raw.contacts.forEach(function(x){ if(x&&Array.isArray(x.roles)) x.roles=x.roles.map(function(t){return t==='道友'?'亲友':t;}); });
  /* 1.2 → 1.2.2 装备状态口径迁移：14 个状态并成 9 个，处置三态合并成「报废/已售」+ dispKind 子选项 */
  if(Array.isArray(raw.items)) raw.items.forEach(function(x){
    if(!x||typeof x!=='object') return;
    var old=x.status;
    if(ITEM_STATUS_MIG[old]) x.status=ITEM_STATUS_MIG[old];
    else if(ITEM_STATUS.indexOf(old)<0) x.status='愿望单/购物车';
    if(!x.dispKind) x.dispKind = DISP_KIND_MIG[old] || (DISP_KINDS.indexOf(x.dispType)>=0?x.dispType:'');
    if(x.status==='报废/已售'&&!x.dispKind) x.dispKind='报废';
    if(x.status==='报废/已售') x.dispType=x.dispKind;
    /* v1.2.2.2（P2-1）：外借中 也是 isDisposalStatus，但它不该带着"卖了/售价"——
       否则详情页会显示「回血 150 元」而首页 soldBack 又不算，两处口径打架。 */
    if(x.status==='外借中'){ x.dispType='外借'; x.dispKind=''; x.dispPrice=null; x.dispReason=''; }
    else if(TERMINAL_STATUS.indexOf(x.status)<0){ x.dispType=''; x.dispKind=''; }
  });
  /* 逐条补默认，防止旧备份缺字段（只补会用到的，不造无意义字段） */
  var need = {
    works:{name:'',type:'',note:''},
    characters:{workId:'',name:'',note:'',imgs:[],refLinks:[],updated_at:''},   /* v1.5.8：角色也要有参考图与链接 */
    projects:{name:'',characterId:'',skin:'',stage:'计划中',occasion:'',deadline:'',restore:'',budget:null,imgs:[],refLinks:[],note:'',created_at:''},
    items:{name:'',kind:'C服',category:'',status:'愿望单/购物车',source:'购买',characterId:'',projectIds:[],shop:'',link:'',price:null,
      size:'',orderDate:'',arrivedDate:'',storage:'',makeStage:'',makeProgress:null,fragile:'',qty:null,lowQty:null,
      wigColor:'',wigLen:'',wigStyle:'',wigBy:'',clBrand:'',clDia:'',powerL:'',powerR:'',throwType:'',openedAt:'',expiresAt:'',
      dispType:'',dispKind:'',dispDate:'',dispPrice:null,dispTo:'',dispReason:'',fittings:[],fits:[],imgs:[],
      restore:'',etaShip:'',trackingNo:'',etaArrive:'',review:'',borrowFrom:'',borrowDue:'',
      rentDate:'',rentTerm:'',rentDue:'',refLinks:[],note:'',autoFrom:''},
    contacts:{cn:'',roles:[],platforms:[],phone:'',portfolio:'',priceNote:'',rating:'',warning:false,warnReason:'',note:''},
    locations:{name:'',type:'',address:'',gather:'',fee:null,traffic:'',facilities:'',bestHours:'',risk:'',imgs:[],refLinks:[],note:''},
    sessions:{projectId:'',date:'',time:'',method:'',contactId:'',photographerText:'',locationId:'',locationText:'',
      fee:null,deposit:null,status:'计划中',changeReason:'',timeline:'',backup:'',checklist:[],kitOff:[],note:''},
    appointments:{projectId:'',type:'',contactId:'',contactText:'',datetime:'',place:'',fee:null,deposit:null,
      status:'待确认',paidNote:'',requirement:'',imgs:[],refLinks:[],note:''},
    deliverables:{sessionId:'',type:'原片',agreedCount:null,actualCount:null,agreedDate:'',deliveredDate:'',link:'',retouch:'',status:'未交付',note:''},
    publications:{projectId:'',deliverableId:'',platform:'',url:'',date:'',caption:'',tags:'',stats:'',note:''},
    expenses:{projectId:'',date:'',category:'其他',amount:0,refType:'',refId:'',note:'',source:'手动',paidBy:''},
    todos:{projectId:'',refType:'',refId:'',title:'',due:'',done:false,note:''},
    /* v1.5.9 意向池：只有角色名必填，其余全可空 —— 记一笔的摩擦要低到"想起来就能记" */
    intents:{charName:'',workName:'',workId:'',characterId:'',want:'很想要',when:'',budget:null,
      why:'',status:'在池子里',projectId:'',refLinks:[],promoted_at:'',created_at:'',updated_at:''}
  };
  for(var coll in need){
    d[coll] = arr(d[coll]).map(function(it){
      if(!it||typeof it!=='object') return null;
      var spec=need[coll];
      /* v1.5.9：数组 / 对象默认值必须逐条新建。
         原来 `it[f]=spec[f]` 把 need 里那**一个**实例发给了所有缺字段的记录 ——
         老备份导入后两条预约单的 refLinks、两条 session 的 kitOff、两件装备的 fits 是同一个数组，
         任何原地 push 会同时改到另一条记录身上（实测 migrate 后 items[0].fits===items[1].fits 为 true）。
         imgs / projectIds 只是侥幸躲过：idSanity 恰好会把这两个字段重建为新数组。 */
      for(var f in spec){
        if(it[f]!==undefined) continue;
        var dv=spec[f];
        it[f] = Array.isArray(dv) ? dv.slice() : ((dv&&typeof dv==='object') ? Object.assign({},dv) : dv);
      }
      if(!it.id) it.id = uid(coll.slice(0,3));
      return it;
    }).filter(Boolean);
  }
  /* 1.1.2：装备台账按 updated_at 倒序，老备份缺这个字段会永远沉底 */
  d.items.forEach(function(it){ if(!it.updated_at) it.updated_at=nowStamp(); });
  /* v1.5.6：重拍序号需要一个"不会每次保存都变"的键。老数据用当时已有的时间戳补，
     补不出来就留空——projRepriseGroup() 会退到录入顺序，仍然稳定。 */
  d.projects.forEach(function(p){ if(p&&typeof p==='object'&&!p.created_at) p.created_at=p.updated_at||p.archived_at||''; });
  idSanity(d);   /* v1.5.8 P1：id 白名单——读档与导入都过这一道 */
  return d;
}
function load(){
  try{
    var raw = localStorage.getItem(APP.storeKey);
    DB = migrate(raw?JSON.parse(raw):null);
  }catch(e){
    DB = emptyData();
    setTimeout(function(){ toast('本地数据读取失败，已用空库启动。请检查浏览器是否禁用了存储'); },300);
  }
}
/* ---------------- v1.5.8 P2：写盘失败要看得见、拦得住、退得回来 ----------------
   原来 save() 失败只弹一句 toast，之后所有编辑照常往内存里堆：刷新一下就回到写成功那一刻，
   用户完全不知道"改了半天没存上"。现在三件事一起做：
   LAST_GOOD 记住最后一次真正写进 localStorage 的那串字符 → 「丢弃未保存的改动」能精确回到它；
   SAVE_BAD 一旦置上，常驻红条挂在每一页顶部（含出装日现场模式），三个总闸先拒绝再改；
   红条自带「立即导出当前数据」——导出是 Blob 下载，不吃存储配额，一定拿得走这一份。 */
var SAVE_BAD={at:'',err:'',fails:0,allow:false};
var LAST_GOOD='';
function writeLocked(){ return !!(SAVE_BAD.at&&!SAVE_BAD.allow); }
/** 原地改，不换对象：window.SAVE_BAD 与测试桩拿到的必须是同一个引用 */
function saveBadClear(){ SAVE_BAD.at=''; SAVE_BAD.err=''; SAVE_BAD.fails=0; SAVE_BAD.allow=false; }
function save(){
  DB.meta = DB.meta||{}; DB.meta.updated_at = nowStamp();
  WRITE_SEQ++;
  var txt=null, jerr=null;
  try{ txt=JSON.stringify(DB); }catch(e){ jerr=e; }
  if(txt===null) return saveFail(jerr||{name:'序列化失败',message:'数据里有不能存的内容'});
  try{
    localStorage.setItem(APP.storeKey, txt);
    if(SAVE_BAD.at){ saveBadClear(); toast('存储写入已恢复正常'); }
    LAST_GOOD=txt;
    drawSaveBar();
    return true;
  }catch(e){ return saveFail(e); }
}
function saveFail(e){
  SAVE_BAD.at=nowStamp(); SAVE_BAD.fails++;
  SAVE_BAD.err=String((e&&e.name?e.name:'写盘失败')+((e&&e.message)?('：'+e.message):'')).slice(0,160);
  toast('保存失败（第 '+SAVE_BAD.fails+' 次）：页面顶部有红条，先「立即导出当前数据」');
  try{ drawSaveBar(); }catch(_){ }
  return false;
}
function saveBarHtml(){
  if(!SAVE_BAD.at) return '';
  return '<div class="card" id="saveBar" style="border:1.5px solid var(--danger);background:var(--danger-soft)">'+
    '<h3 style="color:var(--danger-text)">⚠ 本机存储写入失败 · 现在的改动还没落盘</h3>'+
    '<div class="tiny" style="margin-bottom:8px">'+esc(SAVE_BAD.at)+' · '+esc(SAVE_BAD.err||'未知原因')+
      ' · 已连续失败 '+SAVE_BAD.fails+' 次。'+
      (SAVE_BAD.allow?'<b>你选了「继续编辑」：这些改动只在内存里，关页面就没了。</b>'
                     :'<b>表单保存、滑动推格、删除都已暂停</b>，先处理这一步再往下改。')+'</div>'+
    '<div class="btn-row">'+
      '<button class="btn sm" onclick="exportJSON()">立即导出当前数据</button>'+
      '<button class="btn sm ghost" onclick="saveRetry()">重试写入</button>'+
      (LAST_GOOD?'<button class="btn sm gray" onclick="saveRollback()">丢弃未保存的改动</button>':'')+
      (SAVE_BAD.allow?'':'<button class="btn sm gray" onclick="saveAllow()">我了解风险，继续编辑</button>')+
    '</div>'+
    '<div class="tiny muted" style="margin-top:6px">「立即导出」是浏览器下载，不吃存储配额。图片不在这份里，'
      +'要连图一起拿走用「我的 → 导出完整备份（含图片）」。</div></div>';
}
/** 只换红条这一个节点，不整页重绘：save() 是在各种改动中途被调用的，重绘会打断正在输入的地方 */
function drawSaveBar(){
  var m=document.getElementById('main'); if(!m) return;
  var old=document.getElementById('saveBar');
  if(!SAVE_BAD.at){ if(old&&old.parentNode) old.parentNode.removeChild(old); return; }
  var html=saveBarHtml();
  if(old){ old.outerHTML=html; return; }
  m.insertAdjacentHTML('afterbegin',html);
}
function saveBlocked(){
  toast('存储还没写进去：用顶部红条「重试写入」或「立即导出当前数据」');
  drawSaveBar();
  try{ var b=document.getElementById('saveBar'); if(b) b.scrollIntoView({block:'center'}); }catch(e){}
}
function saveRetry(){
  var ok=save();
  toast(ok?'写入成功，已恢复正常':'还是写不进去：'+(SAVE_BAD.err||'未知原因')+'（多半是浏览器存储满了）');
  render();
}
function saveAllow(){ SAVE_BAD.allow=true; render(); toast('已允许继续编辑：请尽早「立即导出当前数据」存一份'); }
function saveRollback(){
  if(!LAST_GOOD){ toast('这次会话还没有一次成功的写入，没有可回退的快照'); return; }
  confirmBox('丢弃未保存的改动','内存里 '+SAVE_BAD.at+' 之后的改动会被丢掉，回到最后一次真正写进本机存储的那一份。图片库不受影响（它是另一套存储）。',function(){
    var snap;
    try{ snap=JSON.parse(LAST_GOOD); }catch(e){ toast('快照读不出来，请改用「立即导出当前数据」'); return; }
    DB=migrate(snap);
    saveBadClear();
    var ok=save(); render();
    toast(ok?'已回到上次保存成功的状态':'已回退，但还是写不进去——请先「立即导出当前数据」');
  },'丢弃并回退');
}
/* 所有集合统一增删改，自动落盘 */
function put(coll,obj){ var i=idxOf(DB[coll],obj.id); if(i>=0) DB[coll][i]=obj; else DB[coll].push(obj); save(); return obj; }
function idxOf(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return i; return -1; }
function del(coll,id){
  if(writeLocked()){ saveBlocked(); return; }   /* v1.5.8：删除也是改数据，锁着就别让它悄悄把内存态挪走 */
  DB[coll] = DB[coll].filter(function(x){return x.id!==id;});
  save();
}
function get(coll,id){ return byId(DB[coll],id); }

/* ---------------- v1.4 图片库（IndexedDB；结构化数据仍在 localStorage） ----------------
   双击 file:// 打开也能用（Chrome/Edge 的 file 源有 IndexedDB）。
   不可用时优雅降级：入口还在，点了提示环境不支持，不影响其他功能。
   图片最长边压到 900px 的 JPEG（原图不落库），缩略 220px；localStorage 不放图片，5MB 配额不受影响。 */
var HAS_IDB=(typeof indexedDB!=='undefined');
var IMG={db:null,ready:false,mem:{}};
function imgOpen(cb){
  /* v1.5.6：所有出口都把 cb 跑到底（原来不支持/打不开时直接 return，
     选完照片的 readImgs 计数永远凑不齐 → 既不写库也不给结尾提示，静默卡住） */
  if(!HAS_IDB){ toast('当前浏览器环境不支持图片存储（需要 IndexedDB）'); if(cb) cb(false); return; }
  if(IMG.ready){ if(cb) cb(true); return; }
  var req=indexedDB.open('cosplan.img.v1',1);
  req.onupgradeneeded=function(e){ e.target.result.createObjectStore('imgs',{keyPath:'id'}); };
  req.onsuccess=function(e){ IMG.db=e.target.result; IMG.ready=true;   /* v1.5.6：成功路径末尾 cb(true) */
    /* v1.5.5 P3-②：一次性回填 1.5.4 及之前存的图片（只有 itemId、没有 owner/ownerId），
       否则 imgDelOfOwner 按 owner 匹配时清不掉这批老图，成为 IndexedDB 孤儿 */
    try{ imgFixOwners(); }catch(e){}   /* v1.5.8：1.5.6 那段只补 1.5.4 及之前的老形状，见 imgFixOwners 注释 */
    if(cb) cb(true);
  };
  req.onerror=function(){ toast('图片库打开失败，图片功能暂不可用'); if(cb) cb(false); };
}
function imgPut(rec,cb){
  imgOpen(function(okf){
    if(okf===false){ if(cb) cb(false); return; }
    try{
      var tx=IMG.db.transaction('imgs','readwrite');
      tx.objectStore('imgs').put(rec);
      tx.oncomplete=function(){ if(cb) cb(true); };
      tx.onerror=function(){ toast('图片写入失败'); if(cb) cb(false); };
    }catch(e){ toast('图片写入失败'); if(cb) cb(false); }
  });
}
/* v1.5.6：本机图片库体检；v1.5.8 起这里也是「含图片的完整备份」的入口 */
function imgLibInfo(cb){
  if(!HAS_IDB){ cb({ok:false,n:0,kb:0}); return; }
  imgOpen(function(okf){
    if(okf===false||!IMG.db){ cb({ok:false,n:0,kb:0}); return; }
    try{
      var tx=IMG.db.transaction('imgs','readonly'), n=0, bytes=0;
      var cr=tx.objectStore('imgs').openCursor();
      cr.onsuccess=function(e){ var c=e.target.result;
        if(c){ var v=c.value||{}; n++; bytes+=String(v.data||'').length+String(v.thumb||'').length; c.continue(); return; }
        cb({ok:true,n:n,kb:Math.round(bytes/1024)});
      };
      cr.onerror=function(){ cb({ok:false,n:0,kb:0}); };
    }catch(e){ cb({ok:false,n:0,kb:0}); }
  });
}
function showImgLib(){
  imgLibInfo(function(inf){
    if(!inf.ok){ openModal({center:true,title:'本机图片库',body:'<div class="muted">当前环境打不开图片库（需要 IndexedDB）。图片功能不可用，其他功能不受影响。</div>'}); return; }
    openModal({ center:true, title:'本机图片库 · '+inf.n+' 张',
      body:'<div class="tiny muted" style="margin-bottom:8px">合计约 '+kbText(inf.kb)+'（压缩后存本机，最长边 900px）。'
        +'「只要台账（JSON）」里<b>不含</b>这些图片；要连图一起备份，用下面那颗。换机/清缓存前请务必存一份。</div>'
        +'<div class="btn-row"><button class="btn" onclick="closeModal();fullBackupDialog()">导出完整备份（含图片）</button>'
        +'<button class="btn gray sm" onclick="closeModal()">知道了</button></div>'+
        '<div class="btn-row" style="margin-top:8px"><button class="btn danger sm" onclick="wipeImgLib()">清空图片库</button></div>'});
  });
}
function wipeImgLib(){
  imgLibInfo(function(inf){
    if(!inf.ok){ toast('当前环境打不开图片库'); return; }
    if(!inf.n){ toast('图片库本来就是空的'); return; }
    confirmBox('清空图片库','本机图片库里 '+inf.n+' 张会被彻底删除（备份 JSON 里也没有它们）。装备/项目/场地/预约单上的图会全变成"已丢失"。',
      function(){ confirmBox('最后确认','这一步不可恢复。确认要删掉这 '+inf.n+' 张图片吗？',function(){ imgWipeGo(); },'真的清空'); },'继续');
  });
}
function imgWipeGo(){
  if(!IMG||!IMG.db){ toast('图片库没打开'); return; }
  try{
    var tx=IMG.db.transaction('imgs','readwrite'); tx.objectStore('imgs').clear();
    tx.oncomplete=function(){ IMG.mem={}; closeModal(); render(); toast('图片库已清空'); };
    tx.onerror=function(){ toast('图片库清空失败'); };
  }catch(e){ toast('图片库清空失败'); }
}
function imgGet(id,cb){
  if(!IMG.ready){ imgOpen(function(){ imgGet(id,cb); }); return; }
  try{
    var req=IMG.db.transaction('imgs').objectStore('imgs').get(id);
    req.onsuccess=function(){ cb(req.result||null); };
    req.onerror=function(){ cb(null); };
  }catch(e){ cb(null); }
}
function imgDel(id,cb){
  if(!IMG.ready) return;
  try{
    var tx=IMG.db.transaction('imgs','readwrite');
    tx.objectStore('imgs').delete(id);
    tx.oncomplete=function(){ if(cb) cb(); };
  }catch(e){}
}
function imgDelOfOwner(kind,ownerId){
  if(!IMG.ready) return;
  try{
    var tx=IMG.db.transaction('imgs','readwrite'), st=tx.objectStore('imgs');
    var req=st.openCursor();
    req.onsuccess=function(e){
      var c=e.target.result;
      if(c){ if(c.value&&c.value.owner===kind&&c.value.ownerId===ownerId){ delete IMG.mem[c.value.id]; c.delete(); } c.continue(); }
    };
  }catch(e){}
}
/* 压缩：src 可以是 dataURL；cap=最长边，quality=JPEG 质量 */
function compressToDataURL(src,cap,quality,cb){
  var im=new Image();
  im.onload=function(){
    try{
      var r=Math.min(1,cap/Math.max(im.width,im.height));
      var w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',quality),w,h);
    }catch(e){ cb('',0,0); }
  };
  im.onerror=function(){ cb('',0,0); };
  im.src=src;
}
var IMG_TARGET=null;   /* pickImgs 的落点：{kind:'item'|'project'|'appointment'|'location'|'character', id} */
var IMG_FORM_CB=null;  /* v1.5.8：图是在表单弹窗里传的，传完要刷的是这张表单，不是底下那一页 */
function imgCollOf(kind){ return {item:'items',project:'projects',appointment:'appointments',location:'locations',character:'characters'}[kind]||''; }
function pickImgs(kind,id){
  IMG_TARGET={kind:kind,id:id};
  var inp=document.getElementById('imgFile');
  if(!inp||!inp.click){ toast('图片入口初始化失败'); return; }
  inp.value=''; inp.click();
}
function imgOwner(t){
  if(!t) return null;
  var coll=imgCollOf(t.kind);   /* v1.5.8：角色也能挂图片，口径统一走 imgCollOf */
  if(!coll) return null;
/** v1.5.8 修的一处真 bug：1.5.5~1.5.7 这里只回 {coll,o}，而 readImgs 写的是 owner:own.kind
    → 每条图片记录的 owner 都是 undefined。后果有三个：
    ① 删装备 / 项目 / 场地 / 预约单时 imgDelOfOwner 一条都匹配不上，图永远留在库里（悄悄占空间，
       且「本机图片库」的张数只涨不落）；② 看大图的标题永远走兜底那一个词；
    ③ 本版新加的「完整备份」里，这些图片恢复时会被 imgRecOk 全部拒收（备份里没 owner 这一项）。
    这里把 kind 一起带回去断根，历史数据由 imgFixOwners 按台账认回来。 */
  var o=get(coll,t.id);
  return o?{kind:t.kind,coll:coll,o:o}:null;   /* v1.5.8：kind 一起带回去 */
}
var IMG_KIND_OF={items:'item',projects:'project',locations:'location',appointments:'appointment',characters:'character'};
/** 谁都不认的孤儿图片：拿台账反查一次（谁的 imgs 里列着这张，它就是谁的） */
function imgOwnerOfId(imgId){
  var ks=Object.keys(IMG_KIND_OF);
  for(var j=0;j<ks.length;j++){
    var list=arr(DB[ks[j]]);
    for(var m=0;m<list.length;m++){ if(list[m]&&arr(list[m].imgs).indexOf(imgId)>=0) return {kind:IMG_KIND_OF[ks[j]],id:list[m].id}; }
  }
  return null;
}
/** 打开图片库时一次性回填缺 owner 的记录（只改有把握认回来的，认不出的留着不动） */
function imgFixOwners(){
  if(!IMG||!IMG.db) return;
  try{
    var tx=IMG.db.transaction('imgs','readwrite');
    tx.objectStore('imgs').openCursor().onsuccess=function(ev){
      var c=ev.target.result; if(!c) return;
      var v=c.value;
      if(v&&IMG_OWNERS.indexOf(v.owner)<0){
        var hit=v.itemId?{kind:'item',id:v.itemId}:imgOwnerOfId(v.id);
        if(hit){ v.owner=hit.kind; v.ownerId=hit.id; delete v.itemId; c.update(v); }
      }
      c.continue();
    };
  }catch(e){}
}
function readImgs(inp){
  var files=inp.files&&inp.files.length?Array.prototype.slice.call(inp.files):[];
  inp.value='';
  if(!files.length||!IMG_TARGET){ IMG_TARGET=null; return; }
  var own=imgOwner(IMG_TARGET); IMG_TARGET=null;
  if(!own){ toast('目标不存在'); return; }
  own.o.imgs=arr(own.o.imgs);
  var pend=files.length, added=0, failed=0;
  files.forEach(function(f){
    if(!/^image\//.test(f.type)){ pend--; failed++; if(pend<=0) finish(); return; }
    var r=new FileReader();
    r.onload=function(){
      compressToDataURL(String(r.result),900,0.72,function(dataUrl,w,h){
        if(dataUrl){
          var rec={id:uid('img'),owner:own.kind,ownerId:own.o.id,name:f.name||'',mime:'image/jpeg',w:w,h:h,created_at:nowStamp(),data:dataUrl,thumb:''};
          imgPut(rec,function(okf){
            if(okf===false){ failed++; if(--pend<=0) finish(); return; }   /* v1.5.6：写不进去也要给这辆车结个账 */
            compressToDataURL(dataUrl,220,0.72,function(thumb){
              rec.thumb=thumb||dataUrl;
              imgPut(rec,function(okf2){
                if(okf2===false){ failed++; if(--pend<=0) finish(); return; }
                IMG.mem[rec.id]=rec;
                own.o.imgs.push(rec.id); added++;
                if(--pend<=0) finish();
              });
            });
          });
        }else{ failed++; if(--pend<=0) finish(); }
      });
    };
    r.onerror=function(){ failed++; if(--pend<=0) finish(); };
    r.readAsDataURL(f);
  });
  function finish(){
    put(own.coll,own.o);
    /* v1.5.8：参考图能在角色/装备表单里传，传完得让那张表单自己重画一次，
       不然弹窗里看不见刚传的图（底下的页面重绘了也没用） */
    if(IMG_FORM_CB){ try{ IMG_FORM_CB(); }catch(e){ IMG_FORM_CB=null; render(); } }
    else render();
    toast(added?('已添加 '+added+' 张图片'+(failed?('，'+failed+' 张失败'):'')):'没有添加任何图片');
  }
}
function delImg(kind,ownerId,imgId){
  var own=imgOwner({kind:kind,id:ownerId}); if(!own) return;
  own.o.imgs=arr(own.o.imgs).filter(function(x){return x!==imgId;});
  put(own.coll,own.o); imgDel(imgId); render(); toast('已删除图片');
}
/** 渲染后的异步水合：把 img[data-imgid] 占位符填上缩略图（IndexedDB 是异步的，只能这样） */
function hydrateImgs(scope){
  if(!HAS_IDB) return;
  var list=(scope&&scope.querySelectorAll)?scope.querySelectorAll('img[data-imgid]'):[];
  Array.prototype.forEach.call(list,function(el){
    var id=el.getAttribute('data-imgid');
    if(!id||el.getAttribute('src')) return;
    if(IMG.mem[id]){ el.src=IMG.mem[id].thumb||IMG.mem[id].data; return; }
    if(el._busy) return; el._busy='1';
    imgGet(id,function(rec){
      if(rec){ IMG.mem[id]=rec; el.src=rec.thumb||rec.data; }
      else el.alt='图片已丢失';
    });
  });
}
function zoomImg(id){
  var rec=IMG.mem[id];
  if(!rec){ imgGet(id,function(r){ if(r){ IMG.mem[id]=r; zoomImg(id); } }); return; }
  var who={item:'装备',project:'项目',location:'场地',appointment:'预约单',character:'角色'}[rec.owner]||'图片';   /* v1.5.6 图片已泛化；v1.5.8 起角色也有参考图 */
  openModal({center:true,title:rec.name||(who+'图片'),
    body:'<img src="'+rec.data+'" alt="'+esc(who)+'图片" style="width:100%;border-radius:10px;display:block">'+
         '<div class="tiny muted" style="margin-top:6px">'+esc(rec.w||'')+(rec.w?'×'+esc(rec.h||''):'')+' · 已压缩存本机图片库</div>'});
}
function imgCell(owner,kind,ownerId,canEdit){
  var ids=arr(owner.imgs);
  var h='<div style="display:flex;flex-wrap:wrap">'+ids.map(function(id){
    return '<div style="position:relative;display:inline-block;margin:0 6px 6px 0">'+
      '<img data-imgid="'+esc(id)+'" alt="图片" style="width:92px;height:92px;object-fit:cover;border-radius:9px;background:var(--gray-soft);display:block;cursor:zoom-in">'+
      /* v1.5.6：id 一律 esc —— 1.3.4.2 给 promptDispose 打的就是同一类补丁（导入的 JSON 里带个引号就能往 DOM 塞属性） */
      /* v1.5.8 P1：这三个参数落在 onclick 的 JS 字符串里，esc() 在这里没用（&#39; 会被还原成 '）。
         改走 jsid()：形状不对就不给这颗按钮，比"能点、但不能注入"更直白。 */
      (canEdit&&jsid(kind)&&jsid(ownerId)&&jsid(id)?'<span class="badge" style="position:absolute;top:2px;right:2px;cursor:pointer;background:var(--card)" onclick="event.stopPropagation();delImg(\''+jsid(kind)+'\',\''+jsid(ownerId)+'\',\''+jsid(id)+'\')">✕</span>':'')+
      '</div>';
  }).join('')+'</div>';
  if(!ids.length) h+='<div class="tiny muted">还没有图片。点下面按钮从相册/文件选，压缩后只存本机图片库。</div>';
  return h;
}

/* ---------------- 界面状态 ---------------- */
var S = {
  view:'home', tab:'home', projectId:null, itemId:null, contactId:null, locationId:null,
  assetTab:'全部', assetQ:'', assetStatus:'', assetRole:'', assetAvailable:false,
  projectStage:'', projectQ:'', contactRole:'', contactQ:'', teamTab:'contacts', locationQ:'',
  projTab:'base', sessionTab:{},
  intentStatus:'',           /* v1.5.9 意向池：分页筛选（'' = 在池子里） */
  cmp:{kind:'',ids:[],onlyDiff:false},        /* v1.4 装备对比：会话级状态，不落库 */
  osKitOpen:true,                             /* v1.5.1 出装日应急包折叠组的展开状态（勾选后不自动收起） */
  setTab:'avoid', mineSetOpen:false,          /* v1.5.4 应用设置双面板：避让与手势 ⇄ 预警与备份 */
  onsiteChar:'', onsitePid:''   /* v1.3 出装日：当前选中的角色 / 1.3.3 当前选中的那一套出装 */
};
function go(view,patch){
  var prevPid=S.projectId;
  S.view=view; if(patch) for(var k in patch) S[k]=patch[k];
  /* 1.1.2 修复：换项目时重置分页（否则看 A 的「费用」页后进 B 会直接落在「费用」页）；
     但同一项目内跳转（如从拍摄单返回）保留当前分页，不打断操作。 */
  if(view==='project'){
    if(S.projectId!==prevPid) S.projTab=(patch&&patch.projTab)||'base';
    else if(patch&&patch.projTab) S.projTab=patch.projTab;
  }
  window.scrollTo(0,0); render();
  navRecord();   /* v1.3：这一屏进返回栈 */
}
function back(){
  if(S.view==='project') go('assets',{tab:'projects'});
  else if(['asset','contact','location','session','appt'].indexOf(S.view)>=0) go('project',{projectId:S.projectId,tab:'projects'});
  else go('home',{tab:'home'});
}

/* ---------------- v1.3 返回键：先回上一屏，真要退出才问一句 ----------------
   手机上按返回 = 关掉整个页面，用户经常一按就"丢了"应用。
   做法：boot 时垫一个 history 条目当"守门员"，每屏再各推一个；
   popstate 命中守门员说明已经到最上层了 —— 补回守门员并弹确认框，不让它直接退。 */
var NAV_STACK=[], NAV_FWD=[], NAV_CUR=0, navSeq=0, navHooked=false, navCanPush=true, navAllowExit=false;
var MODAL_OPEN=false;   /* v1.3.1：有弹窗时返回键先关弹窗，不动页面栈 */
function sSnapshot(){ var o={}; for(var k in S) o[k]=S[k]; return o; }
function sRestore(o){ for(var k in S){ if(o&&Object.prototype.hasOwnProperty.call(o,k)) S[k]=o[k]; } }
function navGuard(){
  if(!navCanPush) return;
  navSeq++;
  NAV_FWD.length=0;   /* 1.3.4.1（P3-5）：pushState 语义上就作废前向历史，别留着骗自己 */
  try{ history.pushState({cp:navSeq},''); NAV_CUR=navSeq; }catch(e){ navCanPush=false; }   /* 个别内核 file:// 下不让 push → 自动降级 */
}
function navRecord(){
  if(!navHooked) return;
  var s=sSnapshot();
  if(NAV_STACK.length && JSON.stringify(NAV_STACK[NAV_STACK.length-1])===JSON.stringify(s)) return;  /* 原地刷新不入栈 */
  NAV_STACK.push(s);
  NAV_FWD.length=0;          /* v1.3.1：有新动作就把"前进"那条路作废 */
  navGuard();
}
function initNav(){
  if(navHooked) return;
  navHooked=true; NAV_STACK=[sSnapshot()]; NAV_FWD=[]; NAV_CUR=0; navSeq=0;
  navGuard();
  window.addEventListener('popstate',function(e){
    e = e || {};   /* 防御：某些环境/测试桩调用时可能不带事件对象 */
    if(navAllowExit){ navAllowExit=false; setTimeout(function(){ history.back(); },80); return; }
    /* v1.3.1（P2-1）：按 e.state 的序号判方向。以前不看方向，按「前进键」也会出栈，
       结果"前进"变成又退一层、栈与历史错位。 */
    var st=(e.state&&typeof e.state.cp==='number')?e.state.cp:null;
    var goBack = (st===null) ? true : (st < NAV_CUR);
    if(st!==null) NAV_CUR=st;
    /* v1.3.1（P1-1）：弹窗优先。以前返回键会把底层页面退掉、弹窗却还浮着。 */
    if(MODAL_OPEN){ MODAL_OPEN=false; closeModal(); navGuard(); render(); return; }   /* 1.3.4.1：关完弹窗要重绘，否则页面停在「弹窗盖住前的旧卡片」上（半态） */   /* 1.3.3：这一按只关弹窗，但浏览器已经消费掉一条历史 —— 不补回守门员，走到首页再按返回就会直接退出、不再问一句 */
    if(goBack){
      if(NAV_STACK.length>1){ NAV_FWD.push(NAV_STACK.pop()); sRestore(NAV_STACK[NAV_STACK.length-1]); render(); return; }
    }else{
      /* 1.3.4.1（P3-3）：前进但没有可前进的一屏 → 只是补回守门员，不该问「要退出吗」 */
      if(NAV_FWD.length){ var s=NAV_FWD.pop(); NAV_STACK.push(s); sRestore(s); render(); return; }
      navGuard(); return;
    }
    navGuard(); confirmExit();
  });
}
/** 应用内返回：与手机返回键同一套行为（同一份栈），避免两个入口走两条路 */
function appBack(){

  if(NAV_STACK.length>1){
    if(navCanPush){ history.back(); return; }        /* 出栈交给 popstate 做，保证两边同步 */
    NAV_STACK.pop(); sRestore(NAV_STACK[NAV_STACK.length-1]); render(); return;
  }

/* ---------------- 提示与确认 ---------------- */
var toastTimer=null, undoFn=null, undoSeq=-1, toastAct=false;
function showToast(html,ms,act){
  var el=document.getElementById('toast');
  el.style.transform='';
  el.innerHTML='<span class="msg">'+html+'</span>'+
    (act?'<button class="u" onclick="runUndo()">撤销</button><button class="x" onclick="dismissToast()">✕</button>':'');
  toastAct=!!act;
  if(act) el.classList.add('act'); else el.classList.remove('act');
  el.classList.add('on');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('on','act'); toastAct=false; undoFn=null; },ms||2200);
}
/** 顶部通知的"划走"：撤销窗口还没过时，上滑或点 ✕ 就立刻收起来，别挡着看 */
function dismissToast(){
  var el=document.getElementById('toast');
  if(toastTimer){ clearTimeout(toastTimer); toastTimer=null; }
  el.style.transform=''; el.classList.remove('on','act'); toastAct=false; undoFn=null;
}
function toast(msg){
  undoFn=null; showToast(esc(msg));
}
/** 带「撤销」的提示：撤销只在期间没有任何新写入时才生效，避免把后来的改动一起回滚 */
function toastUndo(msg,fn,seq){
  undoFn=fn; undoSeq=seq;
  showToast(esc(msg),4600,true);
}
function runUndo(){
  if(!undoFn){ return; }
  if(WRITE_SEQ!==undoSeq){ undoFn=null; toast('撤销已失效：这之后又有新的改动'); return; }
  var f=undoFn; undoFn=null; dismissToast(); f();
}
/** 撤销通知：从顶上滑下来，跟手上滑超过 24px 就划走 */
function initToast134(){
  var el=document.getElementById('toast'); if(!el||el._t134) return; el._t134=true;
  var down=null;
  el.addEventListener('pointerdown',function(e){
    if(!toastAct) return;
    down={y:e.clientY,id:e.pointerId};
  });
  el.addEventListener('pointermove',function(e){
    if(!down||e.pointerId!==down.id) return;
    var dy=e.clientY-down.y;
    if(dy<-24){ down=null; dismissToast(); return; }
    if(dy<-4) el.style.transform='translateX(-50%) translateY('+dy+'px)';
  });
  var up=function(){ if(!down) return; down=null; el.style.transform=''; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
}

function settings(){

/* =========================================================
   v1.5.4：每晚 20:00 本地通知（明日安排 + 到期/到货）——仅 APK 内生效，网页自动跳过
   ========================================================= */
function capPlug(name){ return (typeof window!=='undefined'&&window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[name])||null; }
function addDaysISO(n){ return isoOf(new Date(Date.now()+n*86400000)); }
/** 某一天的安排/到期清单（通知内容来源；「我的」时间线同一套数据口径） */
function dayBrief(iso){
  var out=[];
  DB.sessions.forEach(function(s){
    if(s.date!==iso||s.status==='已取消') return;
    var lo=s.locationText||locationLabel(s.locationId)||'';
    out.push('拍摄·'+projLabel(s.projectId)+(s.time?(' '+s.time):'')+(lo?(' @'+lo):''));
  });
  DB.appointments.forEach(function(a){
    if(String(a.datetime||'').slice(0,10)!==iso||['已取消','爽约'].indexOf(a.status)>=0) return;
    out.push((a.type||'预约')+'·'+(contactLabel(a.contactId)||a.contactText||'待定')+' '+String(a.datetime).slice(11,16));
  });
  DB.items.forEach(function(i){
    if(i.etaArrive===iso&&i.status==='在途') out.push('「'+(i.name||'装备')+'」预计明天到货');
    if(i.etaShip===iso&&i.status==='已下单/制作中') out.push('「'+(i.name||'装备')+'」预计明天发货');
    if(i.borrowDue===iso&&i.borrowFrom) out.push('「'+(i.name||'装备')+'」明天该还（借自 '+(i.borrowFrom||'？')+'）');
  });
  DB.deliverables.forEach(function(d){
    if(d.agreedDate===iso&&d.status!=='已返图') out.push((d.type||'交付')+'约定明天返图，记得催');
  });
  DB.projects.forEach(function(p){
    if(p.deadline===iso&&!isDoneStage(p)) out.push('「'+(p.name||'项目')+'」明天是计划节点');   /* v1.5.6：已归档也不算"明天有安排" */
  });
  DB.items.forEach(function(i){
    if(i.rentDue===iso&&i.source==='租赁'&&isLiveItem(i)) out.push('「'+(i.name||'装备')+'」明天要还（租赁）');   /* v1.5.6：租赁与借入同口径进通知 */
  });
  return out;
}
function overdueCount(){
  var n=overdueDelivs().length;
  DB.items.forEach(function(i){ if(i.borrowFrom&&i.borrowDue&&isPast(i.borrowDue)) n++; });
  DB.items.forEach(function(i){ if(i.source==='租赁'&&i.rentDue&&isPast(i.rentDue)&&isLiveItem(i)) n++; });   /* v1.5.6 */
  return n;
}
/** 排未来 7 晚 20:00：内容=次日安排 + 到期 + 逾期摘要；每次打开应用都刷新一遍 */
function scheduleNightly(){
  var NL=capPlug('LocalNotifications'); if(!NL||!NL.schedule) return;
  var push=function(){
    var notifs=[], od=overdueCount();
    for(var d=0; d<=7; d++){   /* v1.5.5 P3-③：含今晚——现在还没到 20:00 就也排今晚 */
      var when=new Date(); when.setDate(when.getDate()+d); when.setHours(20,0,0,0);
      if(when.getTime()<=Date.now()) continue;
      var lines=dayBrief(addDaysISO(d+1));   /* 当晚 20:00 提醒的是"明天" */
      var body=lines.length?lines.join('；'):'明天暂时没有已排的安排。';
      if(od>0) body+='（另有 '+od+' 项逾期未办）';
      notifs.push({id:2000+d,title:'CosPlan · 明日与到期',body:body.slice(0,220),schedule:{at:when,allowWhileIdle:true}});
    }
    if(notifs.length&&NL.schedule) NL.schedule({notifications:notifs});
  };
  try{
    var ids=[0,1,2,3,4,5,6].map(function(i){ return {id:2000+i}; });
    if(NL.cancel) NL.cancel({notifications:ids}).then(push,push); else push();
  }catch(e){ push(); }
}
/** 启动即请求通知权限；给了就建渠道并排每晚提醒（可在应用设置里关） */
function setupNotifications(){
  var NL=capPlug('LocalNotifications'); if(!NL||!NL.requestPermissions) return;
  var granted=function(){
    try{ if(NL.createChannel) NL.createChannel({id:'cp-remind',name:'计划提醒',description:'明日安排与到期提醒',importance:4,visibility:1}); }catch(e){}
    if(settings().nightly!==false) scheduleNightly();
    else if(NL.cancel){ try{ NL.cancel({notifications:[0,1,2,3,4,5,6,7].map(function(i){return {id:2000+i};})}); }catch(e){} }
  };
  try{
    NL.requestPermissions().then(function(r){
      var ok2=r&&((r.display==='granted')||(r.notifications==='granted'));
      if(ok2) granted();
    },function(){});
  }catch(e){}
}
function toggleNightly(){
  var s=settings(); s.nightly=(s.nightly===false); save(); render();
  var NL=capPlug('LocalNotifications');
  if(s.nightly===false){
    if(NL&&NL.cancel){ try{ NL.cancel({notifications:[0,1,2,3,4,5,6,7].map(function(i){return {id:2000+i};})}); }catch(e){} }
    toast('已关闭每晚提醒');
  }else{

}

function fieldInput(f,V){

      var hasGroup=os.some(function(o){return o.g;});

function openForm(cfg){
